      ZEPPELIN_JDBC_POSTGRES_URL: jdbc:postgresql://supabase-db:5432/postgres
      ZEPPELIN_JDBC_POSTGRES_USER: supabase_admin
      ZEPPELIN_LOG_DIR: /logs
      ZEPPELIN_NOTEBOOK_DIR: /notebook
      ZEPPELIN_PORT: '8080'
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
    image: atlas-zeppelin:local
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    ports:
    - mode: ingress
      target: 8080
      published: '63086'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/zeppelin/notebooks'
      target: /notebook
      bind: {}
    - type: volume
      source: zeppelin-logs
      target: /logs
      volume: {}
  zeppelin-init:
    container_name: atlas-zeppelin-init
    depends_on:
      minio-init:
        condition: service_completed_successfully
        required: true
      spark-init:
        condition: service_completed_successfully
        required: true
      zeppelin:
        condition: service_healthy
        required: true
    deploy:
      replicas: 0
    entrypoint:
    - python
    - /scripts/seed-spark-interpreter.py
    environment:
      ICEBERG_REST_SOURCE: disabled
      ICEBERG_REST_URI: http://iceberg-rest:8181
      JAVA_HOME: /opt/java/openjdk
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: lakehouse
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ICEBERG_ACCESS_KEY: ''
      MINIO_ICEBERG_SECRET_KEY: ''
      MINIO_REGION: us-east-1
      MINIO_ROOT_PASSWORD: ''
      MINIO_ROOT_USER: minioadmin
      SPARK_HOME: /opt/spark
      SPARK_MASTER: spark://spark-master:7077
      ZEPPELIN_URL: http://zeppelin:8080
    image: python:3.12-alpine
    networks:
      backend-network: null
    restart: 'no'
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/zeppelin/init/scripts'
      target: /scripts
      read_only: true
      bind: {}
