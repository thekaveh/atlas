name: atlas
services:
  airflow-dag-processor:
    build:
      context: '{REPO_ROOT}/services/airflow/build'
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: apache/airflow:3.2.2
    command:
    - airflow
    - dag-processor
    container_name: atlas-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
        required: true
    deploy:
      replicas: 0
      resources:
        limits:
          cpus: 1
          memory: '2147483648'
    environment:
      AIRFLOW__API__SECRET_KEY: ''
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:@supabase-db:5432/airflow
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW_UID: '50000'
      ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
      ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
      ICEBERG_REST_URI: http://iceberg-rest:8181
      MINIO_BUCKET_ICEBERG_JARS: jars
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: lakehouse
      MINIO_BUCKET_ICEBERG_LANDING: landing
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ICEBERG_ACCESS_KEY: ''
      MINIO_ICEBERG_SECRET_KEY: ''
      MINIO_REGION: us-east-1
      MINIO_ROOT_PASSWORD: ''
      MINIO_ROOT_USER: minioadmin
      SPARK_MASTER_URL: spark://spark-master:7077
    healthcheck:
      test:
      - CMD-SHELL
      - airflow jobs check --job-type DagProcessorJob --hostname "$$(hostname)"
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m30s
    image: atlas-airflow:local
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    restart: unless-stopped
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/airflow/dags'
      target: /opt/airflow/dags
      bind: {}
    - type: volume
      source: airflow-logs
      target: /opt/airflow/logs
      volume: {}
  airflow-init:
    build:
      context: '{REPO_ROOT}/services/airflow/build'
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: apache/airflow:3.2.2
    command:
    - bash
    - /scripts/init-airflow.sh
    container_name: atlas-airflow-init
    depends_on:
      supabase-db:
        condition: service_healthy
        required: true
    deploy:
      replicas: 0
    environment:
      AIRFLOW__API__SECRET_KEY: ''
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:@supabase-db:5432/airflow
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW_ADMIN_PASSWORD: ''
      AIRFLOW_DB_PASSWORD: ''
      AIRFLOW_DB_USER: airflow
      AIRFLOW_UID: '50000'
      ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
      GRAPH_DB_PASSWORD: neo4j_password
      GRAPH_DB_USER: neo4j
      ICEBERG_REST_SOURCE: disabled
      LITELLM_MASTER_KEY: ''
      MINIO_ROOT_PASSWORD: ''
      MINIO_ROOT_USER: minioadmin
      MINIO_SOURCE: container
      NEO4J_GRAPH_DB_SOURCE: container
      REDIS_PASSWORD: redis_password
      SPARK_SOURCE: disabled
      SUPABASE_DB_NAME: postgres
      SUPABASE_DB_PASSWORD: password
      SUPABASE_DB_USER: supabase_admin
      WEAVIATE_SOURCE: container
    image: atlas-airflow:local
    networks:
      backend-network: null
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/airflow/dags'
      target: /opt/airflow/dags
      bind: {}
    - type: bind
      source: '{REPO_ROOT}/services/airflow/init/scripts'
      target: /scripts
      read_only: true
      bind: {}
  airflow-scheduler:
    build:
      context: '{REPO_ROOT}/services/airflow/build'
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: apache/airflow:3.2.2
    command:
    - airflow
    - scheduler
    container_name: atlas-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
        required: true
    deploy:
      replicas: 0
      resources:
        limits:
          cpus: 1
          memory: '2147483648'
    environment:
      AIRFLOW__API__SECRET_KEY: ''
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:@supabase-db:5432/airflow
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW_UID: '50000'
      ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
      ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
      ICEBERG_REST_URI: http://iceberg-rest:8181
      MINIO_BUCKET_ICEBERG_JARS: jars
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: lakehouse
      MINIO_BUCKET_ICEBERG_LANDING: landing
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ICEBERG_ACCESS_KEY: ''
      MINIO_ICEBERG_SECRET_KEY: ''
      MINIO_REGION: us-east-1
      MINIO_ROOT_PASSWORD: ''
      MINIO_ROOT_USER: minioadmin
      SPARK_MASTER_URL: spark://spark-master:7077
    healthcheck:
      test:
      - CMD-SHELL
      - airflow jobs check --job-type SchedulerJob --hostname "$$(hostname)"
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m30s
    image: atlas-airflow:local
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    restart: unless-stopped
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/airflow/dags'
      target: /opt/airflow/dags
      bind: {}
    - type: volume
      source: airflow-logs
      target: /opt/airflow/logs
      volume: {}
  airflow-webserver:
    build:
      context: '{REPO_ROOT}/services/airflow/build'
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: apache/airflow:3.2.2
    command:
    - airflow
    - api-server
    container_name: atlas-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
        required: true
    deploy:
      replicas: 0
      resources:
        limits:
          cpus: 1
          memory: '2147483648'
    environment:
      AIRFLOW__API__SECRET_KEY: ''
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:@supabase-db:5432/airflow
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW_UID: '50000'
      ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
      ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
      ICEBERG_REST_URI: http://iceberg-rest:8181
      MINIO_BUCKET_ICEBERG_JARS: jars
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: lakehouse
      MINIO_BUCKET_ICEBERG_LANDING: landing
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ICEBERG_ACCESS_KEY: ''
      MINIO_ICEBERG_SECRET_KEY: ''
      MINIO_REGION: us-east-1
      MINIO_ROOT_PASSWORD: ''
      MINIO_ROOT_USER: minioadmin
      SPARK_MASTER_URL: spark://spark-master:7077
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/api/v2/monitor/health
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
    image: atlas-airflow:local
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    ports:
    - mode: ingress
      target: 8080
      published: '63060'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/airflow/dags'
      target: /opt/airflow/dags
      bind: {}
    - type: volume
      source: airflow-logs
      target: /opt/airflow/logs
      volume: {}
  backend:
    build:
      context: '{REPO_ROOT}/services/backend/app'
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.12.13
    container_name: atlas-backend
    depends_on:
      kong-api-gateway:
        condition: service_started
        required: true
      litellm:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
        required: true
      supabase-db-init:
        condition: service_completed_successfully
        required: true
      supabase-realtime:
        condition: service_started
        required: true
      supabase-storage:
        condition: service_started
        required: true
      supavisor:
        condition: service_healthy
        required: false
      weaviate-init:
        condition: service_completed_successfully
        required: true
    deploy:
      replicas: 1
    environment:
      CELERY_BROKER_URL: ''
      CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS: '3600'
      CELERY_QUEUE: atlas
      CELERY_RESULT_BACKEND: ''
      CELERY_SOURCE: disabled
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: '840'
      CELERY_TASK_TIME_LIMIT_SECONDS: '900'
      CELERY_WORKER_PREFETCH_MULTIPLIER: '1'
      COMFYUI_BASE_URL: http://comfyui:18188
      COMFYUI_ENABLED: 'true'
      COMFYUI_MANIFEST_PATH: /comfyui-manifest/selected-models.yaml
      DATABASE_URL: postgresql://supabase_admin:password@supabase-db:5432/postgres
      DOCLING_ENDPOINT: ''
      HERMES_API_KEY: ''
      HERMES_ENDPOINT: ''
      KONG_URL: http://kong-api-gateway:8000
      LANGMEM_AUTO_CONSOLIDATE: 'true'
      LANGMEM_CONSOLIDATION_INTERVAL: '86400'
      LANGMEM_EMBEDDING_MODEL: ''
      LANGMEM_ENABLED: 'true'
      LANGMEM_EXTRACTION_MODEL: ''
      LANGMEM_MAX_FACTS_PER_USER: '1000'
      LANGMEM_NAMESPACE: default
      LIGHTRAG_API_KEY: ''
      LIGHTRAG_ENDPOINT: ''
      LITELLM_API_KEY: ''
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_DEFAULT_MODEL: ollama/qwen3.6:latest
      LITELLM_EMBEDDING_MODEL: ollama/nomic-embed-text
      N8N_API_KEY: ''
      N8N_BASE_URL: http://n8n:5678
      NEO4J_PASSWORD: neo4j_password
      NEO4J_URI: bolt://neo4j-graph-db:7687
      NEO4J_USER: neo4j
      PROJECT_NAME: atlas
      RAY_ADDRESS: ''
      RAY_DASHBOARD_URL: ''
      REDIS_URL: redis://:redis_password@redis:6379/0
      STT_ENDPOINT: ''
      SUPABASE_ANON_KEY: ''
      SUPABASE_SERVICE_KEY: ''
      TIKA_ENDPOINT: ''
      TIKA_MAX_FILE_SIZE: '52428800'
      TIKA_TIMEOUT_SECONDS: '30'
      TTS_ENDPOINT: ''
      WEAVIATE_ENABLED: 'true'
      WEAVIATE_URL: http://weaviate:8080
    extra_hosts:
    - host.docker.internal=
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    ports:
    - mode: ingress
      target: 8000
      published: '63082'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/backend/app/app'
      target: /app
      bind: {}
    - type: volume
      source: backend-data
      target: /app/data
      volume: {}
    - type: volume
      source: weaviate-shared-config
      target: /shared
      volume: {}
    - type: bind
      source: '{REPO_ROOT}/volumes/comfyui'
      target: /comfyui-manifest
      read_only: true
      bind: {}
  backup:
    command:
    - /scripts/backup-all.sh
    container_name: atlas-backup
    deploy:
      replicas: 0
    entrypoint:
    - sh
    - /scripts/entrypoint.sh
    environment:
      BACKUP_BUCKET: atlas-backups
      BACKUP_S3_ALIAS_URL: http://minio:9000
      MINIO_ROOT_PASSWORD: ''
      MINIO_ROOT_USER: minioadmin
      SUPABASE_DB_NAME: postgres
      SUPABASE_DB_PASSWORD: password
      SUPABASE_DB_USER: supabase_admin
    image: postgres:17.10-alpine
    networks:
      backend-network: null
    restart: 'no'
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/backup/init/scripts'
      target: /scripts
      read_only: true
      bind: {}
    - type: volume
      source: supabase-storage-data
      target: /volumes/supabase-storage
      read_only: true
      volume: {}
    - type: volume
      source: graph-db-data
      target: /volumes/graph-db
      read_only: true
      volume: {}
    - type: volume
      source: weaviate-data
      target: /volumes/weaviate
      read_only: true
      volume: {}
  cadvisor:
    container_name: atlas-cadvisor
    deploy:
      replicas: 0
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    ports:
    - mode: ingress
      target: 8080
      published: '63008'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /
      target: /rootfs
      read_only: true
      bind: {}
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: true
      bind: {}
    - type: bind
      source: /sys
      target: /sys
      read_only: true
      bind: {}
    - type: bind
      source: /var/lib/docker/
      target: /var/lib/docker
      read_only: true
      bind: {}
    - type: bind
      source: /dev/disk/
      target: /dev/disk
      read_only: true
      bind: {}
  celery-worker:
    build:
      context: '{REPO_ROOT}/services/backend/app'
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.12.13
    command:
    - celery
    - -A
    - celery_app:celery_app
    - worker
    - --loglevel=INFO
    - --hostname=atlas-worker@%h
    - --queues=atlas
    - --concurrency=2
    container_name: atlas-celery-worker
    depends_on:
      backend:
        condition: service_started
        required: true
      litellm:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
      supabase-db-init:
        condition: service_completed_successfully
        required: true
      supavisor:
        condition: service_healthy
        required: false
    deploy:
      replicas: 0
    environment:
      CELERY_BROKER_URL: ''
      CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS: '3600'
      CELERY_QUEUE: atlas
      CELERY_RESULT_BACKEND: ''
      CELERY_SOURCE: disabled
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: '840'
      CELERY_TASK_TIME_LIMIT_SECONDS: '900'
      CELERY_WORKER_PREFETCH_MULTIPLIER: '1'
      COMFYUI_BASE_URL: http://comfyui:18188
      DATABASE_URL: postgresql://supabase_admin:password@supabase-db:5432/postgres
      LANGMEM_EMBEDDING_MODEL: ''
      LANGMEM_ENABLED: 'true'
      LANGMEM_EXTRACTION_MODEL: ''
      LANGMEM_MAX_FACTS_PER_USER: '1000'
      LANGMEM_NAMESPACE: default
      LITELLM_API_KEY: ''
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_DEFAULT_MODEL: ollama/qwen3.6:latest
      LITELLM_EMBEDDING_MODEL: ollama/nomic-embed-text
      LITELLM_MODEL: ''
      N8N_BASE_URL: http://n8n:5678
      PROJECT_NAME: atlas
      WEAVIATE_ENABLED: 'true'
      WEAVIATE_URL: http://weaviate:8080
    extra_hosts:
    - host.docker.internal=
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A celery_app:celery_app inspect ping -d atlas-worker@$$HOSTNAME --timeout=5
        | grep -q pong
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 45s
    image: atlas-backend-celery:local
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    restart: unless-stopped
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/backend/app/app'
      target: /app
      bind: {}
    - type: volume
      source: backend-data
      target: /app/data
      volume: {}
    - type: volume
      source: weaviate-shared-config
      target: /shared
      volume: {}
  cloudflared:
    command:
    - tunnel
    - --no-autoupdate
    - run
    container_name: atlas-cloudflared
    depends_on:
      kong-api-gateway:
        condition: service_healthy
        required: true
    deploy:
      replicas: 0
    environment:
      TUNNEL_METRICS: 0.0.0.0:2000
      TUNNEL_TOKEN: ''
    healthcheck:
      test:
      - CMD
      - cloudflared
      - tunnel
      - --metrics
      - 0.0.0.0:2000
      - ready
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 20s
    image: cloudflare/cloudflared:2026.6.1
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    restart: unless-stopped
  comfyui:
    container_name: atlas-comfyui
    depends_on:
      redis:
        condition: service_started
        required: true
      supabase-db-init:
        condition: service_completed_successfully
        required: true
      supabase-storage:
        condition: service_started
        required: true
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: 2
          memory: '4294967296'
    environment:
      AUTO_UPDATE: 'false'
      COMFYUI_ARGS: --listen
      COMFYUI_PORT_HOST: '8188'
      COMFYUI_UPLOAD_TO_SUPABASE: 'true'
      DISABLE_NATPMP: '1'
      ENABLE_QUICKTUNNEL: 'false'
      SERVERLESS: 'false'
      SUPABASE_ANON_KEY: ''
      SUPABASE_STORAGE_BUCKET: comfyui-images
      SUPABASE_URL: http://kong-api-gateway:8000/comfyui
      WEB_ENABLE_AUTH: 'false'
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:18188/system_stats
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 2m0s
    image: ghcr.io/ai-dock/comfyui:v2-cpu-22.04-v0.2.7
    labels:
      com.atlas.category: ai
      com.atlas.dependencies: litellm,supabase-storage
      com.atlas.service: image-generation
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    platform: linux/amd64
    ports:
    - mode: ingress
      target: 18188
      published: '63042'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: volume
      source: comfyui-models
      target: /opt/ComfyUI/models
      volume: {}
    - type: volume
      source: comfyui-output
      target: /opt/ComfyUI/output
      volume: {}
    - type: volume
      source: comfyui-input
      target: /opt/ComfyUI/input
      volume: {}
    - type: volume
      source: comfyui-custom-nodes
      target: /opt/ComfyUI/custom_nodes
      volume: {}
    - type: bind
      source: '{HOME}/Documents/ComfyUI/models'
      target: /host_models
      bind: {}
  comfyui-init:
    container_name: atlas-comfyui-init
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
        required: true
    deploy:
      replicas: 1
    entrypoint:
    - /scripts/download_models.sh
    environment:
      COMFYUI_MANIFEST_TSV: /comfyui-manifest/active-models.tsv
      COMFYUI_MODELS_PATH: /models
    extra_hosts:
    - host.docker.internal=
    image: alpine:3.24.1
    networks:
      backend-network: null
    restart: 'no'
    volumes:
    - type: bind
      source: '{REPO_ROOT}/services/comfyui/init/scripts'
      target: /scripts
      bind: {}
    - type: volume
      source: comfyui-models
      target: /models
      volume: {}
    - type: bind
      source: '{REPO_ROOT}/volumes/comfyui'
      target: /comfyui-manifest
      read_only: true
      bind: {}
  crawl4ai:
    cap_drop:
    - ALL
    container_name: atlas-crawl4ai
    deploy:
      replicas: 0
    environment:
      CRAWL4AI_ALLOW_INTERNAL_URLS: 'false'
      CRAWL4AI_API_TOKEN: ''
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:11235/health || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 1m0s
    image: unclecode/crawl4ai:0.9.0
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
      backend-network: null
    pids_limit: 512
    ports:
    - mode: ingress
      target: 11235
      published: '63040'
      protocol: tcp
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    shm_size: '1073741824'
    tmpfs:
    - /tmp
    - /var/lib/redis
    - /var/lib/crawl4ai/outputs:mode=0700
    - /home/appuser/.cache
  flower:
    command:
    - celery
    - --broker=
    - flower
    - --address=0.0.0.0
    - --port=5555
    - --basic-auth=kong_admin:kong_password
