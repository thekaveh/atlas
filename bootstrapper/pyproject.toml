[project]
name = "atlas-bootstrapper"
# Tracks the tagged product version (BRAND_VERSION in .env / AppState). Atlas
# remains pre-1.0; post-v0.1.0 changes stay under CHANGELOG's [Unreleased]
# section until the next semantic-version tag is cut.
version = "0.1.0"
description = "Atlas bootstrapper - cross-platform startup and management scripts"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",           # YAML parsing (replaces yq)
    "rich>=13.0.0",          # Terminal colors, tables, formatting
    "click>=8.3.3",          # CLI argument parsing; clears click.edit command injection advisory
    "requests>=2.33.0",      # HF + civitai catalog HTTP scraping
    "urllib3>=2.7.0",        # Explicit floor (transitive via requests) — clears CVE-2026-44431/44432
    "textual>=8.2.8",        # TUI framework — owns the wizard, launch, and streaming-logs flows.
                             # Floor raised from 0.85 for selection auto-scroll, cross-container
                             # selection, and the TextSelected event (#535 Pass 0).
    "jsonschema>=4.0.0",     # Validates services/<name>/service.yml against bootstrapper/schemas/*
    "textual-image>=0.12,<0.13",  # Smooth splash poster via the terminal's image protocol (Kitty/Sixel/iTerm); <0.13 keeps Python 3.10 support. Block-art fallback where unsupported.
    "pillow>=12.3.0",        # Explicit floor for textual-image; clears the 12.2 font/image allocation advisories
    "tomli>=2.0.1; python_version < '3.11'",  # stdlib tomllib compatibility for the supported Python 3.10 floor
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
# PEP 735 dependency groups (replaces the deprecated `[tool.uv]
# dev-dependencies` table; uv warns on every invocation otherwise).
# CI invokes `uv sync --group dev`.
dev = [
    "cairosvg>=2.7,<3",
    "fastapi==0.141.1",
    "httpx2>=2.6.0",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "python-multipart==0.0.32",
    "pytest>=7.0.0",
    "pytest-cov>=7.1,<8",
    "radon==6.0.1",         # Recomputes the committed maintenance complexity ceiling in CI.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "live: optional test requiring a running external service or special hardware",
]
# Bootstrapper modules import as bare names (e.g. `from core.config_parser import ConfigParser`);
# adding the package root keeps that style working under pytest.
pythonpath = [".", ".."]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]
