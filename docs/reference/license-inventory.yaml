# Supply-chain license inventory (#1064): every third-party image and model
# weight a supported Atlas release pins, with its license, required notices,
# and what its terms allow for hosted use, source integration and
# redistribution. Atlas's own Apache-2.0 grant relicenses none of them.
#
# This is the review record, not a legal conclusion. The page
# docs/reference/license-inventory.md is generated from it by
# `uv run --project bootstrapper python -m scripts.docs.canonical_references`.
# `python -m scripts.docs.license_inventory --check`, which `make docs-check`
# also runs, fails when:
#   - an `images` row's `image` differs from its manifest `images:` default,
#     a `build_images` row's `image` from its Dockerfile's literal reference,
#     or a `models` row's `sources` from its catalogue entry's download URLs
#     (the pin moved, so the row must be re-reviewed and updated with it);
#   - a pinned artifact has no row, or a row matches no pin;
#   - a license URL or source is not pinned to a revision, unless the row
#     declares `unpinned_license_url` or `unpinned_source` naming one of its
#     own open items;
#   - a mode value is outside the vocabulary, an open item is undefined, or
#     an unresolved mode has no open item whose `modes` include it.
#
# Modes: `hosted` (operating it for your own or others' users), `integration`
# (incorporating or modifying its source in another work) and
# `redistribution` (shipping the artifact, for example in an appliance
# bundle). Values:
#   permitted       no condition beyond keeping the license with the software
#   with notices    ship the license text and the upstream NOTICE, if any
#   with source     copyleft: offer the complete corresponding source
#   conditional     the terms restrict this mode; the license note says how
#   unresolved      not adjudicated; an open item concerning the mode names
#                   the question
reviewed: '2026-09-29'
licenses:
  Apache-2.0:
    name: Apache License 2.0
    notice: Ship the license text and, where the upstream has one, its NOTICE file; mark modified files.
    hosted: permitted
    integration: permitted
    redistribution: with notices
  MIT:
    name: MIT License
    notice: Ship the copyright notice and license text.
    hosted: permitted
    integration: permitted
    redistribution: with notices
  BSD-3-Clause:
    name: BSD 3-Clause License
    notice: Ship the copyright notice, conditions and disclaimer; do not use contributors' names to endorse.
    hosted: permitted
    integration: permitted
    redistribution: with notices
  PSF-2.0:
    name: Python Software Foundation License 2.0
    notice: Ship the PSF copyright notice and license agreement.
    hosted: permitted
    integration: permitted
    redistribution: with notices
  PostgreSQL:
    name: PostgreSQL License
    notice: Ship the copyright notice and the permission paragraphs.
    hosted: permitted
    integration: permitted
    redistribution: with notices
  AGPL-3.0:
    name: GNU Affero General Public License v3.0
    notice: Ship the license and offer the complete corresponding source; a modified version run as a network service must offer its source to its users (section 13).
    hosted: permitted
    integration: with source
    redistribution: with source
  GPL-3.0:
    name: GNU General Public License v3.0
    notice: Ship the license and offer the complete corresponding source with every conveyed copy.
    hosted: permitted
    integration: with source
    redistribution: with source
  Sustainable-Use-1.0:
    name: Sustainable Use License 1.0 (n8n)
    notice: Use or modify only for internal business, non-commercial or personal purposes; distribute only free of charge for non-commercial purposes; keep every licensing notice. Files marked .ee. need
      an n8n Enterprise License.
    hosted: conditional
    integration: conditional
    redistribution: unresolved
  BSL-1.1-Redpanda:
    name: Business Source License 1.1 with Redpanda's Additional Use Grant
    notice: Any use except a commercial Streaming or Queuing Service offered to third parties; each release converts to Apache 2.0 four years after it ships. Enterprise features fall under the Redpanda
      Community License.
    hosted: conditional
    integration: conditional
    redistribution: unresolved
  Open-WebUI:
    name: Open WebUI License (BSD 3-Clause with a branding clause)
    notice: Keep the BSD-3 notices and every "Open WebUI" branding element, unless the deployment has at most 50 end users in any rolling 30 days, a merged contributor has written permission, or an enterprise
      license allows otherwise.
    hosted: conditional
    integration: conditional
    redistribution: conditional
  Alpine-packages:
    name: Alpine Linux package set (build scripts MIT)
    notice: The image is the Alpine base layer itself; its packages carry their own licenses, recorded under R-BASE.
    hosted: permitted
    integration: permitted
    redistribution: unresolved
  NVIDIA-DLC:
    name: NVIDIA Deep Learning Container License
    notice: Not reviewed; see R-NGC.
    hosted: unresolved
    integration: unresolved
    redistribution: unresolved
  unknown:
    name: Not established
    notice: No license could be read; see the row's open item.
    hosted: unresolved
    integration: unresolved
    redistribution: unresolved
open_items:
  R-BASE:
    question: Which license texts and source offers does each image's operating-system layer need? Every image also ships its base distribution's packages (Debian, Ubuntu or Alpine), several under GPL-2.0
      or LGPL. A notice bundle generated from an SBOM of each exact digest is required before any image ships in an appliance bundle.
    applies: The redistribution mode of every image row.
    modes:
    - redistribution
  R-PY:
    question: Which licenses apply to the Python packages installed into the locally built images? The compiled runtime locks (for example services/backend/app/app/requirements-locked.txt) pin every package,
      but their licenses are not inventoried.
    applies: Every locally built image.
    modes:
    - redistribution
  R-BUILD:
    question: Which licenses apply to binaries a local Dockerfile downloads on top of its base image? Known cases are the headless Blender that asset-baker adds and the MinIO mc client that the backup and
      Jenkins images add; neither has an image row of its own.
    applies: asset-baker, backup, jenkins.
    modes:
    - redistribution
  R-CUDA:
    question: Do the NVIDIA CUDA and cuDNN runtime layers in the GPU images fall within the components their license agreements allow to be redistributed, and on what conditions?
    applies: Every CUDA-based image.
    modes:
    - redistribution
  R-NGC:
    question: What does the NVIDIA Deep Learning Container License allow for this image? NVIDIA publishes the terms without a revision-pinned copy, so no mode is recorded as permitted.
    applies: parakeet.
    modes:
    - hosted
    - integration
    - redistribution
  R-N8N:
    question: Can an Atlas bundle that includes n8n be distributed, or offered to others, commercially? The Sustainable Use License allows distribution only free of charge for non-commercial purposes.
    applies: n8n.
    modes:
    - redistribution
  R-REDPANDA:
    question: Can an Atlas bundle that includes Redpanda be redistributed commercially, and does any operator's use amount to a Streaming or Queuing Service for third parties?
    applies: redpanda.
    modes:
    - redistribution
  R-OPENWEBUI:
    question: Is dyrnq/open-webui an unmodified rebuild of Open WebUI v0.6.32, and would a bundle keep the Open WebUI branding the license requires above 50 end users?
    applies: open-webui.
    modes:
    - redistribution
  R-FLOAT:
    question: Which upstream revision does the pinned digest build from? The tag floats (latest, lts, gpu, a major version, a date or no tag), so the license is recorded at the upstream default branch or
      newest matching release on the review date rather than at the image's own source revision.
    applies: Images pinned by a floating tag.
    modes: []
  R-TRUEFORGE:
    question: What license applies to TrueForge? The image comes from the TrueFoundry registry, which the review environment could not reach, and no public license file was found.
    applies: trueforge.
    modes:
    - hosted
    - integration
    - redistribution
  R-MODELS:
    question: What are the weight licenses of the catalogue entries that record none? Record license_name, a revision-pinned license_url and license_restrictions for each in services/comfyui/models.yaml;
      the model cards were not reachable from the review environment. This also covers the CLIP ViT-B-32 weights the multi2vec-clip image bundles.
    applies: ComfyUI catalogue entries without license fields; multi2vec-clip.
    modes:
    - hosted
    - integration
    - redistribution
  R-KREA:
    question: Can Krea 2 weights ship in a bundle, and on what terms? The Krea 2 Community License requires an enterprise license at or above USD 1M annual revenue for commercial use and content filtering
      for deployments; its redistribution terms are not recorded, and krea2-identity-edit-v1-2's license URL points at main rather than a revision.
    applies: Krea 2 catalogue entries.
    modes:
    - redistribution
  R-HUNYUAN:
    question: May Hunyuan3D-2 weights ship in a bundle offered in the European Union, the United Kingdom or South Korea, which the Tencent Hunyuan Community License excludes, or to a service above 100 million
      monthly active users?
    applies: hunyuan3d-2.
    modes:
    - redistribution
  R-SVC-MODELS:
    question: Which licenses apply to the weights services download by their own configuration rather than from a catalogue? Examples are the TEI reranker model (TEI_RERANKER_MODEL_ID, pinned to mixedbread-ai/mxbai-rerank-base-v1
      at a revision) and the speech and document-conversion models speaches, parakeet, chatterbox and docling fetch; none has a row yet.
    applies: Service-configured model weights.
    modes:
    - hosted
    - integration
    - redistribution
  R-OLLAMA:
    question: Which licenses apply to the Ollama library models, and which revision is pulled? Tags such as qwen3.8:latest float, and ollama.com was not reachable from the review environment.
    applies: Every Ollama catalogue model.
    modes:
    - hosted
    - integration
    - redistribution
  R-BUNDLE:
    question: Which licenses apply to the extra files a bundle entry downloads besides its main weights? The Krea 2 entries also fetch a Qwen3-VL text encoder and a Qwen-Image VAE, which the Krea 2 Community
      License does not cover by name.
    applies: ComfyUI entries that download more than one file.
    modes:
    - redistribution

