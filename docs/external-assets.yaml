# Every external asset a clean-cache documentation build downloads (#1053).
#
# The Material `privacy` plugin (enabled by scripts/docs/build_docs.py) self-hosts
# these at build time, caching them under `cache_root`. Nothing is vendored: the
# build is online-only on a cold cache and runs offline from a warm one. The
# policy, and why it was chosen over vendoring or a seeded cache, is in
# docs/development.md §3.1. scripts/docs/external_assets.py reads this file:
#   --preflight     before the strict build; names any asset that is neither
#                   cached nor reachable, instead of a bare strict-mode abort
#   --verify-cache  after a clean-cache build; diffs the cache against this list
#
# `sha256: null` marks an asset whose URL does not pin its content (the Google
# Fonts stylesheet is served per user agent; unpkg resolves `mermaid@11` to the
# newest 11.x). Every font file is versioned in its URL and pinned here.
#
# Refresh after a theme-font or mkdocs-material change: delete `cache_root`, run
# `make docs-check` with network access, then `python -m scripts.docs.external_assets
# --print-inventory` and review the diff.
