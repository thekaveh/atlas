site_name: Atlas Documentation
site_description: Atlas self-hosted AI, data, and engineering platform documentation
site_url: https://thekaveh.github.io/atlas/
repo_url: https://github.com/thekaveh/atlas
repo_name: thekaveh/atlas
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
exclude_docs: 'README.md

  wiki/*.md'
extra_css:
- assets/stylesheets/atlas.css
validation:
  links:
    anchors: ignore
    not_found: warn
    unrecognized_links: ignore
    absolute_links: ignore
  nav:
    omitted_files: ignore
theme:
  name: material
  language: en
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  - toc.follow
  palette:
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
