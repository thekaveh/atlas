    expired_at: 2026-12-09
    statement: >-
      certifi 2021.10.8 is bundled inside Blender 4.3.2's vendored CPython in the
      asset-baker image and still trusts the removed e-Tugra root. The bundled
      interpreter runs only bake.py under `blender -b` and never opens a TLS
      connection; the service's HTTP layer runs on the image's own Python with a
      current certifi. Remove this exception with the Blender 4.5 LTS move
      (#1002).
