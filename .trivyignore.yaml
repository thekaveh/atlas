# Trivy consumes this file directly. Each exception must be package/path scoped,
# carry a concrete risk statement, and expire; scripts.container_security rejects
# broad, undocumented, duplicate, or stale entries before a scan can run.
#
# Review pass 2026-09-10 (#998). The 259 entries then expiring 2026-09-30 were
# re-verified against OSV per (ecosystem, package, version) and against each
# pinned component's newest published release. They collapse into three
# clusters, and in none of them is an upstream fix reachable:
#
#   Zeppelin  176  apache/zeppelin:0.12.1 is still the newest published tag
#                  (5 rows added 2026-09-18 when the final-image scan first
#                  reached the image, #1002: amqp-client, three netty-handler
#                  copies, libthrift 0.13.0 and tornado 6.2, all upstream-bundled).
#   Spark      40  No released Spark carries the fix. 4.2.0 -- the newest --
#                  still ships libthrift 0.16.0, and its netty 4.2.13.Final is
#                  short of the 4.2.17 that CVE-2026-75595 needs. See #996.
#   Julia      40  Julia 1.12.7 (jupyterhub) is the newest 1.12.x; 1.13.0 is a
#                  minor-version move, not a patch.
#   Iceberg    24  apache/iceberg-rest-fixture:1.10.1 is the newest published tag
#                  (2026-09-17); the findings sit in its shaded adapter jar.
#   Jenkins     4  jackson in the upstream image's build-time plugin manager jar,
#                  plus one x/crypto SSH-server advisory in the git-lfs 3.8.0 client
#                  binary that replaces the upstream image's stale 3.7.1.
#
# Renewed to 2026-12-09 on that basis. OSV additionally reports 44 rows as no
# longer affected at the pinned version; those were deliberately NOT deleted,
# because Trivy ships its own database and disagreement between the two is
# routine -- confirming them needs the scan's own output, which until
# 2026-09-16 stopped early on Blender (#1002). Full evidence: #998.
#
# Blender-vendored Python (asset-baker, #1002 criterion 3). Blender 4.3.2 ships
# its own CPython 3.11 under /opt/blender/4.3/python with certifi 2021.10.8,
# setuptools 63.2.0 and urllib3 1.26.8 baked into the release tarball. They are
# not apt- or pip-managed, and the fix is a Blender version move (4.5 LTS clears
# certifi and urllib3; setuptools is confirmed only from 5.2), which needs the
# blender-mcp bridge re-verified live. The nine rows below are scoped to the
# exact dist-info paths inside that tree so an identical package anywhere else
# still fails the gate. Reachability: the bundled interpreter runs only
# bake.py (bpy, numpy, stdlib file I/O) under `blender -b`; the FastAPI layer
# uses the image's own patched Python. Nothing in that process imports urllib3,
# certifi or setuptools, opens a network connection, or installs packages.
vulnerabilities:
  - id: CVE-2026-56854
    paths:
      - "usr/local/bin/git-lfs"
    expired_at: 2026-12-09
    statement: >-
      golang.org/x/crypto v0.54.0 is compiled into the git-lfs 3.8.0 release
      binary that Atlas installs into the Jenkins image (the newest git-lfs
      release on 2026-09-17; the fix is x/crypto 0.55.0). The advisory is an SSH
      server-side authentication bypass; git-lfs only acts as an SSH client for
      git-lfs-authenticate and never listens. Jenkins is disabled by default
      (JENKINS_SOURCE=disabled). Remove when git-lfs publishes a release built
      against x/crypto 0.55.0 or newer (#1002).
  - id: GHSA-r7wm-3cxj-wff9
    paths:
      - "opt/jenkins-plugin-manager.jar"
    expired_at: 2026-12-09
    statement: >-
      jackson 2.20.1 ships inside /opt/jenkins-plugin-manager.jar, the
      plugin-installer CLI the upstream jenkins/jenkins:lts-jdk21 image bundles;
      Atlas runs it only at image build time (jenkins-plugin-cli --plugin-file)
      and the Jenkins runtime never loads that jar. Jenkins itself is disabled by
      default (JENKINS_SOURCE=disabled) and sits behind its own login. Remove when
      the upstream image ships a plugin manager built against jackson
      2.18.8+/2.21.4+ (#1002).
