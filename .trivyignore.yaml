# Trivy consumes this file directly. Each exception must be package/path scoped,
# carry a concrete risk statement, and expire; scripts.container_security rejects
# broad, undocumented, duplicate, or stale entries before a scan can run.
vulnerabilities:
  - id: CVE-2025-9086
    purls:
      - "pkg:julia/LibCURL_jll@8.15.0%2B0?uuid=deac9b47-8bc7-5906-a0fe-35ac56dc84c0"
    expired_at: 2026-09-30
    statement: >-
      Julia 1.12.7 is the current stable runtime, and its registry resolves
      LibCURL_jll to this exact newest-compatible build; the scanner's patched
      build is not compatible with the stable runtime. The token-authenticated
      kernel runs as unprivileged jovyan with no public Julia service endpoint.
      Remove this exception when Julia publishes a compatible patched JLL.
