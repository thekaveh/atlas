    expired_at: 2026-12-09
    statement: >-
      setuptools 63.2.0 is bundled inside Blender 4.3.2's vendored CPython in the
      asset-baker image. The advisory is a ReDoS in package_index.py, reached only
      when setuptools resolves a package index; bake.py never imports setuptools
      or installs anything. Remove this exception with the Blender version move
      that ships a patched setuptools (#1002).
