# TrueForge agent-runtime image (tfy.jfrog.io/tfy-images/trueforge:0.2.0-8b1d98e,
# reviewed index digest sha256:db9de64e1ff354a858dc646f23cf16c70e300c457acb86527e4a0b1cd556f573,
# linux/amd64 only; #1159, added 2026-09-20). 25 HIGH findings, three clusters:
# unfixed Debian 12 base packages (util-linux wave, perl-base, zlib1g MiniZip,
# ncurses, systemd libs, gzip, libacl1 — no patched bookworm package exists),
# libpcre2 (Debian fix published, waiting on an upstream image rebuild — the
# #1002 wave), and three upstream-bundled node_modules packages whose fixes
# arrive with the next TrueForge release (~daily cadence). Every entry is
# purl-scoped to the exact package@version in this image so the same package
# anywhere else still fails the gate.

  - id: CVE-2023-45853
    purls:
      - "pkg:deb/debian/zlib1g@1.2.13.dfsg-1?arch=amd64&distro=debian-12.15&epoch=1"
    expired_at: 2026-12-09
    statement: >-
      zlib1g 1.2.13 in the pinned TrueForge v0.2.0 image. The overflow is in MiniZip's
      zipOpenNewFileInZip4_64, which is not built into Debian's libz shared library,
      and Debian tracks the CVE as unfixed/wontfix for bookworm accordingly. No
      MiniZip consumer exists in the image; the Node.js runtime uses its own bundled
      zlib bindings.

  - id: CVE-2025-69720
