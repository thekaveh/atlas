  - id: CVE-2026-14456
    purls:
      - "pkg:apk/alpine/libcrypto3@3.5.7-r0?arch=x86_64&distro=3.24.1"
      - "pkg:apk/alpine/libcrypto3@3.5.7-r0?arch=aarch64&distro=3.24.1"
      - "pkg:apk/alpine/libssl3@3.5.7-r0?arch=x86_64&distro=3.24.1"
      - "pkg:apk/alpine/libssl3@3.5.7-r0?arch=aarch64&distro=3.24.1"
    expired_at: 2026-12-09
    statement: >-
      OpenSSL 3.5.7-r0 (libcrypto3/libssl3) in the alpine:3.24.1 base of the
      comfyui, hermes, label-studio, langfuse, lightrag, mlflow, ollama
      (pull), openclaw and weaviate init containers, and in the
      postgres:15.18-alpine (supabase-db and iceberg-rest init),
      postgres:17.10-alpine (backup build base) and redpanda console v3.8.0
      images. None starts an OpenSSL QUIC listener, so the affected
      server-only allocation path is unreachable. Re-checked 2026-09-28:
      alpine:3.24.2 (published 2026-09-18) ships OpenSSL 3.5.8-r0 and scans
      clean, so the fix is now a pin move, tracked in #1285. Remove this
      exception when no pinned image carries 3.5.7-r0.
