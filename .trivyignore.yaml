  - id: CVE-2026-43871
    purls:
      - "pkg:maven/org.apache.thrift/libthrift@0.16.0"
      - "pkg:golang/github.com/apache/thrift@v0.21.0"
    expired_at: 2026-11-30
    statement: >-
      libthrift 0.16.0 ships inside pyspark 4.1.2's bundled jars
      (pyspark/jars/libthrift-0.16.0.jar) in the Airflow image. The fix is
      0.24.0, which is unreachable without moving the whole pinned Spark family
      together: the pyspark pin must match the apache/spark:4.1.2 cluster image
      and iceberg-spark-runtime-4.1, and a previous uncoordinated move produced
      a pip file collision that hard-failed the image build. The advisory is a
      denial of service via infinite loop in Thrift protocol parsing; Atlas
      drives Spark through operator-authored DAGs against the internal cluster
      rather than exposing a Thrift endpoint to untrusted callers. Tracked for
      the coordinated upgrade; remove this exception when the Spark family
      moves.
  - id: CVE-2026-56854
    paths:
      - "bin/weaviate"
    expired_at: 2026-11-30
    statement: >-
      golang.org/x/crypto v0.53.0 is vendored into the Weaviate binary. The
      advisory (GHSA-gjhq-gjfw-99mq, rated high by GitHub though Trivy reports
      the vendor CRITICAL score) concerns the SSH server: source-address
      critical options were not enforced for the PasswordCallback,
      KeyboardInteractiveCallback, NoClientAuthCallback, and GSSAPI login
      paths. Weaviate exposes HTTP and gRPC only and runs no SSH server, so
      the package is present but the affected entry points are never reached.
      The fix needs x/crypto 0.55.0. Re-checked 2026-09-28: services/weaviate
      pins 1.38.13, which still ships 0.53.0, but 1.38.17 is published and its
      Docker Hub build (semitechnologies/weaviate) scans clean, so the fix is
      now a pin move, tracked in #1286. Remove this exception with that move.
  - id: CVE-2026-84304
    paths:
      - "bin/weaviate"
    expired_at: 2026-11-30
    statement: >-
      google.golang.org/grpc v1.82.1 is vendored into the Weaviate binary.
      Fragmented HTTP/2 DATA frames can exhaust heap memory, and an
      unauthenticated remote caller can trigger it. Atlas publishes the gRPC
      port through HOST_BIND_IP, which defaults to 127.0.0.1:, so port 50051
      is loopback-bound unless an operator deliberately widens it; this is a
      deployment mitigation rather than a code fix, and any operator who
      exposes the port must firewall it. The fix needs grpc 1.83.1. Re-checked
      2026-09-28: services/weaviate pins 1.38.13, which still ships 1.82.1,
      but 1.38.17 is published and its Docker Hub build
      (semitechnologies/weaviate) scans clean, so the fix is now a pin move,
      tracked in #1286. Remove this exception with that move.
  - id: CVE-2025-47913
    purls:
      - "pkg:golang/golang.org/x/crypto@v0.40.0"
    expired_at: 2026-11-30
    statement: >-
      Go toolchain (stdlib 1.24.6) or vendored-module finding in the official
      MinIO client binary mc RELEASE.2025-08-13T08-35-41Z, which
      services/jenkins bakes into its image at /usr/local/bin/mc (disabled by
      default). services/backup downloads the same checksum-pinned binary at
      entrypoint start, outside any scanned image, so these rows record its
      exposure without suppressing anything there. The stdlib 1.24.6 rows also
      cover two upstream helper binaries built with that toolchain, found by a
      --show-suppressed scan on 2026-09-28: gosu in postgres:15.18-alpine
      (supabase-db and iceberg-rest init) and postgres:17.10-alpine (the
      backup build base), and migrate in langfuse:3.115.0. Re-checked
      2026-09-28: that mc is still the newest official release, so no official
      build carries the fix; the maintained pgsty/mc fork (the MinIO client
      image since the Silo swap) scans clean, and moving Jenkins and backup
      onto it is tracked in #1288. None of these binaries serves a listener:
      mc is an outbound S3 client run by operator-authored Jenkins jobs or the
      backup schedule against the stack's own Silo endpoint, gosu is a
      privilege-drop exec helper, and migrate applies Langfuse's schema at
      start. Remove each purl once no scanned image carries it.
