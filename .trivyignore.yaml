      MLflow 3.16.0, and a fail-closed source scan covers every shipped
      executable surface. Remove this exception with the server move.

# TrueForge agent-runtime image (tfy.jfrog.io/tfy-images/trueforge:0.2.0-8b1d98e,
# reviewed index digest sha256:db9de64e1ff354a858dc646f23cf16c70e300c457acb86527e4a0b1cd556f573,
# linux/amd64 only; #1159, added 2026-09-20). 25 HIGH findings, three clusters:
# unfixed Debian 12 base packages (util-linux wave, perl-base, zlib1g MiniZip,
# ncurses, systemd libs, gzip, libacl1 — no patched bookworm package exists),
# libpcre2 (Debian fix published, waiting on an upstream image rebuild — the
# #1002 wave), and three upstream-bundled node_modules packages whose fixes
# arrive with the next TrueForge release (~daily cadence). Every entry is
# purl-scoped to the exact package@version in this image. That does not keep
# them image-local: the 2026-09-28 --show-suppressed scan found the same
# Debian 12.15 builds, and so these rows, in the airflow, node and python
# bookworm bases too (#1289). Not re-checked that day: tfy.jfrog.io was
# unreachable from the review environment.

  - id: CVE-2023-45853
    purls:
      - "pkg:deb/debian/zlib1g@1.2.13.dfsg-1?arch=amd64&distro=debian-12.15&epoch=1"
    expired_at: 2026-12-09
    statement: >-
      zlib1g 1.2.13 in the pinned TrueForge v0.2.0 image. The overflow is in MiniZip's
      zipOpenNewFileInZip4_64, which is not built into Debian's libz shared library,
      and Debian tracks the CVE as unfixed/wontfix for bookworm accordingly. No
      MiniZip consumer exists in the image; the Node.js runtime uses its own bundled
      zlib bindings.

  - id: CVE-2025-69720
    purls:
      - "pkg:deb/debian/libtinfo6@6.4-4?arch=amd64&distro=debian-12.15"
      - "pkg:deb/debian/ncurses-base@6.4-4?arch=all&distro=debian-12.15"
      - "pkg:deb/debian/ncurses-bin@6.4-4?arch=amd64&distro=debian-12.15"
    expired_at: 2026-12-09
    statement: >-
      ncurses 6.4-4 in the pinned TrueForge v0.2.0 image; no fixed Debian 12 package
      exists. ncurses is a terminal-UI library dragged in by base utilities; the
      server is a non-interactive Node.js process that never renders terminal UIs from
      untrusted terminfo, so the overflow has no input path. Cleared by the next
      upstream image on a patched base.

  - id: CVE-2026-13221
    purls:
      - "pkg:deb/debian/perl-base@5.36.0-7%2Bdeb12u3?arch=amd64&distro=debian-12.15"
    expired_at: 2026-12-09
    statement: >-
      perl-base 5.36.0-7+deb12u3 in the pinned TrueForge v0.2.0 image; no fixed Debian
      12 package exists. perl is a base-image artifact only: the image's processes are
      Node.js (server, controller, init script) and no code path shells out to perl,
      so the interpreter never parses attacker-supplied input. Cleared by the next
      upstream image on a patched base.

  - id: CVE-2026-14257
    purls:
      - "pkg:npm/brace-expansion@5.0.7"
    expired_at: 2026-12-09
    statement: >-
      brace-expansion 5.0.7 bundled in the upstream image's node_modules (TrueForge
      v0.2.0 lockfile); the fixed releases exist but arrive only with an upstream
      dependency bump. The flaw is memory-exhaustion DoS via crafted brace patterns in
      glob inputs; glob patterns reaching the server come from its own code and
      operator-authored agent configs, not anonymous callers, and the deployment is a
      single-operator local stack behind Kong basic-auth. Re-verify at the next image
      pin bump.

