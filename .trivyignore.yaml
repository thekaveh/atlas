  - id: CVE-2025-62506
    purls:
      - "pkg:golang/github.com/minio/minio@v0.0.0-20250907161309-07c3a429bfed+dirty"
    expired_at: 2026-10-15
    statement: >-
      Finding inside /usr/bin/minio in the pinned MinIO server image RELEASE.2025-09
      -07T16-13-09Z. MinIO publishes RELEASE.2025-10-15T17-29-55Z on GitHub only -- 
      it is absent from both Docker Hub and quay.io, verified -- so even the finding
      s with a published upstream fix cannot be reached by moving the image pin. Sev
      eral have no fixed release at all. Exposure is bounded by deployment: MinIO's 
      S3 API and console publish through HOST_BIND_IP, which defaults to 127.0.0.1:,
       so both ports are loopback-bound unless an operator deliberately widens them,
       and any operator who does must firewall them. This is a deployment mitigation
      , not a code fix. Time-boxed short because the decision needed is whether Atla
      s should keep depending on a server image whose security releases are not dist
      ributed as containers.
