      - "pkg:deb/debian/libtinfo6@6.4-4?arch=amd64&distro=debian-12.15"
      - "pkg:deb/debian/ncurses-base@6.4-4?arch=all&distro=debian-12.15"
      - "pkg:deb/debian/ncurses-bin@6.4-4?arch=amd64&distro=debian-12.15"
    expired_at: 2026-12-09
    statement: >-
      ncurses 6.4-4 in the pinned TrueForge v0.2.0 image; no fixed Debian 12 package
      exists. ncurses is a terminal-UI library dragged in by base utilities; the
      server is a non-interactive Node.js process that never renders terminal UIs from
      untrusted terminfo, so the overflow has no input path. Cleared by the next
      upstream image on a patched base.

