    expired_at: 2026-12-26
    statement: >-
      msgpack 1.1.2 listed in pip 26.2.1's own _vendor/vendor.txt inside the
      apache/airflow:3.3.2 base; Trivy reports it without a file path, so only
      the exact PURL can scope it. pip 26.2.1 is the newest release and vendors
      the same version, so no upgrade clears it. The vendored copy serves only
      pip's HTTP cache while pip itself runs at build time; Airflow imports the
      site-packages msgpack, which the overlay lock pins at the fixed 1.2.1.
      Cleared by a pip release that re-vendors msgpack >= 1.2.1.

