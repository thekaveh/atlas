    expired_at: 2026-12-09
    statement: >-
      libpcre2-8-0 10.42-1 in the pinned TrueForge v0.2.0 image. Debian HAS published
      the fix (10.42-1+deb12u1) but upstream has not yet rebuilt the image on the
      patched base — the same libpcre2 wave tracked for the python:3.12-slim remote
      contexts (#1002). Node/V8 uses its own regex engine, so PCRE2 sits on no request
      path (it serves grep and friends only). Time-boxed for the next upstream image
      release, which inherits the patched base automatically.

  - id: CVE-2026-9538
    purls:
      - "pkg:deb/debian/perl-base@5.36.0-7%2Bdeb12u3?arch=amd64&distro=debian-12.15"
