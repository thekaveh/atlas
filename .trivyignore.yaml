  - id: CVE-2026-69247
    purls:
      - "pkg:pypi/cryptography@49.0.0"
    expired_at: 2026-09-30
    statement: >-
      MLflow 3.15.1 caps cryptography below 50, while this finding requires
      cryptography 50. Atlas exposes no PKCS#7 envelope-decryption API in the
      notebook service, so the affected unauthenticated decrypt path is not
      reachable. Remove this exception when MLflow permits cryptography 50.
  - id: CVE-2026-14456
    purls:
      - "pkg:apk/alpine/libcrypto3@3.5.7-r0?arch=x86_64&distro=3.24.1"
      - "pkg:apk/alpine/libcrypto3@3.5.7-r0?arch=aarch64&distro=3.24.1"
      - "pkg:apk/alpine/libssl3@3.5.7-r0?arch=x86_64&distro=3.24.1"
      - "pkg:apk/alpine/libssl3@3.5.7-r0?arch=aarch64&distro=3.24.1"
    expired_at: 2026-09-30
    statement: >-
