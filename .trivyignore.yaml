    statement: >-
      False positive in /usr/bin/silo in the services/minio server image
      (pgsty/silo RELEASE.2026-09-16T00-00-00Z, source revision 2a4d51406b7e).
      The fork reports the MinIO module under a pseudo-version Trivy cannot
      order against MinIO's RELEASE tags, so it matches the "before
      RELEASE.2025-12-20" range. The source at that revision carries the fix:
      internal/s3select/csv/reader.go nextSplit reads with ReadSlice and
      returns errOverMaxRecordSize past the 1 MiB S3 Select record limit,
      where the vulnerable RELEASE.2025-09-07 code calls an unbounded
      ReadBytes. Re-verify the reader on every Silo bump.

  - id: GHSA-6v7p-g79w-8964
