      asset-baker image. The decompression-chain exhaustion needs urllib3 to fetch
      an attacker-controlled response; the bundled interpreter runs only bake.py
      and never imports urllib3 or makes HTTP requests. Remove this exception with
      the Blender 4.5 LTS move (#1002).
