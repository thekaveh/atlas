  - id: CVE-2015-2080
    purls:
      - "pkg:maven/org.eclipse.jetty/jetty-server@8.2.0.v20160908"
    expired_at: 2026-12-09
    statement: >-
      Apache Zeppelin 0.12.1 bundles this exact dependency inside its tested
      interpreter/runtime distribution; replacing individual transitive packages or
