    purls:
      - "pkg:maven/com.rabbitmq/amqp-client@5.5.3"
    expired_at: 2026-12-09
    statement: >-
      amqp-client 5.5.3 is shaded into the Alluxio interpreter jar
      (interpreter/alluxio/zeppelin-alluxio-0.12.1.jar). Atlas seeds only the
      stock Spark interpreter and never binds an Alluxio interpreter, so the
      class is present on disk but no interpreter process loads it. Apache Zeppelin 0.12.1 is still the newest published tag and bundles this exact dependency inside its tested interpreter/runtime distribution; replacing individual transitive packages or shaded JARs would create an unsupported interpreter mix. Atlas binds Zeppelin to a fixed loopback port with no Kong route, limiting access to local operators or explicit SSH tunnels. Remove this exception with a compatible upstream release.
  - id: CVE-2026-75595
    purls:
      - "pkg:maven/io.netty/netty-handler@4.1.51.Final"
      - "pkg:maven/io.netty/netty-handler@4.1.75.Final"
      - "pkg:maven/io.netty/netty-handler@4.1.87.Final"
    expired_at: 2026-12-09
    statement: >-
      These netty-handler copies are shaded into the Neo4j, Cassandra and R
      interpreter jars that ship with the upstream image; Atlas seeds only the
      stock Spark interpreter and none of these three is bound. The advisory is
      an SNI routing bypass that matters only where a netty TLS server uses
      per-SNI clientAuth=REQUIRE as its sole mutual-TLS gate, which no Zeppelin
      interpreter does. Apache Zeppelin 0.12.1 is still the newest published tag and bundles this exact dependency inside its tested interpreter/runtime distribution; replacing individual transitive packages or shaded JARs would create an unsupported interpreter mix. Atlas binds Zeppelin to a fixed loopback port with no Kong route, limiting access to local operators or explicit SSH tunnels. Remove this exception with a compatible upstream release.
  - id: CVE-2026-43871
    purls:
      - "pkg:maven/org.apache.thrift/libthrift@0.13.0"
    expired_at: 2026-12-09
    statement: >-
      libthrift 0.13.0 (lib/libthrift-0.13.0.jar) is the RPC layer between the
      Zeppelin server and its interpreter processes, so it cannot be removed or
      swapped without rebuilding Zeppelin itself. The advisory is a denial of
      service via an infinite loop in Thrift protocol parsing; the interpreter
      RPC listens only inside the container and is reachable by nothing but the
      server that spawned the interpreter. Apache Zeppelin 0.12.1 is still the newest published tag and bundles this exact dependency inside its tested interpreter/runtime distribution; replacing individual transitive packages or shaded JARs would create an unsupported interpreter mix. Atlas binds Zeppelin to a fixed loopback port with no Kong route, limiting access to local operators or explicit SSH tunnels. Remove this exception with a compatible upstream release.
  - id: CVE-2026-82397
    purls:
      - "pkg:pypi/tornado@6.2"
    expired_at: 2026-12-09
    statement: >-
      tornado 6.2 sits in the upstream image's conda Python 3.7 interpreter
      environment (envs/python_3_with_R) and the conda package cache; the fix,
      6.5.8, requires Python 3.9 or newer, so no in-place upgrade exists for that
      environment. Tornado there backs the IPython kernel transport, which is
      loopback-only inside the container. Apache Zeppelin 0.12.1 is still the newest published tag and bundles this exact dependency inside its tested interpreter/runtime distribution; replacing individual transitive packages or shaded JARs would create an unsupported interpreter mix. Atlas binds Zeppelin to a fixed loopback port with no Kong route, limiting access to local operators or explicit SSH tunnels. Remove this exception with a compatible upstream release.
