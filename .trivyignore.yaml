  - id: CVE-2026-43871
    purls:
      - "pkg:maven/org.apache.thrift/libthrift@0.16.0"
      - "pkg:golang/github.com/apache/thrift@v0.21.0"
    expired_at: 2026-11-30
    statement: >-
      libthrift 0.16.0 ships inside pyspark 4.1.2's bundled jars
      (pyspark/jars/libthrift-0.16.0.jar) in the Airflow image. The fix is
      0.24.0, which is unreachable without moving the whole pinned Spark family
      together: the pyspark pin must match the apache/spark:4.1.2 cluster image
      and iceberg-spark-runtime-4.1, and a previous uncoordinated move produced
      a pip file collision that hard-failed the image build. The advisory is a
      denial of service via infinite loop in Thrift protocol parsing; Atlas
      drives Spark through operator-authored DAGs against the internal cluster
      rather than exposing a Thrift endpoint to untrusted callers. Tracked for
      the coordinated upgrade; remove this exception when the Spark family
      moves.
  - id: CVE-2026-56854
    paths:
      - "bin/weaviate"
    expired_at: 2026-11-30
    statement: >-
      golang.org/x/crypto v0.53.0 is vendored into the Weaviate binary. The
      advisory (GHSA-gjhq-gjfw-99mq, rated high by GitHub though Trivy reports
      the vendor CRITICAL score) concerns the SSH server: source-address
      critical options were not enforced for the PasswordCallback,
      KeyboardInteractiveCallback, NoClientAuthCallback, and GSSAPI login
      paths. Weaviate exposes HTTP and gRPC only and runs no SSH server, so the
      package is present but the affected entry points are never reached. The
      fix needs x/crypto 0.55.0; 1.38.13 is the newest Weaviate release and
      still ships 0.53.0. Remove this exception once Weaviate rebuilds.
  - id: CVE-2026-84304
    paths:
      - "bin/weaviate"
    expired_at: 2026-11-30
    statement: >-
      google.golang.org/grpc v1.82.1 is vendored into the Weaviate binary.
      Fragmented HTTP/2 DATA frames can exhaust heap memory, and an
      unauthenticated remote caller can trigger it. Atlas publishes the gRPC
      port through HOST_BIND_IP, which defaults to 127.0.0.1:, so port 50051 is
      loopback-bound unless an operator deliberately widens it; this is a
      deployment mitigation rather than a code fix, and any operator who
      exposes the port must firewall it. The fix needs grpc 1.83.1; 1.38.13 is
      the newest Weaviate release and still ships 1.82.1. Remove this exception
      once Weaviate rebuilds.
  - id: CVE-2025-47913
    purls:
      - "pkg:golang/golang.org/x/crypto@v0.40.0"
      - "pkg:golang/golang.org/x/crypto@v0.37.0"
    expired_at: 2026-10-15
    statement: >-
      Go toolchain and vendored-module findings inside /usr/bin/mc in the pinned Min
      IO client image. No fixed release exists: RELEASE.2025-08-13T08-35-41Z is the 
      newest mc MinIO has published (GitHub and quay agree), and it has been the new
      est for 13 months, so the patched Go toolchain cannot be reached by bumping th
      e pin. Reachability is narrow: mc runs as a one-shot init container that talks
       only to the in-stack MinIO endpoint over the internal compose network, using 
      operator-supplied credentials, then exits -- it serves no network listener and
       processes no untrusted remote input. Deliberately time-boxed short rather tha
      n the full horizon: the real question is not when a fix lands but whether Atla
      s should keep depending on an abandoned image, given services/jenkins already 
      installs mc from its GitHub release binary instead. Tracked for that decision.
