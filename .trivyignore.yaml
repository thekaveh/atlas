  - id: CVE-2026-75595
    purls:
      - "pkg:maven/io.netty/netty-handler@4.1.115.Final"
      - "pkg:maven/io.netty/netty-handler@4.2.13.Final"
      - "pkg:maven/io.netty/netty-handler@4.2.7.Final"
    expired_at: 2026-12-09
    statement: >-
      netty-handler 4.1.115.Final ships inside the AWS SDK bundle jar
      (bundle-2.29.52.jar) that the Airflow, Spark, and Zeppelin images fetch
      for S3A. The advisory is an SNI routing bypass: a fragmented TLS
      ClientHello makes SslClientHelloHandler select the default SslContext
      instead of the SNI-specific one, which matters only where a netty TLS
      *server* uses per-SNI clientAuth=REQUIRE as its sole mutual-TLS gate.
      Atlas runs this jar exclusively as an S3A *client* against private MinIO
      and starts no netty TLS listener, so the vulnerable server-side path is
      never constructed. The fix needs netty 4.1.137/4.2.17, which is
      unreachable in every copy, and for two different pinned reasons. The
      4.1.115.Final copy is frozen because Hadoop 3.4.2 qualifies AWS SDK
      2.29.52 and breaks against newer SDK releases -- the same constraint that
      pins GHSA-443w-3rq3-5m5h below, and both lift together. The 4.2.13.Final
      and 4.2.7.Final copies are vendored by iceberg-aws-bundle 1.11.0 and
      pyspark 4.1.2's spark-connect client, which move only with the
      coordinated Spark family upgrade tracked in #996 alongside libthrift
      above. Remove each purl as its pinned family reaches netty 4.1.137 or
      4.2.17.
  - id: GHSA-443w-3rq3-5m5h
    purls:
      - "pkg:maven/software.amazon.awssdk/cloudfront@2.29.52"
    expired_at: 2026-12-09
    statement: >-
      Hadoop 3.4.2 qualifies AWS SDK 2.29.52 for third-party S3 stores and
      breaks against newer SDK releases. Atlas uses only the S3A client against
      private MinIO; CloudFront is neither configured nor reachable through this
      path, and a live MinIO write/read smoke test gates both image architectures.
      Remove this exception when Hadoop qualifies a patched compatible SDK.
