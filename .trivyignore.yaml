# Trivy consumes this file directly. Each exception must be package/path scoped,
# carry a concrete risk statement, and expire; scripts.container_security rejects
# broad, undocumented, duplicate, or stale entries before a scan can run.
#
# Review pass 2026-09-28 (#998). Before it: 391 entries, 321 unique IDs, 59
# expiring 2026-10-15, 3 on 2026-11-30, 324 on 2026-12-09, 5 on 2026-12-26.
# Coverage was measured rather than inferred: every manifest image reachable
# from the review environment (59 of 72 scan contexts -- ghcr.io denied eight
# anonymous pulls, quay.io, cr.weaviate.io, docker.redpanda.com and
# tfy.jfrog.io were unreachable, and the multi-GB GPU images were skipped) was
# scanned with Trivy 0.74.0 against this file with --show-suppressed, which
# records each finding a row suppresses and the image it sits in.
#
#   Removed   16  The 13 /usr/bin/minio rows (MinIO server RELEASE.2025-09-07)
#                 and 2 Red Hat UBI 9.6 rows, all from images retired by the
#                 Silo swap. pgsty/silo and pgsty/mc scan clean of them with
#                 no exceptions applied; the one row that still matched
#                 elsewhere (jsonparser 1.1.1 in grafana and ollama) carried no
#                 rationale for those images, which already fail the weekly
#                 fleet scan on other unreviewed findings. Also the cryptography
#                 49.0.0 row: its notebook owner now pins 50.0.1 and its only
#                 remaining match, crawl4ai, was never assessed.
#   Re-owned  43  The mc Go-toolchain set. The same mc RELEASE.2025-08-13
#                 binary still ships in the Jenkins image and the backup
#                 entrypoint (a Trivy scan of the checksum-verified release
#                 assets reproduces exactly these 43), and its stdlib 1.24.6
#                 rows also suppress gosu in the postgres alpine images and
#                 migrate in langfuse. Purls narrowed to the versions those
#                 binaries carry, owners named, renewed to 2026-11-30 (#1288).
#   Renewed    1  MLflow CVE-2026-71211 to 2026-11-30: 3.16.x is unaffected,
#                 so the fix is now a server-image move (#1287).
#   Owned     43  Rows that named no owning service now do: the 40 Julia rows
#                 (jupyterhub), the Alpine OpenSSL row and the two Silo pcre2
#                 rows (services/minio).
#
# Why no fix is reachable, per cluster, re-checked on 2026-09-28:
#
#   Zeppelin  174  apache/zeppelin:0.12.1 is still the newest tag.
#   Lakehouse  41  Spark 4.2.0 is the newest release and still ships libthrift
#                  0.16.0 and netty 4.2.13.Final (4.2.17 needed); it moves to
#                  Hadoop 3.5.0 (AWS SDK 2.35.4, netty 4.1.130 -- 4.1.137
#                  needed), which Spark 4.1.x cannot take. Blocked on #996.
#   Julia      40  1.12.7 is still the newest 1.12.x; 1.13.1 is a minor move.
#   Iceberg    24  apache/iceberg-rest-fixture:1.10.1 is still the newest tag;
#                  iceberg-core 1.11.0 has no fixture image.
#   mc         43  RELEASE.2025-08-13T08-35-41Z is still the newest official mc
#                  (git tags); the maintained pgsty fork scans clean (#1288).
#   Jenkins     4  The pinned jenkins/jenkins:lts-jdk21 digest is still the
#                  current tag, and git-lfs 3.8.0 the newest release.
#   Ray         5  2.58.0 drops the jackson and aiohttp rows but still
#                  ships httpcore5 5.0.2 and adds 25 other HIGH/CRITICAL
#                  findings, so moving Ray is its own decision.
#
# Fixes that became reachable by a pin move are recorded in their rows and
# tracked separately, because #998 scopes out upgrades: alpine:3.24.2 carries
# OpenSSL 3.5.8-r0 (#1285), Weaviate 1.38.17 scans clean (#1286), and MLflow
# 3.16.x is unaffected by CVE-2026-71211 (#1287).
#
# Purl-scoped rows match a package in any image, and the scan shows many
# covering images their statements never name -- the TrueForge Debian 12 rows
# also suppress the airflow, node and python bookworm bases, for example.
# Reconciling that coverage, and confirming or deleting the 44 rows OSV calls
# unaffected, needs per-image scan output and is tracked in #1289.
#
# Blender-vendored Python (asset-baker, #1002 criterion 3). Blender 4.3.2 ships
# its own CPython 3.11 under /opt/blender/4.3/python with certifi 2021.10.8,
# setuptools 63.2.0 and urllib3 1.26.8 baked into the release tarball. They are
# not apt- or pip-managed, and the fix is a Blender version move (4.5 LTS clears
# certifi and urllib3; setuptools is confirmed only from 5.2), which needs the
# blender-mcp bridge re-verified live. The nine rows below are scoped to the
# exact dist-info paths inside that tree so an identical package anywhere else
# still fails the gate. Reachability: the bundled interpreter runs only
# bake.py (bpy, numpy, stdlib file I/O) under `blender -b`; the FastAPI layer
# uses the image's own patched Python. Nothing in that process imports urllib3,
# certifi or setuptools, opens a network connection, or installs packages.
# Re-checked 2026-09-28: 4.3.2 is still pinned and 5.2.2 is Blender's newest
# release (tags on the github.com/blender/blender mirror).
vulnerabilities:
  - id: CVE-2026-56854
    paths:
      - "usr/local/bin/git-lfs"
    expired_at: 2026-12-09
    statement: >-
      golang.org/x/crypto v0.54.0 is compiled into the git-lfs 3.8.0 release
      binary that Atlas installs into the Jenkins image (the newest git-lfs
      release on 2026-09-17; the fix is x/crypto 0.55.0). The advisory is an SSH
      server-side authentication bypass; git-lfs only acts as an SSH client for
      git-lfs-authenticate and never listens. Jenkins is disabled by default
      (JENKINS_SOURCE=disabled). Remove when git-lfs publishes a release built
      against x/crypto 0.55.0 or newer (#1002).
  - id: GHSA-r7wm-3cxj-wff9
    paths:
      - "opt/jenkins-plugin-manager.jar"
    expired_at: 2026-12-09
    statement: >-
      jackson 2.20.1 ships inside /opt/jenkins-plugin-manager.jar, the
      plugin-installer CLI the upstream jenkins/jenkins:lts-jdk21 image bundles;
      Atlas runs it only at image build time (jenkins-plugin-cli --plugin-file)
      and the Jenkins runtime never loads that jar. Jenkins itself is disabled by
      default (JENKINS_SOURCE=disabled) and sits behind its own login. Remove when
      the upstream image ships a plugin manager built against jackson
      2.18.8+/2.21.4+ (#1002).
