name: container-security

on:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security
  cancel-in-progress: false

jobs:
  inventory:
    name: Validate image inventory and exception policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      images: ${{ steps.inventory.outputs.images }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.19"

      - name: Sync inventory dependencies
        run: uv sync --project bootstrapper --group dev --locked

      - name: Emit manifest-owned image matrix
        id: inventory
        run: |
          set -euo pipefail
          images="$(uv run --project bootstrapper python -m scripts.container_security --images-json)"
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.image }}
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Fail on unreviewed high or critical vulnerabilities
        env:
          IMAGE_REF: ${{ matrix.image }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: >-
          trivy image
          --image-src remote
          --platform "$IMAGE_PLATFORM"
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignorefile .trivyignore.yaml
          --exit-code 1
          --no-progress
          --timeout 30m
          "$IMAGE_REF"

  local-images:
    name: Build and scan local runtime images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build every CI-supported local runtime image
        run: |
          set -euo pipefail
          image_list="${RUNNER_TEMP}/atlas-ci-images.txt"
          : > "$image_list"
          image_index=0
          for spec in \
            "services/airflow/build|Dockerfile|--build-arg BASE_IMAGE=apache/airflow:3.3.1" \
            "services/asset-worker/app|Dockerfile|" \
            "services/asset-baker/app|Dockerfile|" \
            "services/backend/app|Dockerfile|" \
            "services/docling/provider|adapter/Dockerfile|" \
            "services/iceberg-rest/build|Dockerfile|" \
            "services/jenkins/build|Dockerfile|" \
            "services/jupyterhub/build|Dockerfile|" \
            "services/local-deep-researcher/build|Dockerfile|" \
            "services/mcp-servers/runtime|../build/Dockerfile|" \
            "services/neo4j/build|Dockerfile|" \
            "services/spark/build|Dockerfile|--build-arg BASE_IMAGE=apache/spark:4.1.2" \
            "services/zeppelin/build|Dockerfile|" \
            "services/label-studio/init|Dockerfile|" \
            "services/langfuse/init|Dockerfile|" \
            "services/litellm/init|Dockerfile|" \
            "services/mlflow/init|Dockerfile|" \
            "services/open-webui/init|Dockerfile|"
          do
            IFS='|' read -r context dockerfile extra_args <<< "$spec"
            dockerfile_path="$context/$dockerfile"
            image_tag="atlas-ci/runtime-${image_index}:${GITHUB_SHA}"
            if [ -n "$extra_args" ]; then
              docker buildx build --load -t "$image_tag" $extra_args -f "$dockerfile_path" "$context/"
            else
              docker buildx build --load -t "$image_tag" -f "$dockerfile_path" "$context/"
            fi
            printf '%s\n' "$image_tag" >> "$image_list"
            image_index=$((image_index + 1))
          done

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Fail on unreviewed high or critical vulnerabilities
        run: |
          set -euo pipefail
          while IFS= read -r image_ref; do
            trivy image \
              --image-src docker \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignorefile .trivyignore.yaml \
              --exit-code 1 \
              --no-progress \
              --timeout 10m \
              "$image_ref"
          done < "${RUNNER_TEMP}/atlas-ci-images.txt"
