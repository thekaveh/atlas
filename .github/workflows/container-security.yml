name: container-security

on:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security
  cancel-in-progress: false

jobs:
  inventory:
    name: Validate image inventory and exception policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      images: ${{ steps.inventory.outputs.images }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.19"

      - name: Sync inventory dependencies
        run: uv sync --project bootstrapper --group dev --locked

      - name: Emit manifest-owned image matrix
        id: inventory
        run: |
          set -euo pipefail
          images="$(uv run --project bootstrapper python -m scripts.container_security --images-json)"
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.image }} (${{ matrix.platform }})
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Fail on unreviewed high or critical vulnerabilities
        env:
          IMAGE_REF: ${{ matrix.image }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/run_trivy_remote_scan.sh "$IMAGE_REF" "$IMAGE_PLATFORM"

  local-images:
    name: Build and scan local runtime images
    runs-on: ubuntu-24.04
    # Match the required cold-QEMU build bound: this job builds the same
    # platform set and additionally scans every resulting runtime image.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Build and scan every CI-supported local runtime image
        run: |
          set -euo pipefail
          image_tag=""
          cleanup_loaded_image() {
            if [ -n "$image_tag" ]; then
              docker image rm "$image_tag" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_loaded_image EXIT
          image_index=0
          for spec in \
            "services/airflow/build|Dockerfile" \
            "services/asset-worker/app|Dockerfile" \
            "services/asset-baker/app|Dockerfile" \
            "services/backup/init|Dockerfile" \
            "services/backend/app|Dockerfile" \
            "services/comfyui/init|Dockerfile" \
            "services/docling/provider|adapter/Dockerfile" \
            "services/hermes/init|Dockerfile" \
            "services/iceberg-rest/build|Dockerfile" \
            "services/jenkins/build|Dockerfile" \
            "services/jupyterhub/build|Dockerfile" \
            "services/lightrag/init|Dockerfile" \
            "services/local-deep-researcher/build|Dockerfile" \
            "services/mcp-servers/runtime|../build/Dockerfile" \
            "services/neo4j/build|Dockerfile" \
            "services/spark/build|Dockerfile" \
            "services/zeppelin/build|Dockerfile" \
            "services/label-studio/init|Dockerfile" \
            "services/langfuse/init|Dockerfile" \
            "services/litellm/init|Dockerfile" \
            "services/mlflow|build/Dockerfile" \
            "services/mlflow/init|Dockerfile" \
            "services/ollama/pull|Dockerfile" \
            "services/openclaw/init|Dockerfile" \
            "services/open-webui/init|Dockerfile"
          do
            IFS='|' read -r context dockerfile <<< "$spec"
            dockerfile_path="$context/$dockerfile"
            platforms="linux/amd64 linux/arm64"
            if [ "$context|$dockerfile" = "services/asset-baker/app|Dockerfile" ]; then
              platforms="linux/amd64"
            fi
            for platform in $platforms; do
              platform_tag="${platform#linux/}"
              image_tag="atlas-ci/runtime-${image_index}-${platform_tag}:${GITHUB_SHA}"
              docker buildx build --load --platform "$platform" -t "$image_tag" -f "$dockerfile_path" "$context/"
              trivy image \
                --image-src docker \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --ignorefile .trivyignore.yaml \
                --exit-code 1 \
                --no-progress \
                --timeout 10m \
                "$image_tag"
              echo "::group::Unfixed High/Critical findings (informational)"
              trivy image \
                --image-src docker \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignorefile .trivyignore.yaml \
                --exit-code 0 \
                --no-progress \
                --timeout 10m \
                "$image_tag"
              echo "::endgroup::"
              docker image rm "$image_tag"
              image_tag=""
            done
            image_index=$((image_index + 1))
            docker buildx prune --force
          done
