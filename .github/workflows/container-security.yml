name: container-security

on:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:
    inputs:
      coverage:
        description: >-
          Report which .trivyignore.yaml rows each image uses, with Trivy's
          suppressed findings shown, instead of gating (#1289)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-security
  cancel-in-progress: false

jobs:
  inventory:
    name: Validate image inventory and exception policy
    # A coverage dispatch replaces the gating remote scans with coverage-remote.
    if: ${{ !inputs.coverage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      images: ${{ steps.inventory.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"

      - name: Sync inventory dependencies
        run: uv sync --project bootstrapper --group dev --locked

      - name: Emit manifest-owned image matrix
        id: inventory
        run: |
          set -euo pipefail
          images="$(uv run --project bootstrapper python -m scripts.container_security --images-json)"
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.image }} (${{ matrix.platform }})
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Fail on unreviewed high or critical vulnerabilities
        env:
          IMAGE_REF: ${{ matrix.image }}
          IMAGE_PLATFORM: ${{ matrix.platform }}
          # As in coverage-remote and the PR scan: a Hub token lifts pulls off
          # the anonymous per-IP quota; empty when unset, and the script then
          # falls back to anonymous pulls.
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/run_trivy_remote_scan.sh "$IMAGE_REF" "$IMAGE_PLATFORM"

  coverage-remote:
    # Dispatch-only (#1289): scan every manifest-owned remote image with the
    # suppressed findings shown and print one COVERAGE line per image, so
    # `python -m scripts.exception_coverage --summarize` can fold the logs into
    # a per-row report, plus one FINDING line per HIGH/CRITICAL finding no row
    # suppresses, i.e. what the gate fails on. Never gates.
    name: Exception coverage, remote shard ${{ matrix.shard }}
    if: ${{ inputs.coverage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"

      - name: Sync inventory dependencies
        run: uv sync --project bootstrapper --group dev --locked

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Report exception coverage for this shard
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ -z "${TRIVY_USERNAME:-}" ] || [ -z "${TRIVY_PASSWORD:-}" ]; then
            unset TRIVY_USERNAME TRIVY_PASSWORD
          fi
          uv run --project bootstrapper python -m scripts.exception_coverage --shard "$SHARD" --shards 8

  local-images:
    name: Build and scan local runtime images
    runs-on: ubuntu-24.04
    # Same cold-QEMU build bound as services-lint's final-image-scan job,
    # which builds the same platform set; this job also scans the images.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Set up Python
        if: ${{ inputs.coverage }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ inputs.coverage }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"

      - name: Sync coverage dependencies
        if: ${{ inputs.coverage }}
        run: uv sync --project bootstrapper --group dev --locked

      - name: Build and scan every CI-supported local runtime image
        env:
          # A coverage dispatch reports which exception rows each image uses
          # instead of gating it (#1289).
          COVERAGE: ${{ inputs.coverage && 'true' || 'false' }}
        run: |
          set -euo pipefail
          coverage_lines="$(mktemp)"
          image_tag=""
          cleanup_loaded_image() {
            if [ -n "$image_tag" ]; then
              docker image rm "$image_tag" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_loaded_image EXIT
          image_index=0
          for spec in \
            "services/airflow/build|Dockerfile" \
            "services/asset-worker/app|Dockerfile" \
            "services/asset-baker/app|Dockerfile" \
            "services/backup/init|Dockerfile" \
            "services/backend/app|Dockerfile" \
            "services/comfyui/init|Dockerfile" \
            "services/docling/provider|adapter/Dockerfile" \
            "services/hermes/init|Dockerfile" \
            "services/iceberg-rest/build|Dockerfile" \
            "services/jenkins/build|Dockerfile" \
            "services/jupyterhub/build|Dockerfile" \
            "services/lightrag/init|Dockerfile" \
            "services/local-deep-researcher/build|Dockerfile" \
            "services/mcp-servers/runtime|../build/Dockerfile" \
            "services/neo4j/build|Dockerfile" \
            "services/spark/build|Dockerfile" \
            "services/zeppelin/build|Dockerfile" \
            "services/label-studio/init|Dockerfile" \
            "services/langfuse/init|Dockerfile" \
            "services/litellm/init|Dockerfile" \
            "services/mlflow|build/Dockerfile" \
            "services/mlflow/init|Dockerfile" \
            "services/ollama/pull|Dockerfile" \
            "services/openclaw/init|Dockerfile" \
            "services/open-webui/init|Dockerfile"
          do
            IFS='|' read -r context dockerfile <<< "$spec"
            dockerfile_path="$context/$dockerfile"
            platforms="linux/amd64 linux/arm64"
            if [ "$context|$dockerfile" = "services/asset-baker/app|Dockerfile" ]; then
              platforms="linux/amd64"
            fi
            for platform in $platforms; do
              platform_tag="${platform#linux/}"
              image_tag="atlas-ci/runtime-${image_index}-${platform_tag}:${GITHUB_SHA}"
              docker buildx build --load --platform "$platform" -t "$image_tag" -f "$dockerfile_path" "$context/"
              if [ "$COVERAGE" = true ]; then
                uv run --project bootstrapper python -m scripts.exception_coverage \
                  --local-image "$image_tag" --label "$context" --platform "$platform" --ignore-unfixed \
                  | grep -E '^(COVERAGE|FINDING)[[:space:]]' | tee -a "$coverage_lines"
                docker image rm "$image_tag"
                image_tag=""
                continue
              fi
              trivy image \
                --image-src docker \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --ignorefile .trivyignore.yaml \
                --exit-code 1 \
                --no-progress \
                --timeout 30m \
                "$image_tag"
              echo "::group::Unfixed High/Critical findings (informational)"
              trivy image \
                --image-src docker \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignorefile .trivyignore.yaml \
                --exit-code 0 \
                --no-progress \
                --timeout 30m \
                "$image_tag"
              echo "::endgroup::"
              docker image rm "$image_tag"
              image_tag=""
            done
            image_index=$((image_index + 1))
            docker buildx prune --force
          done
          if [ "$COVERAGE" = true ]; then
            echo "== COVERAGE summary (local images) =="
            cat "$coverage_lines"
          fi
