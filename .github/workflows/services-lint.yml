name: services-lint

# Lints and tests the per-service modular configuration layout.
#
# Gates:
#   - manifest validator (8 cross-manifest checks)
#   - unit tests (loader, validator, assembler, hooks, validate_fragments CLI),
#     split into parallel jobs behind the required `Manifest lint + unit tests`
#     gate: `lint` (with containers + Backend), `unit-fast` (no Docker, the
#     early signal), `python-floor` (Python 3.10) and `component-tests` (#1176)
#   - compose merge (`docker compose -f docker-compose.yml config -q`)
#   - byte-equivalence vs the golden baseline at
#     bootstrapper/tests/fixtures/rendered_config_baseline.yml
#   - source-permutation matrix (every SOURCE value × compose config)
#   - docs-drift gate (`bootstrapper.docs.regen --all --check`)
#   - audit scripts: doc-links, compose source-deps, docs structure,
#     Kong routes, research schema

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Principle-of-least-privilege: this is a read-only lint/test workflow;
# none of the jobs need write access to the repo, PRs, or packages.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's superseded run
# (#1176). Every push to main or develop gets a group of its own (its run id),
# so those runs are never cancelled and never cancel anything.
concurrency:
  group: services-lint-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Not a required check itself: the `required-lint` gate below carries the
    # required "Manifest lint + unit tests" name and fails unless this job and
    # the three split-out suites all pass (#1176).
    name: Bootstrapper and Backend suites (with containers)
    runs-on: ubuntu-24.04
    # One bootstrapper pass with the container-backed backup/restore
    # integration tests (near 40 minutes on its own) plus the Backend suite.
    # The Python 3.10 pass and the MCP and asset suites run in parallel jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth zero fetches all history and tags. `fetch-tags` is only
          # needed to add tags to a positive-depth checkout.
          fetch-depth: 0

      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Pin uv so CI is deterministic. With no version, setup-uv installs
          # the latest uv at run time, whose resolver/lock semantics can shift
          # under us and silently flip a `uv lock --locked` check. Bump
          # deliberately; keep in sync with the Dockerfile `uv==` pins.
          version: "0.11.19"

      - name: Sync dependencies
        working-directory: bootstrapper
        run: uv sync --group dev --locked

      - name: Pull-request title is a Conventional Commits subject
        # The squash commit takes its subject from the title, and
        # scripts/release_notes.py generates the changelog summary from those
        # subjects (#968). Pushes to develop/main carry no title to check.
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --project bootstrapper python -m scripts.release_notes --check-title "$PR_TITLE"

      - name: Generated changelog summary is current
        run: uv run --project bootstrapper python -m scripts.release_notes --check-changelog

      - name: Install ShellCheck
        run: |
          curl -fsSL \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o "${RUNNER_TEMP}/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${RUNNER_TEMP}/shellcheck.tar.xz" \
            | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}"
          sudo install "${RUNNER_TEMP}/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck

      - name: Lint tracked shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x

      - name: Pull exact backup integration images
        run: |
          timeout 5m docker pull postgres:17.10-alpine
          timeout 5m docker pull pgsty/silo:RELEASE.2026-09-16T00-00-00Z
          timeout 5m docker pull pgsty/mc:RELEASE.2026-09-16T00-00-00Z
          # The backup image installs its own pinned mc from the official
          # release, verified by SHA-256 (services/backup/init/scripts/
          # entrypoint.sh). The integration tests need that exact binary, which
          # the newer pgsty/mc client image no longer carries, so provision it
          # the same way and hand its directory to every later step.
          pinned_mc_dir="${RUNNER_TEMP}/atlas-pinned-mc"
          pinned_mc="mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z"
          mkdir -p "$pinned_mc_dir"
          timeout 5m curl -fsSL --retry 3 -o "$pinned_mc_dir/$pinned_mc" \
            "https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/$pinned_mc"
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  $pinned_mc_dir/$pinned_mc" \
            | sha256sum -c -
          echo "ATLAS_BACKUP_PINNED_MC_DIR=$pinned_mc_dir" >> "$GITHUB_ENV"
          timeout 5m docker pull neo4j:5.26.30
          timeout 5m docker pull cr.weaviate.io/semitechnologies/weaviate:1.38.13
          timeout 5m docker pull alpine:3.24.1
          timeout 5m docker pull supabase/postgres:17.6.1.139
          timeout 5m docker pull postgres:15.18-alpine
          timeout 5m docker pull supabase/realtime:v2.112.0
          timeout 5m docker pull supabase/storage-api:v1.61.5
          timeout 5m docker pull supabase/supavisor:2.9.5
          timeout 5m docker pull redis:7.2.14-alpine
          timeout 5m docker pull otel/opentelemetry-collector-contrib:0.154.0
          timeout 5m docker pull grafana/loki:3.7.0
          timeout 5m docker pull grafana/grafana:11.4.3
          timeout 10m docker build --pull \
            --tag atlas-backup:local \
            services/backup/init

      - name: Run unit tests (loader, validator, assembler, hooks, CLI)
        working-directory: bootstrapper
        env:
          ATLAS_BACKUP_PRODUCTION_IMAGE_INTEGRATION: "1"
          ATLAS_DATABASE_BACKUP_LIVE_INTEGRATION: "1"
          ATLAS_RUN_DOCKER_OTEL_SMOKE: "1"
        run: >-
          uv run pytest tests/ -q
          --ignore=tests/test_fragment_equivalence.py
          --ignore=tests/test_source_permutations.py
          --cov=. --cov-config=pyproject.toml --cov-branch
          --cov-report=term --cov-fail-under=69

      - name: Lint manifests
        working-directory: bootstrapper
        run: uv run python -m tools.validate_fragments

      - name: Backend unit tests
        working-directory: services/backend/app/app
        run: |
          BACKEND_TEST_VENV="${RUNNER_TEMP:-$PWD}/backend-ci-venv"
          REDIS_CONTAINER="atlas-backend-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_backend_redis() {
            docker rm -f "$REDIS_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_backend_redis EXIT
          docker run -d --pull=never --name "$REDIS_CONTAINER" \
            -p 127.0.0.1::6379 redis:7.2.14-alpine \
            redis-server --save '' --appendonly no
          for attempt in $(seq 1 40); do
            if docker exec "$REDIS_CONTAINER" redis-cli ping | grep -qx PONG; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Backend test Redis did not become ready" >&2
              exit 1
            fi
            sleep 0.25
          done
          REDIS_ENDPOINT=$(docker port "$REDIS_CONTAINER" 6379/tcp)
          REDIS_PORT=${REDIS_ENDPOINT##*:}
          export ATLAS_TEST_REDIS_URL="redis://127.0.0.1:${REDIS_PORT}/15"
          uv venv --python 3.12 "$BACKEND_TEST_VENV"
          # Runtime and test requirements jointly own the tested import
          # closure. Both are repository-managed; no inline CI subset may
          # drift from the application or pytest plugin contracts.
          VIRTUAL_ENV="$BACKEND_TEST_VENV" uv pip install \
            -r requirements.txt -r requirements-dev.txt -c requirements-test-locked.txt
          "$BACKEND_TEST_VENV/bin/python" -m pytest tests/ -q -W error \
            --cov=. --cov-config=.coveragerc --cov-branch \
            --cov-report=term --cov-fail-under=79

      - name: Remove integration test containers
        # The only job that runs the opted-in backup and restore integration
        # tests owns their cleanup, and runs it even when a test step failed.
        # Their containers are named atlas-<purpose>-<token>, and the live
        # Compose drills run as project atlas_it_<token>, whose containers,
        # networks and volumes all start with that prefix. Housekeeping only:
        # a removal race must never turn a job whose tests passed red.
        if: always()
        continue-on-error: true
        run: |
          owned() { grep -E '^atlas[-_]' || true; }
          docker ps -a --format '{{.Names}}' | owned | xargs -r docker rm -f
          docker network ls --format '{{.Name}}' | owned | xargs -r docker network rm
          docker volume ls --format '{{.Name}}' | owned | xargs -r docker volume rm -f

  unit-fast:
    # The early signal (#1176): the whole bootstrapper suite as a contributor
    # without Docker runs it. No daemon is reachable and CI is cleared, so the
    # container-backed tests skip themselves exactly as they do locally, and
    # a failing unit test turns this check red long before the container
    # suites finish. Those suites still run in `lint` and `python-floor`.
    name: Bootstrapper suite without Docker (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the release-history tests read them.
          fetch-depth: 0

      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.19"

      - name: Sync dependencies
        working-directory: bootstrapper
        run: uv sync --group dev --locked

      - name: Run bootstrapper tests without a Docker daemon
        working-directory: bootstrapper
        env:
          CI: ""
          DOCKER_HOST: unix:///tmp/atlas-no-docker.sock
        run: >-
          uv run pytest tests/ -q
          --ignore=tests/test_fragment_equivalence.py
          --ignore=tests/test_source_permutations.py

  python-floor:
    # The supported Python floor. It runs the full bootstrapper suite, with
    # the same images `lint` pulls, because its Docker-backed tests require
    # them locally in CI.
    name: Bootstrapper suite on Python 3.10
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the release-history tests read them.
          fetch-depth: 0

      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.19"

      - name: Pull exact backup integration images
        run: |
          timeout 5m docker pull postgres:17.10-alpine
          timeout 5m docker pull pgsty/silo:RELEASE.2026-09-16T00-00-00Z
          timeout 5m docker pull pgsty/mc:RELEASE.2026-09-16T00-00-00Z
          # The backup image installs its own pinned mc from the official
          # release, verified by SHA-256 (services/backup/init/scripts/
          # entrypoint.sh). The integration tests need that exact binary, which
          # the newer pgsty/mc client image no longer carries, so provision it
          # the same way and hand its directory to every later step.
          pinned_mc_dir="${RUNNER_TEMP}/atlas-pinned-mc"
          pinned_mc="mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z"
          mkdir -p "$pinned_mc_dir"
          timeout 5m curl -fsSL --retry 3 -o "$pinned_mc_dir/$pinned_mc" \
            "https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/$pinned_mc"
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  $pinned_mc_dir/$pinned_mc" \
            | sha256sum -c -
          echo "ATLAS_BACKUP_PINNED_MC_DIR=$pinned_mc_dir" >> "$GITHUB_ENV"
          timeout 5m docker pull neo4j:5.26.30
          timeout 5m docker pull cr.weaviate.io/semitechnologies/weaviate:1.38.13
          timeout 5m docker pull alpine:3.24.1
          timeout 5m docker pull supabase/postgres:17.6.1.139
          timeout 5m docker pull postgres:15.18-alpine
          timeout 5m docker pull supabase/realtime:v2.112.0
          timeout 5m docker pull supabase/storage-api:v1.61.5
          timeout 5m docker pull supabase/supavisor:2.9.5
          timeout 5m docker pull redis:7.2.14-alpine
          timeout 5m docker pull otel/opentelemetry-collector-contrib:0.154.0
          timeout 5m docker pull grafana/loki:3.7.0
          timeout 5m docker pull grafana/grafana:11.4.3
          timeout 10m docker build --pull \
            --tag atlas-backup:local \
            services/backup/init

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Run bootstrapper tests on Python 3.10
        working-directory: bootstrapper
        run: >-
          uv run --python 3.10 --isolated --locked --group dev
          pytest tests/ -q
          --ignore=tests/test_fragment_equivalence.py
          --ignore=tests/test_source_permutations.py

  component-tests:
    name: MCP and asset API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.19"

      - name: MCP framework contract tests
        run: |
          MCP_TEST_VENV="${RUNNER_TEMP:-$PWD}/mcp-ci-venv"
          uv venv --python 3.12 "$MCP_TEST_VENV"
          VIRTUAL_ENV="$MCP_TEST_VENV" uv pip install \
            -r services/mcp-servers/runtime/requirements-test.txt \
            -c services/mcp-servers/runtime/requirements-test-locked.txt
          "$MCP_TEST_VENV/bin/python" -m pytest \
            bootstrapper/tests/test_mcp_servers_framework.py -q -W error

      - name: Asset processor API tests
        run: |
          ASSET_TEST_VENV="${RUNNER_TEMP:-$PWD}/asset-ci-venv"
          uv venv --python 3.12 "$ASSET_TEST_VENV"
          VIRTUAL_ENV="$ASSET_TEST_VENV" uv pip install \
            -r services/asset-worker/app/requirements-test.txt \
            -c services/asset-worker/app/requirements-test-locked.txt
          (
            cd services/asset-worker/app
            "$ASSET_TEST_VENV/bin/python" -m pytest tests/ -q
          )
          (
            cd services/asset-baker/app
            "$ASSET_TEST_VENV/bin/python" -m pytest tests/ -q
          )

  required-lint:
    # Carries the ruleset-required "Manifest lint + unit tests" check. It
    # waits for every suite split out of the former single job and fails
    # unless all of them succeeded. `always()` makes it run, and fail, when a
    # dependency failed or was cancelled; a skipped required check would
    # otherwise count as passing.
    name: Manifest lint + unit tests
    needs: [unit-fast, lint, python-floor, component-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every split suite to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: data["result"] for job, data in json.loads(os.environ["NEEDS"]).items()}
          print(json.dumps(results, indent=2, sort_keys=True))
          failed = sorted(job for job, result in results.items() if result != "success")
          if failed:
              sys.exit(f"not successful: {', '.join(failed)}")
          PY

  compose-equivalence:
    name: Compose merge + byte-equivalence + source-permutation matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Pin uv so CI is deterministic. With no version, setup-uv installs
          # the latest uv at run time, whose resolver/lock semantics can shift
          # under us and silently flip a `uv lock --locked` check. Bump
          # deliberately; keep in sync with the Dockerfile `uv==` pins.
          version: "0.11.19"

      - name: Sync dependencies
        working-directory: bootstrapper
        run: uv sync --group dev --locked

      - name: Materialize .env from .env.example
        # Compose interpolation reads .env at the project root. The matrix
        # tests then override one SOURCE var at a time in a tmp file.
        run: cp .env.example .env

      - name: Compose merge sanity (docker compose config -q)
        run: docker compose --env-file .env -f docker-compose.yml config -q

      - name: Byte-equivalence test vs golden baseline
        working-directory: bootstrapper
        run: uv run pytest tests/test_fragment_equivalence.py -q

      - name: Source-permutation matrix (every SOURCE value × compose config)
        working-directory: bootstrapper
        run: uv run pytest tests/test_source_permutations.py -q

  audit-scripts:
    name: Docs drift + audit scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Pin uv so CI is deterministic. With no version, setup-uv installs
          # the latest uv at run time, whose resolver/lock semantics can shift
          # under us and silently flip a `uv lock --locked` check. Bump
          # deliberately; keep in sync with the Dockerfile `uv==` pins.
          version: "0.11.19"

      - name: Sync dependencies
        working-directory: bootstrapper
        run: uv sync --group dev --locked

      - name: Materialize .env from .env.example
        # check-compose-source-deps.py invokes `docker compose config` to
        # render the merged shape across all per-service fragments (the
        # top-level docker-compose.yml is a thin `include:`-only shell).
        # Without .env present, compose interpolation fails and the
        # script falls through to a raw parse that sees zero edges,
        # producing spurious "missing dependency" failures.
        run: cp .env.example .env

      - name: Docs drift gate (regen --all --check)
        # Per CLAUDE.md: gates that committed READMEs / SVGs / HTMLs match
        # what the regenerator would emit from the manifests' data_flow.calls.
        run: PYTHONPATH=bootstrapper uv run --project bootstrapper python -m bootstrapper.docs.regen --all --check

      - name: Internal markdown link validator
        run: uv run --project bootstrapper python scripts/check_doc_links.py

      - name: Compose source-deps audit
        run: uv run --project bootstrapper python scripts/check-compose-source-deps.py

      - name: Docs-drift structural audit
        run: uv run --project bootstrapper python scripts/check-docs-drift.py

      - name: Cache MkDocs privacy-plugin external assets
        # `make docs-check` runs `mkdocs build --strict`, and the Material
        # `privacy` plugin self-hosts external assets by DOWNLOADING them at
        # build time: the 20 files recorded in docs/external-assets.yaml
        # (Google Fonts + unpkg mermaid; policy in docs/development.md §3.1).
        # `.cache` is gitignored, so without this the job refetched all of them
        # on every run and a single transient failure became a hard `--strict`
        # error -- which is exactly how #934 and #941 failed on diffs that
        # touched no external URL. Restoring the cache means the steady state
        # performs no third-party fetches at all, and the docs-check preflight
        # names any asset a cold cache cannot fetch. Keyed on the files that
        # decide WHICH assets are needed, so a font/theme change or an
        # inventory refresh re-primes it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          # Hash TRACKED sources that decide which assets get fetched:
          # build_docs.py declares the theme fonts (and generates mkdocs.yml,
          # which is itself untracked and absent at this point in the job), and
          # the stylesheets can pull further external faces. Hashing the
          # generated mkdocs.yml instead silently yields an EMPTY hash and a
          # constant key that never re-primes.
          key: mkdocs-privacy-${{ hashFiles('scripts/docs/build_docs.py', 'docs/assets/stylesheets/**', 'docs/external-assets.yaml') }}
          restore-keys: |
            mkdocs-privacy-

      - name: Three-surface docs contracts + strict build
        run: make docs-check

      - name: Kong route baseline-defaults audit
        run: uv run --project bootstrapper python scripts/check-kong-routes.py

      - name: Research schema validator
        run: uv run --project bootstrapper python scripts/validate_research_schema.py --all

      - name: Track-membership audit
        run: uv run --project bootstrapper python scripts/check-track-membership.py

      - name: Notebook source hygiene
        run: uv run --project bootstrapper python -m scripts.notebook_reproducibility

      - name: Docling localhost-provider lock check
        # Host-run provider (no Dockerfile), so build-validation can't
        # exercise its pins; this catches unsatisfiable bumps and a stale
        # uv.lock at PR time instead of on a user's machine.
        run: >-
          uv run --project bootstrapper python -m scripts.bounded_subprocess
          --label "Docling localhost lock check"
          --cwd services/docling/provider/localhost -- uv lock --locked

      - name: Local Deep Researcher runtime lock check
        run: uv run --project bootstrapper python scripts/refresh-local-deep-researcher-lock.py --check

      - name: Compiled service runtime lock checks
        run: uv run --project bootstrapper python -m scripts.check_runtime_locks

      - name: ComfyUI custom-node dependency lock check
        run: uv run --project bootstrapper python scripts/compile_comfyui_custom_node_locks.py --check

      - name: ComfyUI custom-node runtime overlay compatibility
        run: uv run --project bootstrapper python scripts/check_comfyui_custom_node_overlays.py

      - name: Container image inventory + exception-policy check
        run: uv run --project bootstrapper python -m scripts.container_security

      - name: Compiled CI test lock checks
        run: uv run --project bootstrapper python -m scripts.check_test_locks

      - name: Audit compiled service runtime locks
        run: |
          uv run --project bootstrapper python -m scripts.bounded_subprocess \
            --label "pip-audit tool installation" -- \
            uv tool install pip-audit==2.10.0
          uv run --project bootstrapper python -m scripts.audit_runtime_locks

  build-validation:
    name: Build-validation (Dockerfile + requirements.txt installability)
    runs-on: ubuntu-24.04
    # A cold, cross-architecture build of every local image can exceed 150
    # minutes under QEMU. Keep the job bounded at GitHub's six-hour ceiling.
    timeout-minutes: 360
    # Catches the Pass 12 / Pass 13 class of bug: unsatisfiable pip pins,
    # nonexistent packages, broken Dockerfile syntax. Compose-shape checks
    # never invoke `docker build`, so a broken requirements.txt sails
    # through the other gates. Builds every local non-GPU Compose build
    # context plus init Dockerfiles; GPU provider builds (docling/parakeet)
    # are intentionally excluded for runner size/time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push events diff against github.event.before, which may precede
          # several commits in one push. Keep the full base reachable.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.19"

      - name: Sync inventory dependencies
        run: uv sync --project bootstrapper --group dev --locked

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Validate pinned remote build contexts
        run: >-
          uv run --project bootstrapper python -m scripts.upstream_drift_watch
          --remote-contexts-only
          --report-file "${RUNNER_TEMP}/atlas-remote-context-report.md"

      - name: Scan changed manifest-owned remote images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # cr.weaviate.io delegates auth to Docker Hub's realm
          # (service=registry.docker.io), so a Hub token lifts these pulls off
          # the anonymous per-IP quota that shared runners exhaust. Empty when
          # the secrets are unset; the scan script unsets them in that case and
          # falls back to anonymous pulls.
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `remote_base_digests` records the reviewed indexes for the two remote
          # build contexts and is refreshed whenever a floating upstream tag moves.
          # Feeding that churn into the changed-image set re-scanned all 69
          # manifest-owned image/platform pairs for an edit that changes no image
          # Atlas ships, so the baseline is filtered out here. Every service
          # manifest, compose fragment, and Dockerfile still triggers a scan, and
          # the `builds:` exclusions remain gated by container_security's own
          # schema, expiry, and horizon checks.
          git diff --unified=0 --no-color "$BASE_SHA" "$GITHUB_SHA" -- \
            'services/*/service.yml' 'services/*/compose.yml' \
            'services/**/Dockerfile' \
            | uv run --project bootstrapper python -m scripts.container_security \
                --changed-diff-stdin --images-json \
            | jq -r '.[] | [.image, .platform] | @tsv' \
            | while IFS=$'\t' read -r image_ref image_platform; do
                bash scripts/run_trivy_remote_scan.sh "$image_ref" "$image_platform"
              done

  final-image-scan:
    name: Final-image scan (local Compose and init images)
    runs-on: ubuntu-24.04
    # Not a required check yet. It builds and scans every touched local
    # context, and the fleet still carries pre-existing findings tracked in
    # #996 and #997 — gating on them would block every pull request on debt
    # it did not introduce. Promote this to a required context once those
    # land; the gate itself is unchanged and reports on every run.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.19"

      - name: Sync inventory dependencies
        run: uv sync --project bootstrapper --group dev --locked

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Build and scan local Compose and init images
        run: |
          set -euo pipefail
          image_tag=""
          cleanup_loaded_image() {
            if [ -n "$image_tag" ]; then
              docker image rm "$image_tag" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_loaded_image EXIT
          image_index=0
          for spec in \
            "services/airflow/build|Dockerfile" \
            "services/asset-worker/app|Dockerfile" \
            "services/asset-baker/app|Dockerfile" \
            "services/backup/init|Dockerfile" \
            "services/backend/app|Dockerfile" \
            "services/comfyui/init|Dockerfile" \
            "services/docling/provider|adapter/Dockerfile" \
            "services/hermes/init|Dockerfile" \
            "services/iceberg-rest/build|Dockerfile" \
            "services/jenkins/build|Dockerfile" \
            "services/jupyterhub/build|Dockerfile" \
            "services/lightrag/init|Dockerfile" \
            "services/local-deep-researcher/build|Dockerfile" \
            "services/mcp-servers/runtime|../build/Dockerfile" \
            "services/neo4j/build|Dockerfile" \
            "services/spark/build|Dockerfile" \
            "services/zeppelin/build|Dockerfile" \
            "services/label-studio/init|Dockerfile" \
            "services/langfuse/init|Dockerfile" \
            "services/litellm/init|Dockerfile" \
            "services/mlflow|build/Dockerfile" \
            "services/mlflow/init|Dockerfile" \
            "services/ollama/pull|Dockerfile" \
            "services/openclaw/init|Dockerfile" \
            "services/open-webui/init|Dockerfile"
          do
            IFS='|' read -r context dockerfile <<< "$spec"
            dockerfile_path="$(cd "$context" && realpath "$dockerfile")"
            dockerfile_path="${dockerfile_path#"$GITHUB_WORKSPACE"/}"
            platforms="linux/amd64 linux/arm64"
            if [ "$context|$dockerfile" = "services/asset-baker/app|Dockerfile" ]; then
              platforms="linux/amd64"
            fi
            for platform in $platforms; do
              platform_tag="${platform#linux/}"
              image_tag="atlas-ci/runtime-${image_index}-${platform_tag}:${GITHUB_SHA}"
              docker buildx build --load --platform "$platform" -t "$image_tag" -f "$dockerfile_path" "$context/"
              # Functional smokes run only on the runner's native platform. The
              # arm64 images are still built and scanned below, but a JVM or a
              # Python server under QEMU user emulation cannot finish inside the
              # smoke bounds: the Spark S3A round trip passes in ~12s natively
              # and hit its 300s bound on the emulated arm64 image (#1002).
              if [ "$context|$dockerfile" = "services/spark/build|Dockerfile" ] && [ "$platform" = "linux/amd64" ]; then
                scripts/smoke_spark_s3a.sh "$image_tag"
              fi
              if [ "$context|$dockerfile" = "services/mlflow|build/Dockerfile" ] && [ "$platform" = "linux/amd64" ]; then
                uv run --project bootstrapper python scripts/smoke_mlflow_gateway_guard.py \
                  --image "$image_tag"
              fi
              # 30m: the Zeppelin image (thousands of jars plus two conda
              # environments, read back through the Docker daemon) spends
              # more than 10 minutes in Trivy's analysis phase on a hosted
              # runner, while the Spark images take ~6.5 minutes each (#1002).
              trivy image \
                --image-src docker \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --ignorefile .trivyignore.yaml \
                --exit-code 1 \
                --no-progress \
                --timeout 30m \
                "$image_tag"
              docker image rm "$image_tag"
              image_tag=""
            done
            image_index=$((image_index + 1))
            # Loaded targets are removed immediately; discard the duplicate
            # BuildKit cache after each context to bound runner disk usage.
            docker buildx prune --force
          done
