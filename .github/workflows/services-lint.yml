name: services-lint

# Lints and tests the per-service modular configuration layout.
#
# Gates:
#   - manifest validator (8 cross-manifest checks)
#   - unit tests (loader, validator, assembler, hooks, validate_fragments CLI)
#   - compose merge (`docker compose -f docker-compose.yml config -q`)
#   - byte-equivalence vs the golden baseline at
#     bootstrapper/tests/fixtures/rendered_config_baseline.yml
#   - source-permutation matrix (every SOURCE value × compose config)
#   - docs-drift gate (`bootstrapper.docs.regen --all --check`)
#   - audit scripts: doc-links, compose source-deps, docs structure,
#     Kong routes, research schema

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Principle-of-least-privilege: this is a read-only lint/test workflow;
# none of the jobs need write access to the repo, PRs, or packages.
permissions:
  contents: read

jobs:
  lint:
    name: Manifest lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # Pin uv so CI is deterministic. With no version, setup-uv installs
          # the latest uv at run time, whose resolver/lock semantics can shift
          # under us and silently flip a `uv lock --locked` check. Bump
          # deliberately; keep in sync with the Dockerfile `uv==` pins.
          version: "0.11.19"

      - name: Sync dependencies
        working-directory: bootstrapper
        run: uv sync --group dev --locked

      - name: Install ShellCheck
        run: |
          curl -fsSL \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o "${RUNNER_TEMP}/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  ${RUNNER_TEMP}/shellcheck.tar.xz" \
            | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}"
          sudo install "${RUNNER_TEMP}/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck

      - name: Lint tracked shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x

      - name: Run unit tests (loader, validator, assembler, hooks, CLI)
        working-directory: bootstrapper
        run: >-
          uv run pytest tests/ -q
          --ignore=tests/test_fragment_equivalence.py
          --ignore=tests/test_source_permutations.py
          --cov=. --cov-config=pyproject.toml --cov-branch
          --cov-report=term --cov-fail-under=69

      - name: Lint manifests
        working-directory: bootstrapper
        run: uv run python -m tools.validate_fragments

      - name: Backend unit tests
        working-directory: services/backend/app/app
        run: |
          BACKEND_TEST_VENV="${RUNNER_TEMP:-$PWD}/backend-ci-venv"
          uv venv --python 3.12 "$BACKEND_TEST_VENV"
          # Runtime and test requirements jointly own the tested import
          # closure. Both are repository-managed; no inline CI subset may
          # drift from the application or pytest plugin contracts.
          VIRTUAL_ENV="$BACKEND_TEST_VENV" uv pip install \
            -r requirements.txt -r requirements-dev.txt -c requirements-locked.txt
          "$BACKEND_TEST_VENV/bin/python" -m pytest tests/ -q -W error \
            --cov=. --cov-config=.coveragerc --cov-branch \
            --cov-report=term --cov-fail-under=79

      - name: MCP framework contract tests
        run: |
          MCP_TEST_VENV="${RUNNER_TEMP:-$PWD}/mcp-ci-venv"
          uv venv --python 3.12 "$MCP_TEST_VENV"
          VIRTUAL_ENV="$MCP_TEST_VENV" uv pip install \
            -r services/mcp-servers/runtime/requirements.txt \
            -c services/mcp-servers/runtime/requirements-locked.txt \
            pytest
          "$MCP_TEST_VENV/bin/python" -m pytest \
            bootstrapper/tests/test_mcp_servers_framework.py -q -W error

      - name: Asset processor API tests
        run: |
          ASSET_TEST_VENV="${RUNNER_TEMP:-$PWD}/asset-ci-venv"
          uv venv --python 3.12 "$ASSET_TEST_VENV"
          VIRTUAL_ENV="$ASSET_TEST_VENV" uv pip install \
            -r services/asset-worker/app/requirements.txt \
            -r services/asset-baker/app/requirements.txt \
            -c services/asset-worker/app/requirements-locked.txt \
            -c services/asset-baker/app/requirements-locked.txt \
            pytest httpx2
          (
            cd services/asset-worker/app
            "$ASSET_TEST_VENV/bin/python" -m pytest tests/ -q
          )
          (
            cd services/asset-baker/app
            "$ASSET_TEST_VENV/bin/python" -m pytest tests/ -q
          )

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Run bootstrapper tests on Python 3.10
        working-directory: bootstrapper
        run: >-
          uv run --python 3.10 --isolated --locked --group dev
          pytest tests/ -q
          --ignore=tests/test_fragment_equivalence.py
          --ignore=tests/test_source_permutations.py

  compose-equivalence:
    name: Compose merge + byte-equivalence + source-permutation matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # Pin uv so CI is deterministic. With no version, setup-uv installs
          # the latest uv at run time, whose resolver/lock semantics can shift
          # under us and silently flip a `uv lock --locked` check. Bump
          # deliberately; keep in sync with the Dockerfile `uv==` pins.
          version: "0.11.19"

      - name: Sync dependencies
        working-directory: bootstrapper
        run: uv sync --group dev --locked

      - name: Materialize .env from .env.example
        # Compose interpolation reads .env at the project root. The matrix
        # tests then override one SOURCE var at a time in a tmp file.
        run: cp .env.example .env

      - name: Compose merge sanity (docker compose config -q)
        run: docker compose --env-file .env -f docker-compose.yml config -q

      - name: Byte-equivalence test vs golden baseline
        working-directory: bootstrapper
        run: uv run pytest tests/test_fragment_equivalence.py -q

      - name: Source-permutation matrix (every SOURCE value × compose config)
        working-directory: bootstrapper
        run: uv run pytest tests/test_source_permutations.py -q

  audit-scripts:
    name: Docs drift + audit scripts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # Pin uv so CI is deterministic. With no version, setup-uv installs
          # the latest uv at run time, whose resolver/lock semantics can shift
          # under us and silently flip a `uv lock --locked` check. Bump
          # deliberately; keep in sync with the Dockerfile `uv==` pins.
          version: "0.11.19"

      - name: Sync dependencies
        working-directory: bootstrapper
        run: uv sync --group dev --locked

      - name: Materialize .env from .env.example
        # check-compose-source-deps.py invokes `docker compose config` to
        # render the merged shape across all per-service fragments (the
        # top-level docker-compose.yml is a thin `include:`-only shell).
        # Without .env present, compose interpolation fails and the
        # script falls through to a raw parse that sees zero edges,
        # producing spurious "missing dependency" failures.
        run: cp .env.example .env

      - name: Docs drift gate (regen --all --check)
        # Per CLAUDE.md: gates that committed READMEs / SVGs / HTMLs match
        # what the regenerator would emit from the manifests' data_flow.calls.
        run: PYTHONPATH=bootstrapper uv run --project bootstrapper python -m bootstrapper.docs.regen --all --check

      - name: Internal markdown link validator
        run: uv run --project bootstrapper python scripts/check_doc_links.py

      - name: Compose source-deps audit
        run: uv run --project bootstrapper python scripts/check-compose-source-deps.py

      - name: Docs-drift structural audit
        run: uv run --project bootstrapper python scripts/check-docs-drift.py

      - name: Three-surface docs contracts + strict build
        run: make docs-check

      - name: Kong route baseline-defaults audit
        run: uv run --project bootstrapper python scripts/check-kong-routes.py

      - name: Research schema validator
        run: uv run --project bootstrapper python scripts/validate_research_schema.py --all

      - name: Track-membership audit
        run: uv run --project bootstrapper python scripts/check-track-membership.py

      - name: Notebook source hygiene
        run: uv run --project bootstrapper python -m scripts.notebook_reproducibility

      - name: Docling localhost-provider lock check
        working-directory: services/docling/provider/localhost
        # Host-run provider (no Dockerfile), so build-validation can't
        # exercise its pins; this catches unsatisfiable bumps and a stale
        # uv.lock at PR time instead of on a user's machine.
        run: uv lock --locked

      - name: Local Deep Researcher runtime lock check
        run: uv run --project bootstrapper python scripts/refresh-local-deep-researcher-lock.py --check

      - name: Compiled service runtime lock checks
        run: uv run --project bootstrapper python -m scripts.check_runtime_locks

      - name: Audit compiled service runtime locks
        run: |
          uv tool install pip-audit==2.10.0
          uv run --project bootstrapper python -m scripts.audit_runtime_locks

  build-validation:
    name: Build-validation (Dockerfile + requirements.txt installability)
    runs-on: ubuntu-latest
    # Catches the Pass 12 / Pass 13 class of bug: unsatisfiable pip pins,
    # nonexistent packages, broken Dockerfile syntax. Compose-shape checks
    # never invoke `docker build`, so a broken requirements.txt sails
    # through the other gates. Builds every local non-GPU Compose build
    # context plus init Dockerfiles; GPU provider builds (docling/parakeet)
    # are intentionally excluded for runner size/time.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build local Compose and init images
        run: |
          set -euo pipefail
          for spec in \
            "services/airflow/build|Dockerfile|--build-arg BASE_IMAGE=apache/airflow:3.3.0" \
            "services/asset-worker/app|Dockerfile|" \
            "services/asset-baker/app|Dockerfile|" \
            "services/backend/app|Dockerfile|" \
            "services/docling/provider|adapter/Dockerfile|" \
            "services/iceberg-rest/build|Dockerfile|" \
            "services/jenkins/build|Dockerfile|" \
            "services/jupyterhub/build|Dockerfile|" \
            "services/local-deep-researcher/build|Dockerfile|" \
            "services/mcp-servers/runtime|../build/Dockerfile|" \
            "services/neo4j/build|Dockerfile|" \
            "services/spark/build|Dockerfile|--build-arg BASE_IMAGE=apache/spark:4.1.2" \
            "services/zeppelin/build|Dockerfile|" \
            "services/label-studio/init|Dockerfile|" \
            "services/langfuse/init|Dockerfile|" \
            "services/litellm/init|Dockerfile|" \
            "services/mlflow/init|Dockerfile|" \
            "services/open-webui/init|Dockerfile|"
          do
            IFS='|' read -r context dockerfile extra_args <<< "$spec"
            dockerfile_path="$context/$dockerfile"
            if [ -n "$extra_args" ]; then
              docker buildx build --load $extra_args -f "$dockerfile_path" "$context/"
            else
              docker buildx build --load -f "$dockerfile_path" "$context/"
            fi
          done
