name: upstream-drift-watch

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch external upstream contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize failure report
        id: initialize_report
        run: |
          report_file="${RUNNER_TEMP}/upstream-drift-report.md"
          printf '%s\n\n# Atlas upstream drift watch\n\nStatus: **FAIL**\n\nThe watcher did not run.\n' \
            '<!-- atlas-upstream-drift-watch -->' > "$report_file"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.19"

      - name: Sync watcher dependencies
        run: uv sync --project bootstrapper --group dev --locked

      - name: Read the manifest-pinned Ollama image
        id: ollama_image
        run: |
          image="$(uv run --project bootstrapper python - <<'PY'
          from pathlib import Path

          import yaml

          manifest = yaml.safe_load(
              Path("services/ollama/service.yml").read_text(encoding="utf-8")
          )
          image = next(
              row["default"]
              for row in manifest["images"]
              if row.get("var") == "LLM_PROVIDER_IMAGE"
          )
          if not isinstance(image, str) or not image:
              raise SystemExit("LLM_PROVIDER_IMAGE must be a non-empty string")
          print(image)
          PY
          )"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Start empty loopback Ollama
        id: start_ollama
        continue-on-error: true
        env:
          OLLAMA_IMAGE: ${{ steps.ollama_image.outputs.image }}
        run: |
          set -euo pipefail
          image_pattern='^[a-z0-9][a-z0-9._/@:-]*$'
          if [[ ! "$OLLAMA_IMAGE" =~ $image_pattern ]]; then
            echo "manifest-derived Ollama image is not a safe literal reference" >&2
            exit 1
          fi
          docker run -d --name atlas-upstream-drift-ollama \
            --publish 127.0.0.1:11434:11434 \
            "$OLLAMA_IMAGE"

      - name: Wait for empty Ollama
        id: ollama_readiness
        continue-on-error: true
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 1 http://127.0.0.1:11434/api/tags; then
              exit 0
            fi
            sleep 1
          done
          echo "Ollama did not become ready within 20 seconds" >&2
          exit 1

      - name: Run upstream drift watcher
        id: watch
        continue-on-error: true
        run: |
          report_file="${RUNNER_TEMP}/upstream-drift-report.md"
          set +e
          uv run --project bootstrapper python -m scripts.upstream_drift_watch \
            --ollama-tags-url http://127.0.0.1:11434/api/tags \
            --report-file "$report_file"
          outcome=$?
          set -e
          if [[ ! -f "$report_file" ]]; then
            printf '%s\n\n# Atlas upstream drift watch\n\nStatus: **FAIL**\n\nThe watcher did not produce a report.\n' \
              '<!-- atlas-upstream-drift-watch -->' > "$report_file"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Remove ephemeral Ollama
        id: cleanup_ollama
        if: ${{ always() }}
        run: docker rm -f atlas-upstream-drift-ollama || true

      - name: Reconcile upstream-drift issue
        id: reconcile_issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WATCH_OUTCOME: ${{ steps.watch.outputs.outcome }}
          REPORT_FILE: ${{ runner.temp }}/upstream-drift-report.md
        run: |
          set -euo pipefail
          marker='<!-- atlas-upstream-drift-watch -->'
          title="Atlas upstream drift watch"
          report_file="$REPORT_FILE"
          outcome="${WATCH_OUTCOME:-1}"
          if [[ ! -s "$report_file" ]]; then
            printf '%s\n\n# Atlas upstream drift watch\n\nStatus: **FAIL**\n\nThe watcher did not run.\n' \
              "$marker" > "$report_file"
          fi

          issue_filter='
          [.[][]
           | select(has("pull_request") | not)
           | select(.title == $title and ((.body // "") | contains($marker)))
          ]
          | sort_by(.number)
          | first // {}
          | [(.number // ""), ((.state // "") | ascii_downcase)]
          | @tsv'
          issue="$(gh api --paginate --method GET "repos/${GH_REPO}/issues?state=all&per_page=100" | \
            jq -s -r --arg marker "$marker" --arg title "$title" "$issue_filter")"
          IFS=$'\t' read -r issue_number issue_state <<< "$issue"

          if [[ "$outcome" != "0" ]]; then
            if [[ -z "$issue_number" ]]; then
              gh issue create --title "$title" --body-file "$report_file"
            elif [[ "$issue_state" == "closed" ]]; then
              gh issue reopen "$issue_number"
              gh issue edit "$issue_number" --body-file "$report_file"
            else
              gh issue edit "$issue_number" --body-file "$report_file"
            fi
            exit 1
          fi

          if [[ "$issue_state" == "open" ]]; then
            gh issue comment "$issue_number" --body "Upstream drift watch recovered; closing this issue."
            gh issue close "$issue_number" --reason completed
          fi
