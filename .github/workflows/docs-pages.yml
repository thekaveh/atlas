name: docs-pages

# Publishes the generated MkDocs documentation site and keeps the GitHub Wiki
# in sync with the repo-owned docs/wiki export.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "services/**/README.md"
      - "services/**/architecture.*"
      - "services/**/service.yml"
      - "bootstrapper/**"
      - "scripts/generate-docs-site.py"
      - "scripts/check-docs-site.py"
      - "scripts/export-docs-wiki.py"
      - "mkdocs.yml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish MkDocs and Wiki
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://thekaveh.github.io/atlas/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          version: "0.11.19"

      - name: Sync docs dependencies
        working-directory: bootstrapper
        run: uv sync --group dev

      - name: Build generated MkDocs site
        run: uv run --project bootstrapper python scripts/check-docs-site.py

      - name: Sync GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project bootstrapper python scripts/export-docs-wiki.py --push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
