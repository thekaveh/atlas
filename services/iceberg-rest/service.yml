# services/iceberg-rest/service.yml — Apache Iceberg REST catalog
name: iceberg-rest
label: "Apache Iceberg REST Catalog"
category: data
docs: services/iceberg-rest/README.md

containers:
  - iceberg-rest
  - iceberg-rest-init

images:
  - var: ICEBERG_REST_IMAGE
    default: "apache/iceberg-rest-fixture:1.10.1"
    container: iceberg-rest
    notes: "Base image for the local Atlas build. Atlas layers the PostgreSQL JDBC driver onto the Apache fixture image."
  - var: ICEBERG_REST_INIT_IMAGE
    default: "postgres:15.18-alpine"
    container: iceberg-rest-init

sources:
  var: ICEBERG_REST_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (Iceberg REST + Supabase JDBC catalog + MinIO warehouse)"
    - id: disabled
      label: "Disabled"

env:
  - name: ICEBERG_REST_SOURCE
    default: disabled
  - name: ICEBERG_REST_PORT
    description: "Host port for the Iceberg REST Catalog API (in-container 8181)."
  - name: ICEBERG_DB_USER
    default: iceberg
  - name: ICEBERG_DB_PASSWORD
    default: ""
    secret: true
    description: "Auto-generated by bootstrapper. Postgres role for the Iceberg JDBC catalog DB."
  - name: ICEBERG_REST_POSTGRES_JDBC_VERSION
    default: "42.7.12"
    description: "PostgreSQL JDBC driver version layered into the local Iceberg REST image build."
  - name: ICEBERG_REST_SCALE
    auto_managed: true
  - name: ICEBERG_REST_INIT_SCALE
    auto_managed: true

depends_on:
  required:
    - minio
    - supabase
  optional: []

rows:
  - display_name: "Apache Iceberg REST Catalog"
    source_var: ICEBERG_REST_SOURCE
    port_var: ICEBERG_REST_PORT
    scale_var: ICEBERG_REST_SCALE
    description: "Internal REST catalog for durable Iceberg tables over MinIO."

exports: []

runtime_sc:
  iceberg-rest:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  iceberg-rest-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - minio
    - supabase
