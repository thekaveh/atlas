# services/asset-baker/service.yml — Blender headless HP→LP bake worker
name: asset-baker
label: "Asset Baker (Blender HP→LP bake)"
category: media
docs: services/asset-baker/README.md

containers:
  - asset-baker

images:
  - var: ASSET_BAKER_IMAGE
    default: "python:3.12.9-slim"
    container: asset-baker
    notes: "Base image; the Dockerfile downloads a pinned headless Blender (ASSET_BAKER_BLENDER_VERSION) on top."

sources:
  var: ASSET_BAKER_SOURCE
  default: disabled
  options:
    - id: container-cpu
      label: "Container (Cycles CPU)"
    - id: disabled
      label: "Disabled"

env:
  - name: ASSET_BAKER_SOURCE
    default: disabled
    description: "Deployment mode for the Blender HP→LP bake worker. container-cpu runs deterministic Cycles-CPU bakes (GPU-optional, deferred)."
  - name: ASSET_BAKER_PORT
    description: "Host port for the asset-baker API (in-container listen port is 8096)."
  - name: ASSET_BAKER_SCALE
    auto_managed: true
  - name: ASSET_BAKER_ENDPOINT
    auto_managed: true
    description: "In-network URL for the asset-baker API."
  - name: ASSET_BAKER_API_TOKEN
    default: ""
    secret: true
    description: "Auto-generated bearer token required by all Asset Baker data and processing routes; /health remains unauthenticated."
  - name: ASSET_BAKER_ALLOWED_INPUT_BUCKETS
    default: ""
    description: "Optional comma- or space-separated reference-route bucket allowlist; blank follows MINIO_BUCKET_ASSET_INPUTS."
  - name: ASSET_BAKER_BLENDER_VERSION
    default: "4.3.2"
    description: "Pinned headless Blender version (>= 4.3) downloaded into the asset-baker image. Blender bundles its own Python + numpy for the bake script."
  - name: ASSET_BAKER_ARTIFACT_DIR
    default: "/data/artifacts"
    description: "Local artifact cache used when MinIO upload is disabled or for direct downloads."
  - name: ASSET_BAKER_MINIO_ENABLED
    default: true
    description: "When true, baked LP GLBs + textures are written to MinIO using content-addressed keys."
  - name: ASSET_BAKER_MINIO_BUCKET
    default: asset-baker
    description: "MinIO bucket for baked LP GLB + texture outputs."
  - name: ASSET_BAKER_MINIO_ENDPOINT
    auto_managed: true
    description: "In-network MinIO S3 API endpoint used by the worker."
  - name: ASSET_BAKER_MINIO_ACCESS_KEY
    default: ""
    secret: true
    description: "Optional MinIO access key override. Empty uses the generated asset-baker scoped MinIO account."
  - name: ASSET_BAKER_MINIO_SECRET_KEY
    default: ""
    secret: true
    description: "Optional MinIO secret key override. Empty uses the generated asset-baker scoped MinIO account."
  - name: ASSET_BAKER_TARGET_TRIS
    default: "39000"
    description: "Default low-poly triangle budget the decimate stage targets (overridable per request)."
  - name: ASSET_BAKER_TEX_SIZE
    default: "2048"
    description: "Default baked BaseColor/Normal texture resolution (square). 2k measured 30–200 s/asset on CPU; overridable per request."
  - name: ASSET_BAKER_CANONICAL_SIZE
    default: "4.0"
    description: "Canonical max-dimension (units) each mesh is scaled to before remesh so the relative voxel/ray heuristics are stable regardless of the raw GLB import scale."
  - name: ASSET_BAKER_BRIGHTNESS_MIN
    default: "0.05"
    description: "Mean-brightness QA gate: a baked BaseColor whose mean < this is a silently-failed (black) bake and is refused with a non-zero result."
  - name: ASSET_BAKER_TIMEOUT_SECONDS
    default: "600"
    description: "Hard wall-clock ceiling for a single bake subprocess; exceeded bakes are killed and reported as timeout."
  - name: ASSET_BAKER_MAX_UPLOAD_MB
    default: "200"
    description: "Maximum accepted GLB input size (MiB). Larger uploads/refs are rejected before a Blender process is spawned."
  - name: ASSET_BAKER_CONCURRENCY
    default: "1"
    description: "Maximum concurrent bake subprocesses. Default 1 — a single Cycles bake saturates CPU and concurrent bakes are net-negative."

depends_on:
  required:
    - minio
  optional:
    - backend
    - comfyui
    - fal
    - blender-mcp
    - asset-worker

rows:
  - display_name: "Asset Baker"
    source_var: ASSET_BAKER_SOURCE
    port_var: ASSET_BAKER_PORT
    scale_var: ASSET_BAKER_SCALE
    alias: asset-baker.localhost
    description: "Blender headless HP→LP bake API (voxel-remesh → decimate → Smart-UV → bake color+normal)."

exports:
  - name: ASSET_BAKER_ENDPOINT
    consumers:
      - backend
      - comfyui

runtime_sc:
  asset-baker:
    container-cpu:
      scale: 1
      environment:
        ASSET_BAKER_ENDPOINT: http://asset-baker:8096
        ASSET_BAKER_MINIO_ENDPOINT: http://minio:9000
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        ASSET_BAKER_ENDPOINT: ''
        ASSET_BAKER_MINIO_ENDPOINT: ''
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - minio
