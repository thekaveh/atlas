# services/llm-graph-builder/compose.yml
# Neo4j Labs LLM Knowledge Graph Builder. Upstream currently documents a
# source-built React/FastAPI pair rather than public official images, so Atlas
# pins the git ref via LLM_GRAPH_BUILDER_REF.
services:
  llm-graph-builder-backend:
    build:
      context: https://github.com/neo4j-labs/llm-graph-builder.git#${LLM_GRAPH_BUILDER_REF}:backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-llm-graph-builder-backend
    deploy:
      replicas: ${LLM_GRAPH_BUILDER_BACKEND_SCALE:-0}
      resources:
        limits:
          memory: 8g
          cpus: '4.0'
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${GRAPH_DB_USER:-neo4j}
      NEO4J_PASSWORD: ${GRAPH_DB_PASSWORD}
      NEO4J_DATABASE: ${LLM_GRAPH_BUILDER_NEO4J_DATABASE:-neo4j}
      LLM_MODEL_CONFIG_ATLAS_LITELLM: ${LLM_GRAPH_BUILDER_LITELLM_MODEL_CONFIG}
      DEFAULT_DIFFBOT_CHAT_MODEL: ${LLM_GRAPH_BUILDER_MODEL_ID:-atlas_litellm}
      GRAPH_CLEANUP_MODEL: ${LLM_GRAPH_BUILDER_MODEL_ID:-atlas_litellm}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DIFFBOT_API_KEY: ${DIFFBOT_API_KEY:-}
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      EMBEDDING_PROVIDER: sentence-transformer
      IS_EMBEDDING: "true"
      KNN_MIN_SCORE: ${LLM_GRAPH_BUILDER_KNN_MIN_SCORE:-0.94}
      UPDATE_GRAPH_CHUNKS_PROCESSED: ${LLM_GRAPH_BUILDER_UPDATE_GRAPH_CHUNKS_PROCESSED:-20}
      ENTITY_EMBEDDING: ${LLM_GRAPH_BUILDER_ENTITY_EMBEDDING:-false}
      MAX_TOKEN_CHUNK_SIZE: ${LLM_GRAPH_BUILDER_MAX_TOKEN_CHUNK_SIZE:-10000}
      ENABLE_USER_AGENT: ${LLM_GRAPH_BUILDER_ENABLE_USER_AGENT:-true}
      USER_AGENT: ${LLM_GRAPH_BUILDER_USER_AGENT:-Atlas-LLM-Graph-Builder}
      TRACK_USER_USAGE: ${LLM_GRAPH_BUILDER_TRACK_USER_USAGE:-false}
      AUTHENTICATION_REQUIRED: ${LLM_GRAPH_BUILDER_AUTHENTICATION_REQUIRED:-false}
      GCP_LOG_METRICS_ENABLED: "False"
      GCS_FILE_CACHE: "False"
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    depends_on:
      neo4j-graph-db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    restart: unless-stopped

  llm-graph-builder-frontend:
    build:
      context: https://github.com/neo4j-labs/llm-graph-builder.git#${LLM_GRAPH_BUILDER_REF}:frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_URL: http://graphbuilder-api.localhost:${KONG_HTTP_PORT:-63000}
        VITE_REACT_APP_SOURCES: ${LLM_GRAPH_BUILDER_REACT_APP_SOURCES:-local,wiki,web}
        VITE_LLM_MODELS: ${LLM_GRAPH_BUILDER_MODEL_ID:-atlas_litellm}
        VITE_LLM_MODELS_PROD: ${LLM_GRAPH_BUILDER_MODEL_ID:-atlas_litellm}
        VITE_ENV: PROD
        VITE_CHAT_MODES: ${LLM_GRAPH_BUILDER_CHAT_MODES:-vector,graph_vector,graph,fulltext,graph_vector_fulltext,entity_vector,global_vector}
        VITE_TIME_PER_PAGE: ${LLM_GRAPH_BUILDER_TIME_PER_PAGE:-50}
        VITE_CHUNK_SIZE: ${LLM_GRAPH_BUILDER_CHUNK_SIZE:-5242880}
        VITE_LARGE_FILE_SIZE: ${LLM_GRAPH_BUILDER_LARGE_FILE_SIZE:-5242880}
        VITE_BATCH_SIZE: ${LLM_GRAPH_BUILDER_BATCH_SIZE:-2}
        VITE_CHUNK_OVERLAP: ${LLM_GRAPH_BUILDER_CHUNK_OVERLAP:-20}
        VITE_TOKENS_PER_CHUNK: ${LLM_GRAPH_BUILDER_TOKENS_PER_CHUNK:-200}
        VITE_CHUNK_TO_COMBINE: ${LLM_GRAPH_BUILDER_CHUNK_TO_COMBINE:-1}
        VITE_SKIP_AUTH: "true"
        VITE_GOOGLE_CLIENT_ID: ""
        VITE_AUTH0_CLIENT_ID: ""
        VITE_AUTH0_DOMAIN: ""
        DEPLOYMENT_ENV: local
    container_name: ${PROJECT_NAME}-llm-graph-builder-frontend
    deploy:
      replicas: ${LLM_GRAPH_BUILDER_FRONTEND_SCALE:-0}
      resources:
        limits:
          memory: 768m
          cpus: '1.0'
    ports:
      - "${HOST_BIND_IP:-}${LLM_GRAPH_BUILDER_PORT}:8080"
    networks:
      - backend-network
    depends_on:
      llm-graph-builder-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    restart: unless-stopped
