# services/jupyterhub/service.yml — JupyterHub data-science notebook
name: jupyterhub
label: "JupyterHub (DS/ML + LLM notebooks)"
category: apps
docs: services/jupyterhub/README.md

containers:
  - jupyterhub

images:
  - var: JUPYTERHUB_IMAGE
    default: "quay.io/jupyter/datascience-notebook:python-3.11.10"
    container: jupyterhub

sources:
  var: JUPYTERHUB_SOURCE
  default: container
  options:
    - id: container
      label: "Container (lakehouse + DS/ML notebooks)"
    - id: disabled
      label: "Disabled"

env:
  - name: JUPYTERHUB_SOURCE
    default: container
  - name: JUPYTERHUB_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: JUPYTERHUB_TOKEN
    default: ""
    secret: true
    description: "Optional. Empty = generate on start."
  - name: JUPYTER_ALLOW_ORIGIN
    default: "*"
    description: "Allowed browser origin for Jupyter Server websocket upgrades; keep '*' for local dev, narrow for shared deployments."
  - name: SPARK_REMOTE
    default: "sc://spark-connect:15002"
    description: "Spark Connect endpoint used by bundled notebooks; override for a remote or managed Spark Connect server."
  - name: MCP_SERVERS_URL
    default: ""
    description: "Streamable HTTP URL for the Curated MCP Servers endpoint (http://mcp-servers:8000/mcp). Set by the bootstrapper when MCP_SERVERS_SOURCE is enabled; empty when disabled (#600)."
  - name: JUPYTERHUB_SCALE
    auto_managed: true

depends_on:
  required:
    - supabase
    - redis
    - litellm
  optional:
    - minio
    - iceberg-rest
    - spark
    - mcp-servers
    - redpanda

rows:
  - display_name: "JupyterHub"
    source_var: JUPYTERHUB_SOURCE
    port_var: JUPYTERHUB_PORT
    scale_var: JUPYTERHUB_SCALE
    alias: jupyter.localhost
    description: "DS/ML, lakehouse, and LLM notebooks."

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  jupyterhub:
    container:
      scale: 1
      environment:
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
    disabled:
      scale: 0

runtime_adaptive:
  jupyterhub:
    adapts_to:
    - llm_provider
    - weaviate
    - neo4j-graph-db
    - comfyui
    - stt_provider
    - tts_provider
    - doc_processor
    - ray
    - mlflow
    - label-studio
    - mcp_servers
    environment_adaptation:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      WEAVIATE_URL: http://weaviate:8080
      NEO4J_URI: bolt://neo4j-graph-db:7687
      COMFYUI_BASE_URL: ${COMFYUI_ENDPOINT}
      STT_ENDPOINT: ${STT_ENDPOINT}
      TTS_ENDPOINT: ${TTS_ENDPOINT}
      DOCLING_ENDPOINT: ${DOCLING_ENDPOINT}
      RAY_ADDRESS: ${RAY_ADDRESS}
      SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      LABEL_STUDIO_URL: ${LABEL_STUDIO_ENDPOINT}
      LABEL_STUDIO_API_URL: ${LABEL_STUDIO_API_URL}
      LABEL_STUDIO_API_KEY: ${LABEL_STUDIO_USER_TOKEN}
      MCP_SERVERS_URL: http://mcp-servers:8000/mcp
    extra_hosts_adaptation: inherit from llm_provider

runtime_deps:
  jupyterhub:
    optional:
    - neo4j-graph-db
    - searxng
    - n8n
    - weaviate
    - comfyui
    - mcp-servers
    - parakeet
    - speaches
    - chatterbox
    - docling
    - minio
    - iceberg-rest
    - spark
    - redpanda
    - mlflow
    - label-studio
    info_message: JupyterHub enabled - will connect to available optional services
      (neo4j, searxng, n8n, weaviate, comfyui, parakeet, speaches, chatterbox, docling,
      minio, iceberg-rest, spark, redpanda, mlflow, label-studio)

data_flow:
  # Mirrors the compose-injected env surface the bundled notebooks use:
  # litellm (01/08), comfyui (05), n8n (06), neo4j (03), supabase (04),
  # weaviate (02), ray (07), spark (09 via SPARK_REMOTE), minio + iceberg-rest
  # (lakehouse Python clients), backend + searxng (00 env check), hermes
  # (direct-path env for user code), redis (REDIS_URL cache/queue on db 3),
  # docling + stt-provider + tts-provider (DOCLING_ENDPOINT/STT_ENDPOINT/
  # TTS_ENDPOINT injected for notebook document/audio use, compose.yml:43-45).
  calls:
    - litellm
    - hermes
    - weaviate
    - neo4j
    - supabase
    - ray
    - spark
    - redpanda
    - redis
    - comfyui
    - n8n
    - backend
    - searxng
    - minio
    - iceberg-rest
    - mlflow
    - label-studio
    - docling
    - stt-provider
    - tts-provider
    - mcp-servers
