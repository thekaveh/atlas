# services/silo/service.yml — Silo (S3-compatible artifact storage)
#
# Artifact-tier object storage complementing Supabase Storage. Each built-in
# consumer receives pre-provisioned buckets and a scoped service-account
# credential. silo-init runs `mc`
# commands idempotently to create buckets + IAM policies on every start.
name: silo
label: "Silo (S3-compatible object storage, pgsty fork of MinIO)"
category: data
docs: services/silo/README.md

capabilities:
  - name: "S3-compatible artifact storage"
    status: supported
    verification: tested
    note: "Atlas exposes the Silo S3 API and console directly and through Kong for in-stack artifacts, lakehouse data, traces, models, and backups."
  - name: "Scoped consumer bucket provisioning"
    status: supported
    verification: tested
    note: "The idempotent init service creates built-in and declared extra-consumer buckets, policies, and service-account credentials with scoped access."
  - name: "Highly available storage lifecycle controls"
    status: not-supported
    verification: documented
    note: "The stock single-node deployment configures no replication, object versioning, lifecycle retention, or server-side encryption policy."

# Extra Kong hostname for the S3 API (port 9000), distinct from the console
# row's silo.localhost (port 9001). Lets external s3-compatible tools use a
# stable friendly host instead of the BASE_PORT-derived port. The route is
# emitted by kong_config_generator.generate_silo_s3_service(); --setup-hosts
# wires s3.silo.localhost via Topology.aliases.
extra_kong_aliases:
  - s3.silo.localhost

containers:
  - silo
  - silo-init

images:
  - var: SILO_IMAGE
    default: "pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46"
    container: silo
    notes: "Silo, the Pigsty-maintained AGPL fork of the archived MinIO community server, pinned by tag and multi-arch digest. It keeps the `MINIO_*` server environment names, `/minio/*` routes, mc admin API and on-disk format; Atlas's own variables are `SILO_*`. Its entrypoint maps `server` to `silo server`, so the compose command is unchanged. It carries the bounded S3 Select CSV reader fix for CVE-2026-39414. Review upstream security advisories before bumping."
  - var: SILO_INIT_IMAGE
    default: "pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd"
    container: silo-init

sources:
  var: SILO_SOURCE
  default: container
  options:
    - id: container
      label: "Container (S3-compatible object storage)"
    - id: disabled
      label: "Disabled"

env:
  - name: SILO_SOURCE
    description: "Silo deployment source: container or disabled."
    default: container
  - name: SILO_PORT
    # default computed by services/topology.py slot allocator
    description: "Host port for the Silo S3 API (in-container listen port is 9000)."
  - name: SILO_CONSOLE_PORT
    # default computed by services/topology.py slot allocator
    description: "Host port for the Silo admin console (in-container listen port is 9001)."
  - name: SILO_ROOT_USER
    description: "Silo root username. silo-init, airflow, spark-init and backup also receive it; consumer services use their own scoped access keys."
    default: minioadmin
  - name: SILO_ROOT_PASSWORD
    default: ""
    secret: true
    description: "Auto-generated by bootstrapper KeyGenerator.generate_silo_root_password()."
  - name: SILO_REGION
    description: "S3 region Silo reports. Clients such as iceberg-rest, jupyterhub, langfuse, label-studio and the asset services use it as their S3 region."
    default: us-east-1
  - name: SILO_INIT_SOURCE
    default: container
    description: "Init-container selector listed in the SOURCE matrix (container or disabled). No code reads it: SILO_INIT_SCALE follows SILO_SOURCE."
  - name: SILO_SCALE
    description: "Set by ./start.sh from SILO_SOURCE; do not edit. 1 runs the silo container, 0 does not."
    auto_managed: true
  - name: SILO_INIT_SCALE
    description: "Set by ./start.sh from SILO_SOURCE; do not edit. 1 runs the silo-init container, 0 does not."
    auto_managed: true
  - name: SILO_ENDPOINT
    auto_managed: true
    description: "In-network URL (S3 API)."
  - name: SILO_PUBLIC_ENDPOINT
    auto_managed: true
    description: "Host-side URL (for browser redirects)."
  - name: SILO_PUBLIC_CONSOLE_ENDPOINT
    description: "Derived by ./start.sh; do not set. Host URL of the Silo console (http://localhost:${SILO_CONSOLE_PORT}), empty when disabled. Passed to Silo as MINIO_BROWSER_REDIRECT_URL."
    auto_managed: true
  - name: SILO_EXTRA_CONSUMERS
    default: ""
    description: "Optional space-separated parent-owned Silo entries using CONSUMER:BUCKET_VAR:ACCESS_VAR:SECRET_VAR[:RW_BUCKET_VAR,...[:RO_BUCKET_VAR,...]] grammar for services/_user overlays."
  - name: SILO_BUCKET_ASSET_INPUTS
    default: raw-assets
    description: "Shared input bucket for the Asset Worker and Asset Baker scoped service accounts."
  - name: SILO_ASSET_INGEST_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for writing shared raw asset inputs."
  - name: SILO_ASSET_INGEST_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for writing shared raw asset inputs."
  - name: SILO_ASSET_WORKER_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for Asset Worker input and output buckets."
  - name: SILO_ASSET_WORKER_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for Asset Worker input and output buckets."
  - name: SILO_ASSET_BAKER_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for Asset Baker input and output buckets."
  - name: SILO_ASSET_BAKER_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for Asset Baker input and output buckets."
  # Per-consumer buckets + scoped service accounts.
  # Each access/secret key is auto-generated by KeyGenerator.generate_silo_access_key()
  # and generate_silo_secret_key(). The bucket NAMES are user-configurable.
  - name: SILO_BUCKET_COMFYUI
    description: "Bucket silo-init creates for the comfyui service account."
    default: comfyui
  - name: SILO_COMFYUI_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the comfyui bucket."
  - name: SILO_COMFYUI_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the comfyui bucket."
  - name: SILO_BUCKET_BACKEND
    description: "Bucket silo-init creates for the backend service account."
    default: backend
  - name: SILO_BACKEND_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the backend bucket."
  - name: SILO_BACKEND_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the backend bucket."
  - name: SILO_BUCKET_N8N
    description: "Bucket silo-init creates for the n8n service account."
    default: n8n
  - name: SILO_N8N_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the n8n bucket."
  - name: SILO_N8N_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the n8n bucket."
  - name: SILO_BUCKET_JUPYTER
    description: "Bucket silo-init creates for the jupyter service account, which can also read the Iceberg lakehouse bucket."
    default: jupyter
  - name: SILO_JUPYTER_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the jupyter bucket."
  - name: SILO_JUPYTER_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the jupyter bucket."
  - name: SILO_BUCKET_SPARK_HISTORY
    default: spark-history
    description: "Spark event-log bucket used by Zeppelin and the Spark History Server."
  - name: SILO_SPARK_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for Spark event logs and lakehouse workflow buckets."
  - name: SILO_SPARK_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for Spark event logs and lakehouse workflow buckets."
  - name: SILO_BUCKET_DOCLING
    description: "Bucket silo-init creates for the docling service account."
    default: docling
  - name: SILO_DOCLING_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the docling bucket."
  - name: SILO_DOCLING_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the docling bucket."
  - name: SILO_BUCKET_LANGFUSE
    description: "Bucket silo-init creates for the langfuse service account. Langfuse uses it for event, media and batch-export uploads."
    default: langfuse
  - name: SILO_LANGFUSE_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the langfuse bucket."
  - name: SILO_LANGFUSE_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the langfuse bucket."
  - name: SILO_BUCKET_MLFLOW
    description: "Bucket silo-init creates for the mlflow service account. MLflow stores run artifacts in it."
    default: mlflow
  - name: SILO_MLFLOW_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the mlflow bucket."
  - name: SILO_MLFLOW_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the mlflow bucket."
  - name: SILO_BUCKET_LABEL_STUDIO
    description: "Bucket silo-init creates for the label-studio service account. Label Studio uses it as its storage bucket."
    default: label-studio
  - name: SILO_LABEL_STUDIO_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the label-studio bucket."
  - name: SILO_LABEL_STUDIO_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the label-studio bucket."
  - name: SILO_BUCKET_ICEBERG_LAKEHOUSE
    description: "Iceberg warehouse bucket. The iceberg and spark service accounts can write it; the jupyter account can read it."
    default: lakehouse
  - name: SILO_BUCKET_ICEBERG_JARS
    description: "Jar bucket for Spark jobs. The spark and iceberg service accounts can write it; Airflow and Jenkins receive its name."
    default: jars
  - name: SILO_BUCKET_ICEBERG_CHECKPOINTS
    description: "Checkpoint bucket. The spark and iceberg service accounts can write it; Zeppelin and JupyterHub receive its name."
    default: checkpoints
  - name: SILO_BUCKET_ICEBERG_LANDING
    description: "Landing bucket. The spark and iceberg service accounts can write it; Airflow, Zeppelin and JupyterHub receive its name."
    default: landing
  - name: SILO_ICEBERG_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for the Iceberg lakehouse buckets."
  - name: SILO_ICEBERG_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for the Iceberg lakehouse buckets."
  - name: SILO_JENKINS_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo access key for Jenkins. It can write the Iceberg JARs bucket only, so a job cannot rewrite lakehouse data."
  - name: SILO_JENKINS_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped Silo secret key for Jenkins. It can write the Iceberg JARs bucket only."

depends_on:
  # ORDERING-ONLY: the compose fragment has no supabase depends_on and
  # silo-init only talks to silo. The entry stays because the topology
  # slot allocator derives port positions from depends_on — dropping it
  # would renumber later slots and break existing .env files. Treat as
  # display/slot pinning, not a runtime dependency.
  required:
    - supabase
  optional: []

rows:
  # Wizard / overview row points at SILO_CONSOLE_PORT because the
  # `silo.localhost` alias routes to the admin console (port 9001
  # in-container, SILO_CONSOLE_PORT host-side). The S3 API has its own
  # `s3.silo.localhost` alias (see extra_kong_aliases); S3 clients can
  # also use the direct SILO_PORT.
  - display_name: "Silo Console"
    source_var: SILO_SOURCE
    port_var: SILO_CONSOLE_PORT
    scale_var: SILO_SCALE
    alias: silo.localhost
    description: "S3-compatible artifact storage (admin console)."

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  silo:
    container:
      scale: 1
      environment:
        SILO_ENDPOINT: http://silo:9000
        SILO_PUBLIC_ENDPOINT: http://localhost:${SILO_PORT}
        SILO_PUBLIC_CONSOLE_ENDPOINT: http://localhost:${SILO_CONSOLE_PORT}
        MINIO_PROMETHEUS_AUTH_TYPE: 'public'
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        SILO_ENDPOINT: ''
        SILO_PUBLIC_ENDPOINT: ''
        SILO_PUBLIC_CONSOLE_ENDPOINT: ''
      deploy: {}
      extra_hosts: []
  silo-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

runtime_deps:
  silo:
    requires: []
    optional: []

data_flow:
  calls: []

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
