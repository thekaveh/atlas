# services/tika/service.yml - Apache Tika fallback extractor
name: tika
label: "Apache Tika (fallback extractor)"
category: media
docs: services/tika/README.md

capabilities:
  - name: "Long-tail plain-text extraction"
    status: partial
    verification: tested
    note: "The backend falls back to Tika for explicit unsupported and archive-oriented formats, but results lack Docling's structure-aware tables, OCR, images, and chunks."
  - name: "Container and existing-host Tika sources"
    status: supported
    verification: tested
    note: "Atlas resolves a pinned Tika container or an operator-run localhost server and clears downstream endpoints when the fallback is disabled."
  - name: "Bounded backend fallback calls"
    status: partial
    verification: tested
    note: "Backend calls enforce configured file-size and finite timeout limits, while direct Tika and Kong requests bypass those application-layer bounds."
  - name: "Authenticated Tika access"
    status: partial
    verification: documented
    note: "Kong protects tika.localhost with dashboard Basic authentication and ACL, but the host-published container port and operator-run localhost server bypass that gate."
  - name: "Archive malware and recursion policy"
    status: not-supported
    verification: documented
    note: "Atlas provides no malware scanner, recursive archive policy, or quarantine store; keep Tika disabled or network-restricted unless long-tail extraction is required."

containers:
  - tika

images:
  - var: TIKA_IMAGE
    default: "apache/tika:3.3.1.0"
    container: tika

sources:
  var: TIKA_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container"
    - id: tika-localhost
      label: "Host (existing Tika server)"
      profiles: [default]
    - id: disabled
      label: "Disabled"

env:
  - name: TIKA_SOURCE
    description: "Deployment source for Apache Tika: container, tika-localhost or disabled (default)."
    default: disabled
  - name: TIKA_PORT
    description: "Host port for the Tika server (in-container 9998), bound to HOST_BIND_IP (loopback by default)."
    # default removed - computed by services/topology.py slot allocator
  - name: TIKA_LOCALHOST_PORT
    default: "9998"
    description: "Host port for the tika-localhost source variant."
  - name: TIKA_JAVA_TOOL_OPTIONS
    default: "-Xmx768m"
    description: "JVM memory cap for the Tika server container."
  - name: TIKA_MAX_FILE_SIZE
    default: 52428800
    description: "Positive Backend maximum bytes accepted for Docling/Tika extraction; invalid values fail Backend startup."
  - name: TIKA_TIMEOUT_SECONDS
    default: 30
    description: "Finite Backend timeout in seconds for Tika fallback extraction calls. Must be greater than 0 and no greater than 3600; invalid values fail Backend startup."
  - name: TIKA_SCALE
    description: "Set by ./start.sh from TIKA_SOURCE; do not edit. 1 runs tika for container, 0 otherwise."
    auto_managed: true
  - name: TIKA_ENDPOINT
    description: "Resolved per TIKA_SOURCE: http://tika:9998, the tika-localhost URL, or empty when disabled. Read by backend, celery and n8n."
    auto_managed: true

depends_on:
  required: []
  optional:
    - backend
    - n8n

rows:
  - display_name: "Apache Tika"
    source_var: TIKA_SOURCE
    port_var: TIKA_PORT
    scale_var: TIKA_SCALE
    alias: tika.localhost
    description: "Long-tail document text fallback."
    localhost_endpoint_var: TIKA_ENDPOINT
    localhost_port_var: TIKA_LOCALHOST_PORT

exports:
  - name: TIKA_ENDPOINT
    consumers:
      - backend
      - n8n

runtime_sc:
  tika:
    container:
      scale: 1
      environment:
        TIKA_ENDPOINT: http://tika:9998
      deploy: {}
      extra_hosts: []
    tika-localhost:
      scale: 0
      environment:
        TIKA_ENDPOINT: http://host.docker.internal:${TIKA_LOCALHOST_PORT:-9998}
      deploy: {}
      extra_hosts:
        - host.docker.internal:host-gateway
    disabled:
      scale: 0
      environment:
        TIKA_ENDPOINT: ''
      deploy: {}
      extra_hosts: []

data_flow:
  calls: []

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
