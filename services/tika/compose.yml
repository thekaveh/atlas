# services/tika/compose.yml - Apache Tika fallback extractor
services:
  tika:
    image: ${TIKA_IMAGE:-apache/tika:3.3.1.0}
    container_name: ${PROJECT_NAME}-tika
    restart: unless-stopped
    deploy:
      replicas: ${TIKA_SCALE:-0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    tmpfs:
      - /tmp:mode=1777
    environment:
      JAVA_TOOL_OPTIONS: ${TIKA_JAVA_TOOL_OPTIONS:--Xmx768m}
    ports:
      - "${HOST_BIND_IP:-}${TIKA_PORT}:9998"
    healthcheck:
      # apache/tika:3.3.1.0 ships bash but NOT curl/wget/nc — the old curl probe
      # could never succeed, leaving tika permanently `unhealthy`. Use a bash
      # /dev/tcp connect to the listen port as the readiness probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9998"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network
