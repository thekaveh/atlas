# services/fal/service.yml — fal.ai cloud media provider
name: fal
label: "FAL Cloud Media"
category: media
docs: services/fal/README.md
virtual: true
containers: []

capabilities:
  - name: "Virtual hosted media generation"
    status: supported
    verification: tested
    note: "The backend uses the server-side FAL key for hosted image and curated image-to-3D operations; Atlas runs no FAL container or direct provider ingress."
  - name: "LiteLLM text-to-image passthrough"
    status: partial
    verification: tested
    note: "An enabled keyed provider registers fal-image through LiteLLM, but that route covers text-to-image only and returns LiteLLM's OpenAI-shaped b64/URL image result without Atlas storage or provenance normalization."
  - name: "Durable media-operation accounting"
    status: partial
    verification: tested
    note: "Redis operation state and the Postgres recovery ledger handle polling and ambiguous submissions, while spend-budget enforcement remains disabled unless explicitly configured."
  - name: "Automatic 3D post-processing"
    status: not-supported
    verification: documented
    note: "Image-to-3D returns a normalized GLB reference but never invokes Asset Baker or Asset Worker; callers must submit the artifact to those services explicitly."
  - name: "Provider webhook completion"
    status: not-supported
    verification: documented
    note: "Atlas uses bounded submit-and-poll operations rather than FAL queue webhooks, so no webhook ingress or signature-validation path is configured."

sources:
  var: FAL_SOURCE
  default: disabled
  options:
    - id: enabled
      label: "Enabled (fal.ai cloud media APIs)"
    - id: disabled
      label: "Disabled"

env:
  - name: FAL_SOURCE
    default: disabled
    description: "Enables fal.ai as the backend provider for simple media generation routes."
  - name: FAL_API_KEY
    default: ""
    secret: true
    description: "fal.ai API key. Required only when FAL_SOURCE=enabled. The backend also exposes it to fal-client as FAL_KEY."
  - name: FAL_MODEL
    default: "fal-ai/flux/dev"
    description: "Default fal.ai model endpoint used by the media gateway for text-to-image generation."
  - name: FAL_IMAGE_TO_3D_MODEL
    default: "fal-ai/trellis"
    description: "Default fal.ai endpoint id for the media gateway's image_to_3d modality. Must resolve to a verified registry entry (Hunyuan3D / TRELLIS / Tripo / Rodin); TRELLIS is the MIT-licensed default."
  - name: FAL_MODEL_LICENSE
    default: "fal/provider-terms"
    description: "License or terms marker returned in normalized media operation responses when provider-specific model licensing is not more specific."
  - name: FAL_TIMEOUT_SECONDS
    default: 120
    description: "Finite Backend timeout budget for FAL media submit/poll operations and the compatibility route. Must be greater than zero and at most 3600 seconds."
  - name: FAL_OUTPUT_FORMAT
    default: jpeg
    description: "Requested output format for compatible fal.ai image models: jpeg or png."
  - name: FAL_ENABLE_SAFETY_CHECKER
    default: true
    description: "Whether to request the provider-side safety checker for compatible fal.ai image models."

depends_on:
  required: []
  optional: []

exports: []

rows:
  - display_name: "FAL Cloud Media"
    source_var: FAL_SOURCE
    description: "Cloud-hosted image and media generation via fal.ai."

runtime_sc:
  fal:
    enabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls: []
