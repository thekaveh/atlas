# services/zeppelin/compose.yml — Spark-first notebook UI
services:
  zeppelin:
    # Stock apache/zeppelin:0.12.1. The image does NOT bundle a full
    # Spark distribution — its `interpreter/spark/` dir contains only
    # the interpreter shim (spark-interpreter-0.12.0.jar +
    # scala-2.13/), no spark-core, no SPARK_HOME. The #247 backend
    # decision keeps Zeppelin on the documented spark-submit /
    # standalone-cluster path, so #211 must provide SPARK_HOME plus
    # seeded interpreter settings before fresh %spark lakehouse
    # notebooks are zero-touch. Do not treat `spark.remote` /
    # Spark Connect as the Zeppelin happy path; Spark 4 rejects that
    # when Zeppelin's stock launcher also passes master/deploy-mode
    # configuration.
    image: ${ZEPPELIN_IMAGE:-apache/zeppelin:0.12.1}
    container_name: ${PROJECT_NAME}-zeppelin
    restart: unless-stopped
    deploy:
      replicas: ${ZEPPELIN_SCALE:-0}
      resources:
        limits:
          memory: ${ZEPPELIN_MEMORY_LIMIT:-2g}
          cpus: "${ZEPPELIN_CPU_LIMIT:-1.5}"
    ports:
      - "${HOST_BIND_IP:-}${ZEPPELIN_PORT}:8080"
    environment:
      ZEPPELIN_PORT: "8080"
      ZEPPELIN_LOG_DIR: /logs
      ZEPPELIN_NOTEBOOK_DIR: /notebook
      # SPARK_MASTER / SPARK_SUBMIT_OPTIONS apply on the spark-submit
      # launch path, which still needs SPARK_HOME inside the Zeppelin
      # runtime. #211 is expected to make this complete by adding a
      # bundled/mounted Spark runtime and idempotent lakehouse
      # interpreter seeding.
      SPARK_MASTER: spark://spark-master:7077
      # NOTE: Zeppelin's Spark interpreter does NOT read
      # SPARK_CONNECT_URL — `SparkInterpreterLauncher` only honors the
      # spark-submit style settings. Keep Spark Connect for clients such
      # as JupyterHub that use the Spark Connect API directly.
      SPARK_SUBMIT_OPTIONS: >-
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
        --conf spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.eventLog.enabled=true
        --conf spark.eventLog.dir=s3a://spark-history/
      ZEPPELIN_JDBC_POSTGRES_URL: jdbc:postgresql://supabase-db:5432/${SUPABASE_DB_NAME}
      ZEPPELIN_JDBC_POSTGRES_USER: ${SUPABASE_DB_USER}
      ZEPPELIN_JDBC_POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD}
    volumes:
      - ./notebooks:/notebook
      - zeppelin-logs:/logs
    depends_on:
      spark-master:
        condition: service_healthy
      # Same cold-start race as spark-connect — Zeppelin's first %spark
      # cell writes to s3a://spark-history/ via spark.eventLog.dir; the
      # bucket must exist before Spark's EventLogFileWriters runs
      # requireLogBaseDirAsDirectory().
      spark-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

volumes:
  zeppelin-logs:
    name: ${PROJECT_NAME}-zeppelin-logs
    driver: local
