name: zeppelin
label: "Apache Zeppelin (Spark-first notebook)"
category: apps
docs: services/zeppelin/README.md

containers:
  - zeppelin
  - zeppelin-init

images:
  - var: ZEPPELIN_IMAGE
    default: "apache/zeppelin:0.12.1"
    container: zeppelin
  - var: ZEPPELIN_INIT_IMAGE
    default: "python:3.12.13-alpine"
    container: zeppelin-init

sources:
  var: ZEPPELIN_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (Spark-first notebook)"
    - id: disabled
      label: "Disabled"

env:
  - name: ZEPPELIN_SOURCE
    default: disabled
  - name: ZEPPELIN_PORT
    # default removed — computed by topology
    description: "Host port for the Zeppelin Web UI (in-container 8080)."
  - name: ZEPPELIN_SCALE
    auto_managed: true
  - name: ZEPPELIN_INIT_SCALE
    auto_managed: true
  - name: ZEPPELIN_MEMORY_LIMIT
    default: 2g
    description: "Container memory limit for the zeppelin container (deploy.resources.limits.memory). Zeppelin's JVM-based interpreter host typically uses under 1 g for a single-user session; 2 g leaves comfortable headroom on a 32 GB host."
  - name: ZEPPELIN_CPU_LIMIT
    default: "1.5"
    description: "Container CPU limit for the zeppelin container (deploy.resources.limits.cpus). 1.5 cores covers notebook rendering and interpreter dispatch; compute-heavy work runs on the remote Spark cluster, not in this process."

depends_on:
  required:
    - spark
    - minio
  optional:
    - supabase
    - iceberg-rest
    - redpanda
    - trino
    # litellm: removed (was aspirational). No env vars are wired to the
    # gateway in zeppelin's compose/runtime_sc and the README says users
    # wire LiteLLM themselves. Re-add only if zeppelin starts injecting
    # LITELLM_BASE_URL / LITELLM_MASTER_KEY at compose-render time.

rows:
  - display_name: "Apache Zeppelin"
    source_var: ZEPPELIN_SOURCE
    port_var: ZEPPELIN_PORT
    scale_var: ZEPPELIN_SCALE
    description: "Loopback-only Spark-first notebook UI. Requires Spark and MinIO."

exports: []

runtime_sc:
  zeppelin:
    container:
      scale: 1
      environment:
        ZEPPELIN_PORT: "8080"
        ZEPPELIN_LOG_DIR: /logs
        ZEPPELIN_NOTEBOOK_DIR: /notebook
        JAVA_HOME: /opt/java/openjdk
        SPARK_HOME: /opt/spark
        SPARK_MASTER: "spark://spark-master:7077"
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
        MINIO_ENDPOINT: http://minio:9000
        MINIO_REGION: ${MINIO_REGION:-us-east-1}
        MINIO_BUCKET_SPARK_HISTORY: ${MINIO_BUCKET_SPARK_HISTORY:-spark-history}
        MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY}
        MINIO_SPARK_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY}
        MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
        MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
        MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
        ICEBERG_REST_URI: http://iceberg-rest:8181
        TRINO_SOURCE: ${TRINO_SOURCE:-disabled}
        TRINO_ENDPOINT: http://trino:8080
        TRINO_JDBC_URL: jdbc:trino://trino:8080/lakehouse
        TRINO_JDBC_USER: atlas
        TRINO_JDBC_DRIVER: io.trino.jdbc.TrinoDriver
        TRINO_JDBC_DEPENDENCY: io.trino:trino-jdbc:482
        SPARK_SUBMIT_OPTIONS: >-
          --conf spark.submit.deployMode=client
          --conf spark.driver.bindAddress=0.0.0.0
          --conf spark.driver.host=zeppelin
          --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
          --conf spark.hadoop.fs.s3a.access.key=${MINIO_SPARK_ACCESS_KEY}
          --conf spark.hadoop.fs.s3a.secret.key=${MINIO_SPARK_SECRET_KEY}
          --conf spark.hadoop.fs.s3a.path.style.access=true
          --conf spark.hadoop.fs.s3a.endpoint.region=${MINIO_REGION:-us-east-1}
          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
          --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.lakehouse.type=rest
          --conf spark.sql.catalog.lakehouse.uri=http://iceberg-rest:8181
          --conf spark.sql.catalog.lakehouse.warehouse=s3a://${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}/
          --conf spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.lakehouse.s3.endpoint=http://minio:9000
          --conf spark.sql.catalog.lakehouse.s3.path-style-access=true
          --conf spark.sql.catalog.lakehouse.s3.access-key-id=${MINIO_ICEBERG_ACCESS_KEY}
          --conf spark.sql.catalog.lakehouse.s3.secret-access-key=${MINIO_ICEBERG_SECRET_KEY}
          --conf spark.sql.catalog.lakehouse.client.region=${MINIO_REGION:-us-east-1}
          --conf spark.eventLog.enabled=true
          --conf spark.eventLog.dir=s3a://${MINIO_BUCKET_SPARK_HISTORY:-spark-history}/
        ZEPPELIN_JDBC_POSTGRES_URL: "jdbc:postgresql://supabase-db:5432/${SUPABASE_DB_NAME}"
        ZEPPELIN_JDBC_POSTGRES_USER: "${SUPABASE_DB_USER}"
        ZEPPELIN_JDBC_POSTGRES_PASSWORD: "${SUPABASE_DB_PASSWORD}"
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  zeppelin-init:
    container:
      scale: 1
      environment:
        ZEPPELIN_URL: http://zeppelin:8080
        JAVA_HOME: /opt/java/openjdk
        SPARK_HOME: /opt/spark
        SPARK_MASTER: "spark://spark-master:7077"
        MINIO_ENDPOINT: http://minio:9000
        MINIO_REGION: ${MINIO_REGION:-us-east-1}
        MINIO_BUCKET_SPARK_HISTORY: ${MINIO_BUCKET_SPARK_HISTORY:-spark-history}
        MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY}
        MINIO_SPARK_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY}
        MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
        MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
        MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
        ICEBERG_REST_URI: http://iceberg-rest:8181
        ICEBERG_REST_SOURCE: ${ICEBERG_REST_SOURCE:-disabled}
        TRINO_SOURCE: ${TRINO_SOURCE:-disabled}
        TRINO_ENDPOINT: http://trino:8080
        TRINO_JDBC_URL: jdbc:trino://trino:8080/lakehouse
        TRINO_JDBC_USER: atlas
        TRINO_JDBC_DRIVER: io.trino.jdbc.TrinoDriver
        TRINO_JDBC_DEPENDENCY: io.trino:trino-jdbc:482
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  # Convention: focus.data_flow.calls = what FOCUS calls (upstream).
  # Kong is intentionally absent: Zeppelin is exposed only on a loopback host port.
  # NOTE: litellm is intentionally absent here even though the README
  # describes wiring it from inside Python cells — Zeppelin doesn't auto-
  # inject LITELLM_* env vars at compose-render time, so the call is
  # user-driven, not part of the runtime topology. Mirroring depends_on.
  calls:
    - spark
    - supabase
    - minio
    - iceberg-rest
    - redpanda
    - trino
