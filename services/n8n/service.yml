# services/n8n/service.yml — n8n + worker + init
name: n8n
label: "n8n (workflow automation)"
category: agents
docs: services/n8n/README.md

capabilities:
  - name: "Queue-mode workflow execution"
    status: supported
    verification: tested
    note: "Atlas serializes database migrations, stores workflows in Postgres, and offloads manual and triggered executions through Redis to a dedicated worker."
  - name: "Bounded consumer workflow seeding"
    status: partial
    verification: tested
    note: "The bootstrapper validates, namespaces, imports, activates, and reconciles declared consumer workflows with time and size bounds, but continues best-effort when one workflow fails."
  - name: "Bundled AI workflow examples"
    status: partial
    verification: tested
    note: "Atlas ships structurally validated research, memory, and image examples, while operators must import staged examples and bind real credentials before production webhook activation."
  - name: "Workflow credential propagation"
    status: partial
    verification: tested
    note: "Both web and worker expose a scoped Backend token plus the stack-wide LiteLLM master key and provider service credentials to workflow expressions; trusted authors must avoid returning them in outputs or webhooks."
  - name: "Editor and webhook access control"
    status: partial
    verification: tested
    note: "n8n supplies its own login while direct and CORS-only Kong routes add no Atlas auth; staged privileged examples require operator-bound Header Auth, but the legacy bundled /research fixture declares no authentication and must be secured before activation."
  - name: "Idempotent external side effects"
    status: not-supported
    verification: documented
    note: "Queue retries, manual re-runs, and webhook redelivery can repeat arbitrary workflow side effects; Atlas cannot make third-party nodes transactional or universally idempotent."
  - name: "Workflow execution high availability"
    status: partial
    verification: documented
    note: "Postgres and Redis preserve workflow and queue state across process restarts, but Atlas fixes one web and one worker replica with no multi-node failover certification."

containers:
  - n8n
  - n8n-worker
  - n8n-init

images:
  - var: N8N_IMAGE
    default: "n8nio/n8n:2.36.7"
    container: n8n
  - var: N8N_INIT_IMAGE
    default: "n8nio/n8n:2.36.7"
    container: n8n-init

sources:
  var: N8N_SOURCE
  default: container
  options:
    - id: container
      label: "Container"
    - id: disabled
      label: "Disabled"

env:
  - name: N8N_SOURCE
    default: container
  - name: N8N_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: N8N_ENCRYPTION_KEY
    default: "your-random-encryption-key"
    secret: true
    description: "Encryption key for n8n credentials and workflow secrets; auto-generated by the bootstrapper when left as the placeholder."
  - name: N8N_API_KEY
    default: ""
    secret: true
    description: "n8n public-API key (n8n CE issues these only via the UI: Settings → n8n API). Consumed by the backend's /workflows endpoints; while empty those endpoints currently return backend errors from failed upstream n8n calls."
  - name: N8N_HOST
    default: "n8n.localhost"
  - name: N8N_PROTOCOL
    default: http
  - name: N8N_EXECUTIONS_MODE
    default: queue
  - name: N8N_INIT_SOURCE
    default: container
  - name: N8N_INIT_NODES
    default: "n8n-nodes-comfyui@0.0.9,@ksc1234/n8n-nodes-comfyui-image-to-image@1.0.2"
    description: "Exact community package specs installed before n8n starts. Atlas' default ComfyUI set uses the committed package-lock; n8n 2.36.7 already supplies first-party MCP nodes. Custom values must use name@x.y.z for every comma-separated package."
  - name: N8N_SEED_HTTP_TIMEOUT_MS
    default: 10000
    description: "Absolute deadline in milliseconds for each consumer workflow seeder HTTP operation; must be positive."
  - name: N8N_SEED_COMMAND_TIMEOUT_MS
    default: 120000
    description: "Deadline in milliseconds for each consumer workflow n8n CLI operation; must be positive."
  - name: N8N_SEED_MAX_RESPONSE_BYTES
    default: 1048576
    description: "Maximum bytes accepted from one consumer workflow seeder HTTP response; must be positive."
  # TZ is intentionally NOT declared here. main's .env.example doesn't expose
  # it; n8n's compose has `GENERIC_TIMEZONE: ${TZ:-UTC}` which falls back to
  # UTC when TZ is unset. Declaring TZ on the manifest would force a value
  # into .env.example that doesn't match main's UX (which treats it as an
  # OS-environment passthrough only).
  - name: N8N_SCALE
    auto_managed: true
  - name: N8N_WORKER_SCALE
    auto_managed: true
  - name: N8N_INIT_SCALE
    auto_managed: true

depends_on:
  required:
    - supabase
    - redis
    - litellm
  optional:
    - supavisor

rows:
  - display_name: "n8n"
    source_var: N8N_SOURCE
    port_var: N8N_PORT
    scale_var: N8N_SCALE
    alias: n8n.localhost
    description: "Workflow automation & integrations."

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  n8n:
    container:
      scale: 1
      environment:
        LITELLM_BASE_URL: http://litellm:4000
        LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
        STT_ENDPOINT: ${STT_ENDPOINT}
        TTS_ENDPOINT: ${TTS_ENDPOINT}
        DOCLING_ENDPOINT: ${DOCLING_ENDPOINT}
        DOCLING_API_TOKEN: ${DOCLING_API_TOKEN}
        PARAKEET_API_TOKEN: ${PARAKEET_API_TOKEN}
        N8N_METRICS: 'true'
        N8N_METRICS_PREFIX: 'n8n_'
        N8N_METRICS_INCLUDE_DEFAULT_METRICS: 'true'
        N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: 'true'
        N8N_METRICS_INCLUDE_EXECUTION_DATA_METRICS: 'true'
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  n8n-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

runtime_adaptive:
  n8n:
    adapts_to:
    - stt_provider
    - tts_provider
    - doc_processor
    - tika
    - lightrag
    - hermes
    - crawl4ai
    - supavisor
    environment_adaptation:
      STT_ENDPOINT: ${STT_ENDPOINT}
      TTS_ENDPOINT: ${TTS_ENDPOINT}
      DOCLING_ENDPOINT: ${DOCLING_ENDPOINT}
      DOCLING_API_TOKEN: ${DOCLING_API_TOKEN}
      PARAKEET_API_TOKEN: ${PARAKEET_API_TOKEN}
      TIKA_ENDPOINT: ${TIKA_ENDPOINT}
      LIGHTRAG_ENDPOINT: ${LIGHTRAG_ENDPOINT}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      CRAWL4AI_ENDPOINT: ${CRAWL4AI_ENDPOINT}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN}
      # n8n + n8n-worker compose blocks inject these (services/n8n/
      # compose.yml lines ~75-77 / ~138-141). Declaring them here keeps
      # the auto-generated diagram and §N.x dependency tables in sync
      # with the actual runtime wiring; n8n-worker mirrors n8n.
      HERMES_ENDPOINT: ${HERMES_ENDPOINT}
      HERMES_API_KEY: ${HERMES_API_KEY}
    extra_hosts_adaptation: inherit from stt_provider, tts_provider, doc_processor

runtime_deps:
  n8n:
    requires:
    - weaviate
    optional:
    - parakeet
    error_message: 'n8n disabled: requires weaviate for vector operations and AI workflow
      nodes. Enable weaviate (WEAVIATE_SOURCE=container) to use n8n workflows with
      vector capabilities'
    info_message: n8n enabled - will connect to available optional services (parakeet)
  n8n-worker:
    requires:
    - weaviate
    error_message: 'n8n-worker disabled: requires weaviate for vector operations'

data_flow:
  calls:
    - supabase
    # BullMQ queue + session store. n8n runs in EXECUTIONS_MODE=queue
    # with QUEUE_BULL_REDIS_HOST=redis (and n8n-worker mirrors the same
    # block) — a hard runtime call edge, not just an enablement flag.
    - redis
    - weaviate
    # Bundled workflows POST to http://backend:8000 (e.g. /comfyui/generate,
    # langmem-consolidation, research flows) — n8n reaches ComfyUI THROUGH the
    # backend, not directly (n8n<->comfyui is an unwired future pair; see the
    # README Future-pairs note).
    - backend
    - doc-processor
    - tika
    - hermes
    - litellm
    - stt-provider
    - tts-provider
    - searxng
    - lightrag
    - crawl4ai
    - supavisor
