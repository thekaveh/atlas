name: airflow
label: "Apache Airflow (DAG orchestrator)"
category: agents
docs: services/airflow/README.md

containers:
  - airflow-webserver
  - airflow-scheduler
  - airflow-dag-processor
  - airflow-init

images:
  - var: AIRFLOW_IMAGE
    default: "apache/airflow:3.3.0"
    container: airflow-webserver

sources:
  var: AIRFLOW_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (LocalExecutor + SparkSubmit lakehouse jobs)"
    - id: disabled
      label: "Disabled"

env:
  - name: AIRFLOW_SOURCE
    default: disabled
  - name: AIRFLOW_PORT
    description: "Host port for the Airflow Web UI + REST API (in-container 8080)."
  - name: AIRFLOW_DB_USER
    default: airflow
  - name: AIRFLOW_DB_PASSWORD
    default: ""
    secret: true
    description: "Auto-generated by bootstrapper. Postgres role for the Airflow metadata DB."
  - name: AIRFLOW_FERNET_KEY
    default: ""
    secret: true
    description: "Auto-generated. Fernet key for encrypting Connection passwords."
  - name: AIRFLOW_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated. AIRFLOW__API__SECRET_KEY — signs inter-process payloads (DagFileProcessor → scheduler RPC, deferrable triggers, multi-scheduler JWTs). Airflow 3.x; previously [webserver] secret_key + Flask sessions in 2.x."
  - name: AIRFLOW_JWT_SECRET
    default: ""
    secret: true
    description: "Auto-generated. AIRFLOW__API_AUTH__JWT_SECRET — signs Execution API JWTs (the /execution/ task-supervisor protocol + /api/v2/ auth-token exchange). Distinct from AIRFLOW_SECRET_KEY: when unset, webserver/scheduler/dag-processor each mint their own and cross-process JWT verification fails with 403 InvalidSignatureError (#850). Idempotent — never rotates on warm restart."
  - name: AIRFLOW_ADMIN_PASSWORD
    default: ""
    secret: true
    description: "Auto-generated. Admin login. Username is hardcoded 'admin'."
  - name: AIRFLOW_WEBSERVER_SCALE
    auto_managed: true
  - name: AIRFLOW_SCHEDULER_SCALE
    auto_managed: true
  - name: AIRFLOW_DAG_PROCESSOR_SCALE
    auto_managed: true
    description: "Required in Airflow 3.x — the standalone DAG processor service parses DAG files into the metadata DB (the scheduler no longer does this in-process)."
  - name: AIRFLOW_INIT_SCALE
    auto_managed: true
  - name: AIRFLOW_WEBSERVER_MEMORY_LIMIT
    default: 2g
    description: "Container memory limit for airflow-webserver (deploy.resources.limits.memory). The api-server process is Python + Flask/FAB; 2 g is comfortable on a 32 GB host and prevents runaway memory from large DAG list pages."
  - name: AIRFLOW_WEBSERVER_CPU_LIMIT
    default: "1.0"
    description: "Container CPU limit for airflow-webserver (deploy.resources.limits.cpus). 1.0 core is ample for the API/UI server under typical load."
  - name: AIRFLOW_SCHEDULER_MEMORY_LIMIT
    default: 2g
    description: "Container memory limit for airflow-scheduler (deploy.resources.limits.memory). The LocalExecutor scheduler forks task processes in-process; 2 g caps runaway task forking."
  - name: AIRFLOW_SCHEDULER_CPU_LIMIT
    default: "1.0"
    description: "Container CPU limit for airflow-scheduler (deploy.resources.limits.cpus). 1.0 core is sufficient for LocalExecutor task scheduling on a dev/staging host."
  - name: AIRFLOW_DAG_PROCESSOR_MEMORY_LIMIT
    default: 2g
    description: "Container memory limit for airflow-dag-processor (deploy.resources.limits.memory). DAG parsing is Python-heavy but short-lived per cycle; 2 g prevents unbounded growth from parsing pathological DAG files."
  - name: AIRFLOW_DAG_PROCESSOR_CPU_LIMIT
    default: "1.0"
    description: "Container CPU limit for airflow-dag-processor (deploy.resources.limits.cpus). 1.0 core covers the periodic DAG file parsing cycle."

depends_on:
  required:
    - supabase
    # LiteLLM + Redis are always-on per their service.yml; airflow-init
    # seeds litellm_default and redis_default Connections unconditionally,
    # so they belong in required (not optional) for ordering parity with
    # sibling consumers (n8n, jupyterhub).
    - litellm
    - redis
  optional:
    - spark
    - minio
    - iceberg-rest
    - redpanda
    - weaviate
    - neo4j
    # NOTE: prometheus integration is documented as a Known follow-up
    # in CHANGELOG (Airflow 3.x has no built-in /metrics; the official
    # path is StatsD → statsd_exporter → Prometheus, not yet wired).
    # Removed from optional deps so service_dependencies / auto-diagrams
    # don't show a non-existent edge.

rows:
  - display_name: "Apache Airflow"
    source_var: AIRFLOW_SOURCE
    port_var: AIRFLOW_PORT
    scale_var: AIRFLOW_WEBSERVER_SCALE
    alias: airflow.localhost
    description: "Code-defined DAG orchestrator. LocalExecutor + SparkSubmit lakehouse jobs."

exports: []

runtime_sc:
  airflow-webserver:
    container:
      scale: 1
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@supabase-db:5432/airflow"
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
        # Airflow 3.x renamed [webserver]→[api] for secret_key, and moved
        # auth_backends out of [api] into [fab] inside the FAB provider.
        # Also defaults to SimpleAuthManager (no basic_auth); explicit
        # FabAuthManager required for HTTP basic auth on the REST API.
        AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
        AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
        AIRFLOW__FAB__AUTH_BACKENDS: "airflow.providers.fab.auth_manager.api.auth.backend.basic_auth"
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW_UID: "50000"
        SPARK_MASTER_URL: spark://spark-master:7077
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
        ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
        ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
        MINIO_ENDPOINT: http://minio:9000
        MINIO_REGION: ${MINIO_REGION:-us-east-1}
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        MINIO_BUCKET_ICEBERG_JARS: ${MINIO_BUCKET_ICEBERG_JARS:-jars}
        MINIO_BUCKET_ICEBERG_LANDING: ${MINIO_BUCKET_ICEBERG_LANDING:-landing}
        MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
        MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
        MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
        ICEBERG_REST_URI: http://iceberg-rest:8181
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  airflow-scheduler:
    container:
      scale: 1
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@supabase-db:5432/airflow"
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
        # Mirror of compose.yml — required for inter-process signed payloads.
        # Dual-write per project_runtime_sc_vs_compose_env_dual_write.md.
        # Airflow 3.x: was AIRFLOW__WEBSERVER__SECRET_KEY (section retired).
        AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
        # Parity with api-server + init. DagFileProcessor invokes
        # AuthManager during DAG parsing.
        AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
        AIRFLOW__FAB__AUTH_BACKENDS: "airflow.providers.fab.auth_manager.api.auth.backend.basic_auth"
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW_UID: "50000"
        SPARK_MASTER_URL: spark://spark-master:7077
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
        ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
        ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
        MINIO_ENDPOINT: http://minio:9000
        MINIO_REGION: ${MINIO_REGION:-us-east-1}
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        MINIO_BUCKET_ICEBERG_JARS: ${MINIO_BUCKET_ICEBERG_JARS:-jars}
        MINIO_BUCKET_ICEBERG_LANDING: ${MINIO_BUCKET_ICEBERG_LANDING:-landing}
        MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
        MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
        MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
        ICEBERG_REST_URI: http://iceberg-rest:8181
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  # Airflow 3.x BREAKING CHANGE — see compose.yml comment. Mirror of
  # scheduler env block since they run the same JVM/Python image.
  airflow-dag-processor:
    container:
      scale: 1
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@supabase-db:5432/airflow"
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
        AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
        AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
        AIRFLOW__FAB__AUTH_BACKENDS: "airflow.providers.fab.auth_manager.api.auth.backend.basic_auth"
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW_UID: "50000"
        SPARK_MASTER_URL: spark://spark-master:7077
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
        ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
        ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
        MINIO_ENDPOINT: http://minio:9000
        MINIO_REGION: ${MINIO_REGION:-us-east-1}
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        MINIO_BUCKET_ICEBERG_JARS: ${MINIO_BUCKET_ICEBERG_JARS:-jars}
        MINIO_BUCKET_ICEBERG_LANDING: ${MINIO_BUCKET_ICEBERG_LANDING:-landing}
        MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
        MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
        MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
        ICEBERG_REST_URI: http://iceberg-rest:8181
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  airflow-init:
    container:
      scale: 1
      environment:
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@supabase-db:5432/airflow"
        # _AIRFLOW_DB_MIGRATE intentionally NOT set — see compose.yml.
        # Mirror of compose.yml — required by init-airflow.sh's
        # `airflow users create --password "${AIRFLOW_ADMIN_PASSWORD}"`.
        # Without it, `set -euo pipefail` aborts and the whole family
        # fails to start.
        AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
        # Parity with webserver/scheduler — see compose.yml.
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW_UID: "50000"
        # Sibling-source vars consumed by init-airflow.sh for conditional
        # Connection seeding. Per project_runtime_sc_vs_compose_env_dual_write.md
        # these must mirror what compose.yml's environment block declares —
        # compose is the actual injection point; runtime_sc documents
        # what the container receives for the rendering pipeline.
        # LITELLM + REDIS are always-on per their service.yml; init script
        # seeds those Connections unconditionally and does not read the vars.
        # NEO4J_GRAPH_DB_SOURCE is the canonical name (not NEO4J_SOURCE).
        SPARK_SOURCE: ${SPARK_SOURCE:-disabled}
        MINIO_SOURCE: ${MINIO_SOURCE:-disabled}
        ICEBERG_REST_SOURCE: ${ICEBERG_REST_SOURCE:-disabled}
        WEAVIATE_SOURCE: ${WEAVIATE_SOURCE:-disabled}
        NEO4J_GRAPH_DB_SOURCE: ${NEO4J_GRAPH_DB_SOURCE:-disabled}
        ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
        # Credentials passed through to airflow-init for use by the
        # connection-seeding helper (litellm + minio + supabase + the
        # dedicated airflow Postgres role).
        LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
        SUPABASE_DB_USER: ${SUPABASE_DB_USER}
        SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
        AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
        AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
        # Neo4j credentials for the neo4j_default Connection seed (Neo4j
        # is auth-on by default; canonical var names are GRAPH_DB_*).
        GRAPH_DB_USER: ${GRAPH_DB_USER}
        GRAPH_DB_PASSWORD: ${GRAPH_DB_PASSWORD}
        # Redis is auth-on (--requirepass); without REDIS_PASSWORD the
        # redis_default Connection seed authenticates as anonymous and
        # every DAG using RedisHook fails NOAUTH.
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        # Mirror webserver/scheduler's Airflow 3.x auth settings so the
        # init script's `airflow users create` CLI (FAB provider)
        # actually writes the admin row.
        AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
        AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  # Convention: focus.data_flow.calls = what FOCUS calls (upstream).
  # Kong routes traffic TO Airflow (UI + REST API at airflow.localhost);
  # Airflow does not call Kong. Hermes triggers DAGs via the REST API
  # but that's Hermes's outbound lane (hermes.data_flow.calls includes
  # airflow), not Airflow's.
  calls:
    - supabase
    - spark
    - redpanda
    - minio
    - iceberg-rest
    - litellm
    - weaviate
    - neo4j
    - redis
