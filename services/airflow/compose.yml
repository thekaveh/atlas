services:
  airflow-webserver:
    build:
      context: ./build
      args:
        BASE_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.3.1}
    image: ${PROJECT_NAME}-airflow:local
    container_name: ${PROJECT_NAME}-airflow-webserver
    restart: unless-stopped
    deploy:
      replicas: ${AIRFLOW_WEBSERVER_SCALE:-0}
      resources:
        limits:
          memory: ${AIRFLOW_WEBSERVER_MEMORY_LIMIT:-2g}
          cpus: "${AIRFLOW_WEBSERVER_CPU_LIMIT:-1.0}"
    ports:
      - "${HOST_BIND_IP:-}${AIRFLOW_PORT}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@supabase-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      # Airflow 3.x renamed [webserver] secret_key → [api] secret_key (the
      # `airflow webserver` subcommand was removed alongside; api-server
      # now serves both UI and REST). Setting the old AIRFLOW__WEBSERVER__
      # SECRET_KEY name was a silent no-op.
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      # Airflow 3.x defaults to SimpleAuthManager which does NOT support
      # HTTP basic_auth — the README's curl examples and the Hermes →
      # Airflow REST trigger pattern need the FAB auth manager.
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      # Airflow 3.x: basic_auth backend moved from [api] auth_backends
      # → [fab] auth_backends inside the apache-airflow-providers-fab
      # package. AIRFLOW__API__AUTH_BACKENDS is silently ignored in 3.x.
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: "50000"
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
      ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
      ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_ICEBERG_JARS: ${MINIO_BUCKET_ICEBERG_JARS:-jars}
      MINIO_BUCKET_ICEBERG_LANDING: ${MINIO_BUCKET_ICEBERG_LANDING:-landing}
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
      MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
      MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
      ICEBERG_REST_URI: http://iceberg-rest:8181
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    # Airflow 3.x: the `webserver` subcommand was removed (split-CLI
    # AIP-81). The unified API + UI now ship under `airflow api-server`.
    command: ["airflow", "api-server"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      # Airflow 3.x's api-server retired the legacy `/health` route
      # (it served the FAB webserver in 2.x). The canonical health
      # endpoint is now `/api/v2/monitor/health` — it returns a JSON
      # blob with metadatabase / scheduler / triggerer / dag_processor
      # sub-statuses. `/health` still 404s under the new api-server
      # router, so the prior healthcheck always marked the container
      # unhealthy and Docker emitted the orange dot in TUI / `docker ps`.
      # Verified on 3.3.1: `curl localhost:8080/api/v2/monitor/health` →
      # 200 with `{"metadatabase":{"status":"healthy"},...}`.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  airflow-scheduler:
    # Same locally-built image as airflow-webserver. Compose only
    # auto-builds for services that DECLARE `build:`; without it, an
    # `up` command tries to PULL `${PROJECT_NAME}-airflow:local` from
    # a registry (which doesn't exist) and fails. Declaring `build:`
    # with the same context here makes Compose reuse the already-built
    # tag without rebuilding.
    build:
      context: ./build
      args:
        BASE_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.3.1}
    image: ${PROJECT_NAME}-airflow:local
    container_name: ${PROJECT_NAME}-airflow-scheduler
    restart: unless-stopped
    deploy:
      replicas: ${AIRFLOW_SCHEDULER_SCALE:-0}
      resources:
        limits:
          memory: ${AIRFLOW_SCHEDULER_MEMORY_LIMIT:-2g}
          cpus: "${AIRFLOW_SCHEDULER_CPU_LIMIT:-1.0}"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Airflow 3.3.1's Task-SDK supervisor resolves the Execution API per task
      # via get_execution_api_server_url(), which falls back to
      # http://localhost:8080/execution/ when unset — but `airflow api-server`
      # runs in the separate airflow-webserver container, so localhost is
      # unreachable and every task dies at Pre-Execute with httpcore.ConnectError
      # (#791). Point it at the webserver's compose DNS name (project-agnostic).
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@supabase-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      # Required for inter-process signed-payload validation (DagFileProcessor
      # → scheduler RPC, deferrable triggers, JWT auth between schedulers in
      # an HA setup). Single-scheduler LocalExecutor mostly tolerates a
      # missing key today but pinning it now means scaling later doesn't
      # silently break. Mirrors the api-server block.
      # Airflow 3.x: was AIRFLOW__WEBSERVER__SECRET_KEY ([webserver] section
      # retired); canonical is now AIRFLOW__API__SECRET_KEY.
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      # Parity with api-server + init: scheduler's DagFileProcessor calls
      # AuthManager.is_authorized_dag during DAG parsing. Without these,
      # it falls back to SimpleAuthManager and may emit auth warnings
      # into the scheduler log (no current functional break but a
      # dual-write boundary violation per project_runtime_sc_vs_compose_env).
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: "50000"
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
      ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
      ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_ICEBERG_JARS: ${MINIO_BUCKET_ICEBERG_JARS:-jars}
      MINIO_BUCKET_ICEBERG_LANDING: ${MINIO_BUCKET_ICEBERG_LANDING:-landing}
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
      MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
      MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
      ICEBERG_REST_URI: http://iceberg-rest:8181
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      # Airflow's recommended scheduler liveness probe — checks that THIS
      # host has a fresh SchedulerJob heartbeat in the metadata DB. Silent
      # scheduler death is the worst Airflow failure mode (UI still works,
      # DAGs sit queued forever); this catches it.
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  # Airflow 3.x BREAKING CHANGE: the scheduler no longer parses DAG files
  # in-process. A standalone `airflow dag-processor` service is REQUIRED
  # — even for LocalExecutor / single-node setups. Without it, files in
  # /opt/airflow/dags are never parsed, the UI shows zero DAGs, and no
  # DAG runs schedule. Confirmed against the Airflow 3 upgrade guide
  # ("The Dag processor must now be started independently, even for
  # local or development setups") and upstream's reference compose at
  # and the 3.3.1 reference deployment, which ships an
  # `airflow-dag-processor` service.
  airflow-dag-processor:
    build:
      context: ./build
      args:
        BASE_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.3.1}
    image: ${PROJECT_NAME}-airflow:local
    container_name: ${PROJECT_NAME}-airflow-dag-processor
    restart: unless-stopped
    deploy:
      replicas: ${AIRFLOW_DAG_PROCESSOR_SCALE:-0}
      resources:
        limits:
          memory: ${AIRFLOW_DAG_PROCESSOR_MEMORY_LIMIT:-2g}
          cpus: "${AIRFLOW_DAG_PROCESSOR_CPU_LIMIT:-1.0}"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # See scheduler block: the dag-processor is a separate Task-SDK process
      # that also resolves the Execution API and must not fall back to
      # localhost:8080 (#791).
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@supabase-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: "50000"
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
      ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
      ATLAS_LAKEHOUSE_SMOKE_JAR_PATH: /opt/airflow/atlas-jars/atlas-lakehouse-smoke.jar
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_ICEBERG_JARS: ${MINIO_BUCKET_ICEBERG_JARS:-jars}
      MINIO_BUCKET_ICEBERG_LANDING: ${MINIO_BUCKET_ICEBERG_LANDING:-landing}
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
      MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
      MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
      ICEBERG_REST_URI: http://iceberg-rest:8181
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  airflow-init:
    # Same locally-built image; see comment above on airflow-scheduler.
    build:
      context: ./build
      args:
        BASE_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.3.1}
    image: ${PROJECT_NAME}-airflow:local
    container_name: ${PROJECT_NAME}-airflow-init
    deploy:
      replicas: ${AIRFLOW_INIT_SCALE:-0}
    environment:
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@supabase-db:5432/airflow
      # NOTE: do NOT set _AIRFLOW_DB_MIGRATE=true here. The entrypoint
      # would try to migrate BEFORE init-airflow.sh CREATEs the airflow
      # DB — failing with "database does not exist". The script does its
      # own `airflow db migrate` at line 48 AFTER creating the DB.
      # CRITICAL: init-airflow.sh runs `airflow users create --password
      # "${AIRFLOW_ADMIN_PASSWORD}"` (line 63). Under `set -euo pipefail`
      # an unset var aborts the script — and webserver/scheduler/
      # dag-processor all depends_on airflow-init: service_completed_successfully,
      # so the entire family fails to start. Pass 10 dropped the
      # _AIRFLOW_WWW_USER_PASSWORD mirror as "dead bait" (the legacy
      # entrypoint var) without realizing the canonical AIRFLOW_ADMIN_PASSWORD
      # was the actual consumer — caught by Pass 23.
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # Parity with webserver/scheduler — keep examples off across the
      # entire family so a future Airflow version that reads this during
      # `db migrate` doesn't accidentally seed examples into our metadata DB.
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: "50000"
      # Sibling-source vars consumed by the init script for conditional
      # connection seeding (dual-write per project_runtime_sc_vs_compose_env).
      # LITELLM + REDIS are intentionally absent: both are always-on per their
      # service.yml and the init script seeds their Connections unconditionally.
      # NEO4J_GRAPH_DB_SOURCE is the canonical name (NEO4J_SOURCE does not exist).
      SPARK_SOURCE: ${SPARK_SOURCE:-disabled}
      MINIO_SOURCE: ${MINIO_SOURCE:-disabled}
      ICEBERG_REST_SOURCE: ${ICEBERG_REST_SOURCE:-disabled}
      WEAVIATE_SOURCE: ${WEAVIATE_SOURCE:-disabled}
      NEO4J_GRAPH_DB_SOURCE: ${NEO4J_GRAPH_DB_SOURCE:-disabled}
      ATLAS_LAKEHOUSE_SPARK_DEPLOY_MODE: cluster
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      # Neo4j credentials consumed by init-airflow.sh when seeding
      # neo4j_default (Connection requires auth — Neo4j is auth-on by
      # default). Canonical var names are GRAPH_DB_USER / _PASSWORD
      # (NOT NEO4J_USER / _PASSWORD — the Neo4j manifest's username
      # field is GRAPH_DB_USER).
      GRAPH_DB_USER: ${GRAPH_DB_USER}
      GRAPH_DB_PASSWORD: ${GRAPH_DB_PASSWORD}
      # Redis is auth-on (services/redis/compose.yml passes --requirepass
      # ${REDIS_PASSWORD}). Without this, redis_default Connection auth-
      # fails with NOAUTH/WRONGPASS on every DAG that uses RedisHook.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Same Airflow 3.x section renames as webserver/scheduler — needed
      # so `airflow users create` (a FAB-provider CLI) actually finds
      # FabAuthManager and successfully writes the admin row. The init
      # script's `|| echo "skipping"` swallow would otherwise hide
      # failure, leaving the webserver auth-backend without an admin to
      # validate against (same 401 class as Pass 9's basic_auth bug).
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
    volumes:
      - ./dags:/opt/airflow/dags
      - ./init/scripts:/scripts:ro
    # CRITICAL: apache/airflow:3.3.1's ENTRYPOINT is /entrypoint
    # (entrypoint_prod.sh) which treats the first arg as an `airflow`
    # subcommand and exec's `airflow "$@"`. A bare `["/scripts/init-airflow.sh"]`
    # becomes `exec airflow /scripts/init-airflow.sh` → invalid
    # subcommand → exit 2 → init never runs the actual script body →
    # webserver/scheduler/dag-processor never start (all depends_on
    # init: service_completed_successfully). The entrypoint explicitly
    # supports `bash` as a passthrough (entrypoint_prod.sh
    # exec_to_bash_or_python_command_if_specified), so prefix with `bash`
    # to make the script actually execute. Caught by Pass 38.
    command: ["bash", "/scripts/init-airflow.sh"]
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - backend-network

volumes:
  airflow-logs:
    name: ${PROJECT_NAME}-airflow-logs
    driver: local
