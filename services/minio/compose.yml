# services/minio/compose.yml — MinIO object storage + bucket init
services:
  minio:
    image: ${MINIO_IMAGE}
    container_name: ${PROJECT_NAME}-minio
    restart: unless-stopped
    deploy:
      replicas: ${MINIO_SCALE:-1}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_PUBLIC_CONSOLE_ENDPOINT}
      # Prometheus metrics — `public` disables the JWT-bearer auth on
      # /minio/v2/metrics/cluster so the observability bundle's Prometheus
      # can scrape without managing a token. Scraped on the S3 API port
      # (9000) — see services/prometheus/config/prometheus.yml.
      MINIO_PROMETHEUS_AUTH_TYPE: 'public'
    ports:
      - "${HOST_BIND_IP:-}${MINIO_PORT}:9000"
      - "${HOST_BIND_IP:-}${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  minio-init:
    image: ${MINIO_INIT_IMAGE}
    container_name: ${PROJECT_NAME}-minio-init
    restart: "no"
    deploy:
      replicas: ${MINIO_INIT_SCALE:-1}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_EXTRA_CONSUMERS: ${MINIO_EXTRA_CONSUMERS:-}
      MINIO_BUCKET_ASSET_INPUTS: ${MINIO_BUCKET_ASSET_INPUTS}
      MINIO_ASSET_INGEST_ACCESS_KEY: ${MINIO_ASSET_INGEST_ACCESS_KEY}
      MINIO_ASSET_INGEST_SECRET_KEY: ${MINIO_ASSET_INGEST_SECRET_KEY}
      ASSET_WORKER_MINIO_BUCKET: ${ASSET_WORKER_MINIO_BUCKET}
      MINIO_ASSET_WORKER_ACCESS_KEY: ${MINIO_ASSET_WORKER_ACCESS_KEY}
      MINIO_ASSET_WORKER_SECRET_KEY: ${MINIO_ASSET_WORKER_SECRET_KEY}
      ASSET_BAKER_MINIO_BUCKET: ${ASSET_BAKER_MINIO_BUCKET}
      MINIO_ASSET_BAKER_ACCESS_KEY: ${MINIO_ASSET_BAKER_ACCESS_KEY}
      MINIO_ASSET_BAKER_SECRET_KEY: ${MINIO_ASSET_BAKER_SECRET_KEY}
      MINIO_BUCKET_COMFYUI: ${MINIO_BUCKET_COMFYUI}
      MINIO_COMFYUI_ACCESS_KEY: ${MINIO_COMFYUI_ACCESS_KEY}
      MINIO_COMFYUI_SECRET_KEY: ${MINIO_COMFYUI_SECRET_KEY}
      MINIO_BUCKET_BACKEND: ${MINIO_BUCKET_BACKEND}
      MINIO_BACKEND_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY}
      MINIO_BACKEND_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY}
      MINIO_BUCKET_N8N: ${MINIO_BUCKET_N8N}
      MINIO_N8N_ACCESS_KEY: ${MINIO_N8N_ACCESS_KEY}
      MINIO_N8N_SECRET_KEY: ${MINIO_N8N_SECRET_KEY}
      MINIO_BUCKET_JUPYTER: ${MINIO_BUCKET_JUPYTER}
      MINIO_JUPYTER_ACCESS_KEY: ${MINIO_JUPYTER_ACCESS_KEY}
      MINIO_JUPYTER_SECRET_KEY: ${MINIO_JUPYTER_SECRET_KEY}
      MINIO_BUCKET_SPARK_HISTORY: ${MINIO_BUCKET_SPARK_HISTORY}
      MINIO_SPARK_ACCESS_KEY: ${MINIO_SPARK_ACCESS_KEY}
      MINIO_SPARK_SECRET_KEY: ${MINIO_SPARK_SECRET_KEY}
      MINIO_BUCKET_DOCLING: ${MINIO_BUCKET_DOCLING}
      MINIO_DOCLING_ACCESS_KEY: ${MINIO_DOCLING_ACCESS_KEY}
      MINIO_DOCLING_SECRET_KEY: ${MINIO_DOCLING_SECRET_KEY}
      MINIO_BUCKET_LANGFUSE: ${MINIO_BUCKET_LANGFUSE}
      MINIO_LANGFUSE_ACCESS_KEY: ${MINIO_LANGFUSE_ACCESS_KEY}
      MINIO_LANGFUSE_SECRET_KEY: ${MINIO_LANGFUSE_SECRET_KEY}
      MINIO_BUCKET_MLFLOW: ${MINIO_BUCKET_MLFLOW}
      MINIO_MLFLOW_ACCESS_KEY: ${MINIO_MLFLOW_ACCESS_KEY}
      MINIO_MLFLOW_SECRET_KEY: ${MINIO_MLFLOW_SECRET_KEY}
      MINIO_BUCKET_LABEL_STUDIO: ${MINIO_BUCKET_LABEL_STUDIO}
      MINIO_LABEL_STUDIO_ACCESS_KEY: ${MINIO_LABEL_STUDIO_ACCESS_KEY}
      MINIO_LABEL_STUDIO_SECRET_KEY: ${MINIO_LABEL_STUDIO_SECRET_KEY}
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE}
      MINIO_BUCKET_ICEBERG_JARS: ${MINIO_BUCKET_ICEBERG_JARS}
      MINIO_BUCKET_ICEBERG_CHECKPOINTS: ${MINIO_BUCKET_ICEBERG_CHECKPOINTS}
      MINIO_BUCKET_ICEBERG_LANDING: ${MINIO_BUCKET_ICEBERG_LANDING}
      MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
      MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
    volumes:
      - ./init/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    networks:
      - backend-network

volumes:
  minio-data:
    name: ${PROJECT_NAME}-minio-data
    driver: local
