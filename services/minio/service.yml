# services/minio/service.yml — MinIO (S3-compatible artifact storage)
#
# Artifact-tier object storage complementing Supabase Storage. Each built-in
# consumer receives pre-provisioned buckets and a scoped service-account
# credential. minio-init runs `mc`
# commands idempotently to create buckets + IAM policies on every start.
name: minio
label: "MinIO (S3-compatible object storage)"
category: data
docs: services/minio/README.md

capabilities:
  - name: "S3-compatible artifact storage"
    status: supported
    verification: tested
    note: "Atlas exposes the MinIO S3 API and console directly and through Kong for in-stack artifacts, lakehouse data, traces, models, and backups."
  - name: "Scoped consumer bucket provisioning"
    status: supported
    verification: tested
    note: "The idempotent init service creates built-in and declared extra-consumer buckets, policies, and service-account credentials with scoped access."
  - name: "Highly available storage lifecycle controls"
    status: not-supported
    verification: documented
    note: "The stock single-node deployment configures no replication, object versioning, lifecycle retention, or server-side encryption policy."

# Extra Kong hostname for the S3 API (port 9000), distinct from the console
# row's minio.localhost (port 9001). Lets external s3-compatible tools use a
# stable friendly host instead of the BASE_PORT-derived port. The route is
# emitted by kong_config_generator.generate_minio_s3_service(); --setup-hosts
# wires s3.minio.localhost via Topology.aliases.
extra_kong_aliases:
  - s3.minio.localhost

containers:
  - minio
  - minio-init

images:
  - var: MINIO_IMAGE
    default: "pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46"
    container: minio
    notes: "Silo, the Pigsty-maintained AGPL fork of the archived MinIO community server, pinned by tag and multi-arch digest. It keeps the MINIO_* environment, /minio/* routes, mc admin API and on-disk format. Its entrypoint maps `server` to `silo server`, so the compose command is unchanged. It carries the bounded S3 Select CSV reader fix for CVE-2026-39414. Review upstream security advisories before bumping."
  - var: MINIO_INIT_IMAGE
    default: "pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd"
    container: minio-init

sources:
  var: MINIO_SOURCE
  default: container
  options:
    - id: container
      label: "Container (S3-compatible object storage)"
    - id: disabled
      label: "Disabled"

env:
  - name: MINIO_SOURCE
    description: "MinIO deployment source: container or disabled."
    default: container
  - name: MINIO_PORT
    # default computed by services/topology.py slot allocator
    description: "Host port for the MinIO S3 API (in-container listen port is 9000)."
  - name: MINIO_CONSOLE_PORT
    # default computed by services/topology.py slot allocator
    description: "Host port for the MinIO admin console (in-container listen port is 9001)."
  - name: MINIO_ROOT_USER
    description: "MinIO root username. minio-init, airflow and backup also receive it; consumer services use their own scoped access keys."
    default: minioadmin
  - name: MINIO_ROOT_PASSWORD
    default: ""
    secret: true
    description: "Auto-generated by bootstrapper KeyGenerator.generate_minio_root_password()."
  - name: MINIO_REGION
    description: "S3 region MinIO reports. Clients such as iceberg-rest, jupyterhub, langfuse, label-studio and the asset services use it as their S3 region."
    default: us-east-1
  - name: MINIO_INIT_SOURCE
    default: container
    description: "Auto-managed by minio. Container/disabled."
  - name: MINIO_SCALE
    description: "Set by ./start.sh from MINIO_SOURCE; do not edit. 1 runs the minio container, 0 does not."
    auto_managed: true
  - name: MINIO_INIT_SCALE
    description: "Set by ./start.sh from MINIO_SOURCE; do not edit. 1 runs the minio-init container, 0 does not."
    auto_managed: true
  - name: MINIO_ENDPOINT
    auto_managed: true
    description: "In-network URL (S3 API)."
  - name: MINIO_PUBLIC_ENDPOINT
    auto_managed: true
    description: "Host-side URL (for browser redirects)."
  - name: MINIO_PUBLIC_CONSOLE_ENDPOINT
    description: "Derived by ./start.sh; do not set. Host URL of the MinIO console (http://localhost:${MINIO_CONSOLE_PORT}), empty when disabled. Passed to MinIO as MINIO_BROWSER_REDIRECT_URL."
    auto_managed: true
  - name: MINIO_EXTRA_CONSUMERS
    default: ""
    description: "Optional space-separated parent-owned MinIO entries using CONSUMER:BUCKET_VAR:ACCESS_VAR:SECRET_VAR[:RW_BUCKET_VAR,...[:RO_BUCKET_VAR,...]] grammar for services/_user overlays."
  - name: MINIO_BUCKET_ASSET_INPUTS
    default: raw-assets
    description: "Shared input bucket for the Asset Worker and Asset Baker scoped service accounts."
  - name: MINIO_ASSET_INGEST_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for writing shared raw asset inputs."
  - name: MINIO_ASSET_INGEST_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for writing shared raw asset inputs."
  - name: MINIO_ASSET_WORKER_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for Asset Worker input and output buckets."
  - name: MINIO_ASSET_WORKER_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for Asset Worker input and output buckets."
  - name: MINIO_ASSET_BAKER_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for Asset Baker input and output buckets."
  - name: MINIO_ASSET_BAKER_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for Asset Baker input and output buckets."
  # Per-consumer buckets + scoped service accounts.
  # Each access/secret key is auto-generated by KeyGenerator.generate_minio_access_key()
  # and generate_minio_secret_key(). The bucket NAMES are user-configurable.
  - name: MINIO_BUCKET_COMFYUI
    description: "Bucket minio-init creates for the comfyui service account."
    default: comfyui
  - name: MINIO_COMFYUI_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the comfyui bucket."
  - name: MINIO_COMFYUI_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the comfyui bucket."
  - name: MINIO_BUCKET_BACKEND
    description: "Bucket minio-init creates for the backend service account."
    default: backend
  - name: MINIO_BACKEND_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the backend bucket."
  - name: MINIO_BACKEND_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the backend bucket."
  - name: MINIO_BUCKET_N8N
    description: "Bucket minio-init creates for the n8n service account."
    default: n8n
  - name: MINIO_N8N_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the n8n bucket."
  - name: MINIO_N8N_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the n8n bucket."
  - name: MINIO_BUCKET_JUPYTER
    description: "Bucket minio-init creates for the jupyter service account, which can also read the Iceberg lakehouse bucket."
    default: jupyter
  - name: MINIO_JUPYTER_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the jupyter bucket."
  - name: MINIO_JUPYTER_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the jupyter bucket."
  - name: MINIO_BUCKET_SPARK_HISTORY
    default: spark-history
    description: "Spark event-log bucket used by Zeppelin and the Spark History Server."
  - name: MINIO_SPARK_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for Spark event logs and lakehouse workflow buckets."
  - name: MINIO_SPARK_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for Spark event logs and lakehouse workflow buckets."
  - name: MINIO_BUCKET_DOCLING
    description: "Bucket minio-init creates for the docling service account."
    default: docling
  - name: MINIO_DOCLING_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the docling bucket."
  - name: MINIO_DOCLING_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the docling bucket."
  - name: MINIO_BUCKET_LANGFUSE
    description: "Bucket minio-init creates for the langfuse service account. Langfuse uses it for event, media and batch-export uploads."
    default: langfuse
  - name: MINIO_LANGFUSE_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the langfuse bucket."
  - name: MINIO_LANGFUSE_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the langfuse bucket."
  - name: MINIO_BUCKET_MLFLOW
    description: "Bucket minio-init creates for the mlflow service account. MLflow stores run artifacts in it."
    default: mlflow
  - name: MINIO_MLFLOW_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the mlflow bucket."
  - name: MINIO_MLFLOW_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the mlflow bucket."
  - name: MINIO_BUCKET_LABEL_STUDIO
    description: "Bucket minio-init creates for the label-studio service account. Label Studio uses it as its storage bucket."
    default: label-studio
  - name: MINIO_LABEL_STUDIO_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the label-studio bucket."
  - name: MINIO_LABEL_STUDIO_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the label-studio bucket."
  - name: MINIO_BUCKET_ICEBERG_LAKEHOUSE
    description: "Iceberg warehouse bucket. The iceberg and spark service accounts can write it; the jupyter account can read it."
    default: lakehouse
  - name: MINIO_BUCKET_ICEBERG_JARS
    description: "Jar bucket for Spark jobs. The spark and iceberg service accounts can write it; Airflow and Jenkins receive its name."
    default: jars
  - name: MINIO_BUCKET_ICEBERG_CHECKPOINTS
    description: "Checkpoint bucket. The spark and iceberg service accounts can write it; Zeppelin and JupyterHub receive its name."
    default: checkpoints
  - name: MINIO_BUCKET_ICEBERG_LANDING
    description: "Landing bucket. The spark and iceberg service accounts can write it; Airflow, Zeppelin and JupyterHub receive its name."
    default: landing
  - name: MINIO_ICEBERG_ACCESS_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO access key for the Iceberg lakehouse buckets."
  - name: MINIO_ICEBERG_SECRET_KEY
    default: ""
    secret: true
    description: "Auto-generated scoped MinIO secret key for the Iceberg lakehouse buckets."

depends_on:
  # ORDERING-ONLY: the compose fragment has no supabase depends_on and
  # minio-init only talks to minio. The entry stays because the topology
  # slot allocator derives port positions from depends_on — dropping it
  # would renumber later slots and break existing .env files. Treat as
  # display/slot pinning, not a runtime dependency.
  required:
    - supabase
  optional: []

rows:
  # Wizard / overview row points at MINIO_CONSOLE_PORT because the
  # `minio.localhost` alias routes to the admin console (port 9001
  # in-container, MINIO_CONSOLE_PORT host-side). The S3 API has its own
  # `s3.minio.localhost` alias (see extra_kong_aliases); S3 clients can
  # also use the direct MINIO_PORT.
  - display_name: "MinIO Console"
    source_var: MINIO_SOURCE
    port_var: MINIO_CONSOLE_PORT
    scale_var: MINIO_SCALE
    alias: minio.localhost
    description: "S3-compatible artifact storage (admin console)."

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  minio:
    container:
      scale: 1
      environment:
        MINIO_ENDPOINT: http://minio:9000
        MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT}
        MINIO_PUBLIC_CONSOLE_ENDPOINT: http://localhost:${MINIO_CONSOLE_PORT}
        MINIO_PROMETHEUS_AUTH_TYPE: 'public'
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        MINIO_ENDPOINT: ''
        MINIO_PUBLIC_ENDPOINT: ''
        MINIO_PUBLIC_CONSOLE_ENDPOINT: ''
      deploy: {}
      extra_hosts: []
  minio-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

runtime_deps:
  minio:
    requires: []
    optional: []

data_flow:
  calls: []

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
