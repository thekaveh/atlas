# services/kong/compose.yml — Kong API gateway
services:
  kong-api-gateway:
    container_name: ${PROJECT_NAME}-kong-api-gateway
    image: ${KONG_API_GATEWAY_IMAGE}
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${KONG_HTTP_PORT}:8000/tcp"
      - "${HOST_BIND_IP-127.0.0.1:}${KONG_HTTPS_PORT}:8443/tcp"
    expose:
      # Kong Status API + /metrics endpoint (Prometheus plugin). Not
      # mapped to a host port — only the in-network Prometheus container
      # scrapes it.
      - "8100"
    volumes:
      - ../../volumes/api/kong-dynamic.yml:/home/kong/kong.yml:ro,z
    depends_on:
      redis:
        condition: service_started
      supabase-auth:
        condition: service_started
      supabase-api:
        condition: service_started
      supabase-realtime:
        condition: service_started
      supabase-storage:
        condition: service_started
      supabase-meta:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      # Host->container port map, so X-Forwarded-Port (and every upstream
      # that builds absolute URLs from it, e.g. Trino's redirects and query
      # nextUri) carries the published port instead of 8000.
      KONG_PORT_MAPS: "${KONG_HTTP_PORT:-63000}:8000,${KONG_HTTPS_PORT:-63001}:8443"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      # Tight DNS retry/TTL settings so Kong recovers fast when a
      # service container is restarted (or comes up after Kong). The
      # default ``KONG_DNS_NOT_FOUND_TTL=30s`` means Kong caches a
      # "not-found" verdict for 30 seconds — long enough that an
      # active websocket retry loop (e.g. an open Open WebUI tab
      # reconnecting during ./start.sh) floods the log with DNS
      # errors for ~half a minute every restart. Dropping to 1s keeps
      # the noise window at 1-2 retries and recovery is immediate
      # once the upstream container is registered in the Docker DNS.
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_DNS_STALE_TTL: "4"
      # ``pre-function`` is bundled with Kong OSS but disabled by default.
      # We allowlist it so ``kong_config_generator.py`` can use it to
      # auto-redirect ``http://litellm.localhost:${KONG_HTTP_PORT}/`` to
      # ``/ui/`` (LiteLLM's admin dashboard lives at /ui/; the proxy
      # root serves Swagger). Lua snippet lives next to the route.
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,rate-limiting,pre-function,prometheus,request-termination
      # Expose the Kong Status API on 8100 so Prometheus can scrape /metrics
      # via the in-cluster `kong-api-gateway:8100` upstream (the compose
      # service id; `kong` alone does not resolve on backend-network).
      # The Status API is internal-only (not mapped to a host port) —
      # only services on the backend-network can reach it.
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      # Browser WebSocket clients may pass plugin credentials in the query
      # string. Use the path-only $uri in a named format so Kong never writes
      # query credentials (or any other query parameters) to proxy access logs.
      # nginx's error log still records the full request line (query string
      # included) when an upstream fails, e.g. during restarts.
      # One quoted string: nginx concatenates split format strings with no
      # separator, which fused protocol, status and size into one token.
      KONG_NGINX_HTTP_LOG_FORMAT: >-
        atlas '$$request_method $$uri $$server_protocol $$status
        $$body_bytes_sent "$$http_user_agent" $$kong_request_id'
      KONG_PROXY_ACCESS_LOG: /dev/stdout atlas
      # SSE-compatible settings
      KONG_NGINX_PROXY_PROXY_BUFFERING: "off"
      KONG_NGINX_PROXY_PROXY_CACHE: "off"
      KONG_NGINX_PROXY_CHUNKED_TRANSFER_ENCODING: "on"
      KONG_NGINX_PROXY_TCP_NOPUSH: "on"
      KONG_NGINX_PROXY_TCP_NODELAY: "on"
      KONG_NGINX_PROXY_KEEPALIVE_TIMEOUT: "300"
      # Proxy read/write timeouts are per service in the generated
      # kong-dynamic.yml (300s default, KongConfigGenerator); Kong 3.x has no
      # global KONG_PROXY_*_TIMEOUT setting. Retry only on connection errors
      # (restarts), not on timeouts (connect/send/read): with Kong's 5 retries a wedged
      # single-container upstream otherwise held an idempotent request for
      # 6 x 300s = 30 minutes.
      KONG_NGINX_PROXY_PROXY_NEXT_UPSTREAM: error
      # No Redis or Supabase/dashboard secrets here: kong_config_generator
      # writes the real credentials into kong-dynamic.yml, Kong reads none of
      # these from its environment, and the rate limiter uses policy: local.
    extra_hosts:
      # Kong proxies several aliases (comfyui.localhost, ollama.localhost,
      # graph.localhost, etc.) to host-installed services via
      # ``host.docker.internal``. Docker Desktop maps this automatically;
      # Linux Docker needs the explicit host-gateway entry (bootstrapper
      # fills HOST_GATEWAY_IP with "host-gateway" or the bridge IP for
      # rootless setups).
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    healthcheck:
      # `kong health` is the official Kong-OSS built-in CLI command — exits
      # 0 when the local Kong instance has bound its proxy port and is
      # serving traffic; nonzero otherwise. Cheap and doesn't depend on
      # extra tools (curl/wget) being in the image. Downstream services
      # currently use `service_started` for Kong; with this healthcheck
      # in place they can opt into `service_healthy` for tighter ordering
      # if a future cold-start race ever appears.
      test: ["CMD-SHELL", "kong health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network
