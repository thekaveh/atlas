# services/kong/service.yml — Kong API gateway
name: kong
label: "Kong (API gateway)"
category: infra
docs: services/kong/README.md

capabilities:
  - name: "SOURCE-aware dynamic gateway routing"
    status: supported
    verification: tested
    note: "The bootstrapper generates DB-less Kong routes for enabled container and localhost sources, including service-specific upstream paths and health contracts."
  - name: "Route authentication and traffic policy"
    status: partial
    verification: tested
    note: "Atlas applies Basic, key-auth, pass-through, rate-limit, and CORS policies per route, but it does not enforce one uniform identity policy across every upstream."
  - name: "Direct Compose startup from a clean checkout"
    status: not-supported
    verification: documented
    note: "Kong requires the declarative configuration generated by the Atlas startup pipeline, so operators must use ./start.sh before Compose can launch the gateway."

containers:
  - kong-api-gateway

images:
  - var: KONG_API_GATEWAY_IMAGE
    default: "kong:3.9.3"
    container: kong-api-gateway

env:
  - name: KONG_API_GATEWAY_SOURCE
    default: container
    description: "Single-option (container only)."
  - name: KONG_HTTP_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: KONG_HTTPS_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: DASHBOARD_USERNAME
    default: kong_admin
  - name: DASHBOARD_PASSWORD
    default: kong_password
    secret: true
    description: "Auto-generated on first ./start.sh when left at the placeholder (rotate-when-absent, like MINIO_ROOT_PASSWORD). Gates the Kong-routed Studio dashboard via basic-auth."

depends_on:
  # Kong is a proxy — it does not need its upstream targets to be UP to start
  # serving traffic. Only Supabase (config storage) + Redis (rate-limit state)
  # are real bootstrap blockers. The proxy targets (open-webui, n8n, backend,
  # …) are listed in data_flow.calls below, which is the correct abstraction
  # for "what does Kong route to" and drives the architecture diagram.
  required:
    - supabase
    - redis
  optional: []

exports: []

rows:
  - display_name: "Kong API Gateway"
    source_var: KONG_API_GATEWAY_SOURCE
    port_var: KONG_HTTP_PORT
    description: "Edge gateway routing *.localhost aliases."

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  kong-api-gateway:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []

# data_flow.calls for Kong uses the PROXY direction by convention:
# Kong doesn't initiate outbound calls itself — it forwards inbound traffic
# to these backends. Listing them here produces a diagram where Kong is
# correctly shown as the front door for everything it routes to.
data_flow:
  calls:
    - backend
    - open-webui
    - jupyterhub
    - n8n
    - hermes
    - openclaw
    - local-deep-researcher
    - minio
    - supabase
    - weaviate
    - neo4j
    - comfyui
    - searxng
    - stt-provider
    - tts-provider
    - doc-processor
    - litellm
    - ollama
    - airflow
    - spark
    - lightrag
    - tei-reranker
    - verba
    # Additional SOURCE-gated routes the generator emits (kong_config_generator.py)
    # — each fronts its <alias>.localhost host when the service is enabled.
    - trino
    - redpanda
    - tika
    - crawl4ai
    - langfuse
    - mlflow
    - label-studio
    - jenkins
    - llm-graph-builder
    - mcp-servers
    - celery
    - asset-baker
    - asset-worker
    # Observability routes (kong_config_generator.py:206-212, 932) — Kong
    # fronts grafana.localhost / prometheus.localhost / ray.localhost
    # when each service is enabled.
    - grafana
    - prometheus
    - ray
