# services/backend/service.yml — FastAPI backend (always-on adaptive)
name: backend
label: "Backend API (FastAPI)"
category: apps
docs: services/backend/README.md

containers:
  - backend

images:
  - var: BACKEND_IMAGE
    default: "python:3.12.13"
    container: backend

env:
  - name: BACKEND_SOURCE
    default: container
    description: "Adaptive core service; always container. Single-option."
  - name: BACKEND_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: BACKEND_SCALE
    auto_managed: true
    description: "Always 1 (BACKEND_SOURCE is single-valued)."
  - name: MAX_UPLOAD_BYTES
    default: 104857600
    description: "Maximum accepted /storage/upload body size in bytes before the backend returns 413."
  - name: COMFYUI_MAX_IMAGE_BYTES
    default: 20971520
    description: "Maximum generated-image response bytes accepted from ComfyUI before the Backend aborts the download."
  - name: COMFYUI_COMPLETION_TIMEOUT_SECONDS
    default: 300
    description: "End-to-end deadline in seconds for synchronous ComfyUI generation and workflow requests. The Backend poller and bundled Open WebUI tool share this default."
  - name: RAG_INGESTION_MAX_FILE_BYTES
    default: 104857600
    description: "Maximum bytes loaded from any single mounted or MinIO RAG corpus file. Oversize files fail ingestion before unbounded allocation."
  - name: RAG_INGESTION_MAX_CORPUS_BYTES
    default: 1073741824
    description: "Maximum aggregate bytes loaded by one RAG corpus discovery pass across mounted or MinIO files."
  - name: RAG_INGESTION_MAX_FILES
    default: 10000
    description: "Maximum number of files accepted in one mounted or MinIO RAG corpus discovery pass."
  - name: RAG_INGESTION_CORPUS_ROOT
    default: /app/corpus
    description: "Container path under which operator-provided read-only RAG corpus mounts are resolved. Mount the same path into Backend and Celery worker when asynchronous ingestion is enabled."
  - name: RAG_INGESTION_EXECUTION_LEASE_SECONDS
    default: 30
    description: "Renewable execution-ownership lease for RAG ingestion workers. Must be an integer from 10 through 300; duplicate deliveries retry until the active owner completes or its lease expires."
  - name: RESEARCH_SESSION_LEASE_SECONDS
    default: 300
    description: "Maximum age in seconds for pending research work or a running session heartbeat before the Backend atomically marks the abandoned session failed."
  - name: BACKEND_STORAGE_ALLOWED_BUCKETS
    default: default
    description: "Comma-separated Supabase Storage bucket allowlist accepted by /storage/upload."
  - name: BACKEND_MEDIA_INPUT_BUCKET
    default: default
    description: "Atlas storage bucket the media gateway hosts image_to_3d inputs in when a provider (e.g. Tripo) rejects data-URI inputs. Objects are written under the media-inputs/ prefix."
  - name: BACKEND_MEDIA_INPUT_PUBLIC_BASE_URL
    default: ""
    description: "Optional public base URL for hosted media inputs. When set, hosted image_to_3d input URLs are formed as <base>/<bucket>/<key> so the provider's cloud can fetch them through a reachable ingress; empty falls back to the storage client's public URL."
  - name: MEDIA_REQUEST_MAX_BYTES
    default: 41943040
    description: "Maximum POST /media/generate request body size in bytes. Oversized declared and streamed bodies are rejected with HTTP 413 before route parsing."
  - name: MEDIA_INPUT_MAX_BYTES
    default: 26214400
    description: "Maximum decoded image data-URI size in bytes, including conditioned output. Oversized base64 payloads are rejected before decoding."
  - name: MEDIA_INPUT_MAX_PIXELS
    default: 40000000
    description: "Maximum decoded or conditioned image pixel count. Dimensions are checked before full Pillow conversion to bound decompression and canvas memory."
  - name: MEDIA_BUDGET_ENABLED
    default: false
    description: "Enables the media-gateway spend ledger + budget enforcement (#342). Disabled by default: when off, the gateway records no ledger rows and enforces no caps."
  - name: MEDIA_BUDGET_STORE
    default: postgres
    description: "Ledger store backend: 'postgres' (durable, media_spend_ledger table) or 'memory' (process-local, non-durable — testing/ephemeral). Only used when MEDIA_BUDGET_ENABLED=true."
  - name: MEDIA_BUDGET_CURRENCY
    default: USD
    description: "Currency label recorded on media spend ledger rows."
  - name: MEDIA_BUDGET_DEFAULT_USD
    default: ""
    description: "Default per-consumer/project spend cap in USD. Empty = no default cap (ledger records without hard-stop). Per-consumer overrides go in MEDIA_BUDGET_CONSUMER_CAPS."
  - name: MEDIA_BUDGET_CONSUMER_CAPS
    default: ""
    description: "Optional JSON map of per-scope caps, keyed by 'consumer' or 'consumer:project', e.g. {\"rag-showcase\":25,\"rag-showcase:demo\":5}. Overrides MEDIA_BUDGET_DEFAULT_USD for matching scopes."
  - name: MEDIA_DISABLED_PROVIDERS
    default: ""
    description: "Comma-separated media providers to kill-switch off (e.g. 'fal'). A disabled provider hard-stops its own submissions without downing the gateway or other providers."
  - name: MEDIA_BUDGET_ALLOW_UNKNOWN_COST
    default: false
    description: "When false (default), a budgeted submission for a model with no known cost is rejected rather than billed an unknown amount (never silently $0). Set true to allow unknown-cost submissions under a cap."
  - name: MEDIA_BUDGET_RETENTION_DAYS
    default: ""
    description: "Optional retention window in days for media spend ledger rows; empty keeps rows indefinitely. Pruning is invoked on demand via the budget engine."
  - name: MEDIA_OPERATION_TTL_SECONDS
    default: 604800
    description: "Redis retention in seconds for hosted media operation state. The default keeps terminal results available for seven days across Backend replicas and restarts."
  - name: BACKEND_CORS_ORIGINS
    default: "*"
    description: "Comma-separated browser origins accepted by the backend CORS middleware. Default preserves local-development permissiveness."
  - name: BACKEND_CORS_ALLOW_ORIGIN_REGEX
    default: ""
    description: "Optional regex accepted by the backend CORS middleware for wildcard subdomain policies."
  - name: BACKEND_DEV_RELOAD
    default: false
    description: "Opt-in uvicorn --reload for live development (#679). Disabled by default so the production/consumer image runs a stable process: with backend_plugins bind-mounted, host-side git churn in the plugin tree would otherwise restart or crash-loop the backend. The plugin seam installs at boot, so recreate the backend to apply plugin changes."
  - name: BACKEND_KONG_AUTH
    default: disabled
    description: "Default gateway authentication mode for the api.localhost backend route: disabled (default local-dev behavior) or key-auth (requires apikey header). A backend plugin's plugin.yml `auth: open|key-auth` overrides this per route prefix (#402)."
  - name: BACKEND_KONG_API_KEY
    default: ""
    secret: true
    description: "Auto-generated key accepted by Kong when BACKEND_KONG_AUTH=key-auth. Send as `apikey: <value>`."
  - name: BACKEND_IDENTITY_AUTH
    default: required
    description: "Application identity boundary for backend routes: required (default) accepts Supabase user JWTs or the trusted internal-service token; disabled is an explicit emergency rollback mode."
  - name: BACKEND_INTERNAL_API_TOKEN
    default: ""
    secret: true
    description: "Auto-generated full-operator bearer token. Reserve for trusted administration; first-party services use narrower caller tokens."
  - name: BACKEND_N8N_API_TOKEN
    default: ""
    secret: true
    description: "Auto-generated n8n bearer accepted only by the research, memory-automation, legacy ComfyUI, and storage-upload routes used by bundled workflows."
  - name: BACKEND_NOTEBOOK_API_TOKEN
    default: ""
    secret: true
    description: "Auto-generated bearer token exposed to JupyterHub and accepted only by stateless backend document extraction, chunking, and RAG evaluation routes."
  - name: BACKEND_OPEN_WEBUI_API_TOKEN
    default: ""
    secret: true
    description: "Auto-generated Open WebUI bearer accepted only by memory and legacy ComfyUI routes used by bundled server-side tools and functions."
  - name: BACKEND_PLUGINS_PIP_TIMEOUT_SECONDS
    default: 300
    description: "Timeout in seconds for `pip install` of backend plugin requirements (plugin_seam) at startup. The install runs at backend import time, so an unbounded hang would block startup; raise for slow networks."
  - name: BACKEND_PLUGINS_SITE_DIR
    default: /tmp/atlas-plugins-site
    description: "Writable directory the plugin seam pip-installs plugin requirements into (`pip --target`) and prepends to sys.path before plugin imports (#559). The image runs as appuser with root-owned site-packages, so untargeted installs fail with EACCES even though appuser has a writable home/cache for runtime dependencies. Must be creatable by the backend user; falls back to untargeted pip install when it cannot be created."
  - name: LANGMEM_ENABLED
    default: true
  - name: LANGMEM_MEMORY_NAMESPACE
    default: default
  - name: LANGMEM_AUTO_CONSOLIDATE
    default: true
    description: |
      Reserved — not yet honored. Memory consolidation currently runs only
      on demand via POST /memory/consolidate; there is no background
      scheduler, so changing this value has no effect today.
  - name: LANGMEM_CONSOLIDATION_INTERVAL
    default: 86400
    description: |
      Reserved — not yet honored (see LANGMEM_AUTO_CONSOLIDATE). Interval in
      seconds a future auto-consolidation scheduler would use.
  - name: LANGMEM_MAX_FACTS_PER_USER
    default: 1000
  - name: LANGMEM_EXTRACTION_MODEL
    default: ""
    description: "LiteLLM model id (empty = highest-priority active content model resolved by model_resolver from YAML catalogs + env)."
  - name: LANGMEM_EMBEDDING_MODEL
    default: ""
  - name: GRAPHITI_ENABLED
    default: false
    description: "Disabled-by-default backend-only Graphiti temporal graph memory experiment. Does not expose Graphiti to agents or run a Graphiti service."
  - name: GRAPHITI_GROUP_ID_PREFIX
    default: atlas
    description: "Prefix for backend Graphiti group_id values. Final shape: atlas:<project>:backend:<namespace>:user:<uuid>."
  - name: GRAPHITI_DEFAULT_NAMESPACE
    default: langmem
    description: "Default backend Graphiti namespace segment used when projecting selected LangMem facts/events."
  - name: GRAPHITI_LLM_MODEL
    default: ""
    description: "Optional LiteLLM model id for Graphiti extraction. Empty falls back to LANGMEM_EXTRACTION_MODEL, then LITELLM_DEFAULT_MODEL."
  - name: GRAPHITI_EMBEDDING_MODEL
    default: ""
    description: "Optional LiteLLM embedding model id for Graphiti. Empty falls back to LANGMEM_EMBEDDING_MODEL, then LITELLM_EMBEDDING_MODEL."
  - name: GRAPHITI_EXPOSE_TO_AGENTS
    default: false
    description: "Must remain false for this backend-only evaluation; Hermes/OpenClaw exposure and Graphiti MCP are deferred."
  - name: RAGAS_EVALUATOR_MODEL
    default: ""
    description: "Optional LiteLLM model id for Backend Ragas evaluation. Empty falls back to LITELLM_DEFAULT_MODEL."
  - name: RAGAS_EMBEDDINGS_MODEL
    default: ""
    description: "Optional LiteLLM embedding model id for Backend Ragas answer-relevancy evaluation. Empty falls back to LITELLM_EMBEDDING_MODEL."
  - name: RAY_JOB_API_TOKEN
    default: ""
    secret: true
    description: "Auto-generated bearer token required by every /api/ray/* route. Send as Authorization: Bearer <value>."
  - name: LIGHTRAG_RERANK_ADAPTER_ENABLED
    default: "false"
    description: "Opt-in for the backend LightRAG rerank adapter route (POST /lightrag/rerank, #415). When true AND TEI_RERANKER_SOURCE is enabled, the bootstrapper wires LightRAG's rerank binding to the adapter and consumer query profiles may set enable_rerank=true. Default false keeps direct LightRAG->TEI rerank disabled (payload shapes are incompatible)."
  - name: LIGHTRAG_RERANK_ADAPTER_TOKEN
    default: ""
    secret: true
    description: "Auto-generated bearer token guarding the /lightrag/rerank adapter route. Handed to LightRAG as RERANK_BINDING_API_KEY so the two share one secret. Send as `Authorization: Bearer <value>`."
  - name: LIGHTRAG_RERANK_ADAPTER_TIMEOUT_SECONDS
    default: 30
    description: "Finite per-request timeout in seconds for /lightrag/rerank calls to TEI. Must be greater than 0 and no greater than 3600; invalid values fail Backend startup."

depends_on:
  # Mirrors services/backend/compose.yml. LiteLLM is gated on service_healthy
  # in compose because backend's startup performs first-call probes against
  # it; Weaviate-init must finish so configure-backend.sh can read the shared
  # config file; Kong is reachable but soft (proxy retries handle the race).
  required:
    - supabase
    - redis
    - litellm
  optional:
    - weaviate
    - kong
    - celery
    - supavisor

rows:
  - display_name: "Backend API"
    source_var: BACKEND_SOURCE
    port_var: BACKEND_PORT
    scale_var: BACKEND_SCALE
    alias: api.localhost
    description: "FastAPI backend (always-on adaptive)."

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_adaptive:
  backend:
    adapts_to:
    - llm_provider
    - weaviate
    - stt_provider
    - tts_provider
    - doc_processor
    - tika
    - ray
    - lightrag
    - supavisor
    - otel-collector
    environment_adaptation:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      WEAVIATE_URL: http://weaviate:8080
      STT_ENDPOINT: ${STT_ENDPOINT}
      TTS_ENDPOINT: ${TTS_ENDPOINT}
      DOCLING_ENDPOINT: ${DOCLING_ENDPOINT}
      TIKA_ENDPOINT: ${TIKA_ENDPOINT}
      RAY_ADDRESS: ${RAY_ADDRESS}
      RAGAS_EVALUATOR_MODEL: ${RAGAS_EVALUATOR_MODEL}
      RAGAS_EMBEDDINGS_MODEL: ${RAGAS_EMBEDDINGS_MODEL}
      LIGHTRAG_ENDPOINT: ${LIGHTRAG_ENDPOINT}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      OTEL_COLLECTOR_ENDPOINT: ${OTEL_COLLECTOR_ENDPOINT}
    extra_hosts_adaptation: inherit from llm_provider

runtime_deps:
  backend:
    optional:
    - neo4j-graph-db
    - searxng
    - n8n
    - weaviate
    - parakeet
    - speaches
    - chatterbox
    - docling
    - tika
    - celery
    info_message: Backend enabled - will connect to available optional services (neo4j,
      searxng, n8n, weaviate, parakeet, speaches, chatterbox, docling, tika, celery, supavisor)

data_flow:
  calls:
    - supabase
    - weaviate
    - litellm
    - comfyui
    - fal
    - n8n
    - ray
    - local-deep-researcher
    - celery
    - supavisor
    - tika
    - docling
    - lightrag
    - tei-reranker
    - minio
    - redis
    - otel-collector
