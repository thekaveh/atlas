# services/backend/compose.yml — FastAPI backend
services:
  backend:
    build:
      context: ./app
      args:
        BASE_IMAGE: ${BACKEND_IMAGE}
    container_name: ${PROJECT_NAME}-backend
    restart: unless-stopped
    deploy:
      replicas: ${BACKEND_SCALE:-1}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      supabase-storage:
        condition: service_started
      supabase-realtime:
        condition: service_started
      kong-api-gateway:
        condition: service_started
      litellm:
        condition: service_healthy
      supavisor:
        condition: service_healthy
        required: false
      # Wait for weaviate-init to write /shared/weaviate-config.env
      # before configure-backend.sh tries to source it. Without this,
      # backend starts in parallel with weaviate-init, finds the file
      # missing, and logs ``Warning - No dynamic Weaviate configuration
      # found`` plus a fallback embedding model — fine for most flows,
      # but masks a real race where the LITELLM_EMBEDDING_MODEL the
      # backend ends up using disagrees with what Weaviate eventually
      # gets configured with.
      weaviate-init:
        condition: service_completed_successfully
        required: false
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      KONG_URL: http://kong-api-gateway:8000
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      COMFYUI_MAX_IMAGE_BYTES: ${COMFYUI_MAX_IMAGE_BYTES:-20971520}
      COMFYUI_INIT_IMAGE_TRUSTED_ORIGINS: ${COMFYUI_INIT_IMAGE_TRUSTED_ORIGINS:-}
      COMFYUI_COMPLETION_TIMEOUT_SECONDS: ${COMFYUI_COMPLETION_TIMEOUT_SECONDS:-300}
      RAG_INGESTION_MAX_FILE_BYTES: ${RAG_INGESTION_MAX_FILE_BYTES:-104857600}
      RAG_INGESTION_MAX_CORPUS_BYTES: ${RAG_INGESTION_MAX_CORPUS_BYTES:-1073741824}
      RAG_INGESTION_MAX_FILES: ${RAG_INGESTION_MAX_FILES:-10000}
      RAG_INGESTION_CORPUS_ROOT: ${RAG_INGESTION_CORPUS_ROOT:-/app/corpus}
      CHONKIE_SEMANTIC_EMBEDDING_MODEL: ${CHONKIE_SEMANTIC_EMBEDDING_MODEL:-minishlab/potion-base-32M}
      LIGHTRAG_PIPELINE_STATUS_TIMEOUT_SECONDS: ${LIGHTRAG_PIPELINE_STATUS_TIMEOUT_SECONDS:-30}
      RAG_INGESTION_TTL_SECONDS: ${RAG_INGESTION_TTL_SECONDS:-604800}
      RAG_INGESTION_EXECUTION_LEASE_SECONDS: ${RAG_INGESTION_EXECUTION_LEASE_SECONDS:-30}
      BACKEND_STATE_STORE_MODE: ${BACKEND_STATE_STORE_MODE:-redis}
      RESEARCH_SESSION_LEASE_SECONDS: ${RESEARCH_SESSION_LEASE_SECONDS:-300}
      RESEARCH_MAX_CONCURRENT: ${RESEARCH_MAX_CONCURRENT:-4}
      BACKEND_PG_POOL_MIN: ${BACKEND_PG_POOL_MIN:-1}
      BACKEND_PG_POOL_MAX: ${BACKEND_PG_POOL_MAX:-10}
      BACKEND_STORAGE_ALLOWED_BUCKETS: ${BACKEND_STORAGE_ALLOWED_BUCKETS:-default}
      BACKEND_MEDIA_INPUT_BUCKET: ${BACKEND_MEDIA_INPUT_BUCKET:-default}
      BACKEND_MEDIA_INPUT_PUBLIC_BASE_URL: ${BACKEND_MEDIA_INPUT_PUBLIC_BASE_URL:-}
      MEDIA_REQUEST_MAX_BYTES: ${MEDIA_REQUEST_MAX_BYTES:-41943040}
      MEDIA_INPUT_MAX_BYTES: ${MEDIA_INPUT_MAX_BYTES:-26214400}
      MEDIA_INPUT_MAX_PIXELS: ${MEDIA_INPUT_MAX_PIXELS:-40000000}
      MEDIA_BUDGET_ENABLED: ${MEDIA_BUDGET_ENABLED:-false}
      MEDIA_BUDGET_STORE: ${MEDIA_BUDGET_STORE:-postgres}
      MEDIA_BUDGET_CURRENCY: ${MEDIA_BUDGET_CURRENCY:-USD}
      MEDIA_BUDGET_DEFAULT_USD: ${MEDIA_BUDGET_DEFAULT_USD:-}
      MEDIA_BUDGET_CONSUMER_CAPS: ${MEDIA_BUDGET_CONSUMER_CAPS:-}
      MEDIA_DISABLED_PROVIDERS: ${MEDIA_DISABLED_PROVIDERS:-}
      MEDIA_BUDGET_ALLOW_UNKNOWN_COST: ${MEDIA_BUDGET_ALLOW_UNKNOWN_COST:-false}
      MEDIA_BUDGET_RETENTION_DAYS: ${MEDIA_BUDGET_RETENTION_DAYS:-}
      MEDIA_OPERATION_TTL_SECONDS: ${MEDIA_OPERATION_TTL_SECONDS:-604800}
      MEDIA_LEDGER_RECOVERY_BATCH_SIZE: ${MEDIA_LEDGER_RECOVERY_BATCH_SIZE:-100}
      MEDIA_LEDGER_RECOVERY_MAX_CYCLES: ${MEDIA_LEDGER_RECOVERY_MAX_CYCLES:-4}
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-*}"
      BACKEND_CORS_ALLOW_ORIGIN_REGEX: ${BACKEND_CORS_ALLOW_ORIGIN_REGEX:-}
      BACKEND_DEV_RELOAD: ${BACKEND_DEV_RELOAD:-false}
      DATABASE_URL: ${SUPAVISOR_DATABASE_URL:-postgresql://${BACKEND_DB_USER_URI:?BACKEND_DB_USER_URI is required}:${BACKEND_DB_PASSWORD_URI:?BACKEND_DB_PASSWORD_URI is required}@supabase-db:5432/${SUPABASE_DB_NAME_URI:?SUPABASE_DB_NAME_URI is required}}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL:-ollama/nomic-embed-text}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j-graph-db:7687}
      NEO4J_USER: ${GRAPH_DB_USER}
      NEO4J_PASSWORD: ${GRAPH_DB_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      CELERY_SOURCE: ${CELERY_SOURCE:-disabled}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
      CELERY_QUEUE: ${CELERY_QUEUE:-atlas}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-900}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-840}
      CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS:-3600}
      N8N_BASE_URL: http://n8n:5678
      COMFYUI_BASE_URL: ${COMFYUI_ENDPOINT:-http://comfyui:18188}
      COMFYUI_ENABLED: true
      COMFYUI_SOURCE: ${COMFYUI_SOURCE:-disabled}
      COMFYUI_MANIFEST_PATH: /comfyui-manifest/selected-models.yaml
      FAL_SOURCE: ${FAL_SOURCE:-disabled}
      FAL_API_KEY: ${FAL_API_KEY:-}
      FAL_KEY: ${FAL_API_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux/dev}
      FAL_IMAGE_TO_3D_MODEL: ${FAL_IMAGE_TO_3D_MODEL:-fal-ai/trellis}
      FAL_MODEL_LICENSE: ${FAL_MODEL_LICENSE:-fal/provider-terms}
      FAL_TIMEOUT_SECONDS: ${FAL_TIMEOUT_SECONDS:-120}
      FAL_OUTPUT_FORMAT: ${FAL_OUTPUT_FORMAT:-jpeg}
      FAL_ENABLE_SAFETY_CHECKER: ${FAL_ENABLE_SAFETY_CHECKER:-true}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      BACKEND_IDENTITY_AUTH: ${BACKEND_IDENTITY_AUTH:-required}
      BACKEND_INTERNAL_API_TOKEN: ${BACKEND_INTERNAL_API_TOKEN}
      BACKEND_N8N_API_TOKEN: ${BACKEND_N8N_API_TOKEN}
      BACKEND_NOTEBOOK_API_TOKEN: ${BACKEND_NOTEBOOK_API_TOKEN}
      BACKEND_OPEN_WEBUI_API_TOKEN: ${BACKEND_OPEN_WEBUI_API_TOKEN}
      BACKEND_KONG_API_KEY: ${BACKEND_KONG_API_KEY}
      # Plugin-seam knobs (read by plugin_seam.py). Forwarded so operator
      # overrides actually reach the container — the runtime reads them but
      # compose was not injecting them, so they were inert.
      BACKEND_PLUGINS_PIP_TIMEOUT_SECONDS: ${BACKEND_PLUGINS_PIP_TIMEOUT_SECONDS:-300}
      BACKEND_PLUGINS_SITE_DIR: ${BACKEND_PLUGINS_SITE_DIR:-/tmp/atlas-plugins-site}
      # Vector database integration
      WEAVIATE_URL: ${WEAVIATE_URL:-http://weaviate:8080}
      WEAVIATE_ENABLED: true
      # STT/TTS/DOC endpoints (available for future proxy implementation)
      STT_ENDPOINT: ${STT_ENDPOINT}
      TTS_ENDPOINT: ${TTS_ENDPOINT}
      DOCLING_ENDPOINT: ${DOCLING_ENDPOINT}
      DOCLING_API_TOKEN: ${DOCLING_API_TOKEN}
      PARAKEET_API_TOKEN: ${PARAKEET_API_TOKEN}
      TIKA_ENDPOINT: ${TIKA_ENDPOINT:-}
      TIKA_MAX_FILE_SIZE: ${TIKA_MAX_FILE_SIZE:-52428800}
      TIKA_TIMEOUT_SECONDS: ${TIKA_TIMEOUT_SECONDS:-30}
      # Hermes Agent — optional direct path (LiteLLM-routed `hermes-agent`
      # model is the default surface). Empty when HERMES_SOURCE=disabled.
      HERMES_ENDPOINT: ${HERMES_ENDPOINT:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      # LightRAG — graph-augmented RAG endpoint (empty when LIGHTRAG_SOURCE=disabled)
      LIGHTRAG_ENDPOINT: ${LIGHTRAG_ENDPOINT:-}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      # OpenTelemetry tracing — no-op unless ATLAS_OTEL_ENABLED=true and the
      # collector endpoint is populated by the bootstrapper.
      ATLAS_OTEL_ENABLED: ${ATLAS_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT:-}
      OTEL_SERVICE_NAME: backend
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: /metrics,/health,/ready
      # Ray — distributed compute (empty when RAY_SOURCE=disabled). The
      # runtime_adaptive declaration in service.yml writes .env only; this
      # block is the actual injection point (dual-write rule) — without
      # these lines every /api/ray/* route 503'd even with Ray enabled.
      RAY_ADDRESS: ${RAY_ADDRESS:-}
      RAY_DASHBOARD_URL: ${RAY_DASHBOARD_URL:-}
      RAY_JOB_API_TOKEN: ${RAY_JOB_API_TOKEN:-}
      # n8n public-API key — n8n CE only issues keys via its UI
      # (Settings → n8n API), so this stays empty until the operator
      # creates one; backend /workflows endpoints 401 without it.
      N8N_API_KEY: ${N8N_API_KEY:-}
      # LangMem Memory Configuration
      LANGMEM_ENABLED: ${LANGMEM_ENABLED:-true}
      LANGMEM_NAMESPACE: ${LANGMEM_MEMORY_NAMESPACE:-default}
      LANGMEM_AUTO_CONSOLIDATE: ${LANGMEM_AUTO_CONSOLIDATE:-true}
      LANGMEM_CONSOLIDATION_INTERVAL: ${LANGMEM_CONSOLIDATION_INTERVAL:-86400}
      LANGMEM_MAX_FACTS_PER_USER: ${LANGMEM_MAX_FACTS_PER_USER:-1000}
      LANGMEM_EXTRACTION_MODEL: ${LANGMEM_EXTRACTION_MODEL:-}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-}
      LANGMEM_EMBEDDING_MODEL: ${LANGMEM_EMBEDDING_MODEL:-}
      LANGMEM_EMBEDDING_DIM: ${LANGMEM_EMBEDDING_DIM:-768}
      # Graphiti temporal graph memory experiment — backend-only and disabled
      # by default. No Graphiti service, MCP server, or agent exposure is
      # enabled by these env vars alone.
      GRAPHITI_ENABLED: ${GRAPHITI_ENABLED:-false}
      GRAPHITI_GROUP_ID_PREFIX: ${GRAPHITI_GROUP_ID_PREFIX:-atlas}
      GRAPHITI_DEFAULT_NAMESPACE: ${GRAPHITI_DEFAULT_NAMESPACE:-langmem}
      GRAPHITI_LLM_MODEL: ${GRAPHITI_LLM_MODEL:-}
      GRAPHITI_EMBEDDING_MODEL: ${GRAPHITI_EMBEDDING_MODEL:-}
      GRAPHITI_EXPOSE_TO_AGENTS: ${GRAPHITI_EXPOSE_TO_AGENTS:-false}
      RAGAS_EVALUATOR_MODEL: ${RAGAS_EVALUATOR_MODEL:-}
      RAGAS_EMBEDDINGS_MODEL: ${RAGAS_EMBEDDINGS_MODEL:-}
      # LightRAG → TEI rerank adapter (#415). TEI_RERANKER_ENDPOINT is resolved
      # by tei-reranker's own config generation; the adapter route reads it to
      # forward {query, texts}. The shared client batch limit keeps adapter
      # slices within the selected TEI runtime's configured request contract.
      TEI_RERANKER_ENDPOINT: ${TEI_RERANKER_ENDPOINT:-}
      TEI_RERANKER_MAX_CLIENT_BATCH_SIZE: ${TEI_RERANKER_MAX_CLIENT_BATCH_SIZE:-32}
      LIGHTRAG_RERANK_ADAPTER_ENABLED: ${LIGHTRAG_RERANK_ADAPTER_ENABLED:-false}
      LIGHTRAG_RERANK_ADAPTER_TOKEN: ${LIGHTRAG_RERANK_ADAPTER_TOKEN:-}
      LIGHTRAG_RERANK_ADAPTER_TIMEOUT_SECONDS: ${LIGHTRAG_RERANK_ADAPTER_TIMEOUT_SECONDS:-30}
    volumes:
      - ./app/app:/app
      - backend-data:/app/data
      - weaviate-shared-config:/shared
      - ../../volumes/comfyui:/comfyui-manifest:ro
    ports:
      - "${HOST_BIND_IP:-}${BACKEND_PORT}:8000"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

volumes:
  backend-data:
    name: ${PROJECT_NAME}-backend-data
    driver: local
