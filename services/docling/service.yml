# services/docling/service.yml — Docling document processor
name: docling
label: "Docling (document processor)"
category: media
docs: services/doc-processor/README.md  # docling is the docling-container-gpu / docling-localhost engine behind DOC_PROCESSOR_SOURCE

containers:
  - docling-gpu
  - docling-lightrag-adapter

images:
  - var: DOCLING_GPU_IMAGE
    default: "pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime@sha256:6acf597eeb8e376a96580dde4952f37cc017fef732bb40bfc73f28f25e3f64b4"
    container: docling-gpu
    notes: "Used as BASE_IMAGE in doc-processor/gpu/Dockerfile."
  - var: DOCLING_ADAPTER_IMAGE
    default: "python:3.12.13-slim"
    container: docling-lightrag-adapter
    notes: "Minimal base image for the isolated LightRAG compatibility adapter."

sources:
  var: DOC_PROCESSOR_SOURCE
  default: disabled
  options:
    - id: disabled
      label: "Disabled"
    - id: docling-localhost
      label: "Host (existing Docling on this machine)"
      profiles: [default]
    - id: docling-container-gpu
      label: "Container (GPU, NVIDIA)"

env:
  - name: DOC_PROCESSOR_SOURCE
    default: disabled
  - name: DOC_PROCESSOR_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: DOCLING_GPU_DEVICE
    default: cuda
  - name: DOCLING_OUTPUT_FORMAT
    default: markdown
  - name: DOCLING_USE_OCR
    default: auto
  - name: DOCLING_TABLE_MODE
    default: accurate
  - name: DOCLING_MAX_FILE_SIZE
    default: 52428800
    description: "Positive maximum upload bytes for Docling GPU, localhost, and adapter APIs. Request bodies are capped before multipart parsing with 1 MiB framing overhead; invalid values fail startup and oversized requests return 413."
  - name: DOCLING_UPLOAD_TIMEOUT_SECONDS
    default: 120
    description: "Total seconds (1-3600) allowed to receive one Docling or adapter upload body before a 408 response releases admission capacity."
  - name: DOCLING_CONCURRENCY
    default: 1
    description: "Maximum concurrent Docling conversions per provider process. Default 1 prevents duplicate model loads and GPU memory contention."
  - name: DOCLING_API_TOKEN
    default: ""
    secret: true
    description: "Auto-generated bearer credential required by Docling routes except /health."
  - name: DOCLING_AUTH_MODE
    default: required
    description: "Provider authentication mode: required (default) or disabled for an explicit emergency/local rollback."
  - name: DOCLING_CORS_ORIGINS
    default: ""
    description: "Optional comma-separated browser origin allowlist. Empty disables CORS; wildcard is invalid while authentication is required."
  - name: DOCLING_INFERENCE_TIMEOUT_SECONDS
    default: 900
    description: "Finite conversion and lazy-load deadline in seconds (1-3600). A timeout returns 504 and then exits the provider process for restart."
  - name: DOCLING_LOCALHOST_BIND_HOST
    default: 127.0.0.1
    description: "Native Docling listen address. Set another interface explicitly only when remote access is intended."
  - name: DOCLING_ADAPTER_MAX_JOBS
    default: 2
    description: "Maximum outstanding LightRAG adapter jobs, reserved before multipart parsing."
  - name: DOCLING_ADAPTER_RESULT_TTL_SECONDS
    default: 900
    description: "Seconds a completed LightRAG adapter result may remain before its artifact and job slot are removed."
  - name: DOCLING_ADAPTER_MAX_RESULT_BYTES
    default: 104857600
    description: "Maximum ZIP result bytes streamed from Docling to adapter storage before the job fails safely."
  - name: DOCLING_ADAPTER_UPSTREAM_MAX_ATTEMPTS
    default: 3
    description: "Total bounded Docling request attempts when the provider returns HTTP 429."
  - name: DOCLING_ADAPTER_DOWNLOAD_TIMEOUT_SECONDS
    default: 300
    description: "Positive maximum seconds for one result transmission; expiry deletes the artifact and releases its adapter slot."
  - name: DOCLING_ADAPTER_TMPFS_SIZE
    default: 512m
    description: "Bounded adapter temporary-storage mount. Size must cover MAX_JOBS times the larger of upload-plus-request-body (upload plus 1 MiB multipart overhead) or upload-plus-result limits, plus at least 64 MiB staging headroom; startup fails when actual capacity is smaller."
  - name: DOCLING_ADAPTER_SCALE
    auto_managed: true
    description: "Derived adapter replica count; one only when both LightRAG and Docling are enabled."
  - name: DOCLING_ADAPTER_UPSTREAM_ENDPOINT
    auto_managed: true
    description: "Authenticated internal bundle route selected for the adapter; never exposed to LightRAG."
  - name: DOCLING_ENABLE_FORMULAS
    default: true
  - name: DOCLING_ENABLE_CODE_BLOCKS
    default: true
  - name: DOCLING_CHUNK_SIZE
    default: 512
  - name: DOCLING_CHUNK_OVERLAP
    default: 50
  - name: DOCLING_GPU_SCALE
    auto_managed: true
  - name: DOCLING_ENDPOINT
    auto_managed: true
  - name: DOCLING_LOCALHOST_PORT
    default: "18159"
    description: "Host port for the localhost source variant. URL is derived at compose-render time as http://host.docker.internal:18159."

depends_on:
  # Docling has no runtime upstream service dependencies — it's a leaf
  # processor invoked over HTTP by the backend / n8n. (The virtual
  # `globals` manifest is config-only and was removed from this list —
  # depending on it conflated runtime ordering with config metadata.)
  required: []
  optional: []

exports: []

rows:
  - display_name: "Document Processor"
    source_var: DOC_PROCESSOR_SOURCE
    port_var: DOC_PROCESSOR_PORT
    scale_var: DOCLING_GPU_SCALE
    alias: docling.localhost
    description: "Document parsing & extraction."
    localhost_endpoint_var: DOCLING_ENDPOINT
    localhost_port_var: DOCLING_LOCALHOST_PORT

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  doc_processor:
    docling-container-gpu:
      scale: 1
      environment:
        DOCLING_ENDPOINT: http://docling-gpu:8000
        DOCLING_DEVICE: ${DOCLING_GPU_DEVICE:-cuda}
        NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
        HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      deploy:
        resources:
          reservations:
            devices:
            - driver: nvidia
              count: 1
              capabilities:
              - gpu
      extra_hosts: []
    docling-localhost:
      scale: 0
      environment:
        DOCLING_ENDPOINT: http://host.docker.internal:${DOCLING_LOCALHOST_PORT:-18159}
      deploy: {}
      extra_hosts:
      - host.docker.internal:host-gateway
    disabled:
      scale: 0
      environment:
        DOCLING_ENDPOINT: ''
      deploy: {}
      extra_hosts: []

data_flow:
  calls: []
