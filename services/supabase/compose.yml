# services/supabase/compose.yml — entire Supabase family
services:
  supabase-db:
    image: ${SUPABASE_DB_IMAGE}
    container_name: ${PROJECT_NAME}-supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPABASE_DB_USER}
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD}
      POSTGRES_DB: ${SUPABASE_DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # The image's /etc/postgresql-custom holds pgsodium_root.key, which
      # pgsodium and Vault generate on first start. Unpersisted, every
      # container recreate (each ./start.sh) minted a new key and existing
      # Vault secrets became undecryptable. A new named volume is seeded
      # from the image's directory, so its shipped .conf files are kept.
      - supabase-db-config:/etc/postgresql-custom
      - ./db/snapshot:/snapshot
      - ./db/scripts/enforce-scram-host-auth.sh:/usr/local/bin/enforce-scram-host-auth.sh:ro
    # The script execs the image entrypoint with these arguments. They must
    # keep the image's own `-D /etc/postgresql`: without it Postgres reads the
    # data directory's minimal postgresql.conf, listening on localhost only
    # (nothing else can connect) with no logical WAL or Supabase preloads.
    command: ["sh", "/usr/local/bin/enforce-scram-host-auth.sh", "-D", "/etc/postgresql"]
    ports:
      - "${HOST_BIND_IP:-127.0.0.1:}${SUPABASE_DB_PORT}:5432"
    networks:
      - backend-network
    healthcheck:
      # -h localhost: the unix socket already answers during initdb's
      # temporary server; start_period covers crash recovery.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${SUPABASE_DB_USER} -d ${SUPABASE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  supabase-db-init:
    image: ${SUPABASE_DB_INIT_IMAGE}
    container_name: ${PROJECT_NAME}-supabase-db-init
    restart: "no"
    environment:
      PGHOST: supabase-db
      PGUSER: ${SUPABASE_DB_USER}
      PGPASSWORD: ${SUPABASE_DB_PASSWORD}
      PGDATABASE: ${SUPABASE_DB_NAME}
      LANGMEM_EMBEDDING_DIM: ${LANGMEM_EMBEDDING_DIM:-768}
      LANGMEM_EMBEDDING_MODEL: ${LANGMEM_EMBEDDING_MODEL:-}
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL:-ollama/nomic-embed-text}
      SUPABASE_AUTH_DB_USER: ${SUPABASE_AUTH_DB_USER}
      SUPABASE_AUTH_DB_PASSWORD: ${SUPABASE_AUTH_DB_PASSWORD:?SUPABASE_AUTH_DB_PASSWORD is required}
      SUPABASE_STORAGE_DB_USER: ${SUPABASE_STORAGE_DB_USER}
      SUPABASE_STORAGE_DB_PASSWORD: ${SUPABASE_STORAGE_DB_PASSWORD:?SUPABASE_STORAGE_DB_PASSWORD is required}
      SUPABASE_API_DB_USER: ${SUPABASE_API_DB_USER}
      SUPABASE_API_DB_PASSWORD: ${SUPABASE_API_DB_PASSWORD:?SUPABASE_API_DB_PASSWORD is required}
      SUPABASE_REALTIME_DB_USER: ${SUPABASE_REALTIME_DB_USER}
      SUPABASE_REALTIME_DB_PASSWORD: ${SUPABASE_REALTIME_DB_PASSWORD:?SUPABASE_REALTIME_DB_PASSWORD is required}
      SUPABASE_META_DB_USER: ${SUPABASE_META_DB_USER}
      SUPABASE_META_DB_PASSWORD: ${SUPABASE_META_DB_PASSWORD:?SUPABASE_META_DB_PASSWORD is required}
      SUPABASE_STUDIO_DB_USER: ${SUPABASE_STUDIO_DB_USER}
      POSTGRES_EXPORTER_DB_USER: ${POSTGRES_EXPORTER_DB_USER}
      POSTGRES_EXPORTER_DB_PASSWORD: ${POSTGRES_EXPORTER_DB_PASSWORD:?POSTGRES_EXPORTER_DB_PASSWORD is required}
      SUPAVISOR_DB_ADMIN_USER: ${SUPAVISOR_DB_ADMIN_USER}
      SUPAVISOR_DB_ADMIN_PASSWORD: ${SUPAVISOR_DB_ADMIN_PASSWORD:?SUPAVISOR_DB_ADMIN_PASSWORD is required}
      BACKEND_DB_USER: ${BACKEND_DB_USER}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?BACKEND_DB_PASSWORD is required}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}
      OPEN_WEBUI_DB_USER: ${OPEN_WEBUI_DB_USER}
      OPEN_WEBUI_DB_PASSWORD: ${OPEN_WEBUI_DB_PASSWORD:?OPEN_WEBUI_DB_PASSWORD is required}
      LIGHTRAG_DB_USER: ${LIGHTRAG_DB_USER}
      LIGHTRAG_DB_PASSWORD: ${LIGHTRAG_DB_PASSWORD:?LIGHTRAG_DB_PASSWORD is required}
      LITELLM_DB_USER: ${LITELLM_DB_USER}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD is required}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-litellm}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}
      AIRFLOW_ATLAS_DB_USER: ${AIRFLOW_ATLAS_DB_USER}
      AIRFLOW_ATLAS_DB_PASSWORD: ${AIRFLOW_ATLAS_DB_PASSWORD:?AIRFLOW_ATLAS_DB_PASSWORD is required}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD is required}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME:-langfuse}
      TRUEFORGE_DB_USER: ${TRUEFORGE_DB_USER}
      TRUEFORGE_DB_PASSWORD: ${TRUEFORGE_DB_PASSWORD:?TRUEFORGE_DB_PASSWORD is required}
      TRUEFORGE_DB_NAME: ${TRUEFORGE_DB_NAME:-trueforge}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD is required}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
      LABEL_STUDIO_DB_USER: ${LABEL_STUDIO_DB_USER}
      LABEL_STUDIO_DB_PASSWORD: ${LABEL_STUDIO_DB_PASSWORD:?LABEL_STUDIO_DB_PASSWORD is required}
      LABEL_STUDIO_DB_NAME: ${LABEL_STUDIO_DB_NAME:-label_studio}
      ICEBERG_DB_USER: ${ICEBERG_DB_USER}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:?ICEBERG_DB_PASSWORD is required}
      MCP_POSTGRES_DB_USER: ${MCP_POSTGRES_DB_USER}
      MCP_POSTGRES_DB_PASSWORD: ${MCP_POSTGRES_DB_PASSWORD:?MCP_POSTGRES_DB_PASSWORD is required}
      JUPYTER_DB_USER: ${JUPYTER_DB_USER}
      JUPYTER_DB_PASSWORD: ${JUPYTER_DB_PASSWORD:?JUPYTER_DB_PASSWORD is required}
      ZEPPELIN_DB_USER: ${ZEPPELIN_DB_USER}
      ZEPPELIN_DB_PASSWORD: ${ZEPPELIN_DB_PASSWORD:?ZEPPELIN_DB_PASSWORD is required}
    volumes:
      - ./db/scripts:/scripts
      - ./db/_user:/user-scripts:ro
    entrypoint: ["/scripts/db-init-runner.sh"]
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - backend-network

  supabase-meta:
    image: ${SUPABASE_META_IMAGE}
    container_name: ${PROJECT_NAME}-supabase-meta
    restart: unless-stopped
    deploy:
      replicas: ${SUPABASE_META_SCALE:-1}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${SUPABASE_DB_NAME}
      PG_META_DB_USER: ${SUPABASE_META_DB_USER:?SUPABASE_META_DB_USER is required}
      PG_META_DB_PASSWORD: ${SUPABASE_META_DB_PASSWORD:?SUPABASE_META_DB_PASSWORD is required}
      # Decrypts Studio's x-connection-encrypted header; must match Studio's.
      # postgres-meta reads CRYPTO_KEY (PG_META_CRYPTO_KEY is Studio's name);
      # under the wrong name it fell back to "SAMPLE_KEY" and every Studio
      # SQL/table-editor request failed to decrypt.
      CRYPTO_KEY: ${SUPABASE_META_CRYPTO_KEY:-}
    # Not published on the host: pg-meta runs SQL unauthenticated and answers
    # any browser origin (CORS *), so even a loopback bind let any web page
    # the operator opened query auth.users. Studio and Kong's /pg/ route
    # reach it on backend-network.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  supabase-storage:
    image: ${SUPABASE_STORAGE_IMAGE}
    container_name: ${PROJECT_NAME}-supabase-storage
    restart: unless-stopped
    deploy:
      replicas: ${SUPABASE_STORAGE_SCALE:-1}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${SUPABASE_STORAGE_DB_USER_URI:?SUPABASE_STORAGE_DB_USER_URI is required}:${SUPABASE_STORAGE_DB_PASSWORD_URI:?SUPABASE_STORAGE_DB_PASSWORD_URI is required}@supabase-db:5432/${SUPABASE_DB_NAME_URI:?SUPABASE_DB_NAME_URI is required}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      REGION: ${STORAGE_REGION}
      # Keep Kong's X-Forwarded-Prefix in resumable-upload Location headers;
      # without it Studio's browser uploads PATCH /upload/... and get a 404.
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      FILE_STORAGE_PATH: /var/lib/storage
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${TENANT_ID}
      PROJECT_REF: ${PROJECT_REF}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      POSTGREST_URL: http://supabase-api:3000
      GOTRUE_URL: http://supabase-auth:9999
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${SUPABASE_STORAGE_PORT}:5000"
    volumes:
      - supabase-storage-data:/var/lib/storage
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  supabase-auth:
    image: ${SUPABASE_AUTH_IMAGE}
    container_name: ${PROJECT_NAME}-supabase-auth
    restart: unless-stopped
    deploy:
      replicas: ${SUPABASE_AUTH_SCALE:-1}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
    environment:
      GOTRUE_SITE_URL: http://supabase-studio:3000
      API_EXTERNAL_URL: http://supabase-auth:9999
      # GoTrue's built-in default is 8081; Kong and Storage (GOTRUE_URL) both
      # target 9999, so without these auth was unreachable.
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: postgres://${SUPABASE_AUTH_DB_USER_URI:?SUPABASE_AUTH_DB_USER_URI is required}:${SUPABASE_AUTH_DB_PASSWORD_URI:?SUPABASE_AUTH_DB_PASSWORD_URI is required}@supabase-db:5432/${SUPABASE_DB_NAME_URI:?SUPABASE_DB_NAME_URI is required}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      # Without these every token carried aud "" and role "", which the
      # backend and PostgREST refuse (2026-10-08 run, cycle 56); upstream
      # Supabase sets the same values.
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_URLPATHS_INVITE: "/invite"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: "/confirm"
      GOTRUE_MAILER_URLPATHS_RECOVERY: "/recover"
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "/email-change"
      GOTRUE_SMTP_HOST: "localhost"
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: "Supabase Auth"
      GOTRUE_SMTP_ADMIN_EMAIL: "admin@example.com"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_SITE_NAME: "Local Supabase"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Not published on the host: GoTrue answers any browser origin (CORS *)
    # with signup and autoconfirm on, so any web page the operator opened
    # could create an account and read its token. Kong's /auth/v1 route
    # (key-auth, localhost-scoped CORS) is the host path (cycle 56).
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  supabase-api:
    image: ${SUPABASE_API_IMAGE}
    container_name: ${PROJECT_NAME}-supabase-api
    restart: unless-stopped
    deploy:
      replicas: ${SUPABASE_API_SCALE:-1}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://${SUPABASE_API_DB_USER_URI:?SUPABASE_API_DB_USER_URI is required}:${SUPABASE_API_DB_PASSWORD_URI:?SUPABASE_API_DB_PASSWORD_URI is required}@supabase-db:5432/${SUPABASE_DB_NAME_URI:?SUPABASE_DB_NAME_URI is required}
      PGRST_DB_SCHEMA: "public,storage"
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${SUPABASE_API_PORT}:3000"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  supabase-realtime:
    image: ${SUPABASE_REALTIME_IMAGE}
    container_name: ${PROJECT_NAME}-supabase-realtime
    restart: unless-stopped
    deploy:
      replicas: ${SUPABASE_REALTIME_SCALE:-1}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      supabase-auth:
        condition: service_started
        required: false
      supabase-api:
        condition: service_started
        required: false
    environment:
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_NAME: ${SUPABASE_DB_NAME}
      DB_USER: ${SUPABASE_REALTIME_DB_USER:?SUPABASE_REALTIME_DB_USER is required}
      DB_PASSWORD: ${SUPABASE_REALTIME_DB_PASSWORD:?SUPABASE_REALTIME_DB_PASSWORD is required}
      DB_CHANNEL_ENABLED: "true"
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_ROLE: service_role
      PORT: 4000
      REPLICATION_MODE: RLS
      SECURE_CHANNELS: "true"
      IP_VERSION: ipv4
      SECRET_KEY_BASE: ${SUPABASE_JWT_SECRET}
      # Required since realtime ~v2.3x: runtime.exs does an unconditional
      # System.fetch_env!("METRICS_JWT_SECRET") at boot (it signs the JWT that
      # guards the Prometheus /metrics endpoint). Without it v2.112.0 crash-loops
      # with `(System.EnvError) ... "METRICS_JWT_SECRET" ... is not set`.
      # Reuse SUPABASE_JWT_SECRET — same posture as JWT_SECRET / SECRET_KEY_BASE.
      METRICS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      RLIMIT_NOFILE: 65536
      ERL_AFLAGS: "-proto_dist inet_tcp"
      HOSTNAME: supabase-realtime
      # The upstream image hardcodes ``Cluster.Strategy.DNSPoll`` (the
      # ``fly6pn`` topology) and ignores ``LIBCLUSTER_*`` overrides.
      # Its DNS query is read from ``DNS_NODES``; when unset, libcluster
      # logs ``query or basename param is invalid: query: nil`` every
      # 5 seconds. Pointing at the container's own hostname resolves —
      # but DNSPoll then tries to Erlang-connect to ``realtime@<IP>``,
      # which our ``HOSTNAME=supabase-realtime`` Erlang node doesn't
      # answer for, producing a new ``unable to connect to`` warning
      # at the same cadence.
      # The single-node workaround is to point ``DNS_NODES`` at a name
      # under the reserved ``.invalid`` TLD (RFC 6761) so DNS resolves
      # to nothing. DNSPoll's empty-peer-list path is silent, while
      # the env var is still set (which is what libcluster checks for
      # "configured-ness").
      DNS_NODES: supabase-realtime-noop.invalid
      APP_NAME: realtime
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${SUPABASE_REALTIME_PORT}:4000"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  supabase-studio:
    image: ${SUPABASE_STUDIO_IMAGE}
    container_name: ${PROJECT_NAME}-supabase-studio
    restart: unless-stopped
    deploy:
      replicas: ${SUPABASE_STUDIO_SCALE:-1}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      supabase-meta:
        condition: service_started
      supabase-storage:
        condition: service_started
      supabase-auth:
        condition: service_started
      supabase-api:
        condition: service_started
      supabase-realtime:
        condition: service_started
      kong-api-gateway:
        condition: service_started
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      SUPABASE_URL: http://kong-api-gateway:8000
      SUPABASE_PUBLIC_URL: http://localhost:${KONG_HTTP_PORT}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      DEFAULT_ORGANIZATION_NAME: ${PROJECT_NAME}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      # Shared with Postgres Meta: encrypts the connection header Studio sends
      # it. Unset, both fall back to the public constant "SAMPLE_KEY".
      PG_META_CRYPTO_KEY: ${SUPABASE_META_CRYPTO_KEY:-}
      # Studio constructs its SQL-editor connection URI from this tuple. The
      # user/password fields therefore use bootstrapper-synchronized encoded
      # components; Postgres Meta above keeps the raw discrete credentials.
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${SUPABASE_DB_NAME_URI:?SUPABASE_DB_NAME_URI is required}
      POSTGRES_USER_READ_WRITE: ${SUPABASE_META_DB_USER_URI:?SUPABASE_META_DB_USER_URI is required}
      POSTGRES_USER_READ_ONLY: ${SUPABASE_STUDIO_DB_USER_URI:?SUPABASE_STUDIO_DB_USER_URI is required}
      POSTGRES_PASSWORD: ${SUPABASE_META_DB_PASSWORD_URI:?SUPABASE_META_DB_PASSWORD_URI is required}
      HOSTNAME: 0.0.0.0
    # Not published on the host: Studio has no application auth and its
    # pg-meta proxy takes form-encoded POSTs, so any web page could run SQL
    # as the meta role through a loopback port. Use the Kong route
    # supabase-studio.localhost (Basic auth + dashboard_user ACL).
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"net\").createConnection({port:3000,host:\"localhost\"},()=>process.exit(0)).on(\"error\",()=>process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.19.1}
    container_name: ${PROJECT_NAME}-postgres-exporter
    restart: unless-stopped
    deploy:
      replicas: ${POSTGRES_EXPORTER_SCALE:-0}
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_EXPORTER_DB_USER_URI:?POSTGRES_EXPORTER_DB_USER_URI is required}:${POSTGRES_EXPORTER_DB_PASSWORD_URI:?POSTGRES_EXPORTER_DB_PASSWORD_URI is required}@supabase-db:5432/${SUPABASE_DB_NAME_URI:?SUPABASE_DB_NAME_URI is required}?sslmode=disable"
      # No PG_EXPORTER_AUTO_DISCOVER_DATABASES: per-service databases revoke
      # CONNECT from the metrics role (05-scoped-roles.sh), so discovery only
      # pinned pg_exporter_last_scrape_error at 1 and added no metrics.
      # Disable the built-in pg_settings collector. On supabase/postgres 17.6 a
      # GUC row has a NULL short_desc, and the exporter's settings scrape can't
      # map NULL→string → it logs `error scraping dsn … converting NULL to
      # string is unsupported` every scrape interval (~5s) while still serving
      # all other pg_* metrics. The pg_settings-as-metrics export is low value;
      # turning it off removes the recurring error without losing useful series.
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "true"
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${POSTGRES_EXPORTER_PORT}:9187"
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

volumes:
  supabase-db-data:
    name: ${PROJECT_NAME}-supabase-db-data
    driver: local
  supabase-db-config:
    name: ${PROJECT_NAME}-supabase-db-config
    driver: local
  supabase-storage-data:
    name: ${PROJECT_NAME}-supabase-storage-data
    driver: local
