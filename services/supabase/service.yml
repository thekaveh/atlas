# services/supabase/service.yml — full Supabase stack (9 containers)
#
# One manifest, one compose fragment, nine containers: eight core Supabase
# services (db, db-init, meta, storage, auth, api, realtime, studio) plus the
# postgres-exporter observability sidecar (scales 1<->0 with PROMETHEUS_SOURCE).
# The Supabase family is treated as a single unit because the containers are
# tightly coupled (same JWT secret, same database, lifecycle-linked via
# depends_on chain through supabase-db-init).
name: supabase
label: "Supabase (db, auth, api, storage, realtime, studio, meta)"
category: data
docs: services/supabase/README.md

capabilities:
  - name: "Integrated Postgres application platform"
    status: supported
    verification: tested
    note: "Atlas runs PostgreSQL with Auth, PostgREST, Storage, Realtime, Meta, Studio, database initialization, and optional metrics export as one required family. Realtime runs but serves no tenant yet (§4.5)."
  - name: "Idempotent schema and RLS initialization"
    status: supported
    verification: tested
    note: "Ordered Atlas and downstream SQL runners initialize extensions, service schemas, grants, identity synchronization, and row-level-security policies with failure gating."
  - name: "Least-privilege application database role"
    status: supported
    verification: tested
    note: "Atlas creates idempotent per-service logins and dedicated database/schema ownership or read grants; application containers do not receive the Supabase owner credential."
  - name: "Production email authentication"
    status: partial
    verification: documented
    note: "GoTrue issues and validates JWTs, but the stock local-development defaults auto-confirm email and point SMTP at localhost rather than a configured delivery service."
  - name: "pg-meta administrative access control"
    status: supported
    verification: tested
    note: "The Kong /pg/ route uses Basic authentication and the dashboard_user ACL. The pg-meta service itself has no application authentication, executes as a dedicated dashboard_user member and allows any browser origin. It is therefore not published on the host. SUPABASE_META_PORT is reserved but unused."
  - name: "Supabase Studio access control"
    status: supported
    verification: tested
    note: "The Kong route uses Basic authentication and the dashboard_user ACL. Studio has no application authentication. Its pg-meta proxy accepts form-encoded POSTs that a web page can send cross-site. Studio is therefore not published on the host. SUPABASE_STUDIO_PORT is reserved but unused."
  - name: "Authenticated remote PostgreSQL access"
    status: supported
    verification: tested
    note: "Host TCP uses SCRAM-SHA-256 with generated scoped passwords under the image's own pg_hba.conf. An upgrade-time HBA rewrite for legacy volumes covers their data-directory rules. Publication is loopback by default. Explicit remote exposure still requires firewall and TLS planning."

containers:
  - supabase-db
  - supabase-db-init
  - supabase-meta
  - supabase-storage
  - supabase-auth
  - supabase-api
  - supabase-realtime
  - supabase-studio
  - postgres-exporter

images:
  - var: SUPABASE_DB_IMAGE
    default: "supabase/postgres:17.6.1.139"
    container: supabase-db
  - var: SUPABASE_DB_INIT_IMAGE
    default: "postgres:15.19-alpine"
    container: supabase-db-init
  - var: SUPABASE_META_IMAGE
    default: "supabase/postgres-meta:v0.96.6"
    container: supabase-meta
  - var: SUPABASE_STORAGE_IMAGE
    default: "supabase/storage-api:v1.61.5"
    container: supabase-storage
  - var: SUPABASE_AUTH_IMAGE
    default: "supabase/gotrue:v2.191.0"
    container: supabase-auth
  - var: SUPABASE_API_IMAGE
    default: "postgrest/postgrest:v12.2.10"
    container: supabase-api
  - var: SUPABASE_REALTIME_IMAGE
    default: "supabase/realtime:v2.112.0"
    container: supabase-realtime
  - var: SUPABASE_STUDIO_IMAGE
    default: "supabase/studio:2026.06.22-sha-2207d7f"
    container: supabase-studio
  - var: POSTGRES_EXPORTER_IMAGE
    default: "prometheuscommunity/postgres-exporter:v0.19.1"
    container: postgres-exporter
    notes: "Prometheus exporter sidecar. Scales 1↔0 with PROMETHEUS_SOURCE (gated by _generate_prometheus_config)."

env:
  # DB
  - name: SUPABASE_DB_SOURCE
    default: container
    description: "Single-option (container only). Kept for forward-compat with legacy source-validator."
  - name: SUPABASE_DB_PORT
    description: "Host port for supabase-db PostgreSQL (in-container 5432), bound to HOST_BIND_IP (loopback by default)."
    # default removed — computed by services/topology.py slot allocator
  - name: SUPABASE_DB_USER
    description: "Postgres superuser name, passed to supabase-db as POSTGRES_USER and used by supabase-db-init."
    default: supabase_admin
  - name: SUPABASE_DB_PASSWORD
    default: password
    secret: true
    description: "Supabase postgres admin password; auto-generated by the bootstrapper when left as the placeholder."
  - name: SUPABASE_DB_NAME
    description: "Database name, passed to supabase-db as POSTGRES_DB and used by supabase-db-init, pg-meta and Realtime."
    default: postgres
  - name: SUPABASE_DB_NAME_URI
    default: postgres
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_DB_NAME for DSN path components."
  - name: SUPABASE_DB_APP_USER
    default: app_user
    description: "Reserved for a future least-privilege application-tier database user; not created by init scripts today."
  - name: SUPABASE_DB_APP_PASSWORD
    default: app_password
    secret: true
    description: "Reserved future app-user password; auto-generated by the bootstrapper when left as the placeholder."
  - name: SUPABASE_AUTH_DB_USER
    description: "Login name of the Supabase Auth (GoTrue) schema owner. supabase-db-init creates it if missing and sets its password."
    default: supabase_auth_admin
  - name: SUPABASE_AUTH_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated login password for the upstream auth schema owner."
  - name: SUPABASE_AUTH_DB_USER_URI
    default: supabase_auth_admin
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_AUTH_DB_USER for DSN userinfo."
  - name: SUPABASE_AUTH_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_AUTH_DB_PASSWORD for DSN userinfo."
  - name: SUPABASE_STORAGE_DB_USER
    description: "Login name of the Supabase Storage schema owner. supabase-db-init creates it if missing and sets its password."
    default: supabase_storage_admin
  - name: SUPABASE_STORAGE_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated login password for the upstream storage schema owner."
  - name: SUPABASE_STORAGE_DB_USER_URI
    default: supabase_storage_admin
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_STORAGE_DB_USER for DSN userinfo."
  - name: SUPABASE_STORAGE_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_STORAGE_DB_PASSWORD for DSN userinfo."
  - name: SUPABASE_API_DB_USER
    description: "Login name of the PostgREST's role-switching authenticator. supabase-db-init creates it if missing and sets its password."
    default: authenticator
  - name: SUPABASE_API_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated login password for PostgREST's role-switching authenticator."
  - name: SUPABASE_API_DB_USER_URI
    default: authenticator
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_API_DB_USER for DSN userinfo."
  - name: SUPABASE_API_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_API_DB_PASSWORD for DSN userinfo."
  - name: SUPABASE_REALTIME_DB_USER
    description: "Login name of the replication-scoped Realtime role. supabase-db-init creates it if missing and sets its password."
    default: atlas_realtime
  - name: SUPABASE_REALTIME_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated password for the replication-scoped Realtime role."
  - name: SUPABASE_META_DB_USER
    description: "Login name of the dashboard metadata role used by pg-meta and Studio. supabase-db-init creates it if missing and sets its password."
    default: atlas_meta
  - name: SUPABASE_META_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated password for the dashboard metadata role used by Meta and Studio."
  - name: SUPABASE_META_CRYPTO_KEY
    default: ""
    secret: true
    description: "Auto-generated key shared by Studio (as PG_META_CRYPTO_KEY) and Postgres Meta (as CRYPTO_KEY) to encrypt the connection header Studio sends Meta. Empty falls back to the images' public SAMPLE_KEY constant."
  - name: SUPABASE_META_DB_USER_URI
    default: atlas_meta
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_META_DB_USER for DSN userinfo."
  - name: SUPABASE_META_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_META_DB_PASSWORD for DSN userinfo."
  - name: SUPABASE_STUDIO_DB_USER
    default: atlas_studio_readonly
    description: "Read-only SQL-editor identity used by Studio; it shares Studio's single password interface with Meta but has no Meta admin authority."
  - name: SUPABASE_STUDIO_DB_USER_URI
    default: atlas_studio_readonly
    description: "Bootstrapper-synchronized percent-encoded SUPABASE_STUDIO_DB_USER for Studio's constructed DSN."
  # DB init
  - name: SUPABASE_DB_INIT_SOURCE
    default: container
    description: "Container only: the post-init SQL runner every Supabase-backed service waits for. Other values are rejected."
  # Postgres-exporter sidecar (observability)
  - name: POSTGRES_EXPORTER_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Host port for postgres-exporter (in-container 9187). Sidecar gated by PROMETHEUS_SOURCE."
  - name: POSTGRES_EXPORTER_SCALE
    auto_managed: true
    description: "Set by _generate_prometheus_config() to 1 when PROMETHEUS_SOURCE=container, 0 otherwise."
  - name: POSTGRES_EXPORTER_DB_USER
    description: "Login name of the pg_monitor-only role postgres-exporter uses. supabase-db-init creates it if missing and sets its password."
    default: atlas_metrics
  - name: POSTGRES_EXPORTER_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated password for the pg_monitor-only exporter role."
  - name: POSTGRES_EXPORTER_DB_USER_URI
    default: atlas_metrics
    description: "Bootstrapper-synchronized percent-encoded POSTGRES_EXPORTER_DB_USER for DSN userinfo."
  - name: POSTGRES_EXPORTER_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded POSTGRES_EXPORTER_DB_PASSWORD for DSN userinfo."
  # Meta
  - name: SUPABASE_META_SOURCE
    description: "Deployment source for pg-meta (supabase-meta): container (default) or disabled."
    default: container
  - name: SUPABASE_META_SCALE
    description: "Set by ./start.sh from SUPABASE_META_SOURCE; do not edit. 1 runs the container, 0 (disabled) does not."
    auto_managed: true
  - name: SUPABASE_META_PORT
    description: "Reserved port slot for pg-meta; not published on the host. Reach it through Kong at /pg/."
    # default removed — computed by services/topology.py slot allocator
  # Storage
  - name: SUPABASE_STORAGE_SOURCE
    description: "Deployment source for Supabase Storage (supabase-storage): container (default) or disabled."
    default: container
  - name: SUPABASE_STORAGE_SCALE
    description: "Set by ./start.sh from SUPABASE_STORAGE_SOURCE; do not edit. 1 runs the container, 0 (disabled) does not."
    auto_managed: true
  - name: SUPABASE_STORAGE_PORT
    description: "Host port for Supabase Storage (in-container 5000), bound to HOST_BIND_IP (loopback by default)."
    # default removed — computed by services/topology.py slot allocator
  - name: STORAGE_REGION
    description: "Region name passed to Supabase Storage as REGION."
    default: local
  - name: STORAGE_FILE_SIZE_LIMIT
    description: "Maximum upload size in bytes for Supabase Storage (FILE_SIZE_LIMIT). The default is 50 MiB."
    default: 52428800
  - name: STORAGE_BACKEND
    description: "Supabase Storage backend. The default `file` stores objects in the storage volume at /var/lib/storage."
    default: file
  - name: PROJECT_REF
    description: "Project reference passed to Supabase Storage as PROJECT_REF."
    default: default
  - name: TENANT_ID
    description: "Tenant id passed to Supabase Storage as TENANT_ID."
    default: stub
  # Auth (GoTrue)
  - name: SUPABASE_AUTH_SOURCE
    description: "Deployment source for Supabase Auth, GoTrue (supabase-auth): container (default) or disabled."
    default: container
  - name: SUPABASE_AUTH_SCALE
    description: "Set by ./start.sh from SUPABASE_AUTH_SOURCE; do not edit. 1 runs the container, 0 (disabled) does not."
    auto_managed: true
  - name: SUPABASE_AUTH_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Reserved port slot for Supabase Auth (GoTrue); not published on the host. Reach it through Kong at /auth/v1."
  - name: SUPABASE_JWT_SECRET
    default: ""
    secret: true
    description: "Auto-generated by bootstrapper/generate_supabase_keys.py on first run."
  - name: SUPABASE_ANON_KEY
    default: ""
    secret: true
    description: "Auto-generated."
  - name: SUPABASE_SERVICE_KEY
    default: ""
    secret: true
    description: "Auto-generated."
  # API (PostgREST)
  - name: SUPABASE_API_SOURCE
    description: "Deployment source for PostgREST (supabase-api): container (default) or disabled."
    default: container
  - name: SUPABASE_API_SCALE
    description: "Set by ./start.sh from SUPABASE_API_SOURCE; do not edit. 1 runs the container, 0 (disabled) does not."
    auto_managed: true
  - name: SUPABASE_API_PORT
    description: "Host port for PostgREST (in-container 3000), bound to HOST_BIND_IP (loopback by default)."
    # default removed — computed by services/topology.py slot allocator
  # Realtime
  - name: SUPABASE_REALTIME_SOURCE
    description: "Deployment source for Supabase Realtime (supabase-realtime): container (default) or disabled."
    default: container
  - name: SUPABASE_REALTIME_SCALE
    description: "Set by ./start.sh from SUPABASE_REALTIME_SOURCE; do not edit. 1 runs the container, 0 (disabled) does not."
    auto_managed: true
  - name: SUPABASE_REALTIME_PORT
    description: "Host port for Supabase Realtime (in-container 4000), bound to HOST_BIND_IP (loopback by default)."
    # default removed — computed by services/topology.py slot allocator
  # Studio
  - name: SUPABASE_STUDIO_SOURCE
    description: "Deployment source for Supabase Studio (supabase-studio): container (default) or disabled."
    default: container
  - name: SUPABASE_STUDIO_SCALE
    description: "Set by ./start.sh from SUPABASE_STUDIO_SOURCE; do not edit. 1 runs the container, 0 (disabled) does not."
    auto_managed: true
  - name: SUPABASE_STUDIO_PORT
    description: "Reserved port slot for Supabase Studio; not published on the host. Reach it through Kong."
    # default removed — computed by services/topology.py slot allocator

depends_on:
  # Root infra — Supabase is the data/auth substrate every other service
  # depends on. Has no upstream service dependencies of its own. (The
  # virtual `globals` manifest is config-only and was removed from this
  # list — depending on it conflated runtime ordering with config metadata.)
  required: []
  optional: []

rows:
  - display_name: "Supabase DB"
    source_var: SUPABASE_DB_SOURCE
    port_var: SUPABASE_DB_PORT
    description: "Postgres database (always-on, container-only)."
  - display_name: "Supabase Meta"
    source_var: SUPABASE_META_SOURCE
    scale_var: SUPABASE_META_SCALE
    port_var: SUPABASE_META_PORT
    description: "Postgres metadata API."
  - display_name: "Supabase Storage"
    source_var: SUPABASE_STORAGE_SOURCE
    scale_var: SUPABASE_STORAGE_SCALE
    port_var: SUPABASE_STORAGE_PORT
    description: "S3-compatible storage API."
  - display_name: "Supabase Auth"
    source_var: SUPABASE_AUTH_SOURCE
    scale_var: SUPABASE_AUTH_SCALE
    port_var: SUPABASE_AUTH_PORT
    description: "GoTrue authentication service."
  - display_name: "Supabase API"
    source_var: SUPABASE_API_SOURCE
    scale_var: SUPABASE_API_SCALE
    port_var: SUPABASE_API_PORT
    description: "PostgREST REST API surface."
  - display_name: "Supabase Realtime"
    source_var: SUPABASE_REALTIME_SOURCE
    scale_var: SUPABASE_REALTIME_SCALE
    port_var: SUPABASE_REALTIME_PORT
    description: "WebSocket replication firehose."
  - display_name: "Supabase Studio"
    source_var: SUPABASE_STUDIO_SOURCE
    scale_var: SUPABASE_STUDIO_SCALE
    port_var: SUPABASE_STUDIO_PORT
    alias: supabase-studio.localhost
    description: "Browser UI for the database."

# Supabase exports DB credentials + JWT/ANON/SERVICE keys to half the stack.
# Consumers are listed for documentation; validator only checks closure
# once the consumer manifests exist.
exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  supabase-db:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
  supabase-db-init:
    # Container only: backend, open-webui, comfyui and every Supabase
    # sub-service wait for it to complete, and nothing scales it, so a
    # "disabled" here was accepted and silently ignored (2026-10-08 run,
    # cycle 13).
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
  supabase-meta:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  supabase-storage:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  supabase-auth:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  supabase-api:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  supabase-realtime:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  supabase-studio:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  postgres-exporter:
    container:
      scale: 0   # placeholder — _generate_prometheus_config overwrites
      environment:
        DATA_SOURCE_NAME: "postgresql://${POSTGRES_EXPORTER_DB_USER_URI}:${POSTGRES_EXPORTER_DB_PASSWORD_URI}@supabase-db:5432/${SUPABASE_DB_NAME_URI}?sslmode=disable"
      deploy: {}
      extra_hosts: []

data_flow:
  calls: []

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
