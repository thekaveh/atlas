# services/mcp-servers/service.yml — curated MCP servers package
name: mcp-servers
label: "Curated MCP Servers"
category: agents
docs: services/mcp-servers/README.md

capabilities:
  - name: "Curated Streamable HTTP tools"
    status: supported
    verification: tested
    note: "Atlas serves FastMCP tools for bounded Postgres reads, Neo4j schema/read Cypher, and SearXNG search through one stateless /mcp endpoint."
  - name: "Read-only database guardrails"
    status: partial
    verification: tested
    note: "Atlas rejects common mutation forms, uses a read-only Postgres transaction and Neo4j read routing, and bounds rows and time, but tool output remains untrusted prompt-injection input."
  - name: "MCP ingress authentication"
    status: partial
    verification: tested
    note: "The direct endpoint is loopback-bound without application auth, while mcp.localhost adds Kong Basic Auth and ACL; Host/Origin checks defend rebinding but are not authentication."
  - name: "Write and administration tools"
    status: not-supported
    verification: tested
    note: "The curated package deliberately exposes no Postgres mutation, Neo4j write, credential-management, filesystem, or shell-execution tool."
  - name: "Per-consumer MCP authorization"
    status: not-supported
    verification: documented
    note: "All authenticated Kong users reach the same tool set and backend credentials; Atlas configures no OAuth scopes, tenant namespaces, or tool-level consumer policy."

containers:
  - mcp-servers

images:
  - var: MCP_SERVERS_IMAGE
    default: "python:3.12.13-slim"
    container: mcp-servers
    notes: "Used as build-arg BASE_IMAGE in build/Dockerfile."

sources:
  var: MCP_SERVERS_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (read-only Postgres, Neo4j, SearXNG tools)"
    - id: disabled
      label: "Disabled"

env:
  - name: MCP_SERVERS_SOURCE
    default: disabled
    description: "Curated MCP package source. Disabled by default because MCP tools can reach stack internals."
  - name: MCP_SERVERS_PORT
    description: "Host port for the curated MCP Streamable HTTP endpoint (container port 8000)."
  - name: MCP_SERVERS_SCALE
    auto_managed: true
    description: "Replicas: 1 when MCP_SERVERS_SOURCE=container, else 0."
  - name: MCP_POSTGRES_MAX_ROWS
    default: "50"
    description: "Maximum rows returned by the Postgres MCP query tool."
  - name: MCP_NEO4J_MAX_ROWS
    default: ""
    description: "Maximum rows returned by the Neo4j MCP query tool. Empty falls back to MCP_POSTGRES_MAX_ROWS (default 50)."
  - name: MCP_SEARXNG_MAX_RESULTS
    default: "5"
    description: "Maximum SearXNG results returned by the web-search MCP tool."
  - name: MCP_TOOL_TIMEOUT_SECONDS
    default: "15"
    description: "Timeout for upstream database/search calls made by MCP tools."

depends_on:
  required:
    - supabase
    - neo4j
    - searxng
  optional: []

exports: []

rows:
  - display_name: "Curated MCP Servers"
    source_var: MCP_SERVERS_SOURCE
    port_var: MCP_SERVERS_PORT
    scale_var: MCP_SERVERS_SCALE
    alias: mcp.localhost
    description: "Read-oriented Postgres, Neo4j, and SearXNG MCP tools."

runtime_sc:
  mcp-servers:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - supabase
    - neo4j
    - searxng
