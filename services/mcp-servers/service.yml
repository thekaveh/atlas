# services/mcp-servers/service.yml — curated MCP servers package
name: mcp-servers
label: "Curated MCP Servers"
category: agents
docs: services/mcp-servers/README.md

capabilities:
  - name: "Curated Streamable HTTP tools"
    status: supported
    verification: tested
    note: "Atlas serves FastMCP tools for bounded Postgres reads, Neo4j schema/read Cypher, and SearXNG search through one stateless /mcp endpoint."
  - name: "Database query guardrails"
    status: partial
    verification: tested
    note: "Regex filters, Postgres read-only transactions, Neo4j READ_ACCESS, and row/time caps block common direct mutation syntax but do not prevent privileged function or procedure side effects under administrator credentials."
  - name: "Tenant-scoped Postgres reads"
    status: not-supported
    verification: tested
    note: "MCP uses the shared supabase_admin owner, bypasses RLS, and permits bounded SELECT/WITH/SHOW/EXPLAIN with no schema, table, or column allowlist or redaction; trusted operators only until a separate least-privilege views or role design lands."
  - name: "MCP ingress authentication"
    status: partial
    verification: tested
    note: "127.0.0.1 protects only the host publish; all backend-network containers can call unauthenticated http://mcp-servers:8000/mcp using the allowed mcp-servers Host and bypass Kong Basic Auth and ACL; Host/Origin checks are not authentication."
  - name: "Write and administration prevention"
    status: partial
    verification: tested
    note: "Atlas ships no dedicated write or administration tool, but accepted SELECT functions and CALL db.* procedures run with administrator credentials in a Neo4j environment with unrestricted APOC and can cause administration, filesystem, or write side effects."
  - name: "Per-consumer MCP authorization"
    status: not-supported
    verification: tested
    note: "Unauthenticated backend-network callers bypass Kong, while all Kong dashboard consumers reach the same tool set and administrator credentials; Atlas configures no application credential, OAuth scopes, tenant namespaces, or tool policy."

containers:
  - mcp-servers

images:
  - var: MCP_SERVERS_IMAGE
    default: "python:3.12.13-slim"
    container: mcp-servers
    notes: "Used as build-arg BASE_IMAGE in build/Dockerfile."

sources:
  var: MCP_SERVERS_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (read-only Postgres, Neo4j, SearXNG tools)"
    - id: disabled
      label: "Disabled"

env:
  - name: MCP_SERVERS_SOURCE
    default: disabled
    description: "Curated MCP package source. Disabled by default because MCP tools can reach stack internals."
  - name: MCP_SERVERS_PORT
    description: "Host port for the curated MCP Streamable HTTP endpoint (container port 8000)."
  - name: MCP_SERVERS_SCALE
    auto_managed: true
    description: "Replicas: 1 when MCP_SERVERS_SOURCE=container, else 0."
  - name: MCP_POSTGRES_MAX_ROWS
    default: "50"
    description: "Maximum rows returned by the Postgres MCP query tool."
  - name: MCP_NEO4J_MAX_ROWS
    default: ""
    description: "Maximum rows returned by the Neo4j MCP query tool. Empty falls back to MCP_POSTGRES_MAX_ROWS (default 50)."
  - name: MCP_SEARXNG_MAX_RESULTS
    default: "5"
    description: "Maximum SearXNG results returned by the web-search MCP tool."
  - name: MCP_TOOL_TIMEOUT_SECONDS
    default: "15"
    description: "Timeout for upstream database/search calls made by MCP tools."

depends_on:
  required:
    - supabase
    - neo4j
    - searxng
  optional: []

exports: []

rows:
  - display_name: "Curated MCP Servers"
    source_var: MCP_SERVERS_SOURCE
    port_var: MCP_SERVERS_PORT
    scale_var: MCP_SERVERS_SCALE
    alias: mcp.localhost
    description: "Read-oriented Postgres, Neo4j, and SearXNG MCP tools."

runtime_sc:
  mcp-servers:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - supabase
    - neo4j
    - searxng
