# services/mcp-servers/compose.yml — curated MCP tool surface
services:
  mcp-servers:
    build:
      context: ./runtime
      dockerfile: ../build/Dockerfile
      args:
        BASE_IMAGE: ${MCP_SERVERS_IMAGE:-python:3.12.13-slim}
    image: ${PROJECT_NAME}-mcp-servers:local
    container_name: ${PROJECT_NAME}-mcp-servers
    restart: unless-stopped
    deploy:
      replicas: ${MCP_SERVERS_SCALE:-0}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      neo4j-graph-db:
        condition: service_started
      searxng:
        condition: service_started
    environment:
      SUPABASE_DB_HOST: supabase-db
      SUPABASE_DB_PORT: "5432"
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j-graph-db:7687}
      GRAPH_DB_USER: ${GRAPH_DB_USER:-neo4j}
      GRAPH_DB_PASSWORD: ${GRAPH_DB_PASSWORD}
      SEARXNG_URL: http://searxng:8080
      MCP_POSTGRES_MAX_ROWS: ${MCP_POSTGRES_MAX_ROWS:-50}
      # Empty by default: the runtime falls back to MCP_POSTGRES_MAX_ROWS.
      MCP_NEO4J_MAX_ROWS: ${MCP_NEO4J_MAX_ROWS:-}
      MCP_SEARXNG_MAX_RESULTS: ${MCP_SEARXNG_MAX_RESULTS:-5}
      MCP_TOOL_TIMEOUT_SECONDS: ${MCP_TOOL_TIMEOUT_SECONDS:-15}
    ports:
      - "127.0.0.1:${MCP_SERVERS_PORT}:8000"
    networks:
      - backend-network
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
