# services/trino/compose.yml - Trino coordinator with Atlas lakehouse catalog
services:
  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:482}
    container_name: ${PROJECT_NAME}-trino
    restart: unless-stopped
    deploy:
      replicas: ${TRINO_SCALE:-0}
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${TRINO_PORT}:8080"
    environment:
      # Kong always adds X-Forwarded-* headers; Trino rejects them with 406
      # unless forwarded-header processing is on. Set as a JVM system
      # property (Airlift reads those as config) so the image's own
      # config.properties stays untouched.
      JAVA_TOOL_OPTIONS: -Dhttp-server.process-forwarded=true
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # Same bucket iceberg-rest, Spark and minio-init use (catalog/lakehouse.properties).
      MINIO_BUCKET_ICEBERG_LAKEHOUSE: ${MINIO_BUCKET_ICEBERG_LAKEHOUSE:-lakehouse}
      MINIO_ICEBERG_ACCESS_KEY: ${MINIO_ICEBERG_ACCESS_KEY}
      MINIO_ICEBERG_SECRET_KEY: ${MINIO_ICEBERG_SECRET_KEY}
    volumes:
      - ./catalog:/etc/trino/catalog:ro
    depends_on:
      iceberg-rest:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network
