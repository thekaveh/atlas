connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://${ENV:SILO_BUCKET_ICEBERG_LAKEHOUSE}/

fs.native-s3.enabled=true
s3.endpoint=http://silo:9000
s3.region=${ENV:SILO_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:SILO_ICEBERG_ACCESS_KEY}
s3.aws-secret-key=${ENV:SILO_ICEBERG_SECRET_KEY}
