# services/asset-worker/service.yml — glTF post-processing worker
name: asset-worker
label: "Asset Worker (glTF post-processing)"
category: media
docs: services/asset-worker/README.md

capabilities:
  - name: "Mechanical glTF conditioning"
    status: supported
    verification: tested
    note: "Atlas normalizes scale and grounding, validates GLB input, and applies opt-in glTF-Transform simplification, Draco or Meshopt compression, and WebP texture compression (KTX2 needs KTX-Software, which the image does not ship)."
  - name: "Bounded authenticated post-processing API"
    status: supported
    verification: tested
    note: "Upload, MinIO-reference, and artifact routes require the generated bearer token and enforce admission, upload-size, and subprocess-timeout bounds; health and metrics remain public."
  - name: "Content-addressed optimized artifacts"
    status: supported
    verification: tested
    note: "Optimized GLBs use SHA-256 keys in the scoped MinIO bucket by default, with an explicitly selected local-artifact fallback."
  - name: "Semantic orientation correction"
    status: partial
    verification: tested
    note: "The default trusts glTF Y-up orientation; callers may request explicit-axis or bounded auto reorientation, but product-specific notions of upright remain consumer policy."

containers:
  - asset-worker

images:
  - var: ASSET_WORKER_IMAGE
    default: "python:3.12.9-slim"
    container: asset-worker

sources:
  var: ASSET_WORKER_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container"
    - id: disabled
      label: "Disabled"

env:
  - name: ASSET_WORKER_SOURCE
    default: disabled
    description: "Deployment mode for the glTF post-processing worker."
  - name: ASSET_WORKER_PORT
    description: "Host port for the asset-worker API (in-container listen port is 8095)."
  - name: ASSET_WORKER_SCALE
    auto_managed: true
  - name: ASSET_WORKER_ENDPOINT
    auto_managed: true
    description: "In-network URL for the asset-worker API."
  - name: ASSET_WORKER_API_TOKEN
    default: ""
    secret: true
    description: "Auto-generated bearer token required by all Asset Worker data and processing routes; /health remains unauthenticated."
  - name: ASSET_WORKER_ALLOWED_INPUT_BUCKETS
    default: ""
    description: "Optional comma- or space-separated reference-route bucket allowlist; blank follows MINIO_BUCKET_ASSET_INPUTS."
  - name: ASSET_WORKER_GLTF_TRANSFORM_VERSION
    default: "4.5.0"
    description: "Expected pinned @gltf-transform/cli lock version; overrides must match package.json and package-lock.json."
  - name: ASSET_WORKER_MAX_UPLOAD_MB
    default: "200"
    description: "Maximum GLB upload or MinIO reference size in MiB. Input is streamed and rejected before transformation when this limit is exceeded."
  - name: ASSET_WORKER_TIMEOUT_SECONDS
    default: "300"
    description: "Per-command timeout for gltf-transform inspect, validate, and optimize subprocesses."
  - name: ASSET_WORKER_CONCURRENCY
    default: "1"
    description: "Maximum concurrent glTF mutation requests; saturated workers reject new work with HTTP 429 before request-body parsing or object-store fetch."
  - name: ASSET_WORKER_ARTIFACT_DIR
    default: "/data/artifacts"
    description: "Local artifact cache used when MinIO upload is disabled or for direct downloads."
  - name: ASSET_WORKER_MINIO_ENABLED
    default: true
    description: "When true, optimized GLBs are written to MinIO using content-addressed keys."
  - name: ASSET_WORKER_MINIO_BUCKET
    default: asset-worker
    description: "MinIO bucket for optimized GLB outputs."
  - name: ASSET_WORKER_MINIO_ENDPOINT
    auto_managed: true
    description: "In-network MinIO S3 API endpoint used by the worker."
  - name: ASSET_WORKER_MINIO_ACCESS_KEY
    default: ""
    secret: true
    description: "Optional MinIO access key override. Empty uses the generated asset-worker scoped MinIO account."
  - name: ASSET_WORKER_MINIO_SECRET_KEY
    default: ""
    secret: true
    description: "Optional MinIO secret key override. Empty uses the generated asset-worker scoped MinIO account."

depends_on:
  required:
    - minio
  optional:
    - backend
    - comfyui
    - fal
    - blender-mcp

rows:
  - display_name: "Asset Worker"
    source_var: ASSET_WORKER_SOURCE
    port_var: ASSET_WORKER_PORT
    scale_var: ASSET_WORKER_SCALE
    alias: asset-worker.localhost
    description: "glTF post-processing API for upright, normalized, optimized GLB assets."

exports:
  - name: ASSET_WORKER_ENDPOINT
    consumers:
      - backend
      - comfyui

runtime_sc:
  asset-worker:
    container:
      scale: 1
      environment:
        ASSET_WORKER_ENDPOINT: http://asset-worker:8095
        ASSET_WORKER_MINIO_ENDPOINT: http://minio:9000
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        ASSET_WORKER_ENDPOINT: ''
        ASSET_WORKER_MINIO_ENDPOINT: ''
      deploy: {}
      extra_hosts: []

# Compose gates the container on minio/minio-init, so a launch with MinIO
# off (e.g. the gen-ai-creative track) would hang instead of failing.
runtime_deps:
  asset-worker:
    conditional_requires:
      - when:
          ASSET_WORKER_SOURCE: container
        requires:
          - minio
        auto_resolve: false
        error_message: "Asset Worker requires MinIO (its container waits on minio and minio-init); enable MINIO_SOURCE (gen-ai-creative leaves it off: pass --minio-source container) or disable Asset Worker."

data_flow:
  calls:
    - minio

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared (#967); no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
