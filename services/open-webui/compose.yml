# services/open-webui/compose.yml — Open WebUI + init
services:
  open-web-ui:
    image: ${OPEN_WEB_UI_IMAGE}
    container_name: ${PROJECT_NAME}-open-web-ui
    restart: unless-stopped
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      supabase-realtime:
        condition: service_started
      supabase-storage:
        condition: service_started
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    deploy:
      replicas: ${OPEN_WEB_UI_SCALE:-1}
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    environment:
      # Identifies outgoing HTTP requests (langchain_community emits a
      # `USER_AGENT environment variable not set` warning at boot if
      # unset; setting it silences the warning and lets upstreams attribute
      # the traffic to the stack).
      USER_AGENT: Atlas/Open-WebUI
      # Open WebUI's OpenAI-compatible client points at the LiteLLM gateway.
      # The gateway exposes every provider behind one /v1 surface.
      OPENAI_API_BASE_URLS: http://litellm:4000/v1
      OPENAI_API_KEYS: ${LITELLM_MASTER_KEY}
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      DATABASE_URL: postgresql://${OPEN_WEBUI_DB_USER_URI:?OPEN_WEBUI_DB_USER_URI is required}:${OPEN_WEBUI_DB_PASSWORD_URI:?OPEN_WEBUI_DB_PASSWORD_URI is required}@supabase-db:5432/${SUPABASE_DB_NAME_URI:?SUPABASE_DB_NAME_URI is required}
      WEBUI_SECRET_KEY: ${OPEN_WEB_UI_SECRET_KEY}
      # (no WEBUI_ADMIN_* here: Open WebUI has no such config vars —
      # the admin account is created by open-webui-init via the
      # /api/v1/auths/signup API using OPEN_WEB_UI_ADMIN_*.)
      COMFYUI_BASE_URL: ${COMFYUI_ENDPOINT:-http://comfyui:18188}
      COMFYUI_COMPLETION_TIMEOUT_SECONDS: ${COMFYUI_COMPLETION_TIMEOUT_SECONDS:-300}
      ENABLE_IMAGE_GENERATION: true
      IMAGE_GENERATION_ENGINE: comfyui
      # TTS integration (openai-compatible via openedai-speech)
      AUDIO_TTS_ENGINE: ${OPEN_WEB_UI_TTS_ENGINE:-}
      AUDIO_TTS_OPENAI_API_BASE_URL: ${OPEN_WEB_UI_TTS_API_URL:-}
      AUDIO_TTS_OPENAI_API_KEY: "sk-unused"
      AUDIO_TTS_MODEL: ${OPEN_WEB_UI_TTS_MODEL:-}
      AUDIO_TTS_VOICE: ${OPEN_WEB_UI_TTS_VOICE:-}
      # STT integration (openai-compatible via parakeet)
      AUDIO_STT_ENGINE: ${OPEN_WEB_UI_STT_ENGINE:-}
      AUDIO_STT_OPENAI_API_BASE_URL: ${OPEN_WEB_UI_STT_API_URL:-}
      AUDIO_STT_OPENAI_API_KEY: ${OPEN_WEB_UI_STT_API_KEY:-}
      AUDIO_STT_MODEL: "whisper-1"
      # WebSocket Redis Integration (knobs are surfaced in .env.example so
      # users can disable websocket support, retarget the Redis DB index,
      # or shorten the model-list TTL during Hermes development without
      # editing compose.yml).
      ENABLE_WEBSOCKET_SUPPORT: ${OPEN_WEB_UI_WEBSOCKET_SUPPORT:-true}
      WEBSOCKET_MANAGER: "redis"
      WEBSOCKET_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/${OPEN_WEB_UI_REDIS_DB:-2}"
      REDIS_KEY_PREFIX: "openwebui"
      # Open WebUI renamed this knob; v0.6.32 reads MODELS_CACHE_TTL and has no
      # MODEL_LIST_CACHE_TTL at all, so the old key was inert and the effective
      # TTL was the 1-second default — Open WebUI refetched the LiteLLM model
      # list on essentially every request. The operator-facing variable name is
      # unchanged.
      MODELS_CACHE_TTL: ${OPEN_WEB_UI_MODEL_CACHE_TTL:-300}
      # Trusted server-side bearer used by bundled backend tools/functions.
      # Never expose this value to browser JavaScript.
      BACKEND_OPEN_WEBUI_API_TOKEN: ${BACKEND_OPEN_WEBUI_API_TOKEN}
    volumes:
      - open-web-ui-data:/app/backend/data
      - ./extras/tools:/app/backend/data/tools
      - ./extras/functions:/app/backend/data/functions
    ports:
      - "${HOST_BIND_IP:-}${OPEN_WEB_UI_PORT}:8080"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  open-webui-init:
    build:
      context: ./init
      args:
        BASE_IMAGE: ${OPEN_WEB_UI_INIT_IMAGE:-python:3.12.14-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579}
    container_name: ${PROJECT_NAME}-open-webui-init
    restart: "no"
    deploy:
      replicas: ${OPEN_WEB_UI_INIT_SCALE:-1}
    depends_on:
      open-web-ui:
        condition: service_started
      supabase-db-init:
        condition: service_completed_successfully
    environment:
      WEBUI_URL: http://open-web-ui:8080
      WEBUI_SECRET_KEY: ${OPEN_WEB_UI_SECRET_KEY}
      DATABASE_URL: postgresql://${OPEN_WEBUI_DB_USER_URI:?OPEN_WEBUI_DB_USER_URI is required}:${OPEN_WEBUI_DB_PASSWORD_URI:?OPEN_WEBUI_DB_PASSWORD_URI is required}@supabase-db:5432/${SUPABASE_DB_NAME_URI:?SUPABASE_DB_NAME_URI is required}
      ADMIN_EMAIL: ${OPEN_WEB_UI_ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${OPEN_WEB_UI_ADMIN_PASSWORD:-admin}
      ADMIN_NAME: ${OPEN_WEB_UI_ADMIN_NAME:-Admin}
      TOOLS_DIR: /tools
      FUNCTIONS_DIR: /functions
    volumes:
      - ./extras/tools:/tools:ro
      - ./extras/functions:/functions:ro
    networks:
      - backend-network

volumes:
  open-web-ui-data:
    name: ${PROJECT_NAME}-open-web-ui-data
    driver: local
