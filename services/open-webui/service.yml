# services/open-webui/service.yml — Open WebUI + init
name: open-webui
label: "Open WebUI (chat interface)"
category: apps
docs: services/open-webui/README.md

capabilities:
  - name: "Unified browser chat through LiteLLM"
    status: supported
    verification: tested
    note: "Atlas initializes an Open WebUI administrator and routes its OpenAI-compatible model traffic through the LiteLLM catalog, including Hermes when enabled."
  - name: "Source-aware speech and image features"
    status: partial
    verification: tested
    note: "Open WebUI receives selected speech endpoints and ComfyUI settings, while model readiness, disabled providers, and source-specific credentials can leave individual features unavailable."
  - name: "Backend memory and research tools"
    status: partial
    verification: tested
    note: "Bundled server-side tools use scoped Backend tokens and synchronized user identities, but extraction is bounded best-effort and research depends on Local Deep Researcher availability."
  - name: "Safe prompt secret redaction"
    status: partial
    verification: tested
    note: "The registered filter redacts common secret patterns only after an administrator enables its default-off valve, and it covers Open WebUI user messages rather than stack-wide traffic."
  - name: "Open WebUI access control"
    status: supported
    verification: tested
    note: "Direct and CORS-only chat.localhost paths rely on Open WebUI's own account and session authentication; Kong provides routing but no additional login layer."
  - name: "Chat data and upload persistence"
    status: partial
    verification: documented
    note: "Application state uses Postgres and a named Open WebUI data volume, but MinIO/S3 storage, replicated file state, and a tested restore workflow are not configured."
  - name: "Shared multi-replica WebUI availability"
    status: not-supported
    verification: documented
    note: "Redis backs websocket coordination, but Atlas runs one Open WebUI process and one init job without a certified horizontally scaled application or file-storage topology."

containers:
  - open-web-ui
  - open-webui-init

images:
  - var: OPEN_WEB_UI_IMAGE
    default: "dyrnq/open-webui:v0.6.32"
    container: open-web-ui
  - var: OPEN_WEB_UI_INIT_IMAGE
    # Pinned to the patch version the litellm/init Dockerfile pins, so the
    # real compose build path stays reproducible. Compose passes this value
    # as BASE_IMAGE, so a floating 3.12-slim here would defeat the
    # Dockerfile's reviewed patch-and-digest pin.
    default: "python:3.12.14-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579"
    container: open-webui-init

sources:
  var: OPEN_WEB_UI_SOURCE
  default: container
  options:
    - id: container
      label: "Container"
    - id: disabled
      label: "Disabled"

env:
  - name: OPEN_WEB_UI_SOURCE
    default: container
  - name: OPEN_WEBUI_DB_USER
    default: atlas_open_webui
    description: "Scoped PostgreSQL owner for Open WebUI migration objects."
  - name: OPEN_WEBUI_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated password for the scoped Open WebUI database role."
  - name: OPEN_WEBUI_DB_USER_URI
    default: atlas_open_webui
    description: "Bootstrapper-synchronized percent-encoded OPEN_WEBUI_DB_USER for DSN userinfo."
  - name: OPEN_WEBUI_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded OPEN_WEBUI_DB_PASSWORD for DSN userinfo."
  - name: OPEN_WEB_UI_STT_API_KEY
    auto_managed: true
    secret: true
    description: "Parakeet bearer token when a Parakeet source is selected; a non-secret compatibility placeholder for other enabled STT engines."
  - name: OPEN_WEB_UI_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: OPEN_WEB_UI_SECRET_KEY
    default: secret
    secret: true
    description: "Open WebUI session/signing secret; auto-generated by the bootstrapper when left as the placeholder."
  - name: OPEN_WEB_UI_ADMIN_EMAIL
    default: "admin@localhost"
  - name: OPEN_WEB_UI_ADMIN_PASSWORD
    default: admin
    secret: true
    description: "Initial Open WebUI admin password; auto-generated by the bootstrapper when left as the placeholder."
  - name: OPEN_WEB_UI_ADMIN_NAME
    default: Admin
  - name: OPEN_WEB_UI_WEBSOCKET_SUPPORT
    default: true
  - name: OPEN_WEB_UI_REDIS_DB
    default: 2
  - name: OPEN_WEB_UI_MODEL_CACHE_TTL
    default: 300
  - name: OPEN_WEB_UI_TTS_ENGINE
    default: ""
    description: "Set by bootstrapper when speaches/chatterbox are enabled."
  - name: OPEN_WEB_UI_STT_ENGINE
    default: ""
  - name: OPEN_WEB_UI_TTS_MODEL
    default: ""
    description: "Model name Open WebUI sends to /v1/audio/speech. Empty = engine default."
  - name: OPEN_WEB_UI_TTS_VOICE
    default: ""
    description: "Voice id. Empty = engine default."
  - name: OPEN_WEB_UI_TTS_API_URL
    auto_managed: true
  - name: OPEN_WEB_UI_STT_API_URL
    auto_managed: true
  - name: OPEN_WEB_UI_SCALE
    auto_managed: true
  - name: OPEN_WEB_UI_INIT_SCALE
    auto_managed: true

depends_on:
  # Open WebUI's real bootstrap gates (per compose.yml) are
  # supabase-db-init + supabase-{realtime,storage} + redis + litellm —
  # Hermes was over-claimed: Open WebUI reaches the `hermes-agent` model
  # through LiteLLM's catalog, so Hermes is a runtime-optional path, not
  # a startup blocker.
  required:
    - supabase
    - redis
    - litellm
  optional:
    - hermes

rows:
  - display_name: "Open WebUI"
    source_var: OPEN_WEB_UI_SOURCE
    port_var: OPEN_WEB_UI_PORT
    scale_var: OPEN_WEB_UI_SCALE
    alias: chat.localhost
    description: "Chat interface (consumes LiteLLM model list incl. hermes-agent)."

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  open-web-ui:
    container:
      scale: 1
      environment:
        OPENAI_API_BASE_URLS: http://litellm:4000/v1
        OPENAI_API_KEYS: ${LITELLM_MASTER_KEY}
        COMFYUI_BASE_URL: ${COMFYUI_ENDPOINT:-http://comfyui:18188}
        COMFYUI_COMPLETION_TIMEOUT_SECONDS: ${COMFYUI_COMPLETION_TIMEOUT_SECONDS:-300}
        # STT_ENDPOINT / TTS_ENDPOINT / DOCLING_ENDPOINT are owned by the
        # provider manifests (stt_provider, tts_provider, doc_processor) —
        # service_config.py reads them from THOSE runtime_sc dicts, not
        # this one. Open-WebUI itself plumbs them into AUDIO_*_OPENAI_API_*
        # variables in the compose env block (which is the actual injection
        # point — see project_runtime_sc_vs_compose_env_dual_write.md).
        # Listing them here is dead data on both axes.
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

runtime_deps:
  open-web-ui:
    optional:
    - weaviate
    - local-deep-researcher
    - parakeet
    - speaches
    - chatterbox
    - docling
    info_message: Open WebUI enabled - will connect to available optional services
      (weaviate, local-deep-researcher, parakeet, speaches, chatterbox, docling)

data_flow:
  # Open WebUI reaches every plugged-in media + agent feature at request
  # time. Media calls are guarded by their SOURCE being != disabled;
  # runtime_deps.open-web-ui.optional lists the same services from a
  # different angle (wizard hints + compose ordering). supabase is the
  # app DB (DATABASE_URL), redis backs the websocket manager, and the
  # bundled extras tools/functions call the backend's memory/research/
  # comfyui endpoints. searxng + weaviate are NOT wired today — they
  # live in README §5.4 Future pairs (ENABLE_RAG_WEB_SEARCH / vector
  # store) until someone adds the mechanism.
  calls:
    - litellm
    - supabase
    - redis
    - backend
    - comfyui
    - stt-provider
    - tts-provider
    - local-deep-researcher
