# services/tei-reranker/compose.yml
# TEI Reranker fragment. Image resolved per source variant at .env-render time
# via TEI_RERANKER_IMAGE_RESOLVED (set by _generate_tei_reranker_config).
services:
  tei-reranker:
    image: ${TEI_RERANKER_IMAGE_RESOLVED:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07}
    # Bootstrapper picks the right image for the host arch:
    #   amd64 → cpu-1.9 (ORT backend, versioned)
    #   arm64 → cpu-arm64-latest (candle backend, loads safetensors)
    # See bootstrapper/services/service_config.py::_generate_tei_reranker_config
    container_name: ${PROJECT_NAME}-tei-reranker
    deploy:
      replicas: ${TEI_RERANKER_SCALE:-0}
      resources:
        limits:
          memory: ${TEI_RERANKER_MEMORY_LIMIT:-4g}
          cpus: '${TEI_RERANKER_CPU_LIMIT:-2.0}'
    command:
      - "--model-id=${TEI_RERANKER_MODEL_ID:-mixedbread-ai/mxbai-rerank-base-v1}"
      - "--revision=${TEI_RERANKER_REVISION:-800f24c113213a187e65bde9db00c15a2bb12738}"
      - "--max-client-batch-size=${TEI_RERANKER_MAX_CLIENT_BATCH_SIZE:-32}"
      - "--port=80"
    ports:
      - "${HOST_BIND_IP:-}${TEI_RERANKER_PORT}:80"
    environment:
      # Every var listed in runtime_sc.tei-reranker.<source>.environment MUST
      # also appear here (memory: project_runtime_sc_vs_compose_env_dual_write).
      TEI_RERANKER_ENDPOINT: ${TEI_RERANKER_ENDPOINT}
      HF_HOME: ${TEI_RERANKER_HF_CACHE_DIR:-/data}
    volumes:
      - tei-reranker-data:/data
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    healthcheck:
      # TEI's image has curl but not wget — using wget here flipped the
      # container to (unhealthy) on every probe with
      # `exec: "wget": executable file not found in $PATH`.
      test: ["CMD", "curl", "-fs", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    restart: unless-stopped

volumes:
  tei-reranker-data:
    name: ${PROJECT_NAME}-tei-reranker-data
