# services/langfuse/service.yml — Langfuse LLM trace observability
name: langfuse
label: "Langfuse (LLM traces + evals)"
category: infra
docs: services/langfuse/README.md

containers:
  - langfuse-init
  - langfuse-web
  - langfuse-worker
  - langfuse-clickhouse

images:
  - var: LANGFUSE_IMAGE
    default: "langfuse/langfuse:3"
    container: langfuse-web
  - var: LANGFUSE_WORKER_IMAGE
    default: "langfuse/langfuse-worker:3"
    container: langfuse-worker
  - var: LANGFUSE_CLICKHOUSE_IMAGE
    default: "clickhouse/clickhouse-server:25.8"
    container: langfuse-clickhouse
  - var: LANGFUSE_INIT_IMAGE
    default: "alpine:3.22"
    container: langfuse-init

sources:
  var: LANGFUSE_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (Langfuse web + worker + ClickHouse)"
    - id: disabled
      label: "Disabled"

env:
  - name: LANGFUSE_SOURCE
    default: disabled
  - name: LANGFUSE_PORT
    description: "Host port for the Langfuse web UI/API (in-container 3000)."
  - name: LANGFUSE_ENDPOINT
    auto_managed: true
    description: "In-network URL used by LiteLLM when Langfuse tracing is enabled."
  - name: LANGFUSE_WEB_SCALE
    auto_managed: true
  - name: LANGFUSE_WORKER_SCALE
    auto_managed: true
  - name: LANGFUSE_CLICKHOUSE_SCALE
    auto_managed: true
  - name: LANGFUSE_INIT_SCALE
    auto_managed: true
  - name: LANGFUSE_DB_NAME
    default: langfuse
  - name: LANGFUSE_SALT
    default: ""
    secret: true
    description: "Auto-generated by the bootstrapper on first run."
  - name: LANGFUSE_ENCRYPTION_KEY
    default: ""
    secret: true
    description: "64 hex chars. Auto-generated by the bootstrapper on first run."
  - name: LANGFUSE_NEXTAUTH_SECRET
    default: ""
    secret: true
    description: "Auto-generated by the bootstrapper on first run."
  - name: LANGFUSE_PUBLIC_KEY
    default: ""
    secret: true
    description: "Initial Langfuse project public key used by LiteLLM tracing."
  - name: LANGFUSE_SECRET_KEY
    default: ""
    secret: true
    description: "Initial Langfuse project secret key used by LiteLLM tracing."
  - name: LANGFUSE_INIT_ORG_ID
    default: atlas
  - name: LANGFUSE_INIT_ORG_NAME
    default: Atlas
  - name: LANGFUSE_INIT_PROJECT_ID
    default: atlas-default
  - name: LANGFUSE_INIT_PROJECT_NAME
    default: Atlas Default
  - name: LANGFUSE_INIT_USER_EMAIL
    default: admin@atlas.localhost
  - name: LANGFUSE_INIT_USER_NAME
    default: Atlas Admin
  - name: LANGFUSE_INIT_USER_PASSWORD
    default: ""
    secret: true
    description: "Auto-generated by the bootstrapper on first run."
  - name: LANGFUSE_CLICKHOUSE_USER
    default: clickhouse
  - name: LANGFUSE_CLICKHOUSE_PASSWORD
    default: ""
    secret: true
    description: "Auto-generated by the bootstrapper on first run."
depends_on:
  required:
    - supabase
    - redis
    - minio
    - litellm
    - kong
    - ray
  optional: []

rows:
  - display_name: "Langfuse"
    source_var: LANGFUSE_SOURCE
    port_var: LANGFUSE_PORT
    scale_var: LANGFUSE_WEB_SCALE
    alias: langfuse.localhost
    description: "LLM traces, prompt/eval observability, and LiteLLM cost/latency inspection."

runtime_sc:
  langfuse-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  langfuse-web:
    container:
      scale: 1
      environment:
        LANGFUSE_ENDPOINT: http://langfuse-web:3000
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        LANGFUSE_ENDPOINT: ''
      deploy: {}
      extra_hosts: []
  langfuse-worker:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  langfuse-clickhouse:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - supabase
    - redis
    - minio
    - litellm
