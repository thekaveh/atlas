# services/langfuse/compose.yml — Langfuse web + worker + ClickHouse
services:
  langfuse-init:
    build:
      context: ./init
      args:
        BASE_IMAGE: ${LANGFUSE_INIT_IMAGE:-alpine:3.24.1}
    image: ${PROJECT_NAME}-langfuse-init:local
    container_name: ${PROJECT_NAME}-langfuse-init
    restart: "no"
    deploy:
      replicas: ${LANGFUSE_INIT_SCALE:-0}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      PGHOST: supabase-db
      PGPORT: 5432
      PGUSER: ${LANGFUSE_DB_USER:?LANGFUSE_DB_USER is required}
      PGPASSWORD: ${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD is required}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME:-langfuse}
    volumes:
      - ./init/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-langfuse.sh"]
    networks:
      - backend-network

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.33.6}
    container_name: ${PROJECT_NAME}-langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    deploy:
      replicas: ${LANGFUSE_CLICKHOUSE_SCALE:-0}
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      TZ: UTC
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  langfuse-web:
    image: ${LANGFUSE_IMAGE:-langfuse/langfuse:3.115.0}
    container_name: ${PROJECT_NAME}-langfuse-web
    restart: unless-stopped
    deploy:
      replicas: ${LANGFUSE_WEB_SCALE:-0}
    depends_on:
      langfuse-init:
        condition: service_completed_successfully
      langfuse-clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HOST_BIND_IP:-}${LANGFUSE_PORT}:3000"
    environment: &langfuse-env
      # Next.js standalone binds to process.env.HOSTNAME. Docker sets HOSTNAME
      # to the container ID, so the server binds that container's eth0 IP ONLY
      # — nothing listens on loopback, and the loopback healthcheck below can
      # never pass. The app is fully functional the whole time, so langfuse-web
      # sat at (unhealthy) forever and ./start.sh exited non-zero, which breaks
      # scripted bring-up for any consumer that enables Langfuse (#928).
      #
      # Upstream's compose does not hit this because it ships NO healthcheck on
      # langfuse-web at all; Atlas adds one, which is what exposes the bind.
      # Pinning 0.0.0.0 is the standard Next.js-standalone-in-Docker fix and
      # keeps any future in-container or sidecar probe working too.
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: http://langfuse.localhost:${KONG_HTTP_PORT}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER_URI:?LANGFUSE_DB_USER_URI is required}:${LANGFUSE_DB_PASSWORD_URI:?LANGFUSE_DB_PASSWORD_URI is required}@supabase-db:5432/${LANGFUSE_DB_NAME_URI:?LANGFUSE_DB_NAME_URI is required}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${MINIO_BUCKET_LANGFUSE:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${MINIO_REGION:-us-east-1}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_LANGFUSE_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_LANGFUSE_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${MINIO_BUCKET_LANGFUSE:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${MINIO_REGION:-us-east-1}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_LANGFUSE_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_LANGFUSE_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${MINIO_BUCKET_LANGFUSE:-langfuse}
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: ${MINIO_REGION:-us-east-1}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_LANGFUSE_ACCESS_KEY}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_LANGFUSE_SECRET_KEY}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-atlas}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Atlas}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-atlas-default}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Atlas Default}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@atlas.localhost}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Atlas Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE:-langfuse/langfuse-worker:3.115.0}
    container_name: ${PROJECT_NAME}-langfuse-worker
    restart: unless-stopped
    deploy:
      replicas: ${LANGFUSE_WORKER_SCALE:-0}
    depends_on:
      langfuse-init:
        condition: service_completed_successfully
      langfuse-clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *langfuse-env
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

volumes:
  langfuse-clickhouse-data:
    name: ${PROJECT_NAME}-langfuse-clickhouse-data
    driver: local
  langfuse-clickhouse-logs:
    name: ${PROJECT_NAME}-langfuse-clickhouse-logs
    driver: local
