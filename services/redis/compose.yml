# Redis — cache / session / queue substrate for the stack.
# Included from the root docker-compose.yml `include:` list like every
# other fragment; see services/README.md for the fragment conventions.

services:
  redis:
    image: ${REDIS_IMAGE}
    container_name: ${PROJECT_NAME}-redis
    restart: unless-stopped
    # maxmemory defaults to 0 (unlimited), preserving the historical
    # behaviour: without a cap Redis grows until the CONTAINER is OOM-killed,
    # which loses the in-flight queue rather than shedding anything. Set
    # REDIS_MAXMEMORY (e.g. 512mb) to bound it — recommended for any
    # long-running or multi-consumer deployment.
    #
    # The policy is volatile-lru, NOT noeviction: db 0 mixes LiteLLM's
    # response cache with n8n's BullMQ queue,
    # Langfuse's queue and the backend's media store. volatile-lru evicts
    # only keys that carry a TTL, including ordinary media operation records.
    # Those records can disappear before their seven-day retention expires.
    # Budget-tracked in-flight records, unresolved submissions and pending
    # ledger intents have no TTL.
    # The RAG execution lease and the Celery memory-consolidation lease DO
    # carry a TTL, so a cap lets eviction hand a running job to a second
    # worker (#1040; README §9). A logical db does not scope the policy.
    # Other persistent keys also survive eviction. Under noeviction a full
    # instance instead rejects WRITES,
    # so the cache would take the whole queue down with it.
    #
    # Worst case is unchanged: if nothing volatile remains, volatile-lru
    # returns the same OOM error noeviction would have.
    # The password reaches Redis through a config file in /dev/shm, not argv:
    # the server's command line is visible in `ps` for the life of the
    # container (#1381). /dev/shm is memory-backed, so the file never lands in
    # the container's writable layer. The sed escapes backslash and double
    # quote for the config's quoted value. A newline would split the config
    # line, so it is refused. Compose interpolates a bare `$`, so shell
    # variables are `$$`. The script starts as root only to repair ownership
    # of /data left by earlier runs, then drops to the `redis` user with the
    # same setpriv call the image entrypoint uses, before the server starts.
    command:
      - sh
      - -c
      - |
        umask 077
        if [ "$$(printf '%s' "$$REDIS_PASSWORD" | wc -l | tr -d ' ')" != 0 ]; then
          echo "REDIS_PASSWORD must not contain a newline" >&2
          exit 1
        fi
        find /data \! -user redis -exec chown redis '{}' +
        esc=$$(printf '%s' "$$REDIS_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
        printf 'requirepass "%s"\n' "$$esc" > /dev/shm/redis.conf
        chown redis:redis /dev/shm/redis.conf
        exec setpriv --reuid redis --regid redis --clear-groups redis-server /dev/shm/redis.conf --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-0} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    volumes:
      - redis-data:/data
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${REDIS_PORT}:6379"
    # redis-cli reads REDISCLI_AUTH, so the password is not in the argv of
    # every probe (visible to any local user through ps on Linux).
    environment:
      # Required: a blank value would write `requirepass ""`, which turns
      # authentication off.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      # redis-cli exits 0 on error replies (-LOADING after an AOF replay,
      # NOAUTH), so require PONG or dependents are released early.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A large AOF replays as -LOADING, which no longer counts as healthy.
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.86.0}
    container_name: ${PROJECT_NAME}-redis-exporter
    restart: unless-stopped
    deploy:
      replicas: ${REDIS_EXPORTER_SCALE:-0}
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # /scrape?target=<host> dials any target with the exporter's options,
      # REDIS_PASSWORD included, so anything that can reach :9121 could
      # collect the shared Redis password (2026-10-08 run, cycle 32).
      # Prometheus scrapes /metrics, which this does not affect.
      REDIS_EXPORTER_DISABLE_SCRAPE_ENDPOINT: "true"
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${REDIS_EXPORTER_PORT}:9121"
    depends_on:
      redis:
        condition: service_healthy
    # No container healthcheck: oliver006/redis_exporter is a distroless image
    # with NO shell and no wget/curl/nc, so a CMD healthcheck can't probe its
    # own :9121/metrics endpoint (the previous `wget --spider` test always
    # failed → permanent "unhealthy", a false signal). The exporter's real
    # liveness is owned by Prometheus, which scrapes redis-exporter:9121/metrics
    # directly; nothing depends_on this container's health.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

volumes:
  redis-data:
    name: ${PROJECT_NAME}-redis-data
    driver: local
