# services/redis/service.yml
#
# Manifest for the Redis cache/queue. First service carved out of the
# monolithic docker-compose.yml during the configuration modularization;
# the migration is now complete and the bootstrapper reads manifests
# directly (bootstrapper/service-configs.yml has been retired). Redis
# has a single container, no source variants, and is consumed by half
# the stack (n8n, kong, open-webui, backend, local-deep-researcher).

name: redis
label: "Redis (cache & queue)"
category: data
docs: services/redis/README.md

capabilities:
  - name: "Authenticated cache and queue substrate"
    status: supported
    verification: tested
    note: "Atlas runs password-protected Redis as the shared cache, queue, coordination, and transient-state substrate for multiple service families."
  - name: "AOF persistence and bounded eviction"
    status: partial
    verification: tested
    note: "Append-only persistence and volatile-LRU are configured, but the default zero maxmemory is unbounded and only expiring keys become eviction candidates after a cap is set."
  - name: "Per-service ACL and transport isolation"
    status: not-supported
    verification: documented
    note: "Consumers share one password and logical database convention over plaintext Redis; Atlas provisions neither per-service ACL users nor TLS."

containers:
  - redis
  - redis-exporter

images:
  - var: REDIS_IMAGE
    default: "redis:7.2.14-alpine"
    container: redis
    notes: "Bumping the redis version: change this default and rerun ./start.sh."
  - var: REDIS_EXPORTER_IMAGE
    default: "oliver006/redis_exporter:v1.86.0"
    container: redis-exporter
    notes: "Prometheus exporter sidecar. Scales 1↔0 with PROMETHEUS_SOURCE (gated by _generate_prometheus_config)."

env:
  - name: REDIS_SOURCE
    default: container
    description: |
      Single-option source toggle. Redis only ever runs as a container.
      Kept as an env entry (rather than a sources: block) so the wizard
      does not render a one-option dropdown. The legacy source validator
      still expects REDIS_SOURCE=container until Phase D.
  - name: REDIS_MAXMEMORY
    default: "0"
    description: "Redis memory cap (redis-server --maxmemory), e.g. 512mb. 0 means unlimited, which is the historical behaviour: Redis grows until the CONTAINER is OOM-killed, losing in-flight queue state rather than shedding anything. Setting a cap lets REDIS_MAXMEMORY_POLICY shed recomputable data instead. Recommended for long-running or multi-consumer deployments; size it to roughly 75% of the container's memory budget."
  - name: REDIS_MAXMEMORY_POLICY
    default: volatile-lru
    description: "Eviction policy once REDIS_MAXMEMORY is reached. volatile-lru evicts only keys carrying a TTL, which on this stack means LiteLLM's response cache — db 0 also holds n8n's BullMQ queue, Kong's counters, Langfuse's queue and the backend's media store, all written WITHOUT a TTL, so they survive. Under the previous noeviction a full instance rejected writes instead, letting an oversized cache take the queue down with it. With nothing volatile left, volatile-lru returns the same OOM error noeviction would."
  - name: REDIS_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Host port. Container port is always 6379."
  - name: REDIS_PASSWORD
    default: redis_password
    secret: true
    description: |
      Used by every consumer (n8n queue, kong rate-limit cache,
      open-webui websocket store, backend session/queue, local-deep-
      researcher worker queue). The default is for fresh-install
      convenience only; rotate before any deployment.
  - name: REDIS_URL
    default: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    description: |
      Default connection string (database index 0; also n8n's queue and
      Kong's rate-limit cache). Consumers that need a different DB index
      build their own URL (open-webui + lightrag share /2, jupyterhub
      uses /3). REDIS_PASSWORD is substituted at compose-interpolation
      time.
  - name: REDIS_EXPORTER_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Host port for redis-exporter (in-container 9121). Sidecar gated by PROMETHEUS_SOURCE."
  - name: REDIS_EXPORTER_SCALE
    auto_managed: true
    description: "Set by _generate_prometheus_config() to 1 when PROMETHEUS_SOURCE=container, 0 otherwise."

# Manifest-level depends_on.required lists `supabase` for ORDERING / slot-pinning
# only: the topology port allocator derives slot positions from depends_on, so
# removing it would renumber later services' ports. Redis has NO functional
# Postgres dependency, and compose.yml no longer gates redis startup on
# supabase-db-init (PR #11 dropped that compose-level depends_on; only
# redis-exporter waits on redis being healthy).
depends_on:
  required:
    - supabase
  optional: []

rows:
  - display_name: "Redis"
    source_var: REDIS_SOURCE
    port_var: REDIS_PORT
    description: "Key-value cache and queue broker."

# Exports declare the env-var contract redis offers to other services.
# Consumer lists are advisory documentation; the validator only checks
# that each named consumer is itself a known manifest. Until the consumer
# manifests exist (Phase C), this stays empty so the validator stays clean.
#
# The compose-time wiring (KONG_REDIS_HOST: redis, REDIS_URL: ${REDIS_URL},
# WEBSOCKET_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/2", etc.)
# continues to work via the flat .env regardless of this exports list.
exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  redis:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
  redis-exporter:
    container:
      scale: 0   # placeholder — _generate_prometheus_config overwrites
      environment:
        REDIS_ADDR: "redis://redis:6379"
        REDIS_PASSWORD: ${REDIS_PASSWORD}
      deploy: {}
      extra_hosts: []

data_flow:
  calls: []
