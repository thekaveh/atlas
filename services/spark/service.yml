# services/spark/service.yml — Apache Spark standalone cluster
# master + N workers + history server. Distinct from Ray.
name: spark
label: "Apache Spark (standalone cluster)"
category: data
docs: services/spark/README.md

capabilities:
  - name: "Standalone batch compute cluster"
    status: supported
    verification: tested
    note: "Atlas configures one Spark master, an operator-selected worker count, and backend-network submission surfaces for standalone jobs."
  - name: "Spark Connect and history services"
    status: supported
    verification: tested
    note: "A health-checked backend-only Spark Connect sidecar serves remote sessions while the history server reads event logs from a provisioned MinIO bucket."
  - name: "Iceberg and Kafka data paths"
    status: partial
    verification: tested
    note: "Atlas bakes and configures the Iceberg, S3A, and Kafka connectors, but lakehouse and streaming operations require optional Iceberg REST and Redpanda services and live smoke remains opt-in."
  - name: "Highly available Spark control plane"
    status: not-supported
    verification: documented
    note: "The stock standalone topology has one master, no recovery directory, and no YARN or Kubernetes scheduler integration."
  - name: "Authenticated Spark web access"
    status: not-supported
    verification: tested
    note: "The direct SPARK_MASTER_UI_PORT and SPARK_HISTORY_PORT publishes are unauthenticated, the CORS-only Kong Spark routes are unauthenticated, and the default empty HOST_BIND_IP binds direct ports on all interfaces; set HOST_BIND_IP=127.0.0.1:, firewall or remove the direct ports, and use an authentication proxy or remove both Spark Kong routes before exposure beyond a trusted host."

containers:
  - spark-master
  - spark-worker
  - spark-history
  - spark-init
  - spark-connect

images:
  - var: SPARK_IMAGE
    default: "apache/spark:4.1.2"
    container: spark-master

sources:
  var: SPARK_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (standalone cluster + lakehouse-ready Connect)"
    - id: disabled
      label: "Disabled"

env:
  - name: SPARK_SOURCE
    default: disabled
  - name: SPARK_MASTER_UI_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Host port for the Spark Master Web UI (in-container 8080)."
  - name: SPARK_HISTORY_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Host port for the Spark History Server (in-container 18080)."
  - name: SPARK_WORKER_COUNT
    default: "2"
    description: "Number of spark-worker replicas alongside the master. 1-8."
  - name: SPARK_MASTER_SCALE
    auto_managed: true
  - name: SPARK_WORKER_SCALE
    auto_managed: true
    description: "Resolved by the bootstrapper from SPARK_WORKER_COUNT when source=container; 0 otherwise."
  - name: SPARK_HISTORY_SCALE
    auto_managed: true
  - name: SPARK_INIT_SCALE
    auto_managed: true
  - name: SPARK_CONNECT_SCALE
    auto_managed: true
    description: "Resolved by the bootstrapper from SPARK_SOURCE; spark-connect runs as a sidecar to spark-master."
  - name: SPARK_CONNECT_CORES_MAX
    default: "1"
    description: "Maximum standalone-cluster cores the long-lived Spark Connect server may hold. Keep below total worker cores so Airflow SparkSubmit and Zeppelin standalone workloads can run alongside Connect; raise only when the worker pool has enough headroom."
  - name: SPARK_MASTER_MEMORY_LIMIT
    default: 2g
    description: "Container memory limit for spark-master (deploy.resources.limits.memory). The standalone master process manages cluster state and requires minimal heap — 2 g is generous on a 32 GB host."
  - name: SPARK_MASTER_CPU_LIMIT
    default: "1.0"
    description: "Container CPU limit for spark-master (deploy.resources.limits.cpus). Master is lightweight; 1.0 core is ample."
  - name: SPARK_WORKER_MEMORY_LIMIT
    default: 4g
    description: "Container memory limit per spark-worker (deploy.resources.limits.memory). Workers run executor JVMs; 4 g per replica is a conservative cap on a 32 GB host with the default 2 workers (8 g total). Raise for memory-intensive jobs."
  - name: SPARK_WORKER_CPU_LIMIT
    default: "2.0"
    description: "Container CPU limit per spark-worker (deploy.resources.limits.cpus). 2.0 cores per worker leaves headroom for other services on the host."

depends_on:
  required:
    - minio
  optional:
    - supabase
    - iceberg-rest
    - redpanda

rows:
  - display_name: "Apache Spark"
    source_var: SPARK_SOURCE
    port_var: SPARK_MASTER_UI_PORT
    scale_var: SPARK_MASTER_SCALE
    alias: spark.localhost
    description: "Standalone Spark cluster for batch / SQL / DataFrame workloads."
  # Second row needed so Topology.aliases includes spark-history.localhost
  # for /etc/hosts setup. Same SOURCE drives both surfaces.
  - display_name: "Apache Spark — History Server"
    source_var: SPARK_SOURCE
    port_var: SPARK_HISTORY_PORT
    scale_var: SPARK_HISTORY_SCALE
    alias: spark-history.localhost
    description: "Spark History Server — post-mortem job inspection for completed Spark jobs."

exports: []

runtime_sc:
  # apache/spark images don't use SPARK_MODE — each role is started by an
  # explicit `/opt/spark/bin/spark-class` command in compose.yml. The env
  # blocks below mirror what compose.yml's `environment:` declares per
  # service (dual-write per project_runtime_sc_vs_compose_env_dual_write.md).
  spark-master:
    container:
      scale: 1
      environment:
        SPARK_MASTER_HOST: spark-master
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
        SPARK_MASTER_OPTS: >-
          -Dspark.master.rest.enabled=true
          -Dspark.master.rest.host=spark-master
          -Dspark.master.rest.port=6066
          -Dspark.standalone.submit.waitAppCompletion=true
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  spark-worker:
    container:
      scale: 2   # overridden by SPARK_WORKER_COUNT via auto_managed SPARK_WORKER_SCALE
      environment:
        AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
        AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
        AWS_REGION: ${MINIO_REGION:-us-east-1}
        AWS_ENDPOINT_URL_S3: http://minio:9000
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  spark-history:
    container:
      scale: 1
      environment:
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
        SPARK_HISTORY_OPTS: >-
          -Dspark.history.fs.logDirectory=s3a://spark-history/
          -Dspark.hadoop.fs.s3a.endpoint=http://minio:9000
          -Dspark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
          -Dspark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}
          -Dspark.hadoop.fs.s3a.path.style.access=true
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  spark-connect:
    # Spark Connect gRPC server (apache/spark's start-connect-server.sh).
    # Sidecar to spark-master — earlier attempts at in-master plugin
    # loading via SPARK_DAEMON_JAVA_OPTS didn't actually bind the
    # listener. Backend-only; no host port.
    container:
      scale: 1
      environment:
        SPARK_KAFKA_BOOTSTRAP_SERVERS: ${SPARK_KAFKA_BOOTSTRAP_SERVERS:-}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  # Convention: focus.data_flow.calls = what FOCUS calls (upstream).
  # Kong routes traffic TO Spark; that's Kong's outbound lane, not Spark's.
  # Same for the other in-stack services routed via *.localhost aliases.
  # NOTE: supabase is intentionally absent here even though the README
  # describes JDBC reads from inside jobs — the image ships no Postgres
  # JDBC driver and compose injects no SUPABASE_* vars, so the call is
  # user-driven, not part of the runtime topology (same rule as
  # zeppelin's litellm exclusion).
  calls:
    - minio      # s3a:// history + user data
    - iceberg-rest  # lakehouse REST catalog when enabled
    - redpanda  # optional Kafka API broker for Structured Streaming jobs
