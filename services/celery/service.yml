# services/celery/service.yml — Redis-backed backend async worker tier
name: celery
label: "Celery + Flower (async jobs)"
category: agents
docs: services/celery/README.md

capabilities:
  - name: "Backend asynchronous task execution"
    status: partial
    verification: tested
    note: "The worker offloads memory consolidation and phased RAG ingestion, but research, media generation, and arbitrary Backend routes are not Celery tasks in this slice."
  - name: "Bounded worker scheduling"
    status: supported
    verification: tested
    note: "Atlas validates positive concurrency, prefetch, soft and hard time limits, and a Redis visibility timeout longer than the hard task limit before Backend or worker startup."
  - name: "Retry-safe RAG ingestion ownership"
    status: partial
    verification: tested
    note: "Owner-fenced renewable leases and deterministic LightRAG identities limit duplicate phase effects, but Redis delivery is at-least-once and future side-effecting tasks still require idempotency review."
  - name: "Flower task monitoring access"
    status: supported
    verification: tested
    note: "Flower requires its own Basic authentication on the direct port and is additionally protected by Kong dashboard Basic Auth and ACL on flower.localhost."
  - name: "Durable queue high availability"
    status: not-supported
    verification: documented
    note: "Atlas runs one worker replica and one Flower process on the shared single Redis service; result and broker state survive only according to that Redis instance's persistence."

containers:
  - celery-worker
  - flower

images:
  - var: FLOWER_IMAGE
    default: "mher/flower:2.0.1"
    container: flower

sources:
  var: CELERY_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (backend Celery worker + Flower monitor)"
    - id: disabled
      label: "Disabled"

env:
  - name: CELERY_SOURCE
    default: disabled
    description: "Deployment mode: container (backend worker + Flower) or disabled."
  - name: CELERY_WORKER_SCALE
    auto_managed: true
  - name: FLOWER_SCALE
    auto_managed: true
  - name: FLOWER_PORT
    description: "Host port for Flower (in-container 5555)."
  - name: CELERY_BROKER_URL
    auto_managed: true
    description: "Redis broker URL; Atlas uses Redis database 4 for Celery."
  - name: CELERY_RESULT_BACKEND
    auto_managed: true
    description: "Redis result backend URL; Atlas uses Redis database 4 for Celery task state."
  - name: CELERY_QUEUE
    default: atlas
    description: "Default Celery queue consumed by the Atlas backend worker."
  - name: CELERY_WORKER_CONCURRENCY
    default: 2
    description: "Positive worker process concurrency for backend async jobs. Invalid values fail Backend and worker startup."
  - name: CELERY_WORKER_PREFETCH_MULTIPLIER
    default: 1
    description: "Positive prefetch multiplier. The default reduces head-of-line blocking for long tasks; invalid values fail startup."
  - name: CELERY_TASK_TIME_LIMIT_SECONDS
    default: 900
    description: "Positive hard per-task limit. Must exceed the soft limit and remain below the broker visibility timeout."
  - name: CELERY_TASK_SOFT_TIME_LIMIT_SECONDS
    default: 840
    description: "Positive soft per-task limit. Must be strictly less than the hard limit."
  - name: CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS
    default: 3600
    description: "Positive Redis broker visibility timeout. Must be strictly greater than the task hard limit."

depends_on:
  required:
    - redis
    - backend
    - supabase
    - litellm
  optional:
    - weaviate
    - supavisor
    - docling
    - tika
    - lightrag
    - minio
    - otel-collector

rows:
  - display_name: "Celery Worker"
    source_var: CELERY_SOURCE
    scale_var: CELERY_WORKER_SCALE
    description: "Backend async worker for long-running jobs."
  - display_name: "Flower"
    source_var: CELERY_SOURCE
    port_var: FLOWER_PORT
    scale_var: FLOWER_SCALE
    alias: flower.localhost
    description: "Celery worker monitor and task inspection UI."

runtime_sc:
  celery-worker:
    container:
      scale: 1
      environment:
        CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/4
        CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/4
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        CELERY_BROKER_URL: ''
        CELERY_RESULT_BACKEND: ''
      deploy: {}
      extra_hosts: []
  flower:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - redis
    - supabase
    - litellm
    - weaviate
    - supavisor
    - docling
    - tika
    - lightrag
    - minio
    - otel-collector
