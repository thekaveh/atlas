# services/tempo/service.yml — Grafana Tempo local trace store
name: tempo
label: "Tempo (distributed trace store)"
category: infra
docs: services/tempo/README.md

capabilities:
  - name: "Local distributed trace storage"
    status: supported
    verification: tested
    note: "Atlas configures a filesystem-backed Tempo service receiving internal OTLP traces from the OpenTelemetry Collector and exposes it to Grafana."
  - name: "Authenticated public trace ingestion"
    status: not-supported
    verification: tested
    note: "Tempo has no host port, Kong route, or authentication layer in the stock topology; ingestion is restricted to the backend network."
  - name: "Highly available trace retention"
    status: not-supported
    verification: documented
    note: "The bundled single replica uses local filesystem storage and does not provide replicated object storage or production high availability."

containers:
  - tempo

images:
  - var: TEMPO_IMAGE
    default: "grafana/tempo:3.0.0"
    container: tempo

sources:
  var: TEMPO_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (local trace store)"
    - id: disabled
      label: "Disabled"

env:
  - name: TEMPO_SOURCE
    default: disabled
  - name: TEMPO_SCALE
    auto_managed: true
  - name: TEMPO_ENDPOINT
    auto_managed: true
    description: "Internal Tempo query/API endpoint consumed by Grafana."

depends_on:
  required:
    - kong
    - ray
  optional: []

rows:
  - display_name: "Tempo"
    source_var: TEMPO_SOURCE
    scale_var: TEMPO_SCALE
    description: "Grafana-native distributed trace store for local development."

runtime_sc:
  tempo:
    container:
      scale: 1
      environment:
        TEMPO_ENDPOINT: http://tempo:3200
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        TEMPO_ENDPOINT: ''
      deploy: {}
      extra_hosts: []

data_flow:
  calls: []
