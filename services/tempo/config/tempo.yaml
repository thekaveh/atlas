server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

overrides:
  defaults:
    metrics_generator:
      processors: []

# Trace retention. Tempo 3 applies it in two places: the scheduler plans
# retention work and the worker executes it; both read the same duration.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: ${TEMPO_RETENTION_PERIOD:-336h}
backend_worker:
  compaction:
    block_retention: ${TEMPO_RETENTION_PERIOD:-336h}
