# services/tempo/compose.yml — Grafana Tempo
services:
  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:3.0.0}
    container_name: ${PROJECT_NAME}-tempo
    restart: unless-stopped
    deploy:
      replicas: ${TEMPO_SCALE:-0}
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      # Read by config/tempo.yaml through -config.expand-env.
      TEMPO_RETENTION_PERIOD: ${TEMPO_RETENTION_PERIOD:-336h}
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    # The image is distroless (no shell, no wget); the binary's own -health
    # flag probes /ready and exits nonzero when it is not ready.
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

volumes:
  tempo-data:
    name: ${PROJECT_NAME}-tempo-data
    driver: local
