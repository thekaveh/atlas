# services/otel-collector/compose.yml — OpenTelemetry Collector
services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.154.0}
    container_name: ${PROJECT_NAME}-otel-collector
    restart: unless-stopped
    deploy:
      replicas: ${OTEL_COLLECTOR_SCALE:-0}
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ./config/config.yaml:/etc/otelcol/config.yaml:ro
    # The upstream image is distroless, so it has no curl/wget shell client.
    # Docker already observes main-process liveness; validate the exact mounted
    # config on every probe so a broken receiver/exporter graph cannot be
    # reported healthy merely because the binary remains alive.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network
