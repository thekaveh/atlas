receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304

processors:
  batch: {}
  batch/logs:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  transform/logs:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - 'delete_matching_keys(log.attributes, "(?i)^(.*[._-])?(authorization|proxy-authorization|x-api-key|api[_-]key|apikey|token|access[_-]token|refresh[_-]token|client[_-]secret|password|passwd|secret|cookie|set-cookie|master[_-]key)$")'
          - 'delete_matching_keys(resource.attributes, "(?i)^(.*[._-])?(authorization|proxy-authorization|x-api-key|api[_-]key|apikey|token|access[_-]token|refresh[_-]token|client[_-]secret|password|passwd|secret|cookie|set-cookie|master[_-]key)$")'
          - 'replace_pattern(log.body, "(?i)(^|[\\s{\\[,?&;])([\\\"'']?(?:authorization|proxy-authorization)[\\\"'']?\\s*[:=]\\s*[\\\"'']?(?:bearer|basic)\\s+)[^\\s,;\\\"''}\\]&]+", "$$1$$2[REDACTED]") where IsString(log.body)'
          - 'replace_pattern(log.body, "(?i)(^|[\\s{\\[,?&;])([\\\"'']?(?:[a-z0-9_.-]*[_.-])?(?:api[_-]key|apikey|x-api-key|token|access[_-]token|refresh[_-]token|client[_-]secret|password|secret|master[_-]key)[\\\"'']?\\s*[:=]\\s*[\\\"'']?)[^\\s,;\\\"''}\\]&]+", "$$1$$2[REDACTED]") where IsString(log.body)'
          # Connection-string passwords and OpenAI-style keys in free text.
          - 'replace_pattern(log.body, "(://[^:/\\s@?#]*:)[^@\\s?#]+@", "$$1[REDACTED]@") where IsString(log.body)'
          - 'replace_pattern(log.body, "\\bsk-[A-Za-z0-9_-]{16,}", "[REDACTED]") where IsString(log.body)'

  # Span URLs carry query strings verbatim (`?apikey=`, `?token=`): blank the
  # values of credential-named parameters before traces reach Tempo.
  transform/traces:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'replace_pattern(span.attributes["url.query"], "(?i)((?:^|&)(?:apikey|api[_-]key|token|access[_-]token|key|password|secret|sig|x-amz-security-token|x-amz-signature|x-amz-credential)=)[^&#]*", "$$1[REDACTED]")'
          - 'replace_pattern(span.attributes["url.full"], "(?i)([?&](?:apikey|api[_-]key|token|access[_-]token|key|password|secret|sig|x-amz-security-token|x-amz-signature|x-amz-credential)=)[^&#]*", "$$1[REDACTED]")'
          - 'replace_pattern(span.attributes["http.url"], "(?i)([?&](?:apikey|api[_-]key|token|access[_-]token|key|password|secret|sig|x-amz-security-token|x-amz-signature|x-amz-credential)=)[^&#]*", "$$1[REDACTED]")'

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      enabled: true
      sizer: requests
      num_consumers: 2
      queue_size: 512
      block_on_overflow: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/traces, batch]
      exporters: [otlp_http/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/logs, batch/logs]
      exporters: [otlp_http/loki]
