# services/otel-collector/service.yml — OpenTelemetry Collector telemetry ingest
name: otel-collector
label: "OpenTelemetry Collector (telemetry ingest)"
category: infra
docs: services/otel-collector/README.md

capabilities:
  - name: "OTLP trace ingestion and Tempo export"
    status: supported
    verification: tested
    note: "Atlas accepts internal OTLP over gRPC and HTTP, batches traces, and exports them to the required Tempo service."
  - name: "Log export to Loki"
    status: supported
    verification: tested
    note: "Atlas redacts a documented top-level credential-key allowlist, sends OTLP logs through a bounded live retry queue, and persists accepted logs in the required local Loki service."
  - name: "Public telemetry ingestion"
    status: not-supported
    verification: tested
    note: "Collector receivers are backend-network only with no published host port or Kong route in the stock deployment."

containers:
  - otel-collector

images:
  - var: OTEL_COLLECTOR_IMAGE
    default: "otel/opentelemetry-collector-contrib:0.154.0"
    container: otel-collector

sources:
  var: OTEL_COLLECTOR_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (OTLP ingest)"
    - id: disabled
      label: "Disabled"

env:
  - name: OTEL_COLLECTOR_SOURCE
    default: disabled
  - name: OTEL_COLLECTOR_SCALE
    auto_managed: true
  - name: OTEL_COLLECTOR_ENDPOINT
    auto_managed: true
    description: "Preferred internal OTLP HTTP endpoint for Atlas services."
  - name: OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT
    auto_managed: true
    description: "Internal OTLP HTTP endpoint (`http://otel-collector:4318`) when enabled."
  - name: OTEL_COLLECTOR_OTLP_GRPC_ENDPOINT
    auto_managed: true
    description: "Internal OTLP gRPC endpoint (`http://otel-collector:4317`) when enabled."
  - name: ATLAS_OTEL_ENABLED
    auto_managed: true
    description: "Boolean string consumed by backend and LiteLLM tracing toggles."

depends_on:
  required:
    - tempo
    - loki
  optional: []

rows:
  - display_name: "OpenTelemetry Collector"
    source_var: OTEL_COLLECTOR_SOURCE
    scale_var: OTEL_COLLECTOR_SCALE
    description: "Vendor-neutral telemetry ingest for Tempo traces and Loki logs."

runtime_sc:
  otel-collector:
    container:
      scale: 1
      environment:
        OTEL_COLLECTOR_ENDPOINT: http://otel-collector:4318
        OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT: http://otel-collector:4318
        OTEL_COLLECTOR_OTLP_GRPC_ENDPOINT: http://otel-collector:4317
        ATLAS_OTEL_ENABLED: "true"
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        OTEL_COLLECTOR_ENDPOINT: ''
        OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT: ''
        OTEL_COLLECTOR_OTLP_GRPC_ENDPOINT: ''
        ATLAS_OTEL_ENABLED: "false"
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - tempo
    - loki
