name: ray
label: "Ray (distributed compute substrate)"
category: infra
docs: services/ray/README.md

containers:
  - ray-head
  - ray-worker

images:
  - var: RAY_IMAGE
    default: "rayproject/ray:2.56.0"
    container: ray-head
    notes: "CPU build. Same image used for both head and CPU workers."
  - var: RAY_GPU_IMAGE
    default: "rayproject/ray:2.56.0-gpu"
    container: ray-head
    notes: "GPU build with CUDA runtime. Selected by ray-container-gpu source."

sources:
  var: RAY_SOURCE
  default: disabled
  options:
    - id: ray-container-cpu
      label: "Container (CPU)"
    - id: ray-container-gpu
      label: "Container (GPU, NVIDIA)"
    - id: disabled
      label: "Disabled"

env:
  - name: RAY_SOURCE
    default: disabled
  - name: RAY_DASHBOARD_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Loopback-only host port for the Ray dashboard + native REST job-submission API (in-container 8265). Use the authenticated Kong route for remote access."
  - name: RAY_GCS_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Loopback-only host port for the Ray GCS (in-container 6379). Distinct from the project's Redis cache container; Ray bundles its own GCS process."
  - name: RAY_CLIENT_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Loopback-only host port for the unauthenticated Ray client server (in-container 10001). Used only by trusted host Python: `ray.init('ray://localhost:<port>')`."
  - name: RAY_WORKER_COUNT
    default: 2
    description: "Number of ray-worker replicas. The wizard prompts for this with default 2. Valid values: 0 (head-only mode) and up. No hard upper bound — bounded by host resources."
  - name: RAY_HEAD_SCALE
    auto_managed: true
  - name: RAY_WORKER_SCALE
    auto_managed: true
    description: "Resolved by the bootstrapper from RAY_WORKER_COUNT when source is ray-container-{cpu,gpu}; 0 otherwise."
  - name: RAY_ADDRESS
    auto_managed: true
    description: "Resolved per source: `ray://ray-head:10001` for container sources, empty for disabled. Injected into the backend + jupyterhub containers via their compose environment blocks."
  - name: RAY_DASHBOARD_URL
    default: ""
    description: "Optional override for the Ray dashboard URL the backend's job client uses. Empty = derive from RAY_ADDRESS (http://ray-head:8265)."
  - name: RAY_HEAD_MEMORY_LIMIT
    default: 4g
    description: "Container memory limit for ray-head (deploy.resources.limits.memory). The head node manages the GCS, dashboard, and object directory; 4 g is conservative but safe on a 32 GB host (the shm_size=8gb allocation is for /dev/shm, separate from this OS memory cap)."
  - name: RAY_HEAD_CPU_LIMIT
    default: "2.0"
    description: "Container CPU limit for ray-head (deploy.resources.limits.cpus). GCS + dashboard coordination rarely needs more than 1 core; 2.0 leaves room for brief spikes."
  - name: RAY_WORKER_MEMORY_LIMIT
    default: 4g
    description: "Container memory limit per ray-worker (deploy.resources.limits.memory). Workers run tasks and actors; 4 g per replica is a modest OOM fence on a 32 GB host with the default 2 workers. Raise for large in-memory datasets."
  - name: RAY_WORKER_CPU_LIMIT
    default: "2.0"
    description: "Container CPU limit per ray-worker (deploy.resources.limits.cpus). 2.0 cores per worker. Raise if workers need more parallelism; lower if the host is saturated."

depends_on:
  # Display-ordering pin: Ray is genuinely standalone at runtime (ships its
  # own GCS / Plasma; no external service needed). Without this list Ray
  # would sort BEFORE Kong in the infra block — `ray` (r-a) is alphabetically
  # earlier than both `redis` and `kong`, and the topology slot allocator
  # pops alphabetically when multiple manifests are simultaneously ready,
  # which would shift Kong's `63000` / `63001` port slots. Matching Kong's
  # own required list (supabase + redis) makes Ray and Kong ready at the
  # same time, alphabetical break gives Kong precedence (k < r), and Kong
  # keeps its slots. NEITHER edge is a runtime call.
  required:
    - supabase
    - redis
  optional: []

exports: []

rows:
  - display_name: "Ray"
    source_var: RAY_SOURCE
    port_var: RAY_DASHBOARD_PORT
    scale_var: RAY_HEAD_SCALE
    alias: ray.localhost
    description: "Distributed-compute substrate (cluster controller + workers)."

runtime_sc:
  # Note: scale values here are bootstrapper-display defaults. Actual
  # compose replicas are driven by ${RAY_HEAD_SCALE} / ${RAY_WORKER_SCALE}
  # in compose.yml, which the _generate_ray_config() hook writes to .env
  # based on RAY_SOURCE + RAY_WORKER_COUNT. Same pattern for the image:
  # compose.yml says `image: ${RAY_IMAGE}` and the hook sets RAY_IMAGE
  # to the CPU or GPU image tag based on source.
  ray-head:
    ray-container-cpu:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    ray-container-gpu:
      scale: 1
      environment:
        NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  ray-worker:
    ray-container-cpu:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    ray-container-gpu:
      scale: 1
      environment:
        NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls: []
