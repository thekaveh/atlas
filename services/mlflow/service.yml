# services/mlflow/service.yml — MLflow experiment tracking
name: mlflow
label: "MLflow (experiment tracking + artifacts)"
category: apps
docs: services/mlflow/README.md

capabilities:
  - name: "Experiment and run tracking"
    status: supported
    verification: tested
    note: "Atlas runs an MLflow tracking server with a dedicated Postgres database and injects its tracking URI plus client into JupyterHub."
  - name: "Scoped Silo artifact storage"
    status: supported
    verification: tested
    note: "MLflow proxies artifacts to a dedicated Silo bucket with generated service credentials and refuses Atlas enablement when Silo is unavailable."
  - name: "MLflow ingress authentication"
    status: partial
    verification: tested
    note: "mlflow.localhost is protected by Kong dashboard Basic Auth and ACL, but the host-published direct tracking UI/API has no MLflow application authentication."
  - name: "MLflow AI Gateway SSRF containment"
    status: supported
    verification: tested
    note: "Atlas accepts exactly reviewed MLflow 3.17.2, which closes CVE-2026-64849, CVE-2026-71211, CVE-2026-116692, CVE-2026-116690 and CVE-2026-53995. Every prefixed and unprefixed AI Gateway, Assistant and MCP access route stays disabled at its ASGI boundary, because Atlas configures none of them. The built image runs a required multi-architecture smoke."
  - name: "Model registry deployment automation"
    status: not-supported
    verification: documented
    note: "The first Atlas slice stores tracking and registry metadata only; it ships no model serving, promotion, deployment plugin, or Backend/n8n automation."
  - name: "Tracking service high availability"
    status: not-supported
    verification: documented
    note: "Postgres and Silo persist state, but Atlas runs one MLflow server without replicas, failover routing, or a tested backup-and-restore workflow for the combined stores."

containers:
  - mlflow-init
  - mlflow

images:
  - var: MLFLOW_IMAGE
    default: "ghcr.io/mlflow/mlflow:v3.17.2"
    container: mlflow
  - var: MLFLOW_INIT_IMAGE
    default: "alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf"
    container: mlflow-init

sources:
  var: MLFLOW_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (MLflow tracking server + Silo artifacts)"
    - id: disabled
      label: "Disabled"

env:
  - name: MLFLOW_SOURCE
    description: "MLflow deployment source: container or disabled. container requires SILO_SOURCE=container for artifact storage."
    default: disabled
  - name: MLFLOW_PORT
    description: "Host port for the MLflow UI/API (in-container 5000)."
  - name: MLFLOW_ENDPOINT
    auto_managed: true
    description: "In-network URL for Atlas services and notebooks."
  - name: MLFLOW_TRACKING_URI
    auto_managed: true
    description: "Tracking URI injected into JupyterHub when MLflow is enabled."
  - name: MLFLOW_SCALE
    description: "Set by ./start.sh from MLFLOW_SOURCE; do not edit. 1 runs the mlflow container, 0 does not."
    auto_managed: true
  - name: MLFLOW_INIT_SCALE
    description: "Set by ./start.sh from MLFLOW_SOURCE; do not edit. 1 runs the mlflow-init container, 0 does not."
    auto_managed: true
  - name: MLFLOW_DB_NAME
    description: "Postgres database in supabase-db that holds the MLflow tracking and model-registry stores."
    default: mlflow
  - name: MLFLOW_DB_NAME_URI
    default: mlflow
    description: "Bootstrapper-synchronized percent-encoded MLFLOW_DB_NAME for DSN path components."
  - name: MLFLOW_DB_USER
    description: "Restricted Postgres login that owns the MLflow database; created by 05-scoped-roles.sh."
    default: mlflow
  - name: MLFLOW_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated Postgres password for the dedicated MLflow database role."
  - name: MLFLOW_DB_USER_URI
    default: mlflow
    description: "Bootstrapper-synchronized percent-encoded MLFLOW_DB_USER for DSN userinfo."
  - name: MLFLOW_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded MLFLOW_DB_PASSWORD for DSN userinfo."
depends_on:
  required:
    - supabase
    - silo
  optional:
    - jupyterhub

rows:
  - display_name: "MLflow"
    source_var: MLFLOW_SOURCE
    port_var: MLFLOW_PORT
    scale_var: MLFLOW_SCALE
    alias: mlflow.localhost
    description: "Experiment tracking, model registry metadata, and Silo-backed artifacts."

runtime_sc:
  mlflow-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  mlflow:
    container:
      scale: 1
      environment:
        MLFLOW_ENDPOINT: http://mlflow:5000
        MLFLOW_TRACKING_URI: http://mlflow:5000
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        MLFLOW_ENDPOINT: ''
        MLFLOW_TRACKING_URI: ''
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - supabase
    - silo

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
