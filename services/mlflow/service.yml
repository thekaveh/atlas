# services/mlflow/service.yml — MLflow experiment tracking
name: mlflow
label: "MLflow (experiment tracking + artifacts)"
category: apps
docs: services/mlflow/README.md

capabilities:
  - name: "Experiment and run tracking"
    status: supported
    verification: tested
    note: "Atlas runs an MLflow tracking server with a dedicated Postgres database and injects its tracking URI plus client into JupyterHub."
  - name: "Scoped MinIO artifact storage"
    status: supported
    verification: tested
    note: "MLflow proxies artifacts to a dedicated MinIO bucket with generated service credentials and refuses Atlas enablement when MinIO is unavailable."
  - name: "MLflow ingress authentication"
    status: partial
    verification: tested
    note: "mlflow.localhost is protected by Kong dashboard Basic Auth and ACL, but the host-published direct UI/API has no MLflow application authentication."
  - name: "Model registry deployment automation"
    status: not-supported
    verification: documented
    note: "The first Atlas slice stores tracking and registry metadata only; it ships no model serving, promotion, deployment plugin, or Backend/n8n automation."
  - name: "Tracking service high availability"
    status: not-supported
    verification: documented
    note: "Postgres and MinIO persist state, but Atlas runs one MLflow server without replicas, failover routing, or a tested backup-and-restore workflow for the combined stores."

containers:
  - mlflow-init
  - mlflow

images:
  - var: MLFLOW_IMAGE
    default: "ghcr.io/mlflow/mlflow:v3.14.0"
    container: mlflow
  - var: MLFLOW_INIT_IMAGE
    default: "alpine:3.22.1"
    container: mlflow-init

sources:
  var: MLFLOW_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (MLflow tracking server + MinIO artifacts)"
    - id: disabled
      label: "Disabled"

env:
  - name: MLFLOW_SOURCE
    default: disabled
  - name: MLFLOW_PORT
    description: "Host port for the MLflow UI/API (in-container 5000)."
  - name: MLFLOW_ENDPOINT
    auto_managed: true
    description: "In-network URL for Atlas services and notebooks."
  - name: MLFLOW_TRACKING_URI
    auto_managed: true
    description: "Tracking URI injected into JupyterHub when MLflow is enabled."
  - name: MLFLOW_SCALE
    auto_managed: true
  - name: MLFLOW_INIT_SCALE
    auto_managed: true
  - name: MLFLOW_DB_NAME
    default: mlflow
  - name: MLFLOW_DB_USER
    default: mlflow
  - name: MLFLOW_DB_PASSWORD
    default: ""
    secret: true
    description: "Auto-generated Postgres password for the dedicated MLflow database role."
depends_on:
  required:
    - supabase
    - minio
  optional:
    - jupyterhub

rows:
  - display_name: "MLflow"
    source_var: MLFLOW_SOURCE
    port_var: MLFLOW_PORT
    scale_var: MLFLOW_SCALE
    alias: mlflow.localhost
    description: "Experiment tracking, model registry metadata, and MinIO-backed artifacts."

runtime_sc:
  mlflow-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  mlflow:
    container:
      scale: 1
      environment:
        MLFLOW_ENDPOINT: http://mlflow:5000
        MLFLOW_TRACKING_URI: http://mlflow:5000
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        MLFLOW_ENDPOINT: ''
        MLFLOW_TRACKING_URI: ''
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - supabase
    - minio
