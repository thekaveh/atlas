# services/loki/compose.yml — Grafana Loki
services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.0}
    container_name: ${PROJECT_NAME}-loki
    restart: unless-stopped
    deploy:
      replicas: ${LOKI_SCALE:-0}
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      # loki runs with -config.expand-env, so config/loki.yaml reads
      # ${LOKI_RETENTION_PERIOD} from this container's environment. Without
      # forwarding it here the documented retention knob is inert — loki always
      # falls through to the in-config 24h default regardless of .env.
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-24h}
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    # No healthcheck: the image is distroless (no shell, no wget) and the
    # loki binary has no probe flag, so any test command can never pass.
    # Docker still watches main-process liveness; otel-collector's Loki
    # exporter queues and retries until /otlp accepts writes.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

volumes:
  loki-data:
    name: ${PROJECT_NAME}-loki-data
    driver: local
