# services/trueforge/service.yml — TrueForge general agent runtime
# (server + schedule controller + settings-seeding init)
name: trueforge
label: "TrueForge (agent runtime: MCP + approvals + schedules)"
category: agents
docs: services/trueforge/README.md

capabilities:
  - name: "User-composable saved agents over LiteLLM models"
    status: supported
    verification: documented
    note: "trueforge-init seeds a single `custom` model provider pointed at the in-stack LiteLLM gateway, so every enabled Ollama and cloud model is available to agents; keys never live in agent configs. Live qualification run pending (#1159)."
  - name: "MCP tool calling with per-call human approvals"
    status: supported
    verification: documented
    note: "Remote streamable-HTTP MCP connectors with per-tool-call approvals and @write/@destructive gating. trueforge-init registers the in-stack mcp-servers endpoint when that family is enabled; other connectors are user-added."
  - name: "Scheduled unattended agent runs"
    status: supported
    verification: documented
    note: "The trueforge-controller container dispatches hourly/daily/weekly schedules through the server API. Raw cron expressions and webhook/event triggers are not part of upstream v0.2."
  - name: "Git-backed skills and code sandbox execution"
    status: not-supported
    verification: documented
    note: "Atlas configures no skill sources and no sandbox provider (upstream supports Daytona only). TrueForge rejects agent specs that request skills or a sandbox at session creation, so the boundary is explicit rather than silently degraded."
  - name: "Authenticated multi-user access"
    status: not-supported
    verification: documented
    note: "The OIDC triple is deliberately unset, so TrueForge runs with its fixed local admin identity — anyone who can reach the server or the Kong route is admin, the same network-trusted posture as the other Atlas UIs. Model-provider credentials are still scoped: the seeded provider carries a dedicated LiteLLM virtual key, not the master key."

containers:
  - trueforge
  - trueforge-controller
  - trueforge-init

images:
  # Upstream publishes linux/amd64 only; Docker Desktop on Apple Silicon runs
  # it under emulation (same as chatterbox/docling). Reviewed index digest
  # sha256:db9de64e1ff354a858dc646f23cf16c70e300c457acb86527e4a0b1cd556f573 —
  # see the external-contract ledger row. trueforge-controller and
  # trueforge-init reuse this image (controller-main.js entry / node init
  # script), so the family adds exactly one remote image.
  - var: TRUEFORGE_IMAGE
    default: "tfy.jfrog.io/tfy-images/trueforge:0.2.0-8b1d98e"
    container: trueforge
    platform: "linux/amd64"

sources:
  var: TRUEFORGE_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (server + schedule controller + settings seeding)"
    - id: disabled
      label: "Disabled"

env:
  - name: TRUEFORGE_SOURCE
    default: disabled
  - name: TRUEFORGE_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Host port for the TrueForge server UI + API (in-container 8790)."
  - name: TRUEFORGE_ENDPOINT
    auto_managed: true
    description: "Resolved per TRUEFORGE_SOURCE — `http://trueforge:8790` for container, empty for disabled."
  - name: TRUEFORGE_API_KEY
    default: ""
    secret: true
    description: "Auto-generated by the bootstrapper on first run. Service credential for the controller's internal schedule-dispatch calls to the server."
  - name: TRUEFORGE_DB_NAME
    default: trueforge
  - name: TRUEFORGE_DB_NAME_URI
    default: trueforge
    description: "Bootstrapper-synchronized percent-encoded TRUEFORGE_DB_NAME for DSN path components."
  - name: TRUEFORGE_DB_USER
    default: trueforge
  - name: TRUEFORGE_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated password for the owner of TrueForge's dedicated database."
  - name: TRUEFORGE_DB_USER_URI
    default: trueforge
    description: "Bootstrapper-synchronized percent-encoded TRUEFORGE_DB_USER for DSN userinfo."
  - name: TRUEFORGE_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded TRUEFORGE_DB_PASSWORD for DSN userinfo."
  - name: TRUEFORGE_SCALE
    auto_managed: true
  - name: TRUEFORGE_CONTROLLER_SCALE
    auto_managed: true
  - name: TRUEFORGE_INIT_SCALE
    auto_managed: true

depends_on:
  required:
    - supabase
    - redis
    - litellm
  optional:
    - mcp-servers

rows:
  - display_name: "TrueForge"
    source_var: TRUEFORGE_SOURCE
    port_var: TRUEFORGE_PORT
    scale_var: TRUEFORGE_SCALE
    alias: trueforge.localhost
    description: "General agent runtime — saved agents with MCP tools, approvals, schedules, and session history."

runtime_sc:
  trueforge:
    container:
      scale: 1
      environment:
        TRUEFORGE_ENDPOINT: http://trueforge:8790
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        TRUEFORGE_ENDPOINT: ''
      deploy: {}
      extra_hosts: []
  trueforge-controller:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
  trueforge-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      extra_hosts: []
      deploy: {}

# No runtime_deps block: TrueForge's hard dependencies (supabase, redis,
# litellm) are all in the always-on tier, so no track or source combination
# can take them away — there is nothing for DependencyManager to enforce
# (contrast langfuse -> minio, where the required dependency is
# source-configurable). mcp-servers is genuinely optional: trueforge-init
# skips the connector seed cleanly when that family is disabled.

data_flow:
  # langfuse is intentionally absent: TrueForge never talks to Langfuse
  # directly — traces/cost arrive there through LiteLLM's success callbacks,
  # and that edge already lives in litellm's manifest.
  calls:
    - supabase
    - redis
    - litellm
    - mcp-servers

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Adopted at upstream v0.2.0 per the #1159 evaluation; capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
