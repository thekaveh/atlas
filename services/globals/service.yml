# services/globals/service.yml — global, non-service-specific env vars
#
# Virtual manifest. Owns vars that don't belong to any one service:
#   - PROJECT_NAME, BASE_PORT, HOST_GATEWAY_IP (infrastructure)
#   - BRAND_* (TUI branding)
# These appear at the top of the assembled .env.example.
name: globals
label: "Globals (project + branding)"
category: infra
docs: docs/CONTRIBUTING-services.md  # virtual; nearest reference doc is the architecture / manifest convention guide

capabilities:
  - name: "Project namespace and base-port ownership"
    status: supported
    verification: tested
    note: "This virtual manifest owns the Compose project namespace, bind and gateway settings, and the base port from which service ports are derived; it launches no container of its own."
  - name: "Branding and launch defaults"
    status: supported
    verification: tested
    note: "Atlas assembles the brand metadata, Compose profiles, GPU reservation flags, and shared logging defaults declared here into the generated environment."
  - name: "Generic production resource limits"
    status: partial
    verification: documented
    note: "The PROD_ENV limit variables are reserved shared configuration, but most service compose fragments do not yet consume them as generic runtime caps."

virtual: true
containers: []

env:
  - name: PROJECT_NAME
    default: atlas
    description: "Docker Compose project name — the container/volume/network prefix (<name>-…) and `docker compose -p` namespace. start.sh AND stop.sh read it from here, so stop tears down exactly what start launched. Override with `./start.sh --project <name>` (also -p; persists back here) or by editing this value. Set a unique name when running Atlas as a submodule so you don't collide with a base Atlas stack."
  - name: BASE_PORT
    default: 63000
    description: "Base port. Every service's *_PORT derives from this + a fixed offset."
  - name: HOST_BIND_IP
    default: ""
    description: |
      Host interface prefix for ALL published service ports. Empty (default)
      => Docker binds 0.0.0.0 (dev). `--profile prod` sets this to
      "127.0.0.1:" so service ports are reachable only from the host (the
      public edge — Cloudflare Tunnel or Caddy — reaches Kong locally).
      Must include the trailing colon when set, e.g. "127.0.0.1:".
  - name: HOST_GATEWAY_IP
    auto_managed: true
    default: host-gateway
    description: |
      Bootstrapper computes this at runtime based on the runtime (Docker:
      "host-gateway"; Podman: literal gateway IP). If you copy this file to
      .env manually without running ./start.sh, set this to "host-gateway"
      on Linux/macOS Docker, or the real bridge IP on rootless setups.
  # Branding (TUI wizard)
  - name: BRAND_NAME
    default: "Atlas"
  - name: BRAND_TAGLINE
    default: "A self-hosted, source-configurable, multi-disciplinary engineering platform — gen-AI, ML, and data."
  - name: BRAND_VERSION
    default: "0.1.0"
  - name: BRAND_AUTHOR
    default: "Kaveh Razavi"
  - name: BRAND_AUTHOR_EMAIL
    default: "kaveh.razavi@gmail.com"
  - name: BRAND_LICENSE
    default: "Apache License 2.0"
  - name: BRAND_REPO_URL
    default: "https://github.com/thekaveh/atlas"
  - name: BRAND_LOGO_FILE
    default: ""
    description: "Optional path to a custom block-art logo that overrides the built-in ATLAS lockup in the wizard + --no-tui banner (the BRAND_* rebranding contract). File format: the wide-lockup rows, an optional '---' line on its own, then the narrow (compact) fallback rows used on terminals too small for the wide one. Keep it 6 rows tall. Empty = built-in ATLAS. Format + example: docs/quick-start/interactive-setup-wizard.md (Brand Customization)."

  - name: COMPOSE_PROFILES
    auto_managed: true
    default: ""
    description: |
      Docker Compose profile activation list. Rebuilt from scratch on every
      ./start.sh run from the active STT/TTS/doc-processor sources
      (speaches-cpu/-gpu, parakeet-gpu, chatterbox-gpu, docling-gpu/doc-gpu).
      Do not edit by hand — the bootstrapper owns this value.

  # GPU + production-tuning vars — system-wide knobs not owned by any one
  # service. NVIDIA_VISIBLE_DEVICES is read by every GPU-aware container
  # (parakeet, speaches, chatterbox, docling). Most PROD_ENV_* are reserved
  # deploy.resources cap defaults NOT yet consumed by any compose fragment
  # (the generic CPUS/MEM_LIMIT pair and the BACKEND/N8N pairs — backend / n8n
  # run unbounded; wiring them is a deferred prod-profile follow-up). The
  # EXCEPTION is PROD_ENV_COMFYUI_CPUS / PROD_ENV_COMFYUI_MEM_LIMIT, which ARE
  # live — comfyui's container-gpu runtime_sc slice caps deploy.resources with
  # them (services/comfyui/service.yml). comfyui's CPU variant caps separately
  # via COMFYUI_CPU_LIMIT / COMFYUI_MEMORY_LIMIT in services/comfyui/compose.yml.
  - name: NVIDIA_VISIBLE_DEVICES
    default: all
    description: "Host-side GPU visibility. Forwarded into every NVIDIA-runtime container."
  - name: PROD_ENV_CPUS
    default: 2
    description: "Default container CPU cap (cores). Per-service overrides below."
  - name: PROD_ENV_MEM_LIMIT
    default: 8g
  - name: PROD_ENV_BACKEND_CPUS
    default: 1
  - name: PROD_ENV_BACKEND_MEM_LIMIT
    default: 2g
  - name: PROD_ENV_N8N_CPUS
    default: 1
  - name: PROD_ENV_N8N_MEM_LIMIT
    default: 2g
  - name: PROD_ENV_COMFYUI_CPUS
    default: 2
  - name: PROD_ENV_COMFYUI_MEM_LIMIT
    default: 4g

  - name: LOG_MAX_SIZE
    default: "10m"
    description: "Per-container json-file log max size (Docker logging option)."
  - name: LOG_MAX_FILE
    default: "3"
    description: "Per-container json-file log file count (Docker logging option)."

  # Migration sentinels
  - name: BOOTSTRAPPER_PORT_LAYOUT_VERSION
    default: 4
    auto_managed: false
    description: "Sentinel updated by bootstrapper/services/migrations. Missing or <N triggers the chained env migrations up to N (v1 port-layout, v2 URL>PORT, v3 COMFYUI model-set, v4 stale curated Ollama model reference cleanup). Fresh .env files are already v4-shaped."

depends_on:
  required: []
  optional: []

exports: []

rows: []

# ─────────────────────────────────────────────────────────
