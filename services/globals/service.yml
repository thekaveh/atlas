# services/globals/service.yml — global, non-service-specific env vars
#
# Virtual manifest. Owns vars that don't belong to any one service:
#   - PROJECT_NAME, BASE_PORT, HOST_GATEWAY_IP (infrastructure)
#   - BRAND_* (TUI branding)
# These appear at the top of the assembled .env.example.
name: globals
label: "Globals (project + branding)"
category: infra
docs: docs/CONTRIBUTING-services.md  # virtual; nearest reference doc is the architecture / manifest convention guide

capabilities:
  - name: "Project namespace and base-port ownership"
    status: supported
    verification: tested
    note: "This virtual manifest owns the Compose project namespace, the bind and gateway settings, and the base port from which service ports derive. It launches no container of its own."
  - name: "Branding and launch defaults"
    status: supported
    verification: tested
    note: "Atlas assembles the brand metadata, Compose profiles, GPU reservation flags, and shared logging defaults declared here into the generated environment."
  - name: "Generic production resource limits"
    status: partial
    verification: documented
    note: "The PROD_ENV limit variables are reserved shared configuration, but most service compose fragments do not yet consume them as generic runtime caps."

virtual: true
containers: []

env:
  - name: PROJECT_NAME
    default: atlas
    description: "Docker Compose project name: the prefix for containers, volumes and networks, and the `docker compose -p` namespace. start.sh and stop.sh both read it. `./start.sh --project <name>` (or -p) writes it here. Use a unique name for a submodule consumer."
  - name: BASE_PORT
    default: 63000
    description: "Base port. Every service's *_PORT derives from this + a fixed offset."
  - name: HOST_BIND_IP
    default: "127.0.0.1:"
    description: "Published-port interface prefix (trailing colon). Default 127.0.0.1: is host-only; 0.0.0.0: is for deliberate remote access. Existing .env files with HOST_BIND_IP= are upgraded by backfill. Empty binds all interfaces except Ray, Zeppelin, mcp-servers, Supabase DB, Docling, Parakeet. LAN Supabase routes: KONG_SUPABASE_EXTRA_HOSTS."
  - name: HOST_GATEWAY_IP
    auto_managed: true
    default: host-gateway
    description: "Set by ./start.sh for the container runtime: host-gateway on Docker, the literal gateway IP on Podman. If you write .env without ./start.sh, use host-gateway on Docker, or the real bridge IP on rootless setups."
  # Branding (TUI wizard)
  - name: BRAND_NAME
    description: "Wizard branding: the brand name shown by the wizard and --no-tui banner. Empty uses the Atlas default."
    default: "Atlas"
  - name: BRAND_TAGLINE
    description: "Wizard branding: the tagline shown by the wizard and --no-tui banner. Empty uses the Atlas default."
    default: "A self-hosted, source-configurable, multi-disciplinary engineering platform — gen-AI, ML, and data."
  - name: BRAND_VERSION
    description: "Wizard branding: the version shown by the wizard and --no-tui banner. Empty uses the Atlas default."
    default: "0.1.0"
  - name: BRAND_AUTHOR
    description: "Wizard branding: the author shown by the wizard and --no-tui banner. Empty uses the Atlas default."
    default: "Kaveh Razavi"
  - name: BRAND_AUTHOR_EMAIL
    description: "Wizard branding: the author email shown by the wizard and --no-tui banner. Empty uses the Atlas default."
    default: "kaveh.razavi@gmail.com"
  - name: BRAND_LICENSE
    description: "Wizard branding: the license shown by the wizard and --no-tui banner. Empty uses the Atlas default."
    default: "Apache License 2.0"
  - name: BRAND_REPO_URL
    description: "Wizard branding: the repository URL shown by the wizard and --no-tui banner. Empty uses the Atlas default."
    default: "https://github.com/thekaveh/atlas"
  - name: BRAND_LOGO_FILE
    default: ""
    description: "Optional path to a block-art logo that replaces the built-in ATLAS lockup in the wizard and --no-tui banner. Empty keeps ATLAS. Keep it 6 rows tall. File format: docs/quick-start/interactive-setup-wizard.md (Brand Customization)."

  - name: COMPOSE_PROFILES
    auto_managed: true
    default: ""
    description: |
      Docker Compose profile activation list. Rebuilt from scratch on every
      ./start.sh run from the active STT/TTS/doc-processor sources
      (speaches-cpu/-gpu, parakeet-gpu, chatterbox-gpu, docling-gpu/doc-gpu).
      Do not edit by hand — the bootstrapper owns this value.

  # GPU + production-tuning vars — system-wide knobs not owned by any one
  # service. NVIDIA_VISIBLE_DEVICES is read by every GPU-aware container
  # (parakeet, speaches, chatterbox, docling). Most PROD_ENV_* are reserved
  # deploy.resources cap defaults NOT yet consumed by any compose fragment
  # (the generic CPUS/MEM_LIMIT pair and the BACKEND/N8N pairs — backend / n8n
  # run unbounded; wiring them is a deferred prod-profile follow-up). The
  # EXCEPTION is PROD_ENV_COMFYUI_CPUS / PROD_ENV_COMFYUI_MEM_LIMIT, which ARE
  # live — comfyui's container-gpu runtime_sc slice caps deploy.resources with
  # them (services/comfyui/service.yml). comfyui's CPU variant caps separately
  # via COMFYUI_CPU_LIMIT / COMFYUI_MEMORY_LIMIT in services/comfyui/compose.yml.
  - name: NVIDIA_VISIBLE_DEVICES
    default: all
    description: "Host-side GPU visibility. Forwarded into every NVIDIA-runtime container."
  - name: PROD_ENV_CPUS
    default: 2
    description: "Reserved default container CPU cap (cores). No compose fragment reads it yet."
  - name: PROD_ENV_MEM_LIMIT
    description: "Reserved default container memory cap. No compose fragment reads it yet."
    default: 8g
  - name: PROD_ENV_BACKEND_CPUS
    description: "Reserved backend CPU cap (cores). No compose fragment reads it yet; the backend runs unbounded."
    default: 1
  - name: PROD_ENV_BACKEND_MEM_LIMIT
    description: "Reserved backend memory cap. No compose fragment reads it yet; the backend runs unbounded."
    default: 2g
  - name: PROD_ENV_N8N_CPUS
    description: "Reserved n8n CPU cap (cores). No compose fragment reads it yet; n8n runs unbounded."
    default: 1
  - name: PROD_ENV_N8N_MEM_LIMIT
    description: "Reserved n8n memory cap. No compose fragment reads it yet; n8n runs unbounded."
    default: 2g
  - name: PROD_ENV_COMFYUI_CPUS
    description: "CPU limit (cores) for ComfyUI with COMFYUI_SOURCE=container-gpu. The CPU variant uses COMFYUI_CPU_LIMIT instead."
    default: 2
  - name: PROD_ENV_COMFYUI_MEM_LIMIT
    description: "Memory limit for ComfyUI with COMFYUI_SOURCE=container-gpu. The CPU variant uses COMFYUI_MEMORY_LIMIT instead."
    default: 4g

  - name: LOG_MAX_SIZE
    default: "10m"
    description: "Per-container json-file log max size (Docker logging option)."
  - name: LOG_MAX_FILE
    default: "3"
    description: "Per-container json-file log file count (Docker logging option)."

  # Migration sentinels
  - name: BOOTSTRAPPER_PORT_LAYOUT_VERSION
    default: 5
    auto_managed: false
    description: "Env-migration sentinel. A missing value or one below 5 runs the chained migrations up to v5. They cover port layout, URL to PORT, ComfyUI model set, stale Ollama model cleanup and Weaviate backup-filesystem. Fresh .env files are v5."

depends_on:
  required: []
  optional: []

exports: []

rows: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slice owned by this
# manifest — stack-wide dependency tiers (data → init → core → app).
# Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_dependency_tiers:
  data_tier:
  - supabase-db
  - redis
  - neo4j-graph-db
  init_tier:
  - supabase-db-init
  - litellm-init
  - ollama-pull
  - comfyui-init
  - weaviate-init
  - n8n-init
  core_services:
  - supabase-meta
  - supabase-storage
  - supabase-auth
  - supabase-api
  - supabase-realtime
  - litellm
  - ollama
  - comfyui
  - parakeet-gpu
  - speaches
  - chatterbox
  - docling-gpu
  - weaviate
  - multi2vec-clip
  - searxng
  - n8n
  - n8n-worker
  - openclaw-gateway
  - hermes
  app_tier:
  - kong-api-gateway
  - supabase-studio
  - local-deep-researcher
  - open-web-ui
  - backend
  - jupyterhub

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
