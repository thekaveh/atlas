# bootstrapper/service-configs.yml). Slice owned by this
# manifest — stack-wide dependency tiers (data → init → core → app).
# Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_dependency_tiers:
  data_tier:
  - supabase-db
  - redis
  - neo4j-graph-db
  init_tier:
  - supabase-db-init
  - litellm-init
  - ollama-pull
  - comfyui-init
  - weaviate-init
  - n8n-init
  core_services:
  - supabase-meta
  - supabase-storage
  - supabase-auth
  - supabase-api
  - supabase-realtime
  - litellm
  - ollama
  - comfyui
  - parakeet-gpu
  - speaches
  - chatterbox
  - docling-gpu
  - weaviate
  - multi2vec-clip
  - searxng
  - n8n
  - n8n-worker
  - openclaw-gateway
  - hermes
  app_tier:
  - kong-api-gateway
  - supabase-studio
  - local-deep-researcher
  - open-web-ui
  - backend
  - jupyterhub
