# services/openclaw/service.yml — OpenClaw AI agent gateway + init
name: openclaw
label: "OpenClaw (AI agent gateway)"
category: agents
docs: services/openclaw/README.md

capabilities:
  - name: "LiteLLM-backed messaging agent gateway"
    status: partial
    verification: tested
    note: "Atlas injects the LiteLLM key and openclaw-init points the bundled litellm provider at http://litellm:4000 when its baseUrl is unset; messaging channels and approvals require onboarding and are not exercised against live platforms."
  - name: "Container and operator-host sources"
    status: partial
    verification: tested
    note: "Atlas initializes and runs the container source, while localhost mode only resolves an existing operator-managed gateway and cannot guarantee its version, onboarding, or supervision."
  - name: "Direct cloud-provider overrides"
    status: partial
    verification: tested
    note: "Optional OpenClaw-specific Anthropic or OpenAI keys can bypass LiteLLM, which also bypasses Atlas gateway accounting and centralized provider routing."
  - name: "OpenClaw gateway authentication"
    status: partial
    verification: tested
    note: "OPENCLAW_GATEWAY_TOKEN, generated at startup, protects the gateway API and dashboard; the CORS-only Kong route adds no Atlas authentication of its own. Direct gateway ports are loopback-only by default; an operator who deliberately publishes them remotely must secure that exposure separately."
  - name: "Agent configuration and workspace persistence"
    status: partial
    verification: tested
    note: "Config and workspace data persist in local named volumes, with no MinIO sharing, backup workflow, replication, or tenant-isolated workspace topology."
  - name: "Hermes and n8n message bridges"
    status: stubbed
    verification: tested
    note: "Hermes endpoint variables are injected and OpenClaw webhooks are documented, but Atlas ships no live forwarding implementation between OpenClaw, Hermes, or n8n."
  - name: "Untrusted agent command isolation"
    status: not-supported
    verification: documented
    note: "OpenClaw can manage files and execute commands from messaging workflows, while Atlas configures no mandatory sandbox runner or per-channel authorization policy."

containers:
  - openclaw-gateway
  - openclaw-init

images:
  - var: OPENCLAW_IMAGE
    default: "ghcr.io/openclaw/openclaw:2026.6.10"
    container: openclaw-gateway
  - var: OPENCLAW_INIT_IMAGE
    default: "alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
    container: openclaw-init

sources:
  var: OPENCLAW_SOURCE
  default: disabled
  options:
    - id: disabled
      label: "Disabled"
    - id: container
      label: "Container"
    - id: localhost
      label: "Host (existing OpenClaw on this machine)"
      profiles: [default]

env:
  - name: OPENCLAW_SOURCE
    default: disabled
  - name: OPENCLAW_GATEWAY_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: OPENCLAW_BRIDGE_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: OPENCLAW_GATEWAY_TOKEN
    default: ""
    secret: true
    description: "Auto-generated bearer token for the OpenClaw gateway API and dashboard (kept once set). The gateway binds to the LAN interface, which it refuses to do tokenless; left empty, it would mint a random per-start token nobody can read back."
  - name: OPENCLAW_LOCALHOST_PORT
    default: "63065"
    description: "Host port for the localhost source variant (its own slot, separate from OPENCLAW_GATEWAY_PORT). URL is derived at compose-render time as http://host.docker.internal:63065."
  - name: OPENCLAW_INIT_SOURCE
    default: container
  - name: OPENCLAW_ANTHROPIC_API_KEY
    default: ""
    secret: true
    description: "Optional per-OpenClaw Anthropic override."
  - name: OPENCLAW_OPENAI_API_KEY
    default: ""
    secret: true
    description: "Optional per-OpenClaw OpenAI override. Leave empty to keep OpenClaw routed through LiteLLM instead of bypassing the stack gateway."
  - name: OPENCLAW_SCALE
    auto_managed: true
  - name: OPENCLAW_INIT_SCALE
    auto_managed: true
  - name: OPENCLAW_ENDPOINT
    auto_managed: true
    description: "Resolved per-source by the bootstrapper (container DNS / host.docker.internal / empty when disabled). Forward-looking hook: no compose fragment injects it into a container today — consumers (e.g. n8n workflows) would read it via their own env wiring when that lands."

depends_on:
  required:
    - litellm
  optional: []

rows:
  - display_name: "OpenClaw"
    source_var: OPENCLAW_SOURCE
    port_var: OPENCLAW_GATEWAY_PORT
    scale_var: OPENCLAW_SCALE
    alias: openclaw.localhost
    description: "AI agent gateway for messaging platforms."
    localhost_port_var: OPENCLAW_LOCALHOST_PORT

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  openclaw:
    container:
      scale: 1
      environment:
        OPENCLAW_ENDPOINT: http://openclaw-gateway:18789
      deploy: {}
      extra_hosts: []
    localhost:
      scale: 0
      environment:
        OPENCLAW_ENDPOINT: http://host.docker.internal:${OPENCLAW_LOCALHOST_PORT:-63065}
      deploy: {}
      extra_hosts:
      - host.docker.internal:host-gateway
    disabled:
      scale: 0
      environment:
        OPENCLAW_ENDPOINT: ''
      deploy: {}
      extra_hosts: []
  openclaw-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

runtime_deps:
  openclaw-gateway:
    optional: []

data_flow:
  calls:
    - target: litellm
      status: optional
      condition: openclaw-init sets models.providers.litellm.baseUrl when unset; an operator value is kept
      evidence: services/openclaw/README.md

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared (#967); no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
