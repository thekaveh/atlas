# services/ollama/service.yml — Ollama local LLM engine + model puller
name: ollama
label: "Ollama (local LLM engine)"
category: llm
docs: services/ollama/README.md

capabilities:
  - name: "Local Ollama source selection"
    status: supported
    verification: tested
    note: "Atlas resolves CPU and NVIDIA containers, an existing host daemon, or no Ollama upstream behind the same LiteLLM contract."
  - name: "Declared model provisioning"
    status: partial
    verification: tested
    note: "Selected and custom models are pulled for container and localhost sources, but per-model failures are non-fatal and can leave a registered model unavailable until retried."
  - name: "Parallelism and residency tuning"
    status: partial
    verification: tested
    note: "Atlas applies parallel slots, loaded-model limits, KV-cache quantization, flash attention, and keep-alive to containers; host daemons remain operator-owned with macOS-only advisory probes."
  - name: "Authenticated raw Ollama administration"
    status: not-supported
    verification: documented
    note: "The raw ollama.localhost Kong alias is CORS-only and exposes native model-management APIs without Atlas authentication; restrict network access or use an authentication proxy."
  - name: "Deploy-resource environment override"
    status: stubbed
    verification: documented
    note: "OLLAMA_DEPLOY_RESOURCES is projected by service configuration, but the Compose fragment does not consume it; CPU and GPU reservations come from typed source runtime data."

containers:
  - ollama
  - ollama-pull

images:
  - var: LLM_PROVIDER_IMAGE
    default: "ollama/ollama:0.30.11"
    container: ollama
  - var: OLLAMA_PULL_IMAGE
    default: "alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
    container: ollama-pull

sources:
  var: LLM_PROVIDER_SOURCE
  default: ollama-container-cpu
  # Drives `LLM_PROVIDER_SOURCE: auto` (#753): a host Ollama install wins
  # (serve models natively), else an NVIDIA host gets the GPU container, else
  # the CPU container terminal fallback.
  auto_prefer:
    - id: ollama-localhost
      requires_capability: host_ollama
    - id: ollama-container-gpu
      requires_capability: nvidia_gpu
    - id: ollama-container-cpu
  options:
    - id: ollama-container-cpu
      label: "Container (CPU)"
    - id: ollama-container-gpu
      label: "Container (GPU, NVIDIA)"
    - id: ollama-localhost
      label: "Host (existing Ollama on this machine)"
      profiles: [default]
    - id: none
      label: "No Ollama upstream"

env:
  - name: LLM_PROVIDER_SOURCE
    description: "Where LiteLLM's Ollama upstream runs: ollama-container-cpu, ollama-container-gpu, ollama-localhost (host daemon) or none (cloud providers only). Also accepts auto in a consumer manifest."
    default: ollama-container-cpu
  - name: OLLAMA_USER_MODELS
    default: ""
    description: "Comma-separated Ollama model names to activate/pull. Pre-filled by env_assembler from the catalog's default-active Ollama set (see services/ollama/models.yaml); the wizard overwrites it with the user's selection."
  - name: OLLAMA_CUSTOM_MODELS
    default: ""
    description: "Free-text extra Ollama models; a consumer's model_sidecars.ollama lands here. The ollama-pull init container pulls them for container-* sources, and ./start.sh pulls them onto the host daemon for ollama-localhost."
  - name: OLLAMA_PULL_STALL_TIMEOUT_SECONDS
    default: "120"
    description: "Seconds an ollama-pull download may stay below 1 KiB/s before it is aborted and retried. A download that keeps progressing has no wall-clock cutoff."
  - name: OLLAMA_AUTO_IMPORT_LOCAL_MODELS
    default: true
    description: "When LLM_PROVIDER_SOURCE=ollama-localhost, litellm-init queries the upstream's /api/tags and auto-imports every model found, unioning with OLLAMA_USER_MODELS. Set false to keep strict wizard-only control."
  - name: OLLAMA_DEPLOY_RESOURCES
    default: "~"
    description: "Reserved for future GPU deploy block. Currently '~' (null)."
  - name: OLLAMA_SCALE
    description: "Set by ./start.sh from LLM_PROVIDER_SOURCE; do not edit. 1 runs the ollama container (container-* sources), 0 does not."
    auto_managed: true
  - name: OLLAMA_PULL_SCALE
    description: "Set by ./start.sh from LLM_PROVIDER_SOURCE; do not edit. 1 runs the ollama-pull init container for container-* sources, else 0."
    auto_managed: true
  - name: OLLAMA_NVIDIA_VISIBLE_DEVICES
    description: "Set by ./start.sh from LLM_PROVIDER_SOURCE; do not edit. all for ollama-container-gpu, else null. Passed to the ollama container as NVIDIA_VISIBLE_DEVICES."
    auto_managed: true
  - name: OLLAMA_ENDPOINT
    description: "Auto-managed; do not set. The per-source Ollama URL (empty for none). ./start.sh writes it into LITELLM_OLLAMA_UPSTREAM; no container reads OLLAMA_ENDPOINT directly."
    auto_managed: true
  - name: LITELLM_OLLAMA_UPSTREAM
    auto_managed: true
    description: "Ollama URL the LiteLLM gateway forwards Ollama-routed requests to. Owned by ollama because the value flips with LLM_PROVIDER_SOURCE; consumed by litellm-init when rendering its config.yaml."
  - name: OLLAMA_LOCALHOST_PORT
    default: "11434"
    description: "Host port for the ollama-localhost source variant. URL is derived at compose-render time as http://host.docker.internal:11434."
  - name: OLLAMA_NUM_PARALLEL
    default: "8"
    description: "Ollama parallel request slots per model. Multi-agent consumers (8+ concurrent requests) need more than 1; Ollama's default of 1 serializes them. Applies to the container-* sources; for ollama-localhost the host daemon owns it."
  - name: OLLAMA_MAX_LOADED_MODELS
    default: "2"
    description: "Maximum models Ollama keeps resident at once. Raise it for workloads that swap between several models; lower it to bound memory. Applies to the container-* sources; for ollama-localhost the host daemon owns it."
  - name: OLLAMA_KV_CACHE_TYPE
    default: q8_0
    description: "KV cache quantization: f16 (full precision, Ollama's default), q8_0 (about half the memory, negligible quality cost) or q4_0 (about a quarter, measurable cost). Needs OLLAMA_FLASH_ATTENTION active. Container-* sources only; ollama-localhost uses the host daemon's setting."
  - name: OLLAMA_FLASH_ATTENTION
    default: "1"
    description: "Enables Ollama's flash-attention path. Current Ollama enables it automatically where supported. Atlas pins it because OLLAMA_KV_CACHE_TYPE quantization has no effect without it. Set 0 to force it off."
  - name: OLLAMA_KEEP_ALIVE
    default: ""
    description: "Time Ollama keeps a model loaded after its last use (5m, 1h, or -1 for forever); empty uses Ollama's 5m default. Container-* sources only. -1 keeps every loaded model in RAM until reverted and the daemon restarts."
  - name: OLLAMA_MODELS_RESIDENT_MIN
    default: ""
    description: "Advisory, ollama-localhost only: how many models a workload needs resident at once. ./start.sh doctor reports a failure when the daemon's OLLAMA_MAX_LOADED_MODELS is lower. Empty declares no expectation. A LightRAG run with separate extract, embed and keyword models needs 3."
  - name: OLLAMA_PARALLEL_MIN
    default: ""
    description: "Advisory, ollama-localhost only: the concurrent-request floor a consumer needs. ./start.sh doctor warns when the daemon's OLLAMA_NUM_PARALLEL is lower. Empty declares no expectation. Ollama's default of 1 slot silently serializes a multi-agent consumer."

depends_on:
  # `litellm` is listed here NOT because the ollama container calls
  # LiteLLM (the call direction is the opposite), but because the
  # bootstrapper uses `depends_on.required` as the canonical-order
  # backbone for the wizard / overview-box display. Keeping ollama →
  # litellm here pins the rule that the LLM Engine row sits immediately
  # after LiteLLM in the wizard's LLM block (see
  # tests/test_row_order_stability.py). When a separate
  # `display_order:` field is added, this edge moves there.
  # `supabase` is the actual bootstrap blocker (supabase-db-init must
  # complete before ollama-pull can run).
  required:
    - supabase
    - litellm
  optional: []

rows:
  - display_name: "LLM Engine"
    source_var: LLM_PROVIDER_SOURCE
    scale_var: OLLAMA_SCALE
    alias: ollama.localhost
    description: "Local Ollama upstream the LiteLLM gateway forwards to."
    localhost_endpoint_var: LITELLM_OLLAMA_UPSTREAM
    localhost_port_var: OLLAMA_LOCALHOST_PORT

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  llm_provider:
    ollama-container-cpu:
      scale: 1
      environment:
        OLLAMA_ENDPOINT: http://ollama:11434
        OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-8}
        OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      deploy: {}
      extra_hosts: []
    ollama-container-gpu:
      scale: 1
      environment:
        OLLAMA_ENDPOINT: http://ollama:11434
        OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-8}
        OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
        NVIDIA_VISIBLE_DEVICES: all
      deploy:
        resources:
          reservations:
            devices:
            - driver: nvidia
              capabilities:
              - gpu
      extra_hosts: []
    ollama-localhost:
      scale: 0
      environment:
        OLLAMA_ENDPOINT: http://host.docker.internal:${OLLAMA_LOCALHOST_PORT:-11434}
      deploy: {}
      extra_hosts:
      - host.docker.internal:host-gateway
    none:
      scale: 0
      environment:
        OLLAMA_ENDPOINT: ''
      deploy: {}
      extra_hosts: []
  ollama-pull:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

runtime_adaptive:
  ollama-pull:
    adapts_to: llm_provider
    environment_adaptation:
      OLLAMA_HOST_URL: ${LITELLM_OLLAMA_UPSTREAM}
    extra_hosts_adaptation: inherit from llm_provider

data_flow:
  # Ollama serves /api at runtime; it doesn't initiate outbound calls in
  # the request path. The historical supabase + litellm edges here were
  # init-time bootstrap contacts (ollama-pull reads OLLAMA_USER_MODELS /
  # OLLAMA_CUSTOM_MODELS and warms the Ollama engine), which the schema
  # explicitly excludes — those belong on the ollama-pull init manifest if anywhere.
  calls: []

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
