# services/ollama/models.yaml
# Curated Ollama default catalog (maintainer-editable). Section = role,
# order = priority (first entry = highest priority), default: pre-selected
# in the wizard. The wizard also live-scrapes ollama.com/library for the
# full picker; this file provides the default trio and serves as the
# scrape-failure fallback.
#
# Schema: bootstrapper/schemas/models.schema.json (flat-sections variant).
# Sections: content | embeddings | vision
content:
  - name: qwen3.8:latest
    default: true
    description: "Qwen3.8 27B multimodal — image + video understanding, 256K context, default content model"
    badges: [default]
    metadata_version: 1
    kind: chat
    adapter: ollama_chat
    capabilities: {chat: true, tools: true, reasoning: true, structured_output: true}
    # think:false is load-bearing here, more so than it was for qwen3.6.
    # Qwen3.8 ships with THINKING MODE ON by default (disableable per
    # request), so without this every extract/keyword call would pay for
    # reasoning tokens it does not need and return prose around the answer.
    # Roles that genuinely want deliberation can re-enable it per request.
    #
    # Upstream also exposes `reasoning_effort` (depth) and
    # `preserve_thinking` (carry reasoning across turns). Neither is
    # expressible here: models.schema.json pins request_defaults to
    # `think` only. Adding them is a schema change, not a catalog edit.
    request_defaults: {think: false}
    recommended_roles: [extract, keyword, query, judge]
# `dim:` is the model's output vector dimension. The wizard pre-selects the
# embedding model whose dim matches the consumer's required dimension — the
# backend memory_facts vector(768) column (model_resolver.MEMORY_FACTS_EMBEDDING_DIM).
# So nomic-embed-text (dim 768) is the auto-matched default; list-order is only a
# tiebreaker among same-dim models. qwen3-embedding:0.6b (dim 1536) stays available
# but selecting it triggers a warning unless that column is migrated. See
# bootstrapper/utils/model_resolver.embedding_dim_warning.
embeddings:
  - name: nomic-embed-text
    dim: 768
    default: true
    description: "Nomic text embeddings — small, fast"
    badges: [default, embeddings]
    metadata_version: 1
    kind: embedding
    adapter: ollama
    capabilities: {embedding: true}
    recommended_roles: [embedding]
  - name: qwen3-embedding:0.6b
    dim: 1536
    default: true
    description: "Qwen3 embeddings, 0.6B — top of MTEB multilingual leaderboard"
    badges: [default, embeddings]
    metadata_version: 1
    kind: embedding
    adapter: ollama
    capabilities: {embedding: true}
    recommended_roles: [embedding]
  - name: bge-m3
    dim: 1024
    description: "BAAI multilingual embedding model — dense, sparse, and multi-vector retrieval"
    badges: [embeddings]
    metadata_version: 1
    kind: embedding
    adapter: ollama
    capabilities: {embedding: true}
    recommended_roles: [embedding]
vision:
  # Same artifact as the content entry above — Qwen3.8 is natively
  # multimodal (image AND video understanding, from STEM diagrams and
  # documents through hour-scale video), so it is listed in both sections
  # rather than pairing a separate vision model.
  - name: qwen3.8:latest
    metadata_version: 1
    kind: chat
    adapter: ollama_chat
    capabilities: {vision: true}
    recommended_roles: [vision]
