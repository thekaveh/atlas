# services/ollama/compose.yml — Ollama engine + model puller
services:
  ollama:
    image: ${LLM_PROVIDER_IMAGE}
    container_name: ${PROJECT_NAME}-ollama
    restart: unless-stopped
    volumes:
      - llm-provider-data:/root/.ollama
    # No host port mapping — Ollama is now an internal-only upstream for LiteLLM.
    # Direct CLI access from host: docker exec -it ${PROJECT_NAME}-ollama ollama <cmd>
    environment:
      NVIDIA_VISIBLE_DEVICES: ${OLLAMA_NVIDIA_VISIBLE_DEVICES:-all}
      # Parallel serving (#849): multi-agent consumers (8+ concurrent
      # requests) need NUM_PARALLEL > 1; Ollama's default of 1 serializes.
      # MAX_LOADED_MODELS bounds resident-model memory. Inert when this
      # container is scaled to 0 (ollama-localhost); the host daemon owns
      # both for that source.
      # KV-cache quantization (#849 follow-up). The attention KV cache is
      # the dominant per-slot memory cost, and NUM_PARALLEL multiplies it:
      # q8_0 roughly halves it for a negligible quality cost. Only takes
      # effect with flash attention, so that is pinned alongside rather
      # than left to autodetection — a silently-inactive memory setting is
      # worse than an absent one. Inert when scaled to 0 (ollama-localhost).
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-8}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      # Residency TTL (#798). Empty = Ollama's own 5m default, which evicts a
      # multi-model ingest's working set between calls. Deliberately NOT
      # defaulted to -1: that pins every loaded model in RAM until reverted,
      # which on a large model-set is tens of GB. Operator opt-in.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
    deploy:
      replicas: ${OLLAMA_SCALE:-1}
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network

  ollama-pull:
    build:
      context: pull
      args:
        BASE_IMAGE: ${OLLAMA_PULL_IMAGE}
    image: ${PROJECT_NAME}-ollama-pull:local
    container_name: ${PROJECT_NAME}-ollama-pull
    restart: "no"
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    environment:
      # Bypasses LiteLLM by design — model pulls hit Ollama's /api/pull directly.
      # ``${VAR-default}`` form: see comment in litellm-init service.
      OLLAMA_HOST_URL: ${LITELLM_OLLAMA_UPSTREAM-http://ollama:11434}
      # Model lists sourced from env vars (not DB). See pull.sh header.
      OLLAMA_USER_MODELS: ${OLLAMA_USER_MODELS:-}
      OLLAMA_CUSTOM_MODELS: ${OLLAMA_CUSTOM_MODELS:-}
      OLLAMA_PULL_STALL_TIMEOUT_SECONDS: ${OLLAMA_PULL_STALL_TIMEOUT_SECONDS:-120}
    volumes:
      - ./pull/scripts:/scripts:ro
    entrypoint: ["/scripts/pull.sh"]
    deploy:
      replicas: ${OLLAMA_PULL_SCALE:-1}
    networks:
      - backend-network

volumes:
  llm-provider-data:
    name: ${PROJECT_NAME}-llm-provider-data
    driver: local
