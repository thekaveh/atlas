# services/speaches/service.yml — Speaches (unified TTS + STT, OpenAI-compatible)
#
# One container exposes BOTH /v1/audio/transcriptions (STT, Faster-Whisper)
# AND /v1/audio/speech (TTS, Kokoro + Piper voices). Activation is driven
# externally — by whichever of stt_provider OR tts_provider picks a
# speaches-* option. When both pick it, the bootstrapper dedupes to one
# running container.
#
# This manifest has NO `sources:` block. The activation logic lives in
# `bootstrapper/services/service_config.py::_generate_stt_provider_config`
# and `_generate_tts_provider_config`, which read both
# STT_PROVIDER_SOURCE and TTS_PROVIDER_SOURCE and write SPEACHES_SCALE.
name: speaches
label: "Speaches (unified TTS + STT)"
category: media
docs: services/tts-provider/README.md

capabilities:
  - name: "OpenAI-compatible text-to-speech"
    status: partial
    verification: tested
    note: "Atlas preloads speaches-ai/Kokoro-82M-v1.0-ONNX (the SPEACHES_TTS_MODEL default and tts-1 alias target). The first start downloads it from Hugging Face; once it is cached, Speaches restarts offline. Open WebUI text-to-speech returned audio from a cold cache on 2026-11-09."
  - name: "OpenAI-compatible speech-to-text"
    status: partial
    verification: tested
    note: "Atlas preloads Systran/faster-whisper-large-v3, the whisper-1 alias target Open WebUI and Hermes request. Open WebUI transcribed Speaches-generated audio from a cold cache, and again after an offline restart, on 2026-11-09."
  - name: "Configurable STT model selection"
    status: stubbed
    verification: documented
    note: "SPEACHES_STT_MODEL is declared but inert: PRELOAD_MODELS pins the whisper-1 alias target, and Open WebUI and Hermes request whisper-1."

containers:
  - speaches

images:
  - var: SPEACHES_IMAGE
    default: "ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu"
    container: speaches
    notes: "CPU build (default). When the speaches-gpu profile wins, the bootstrapper rewrites this var from SPEACHES_GPU_IMAGE at generation time."

env:
  - name: SPEACHES_GPU_IMAGE
    default: "ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda"
    description: "CUDA build of the same image. When the speaches-gpu profile wins, the bootstrapper writes this value into SPEACHES_IMAGE (the compose interpolation target)."
  - name: SPEACHES_TTS_MODEL
    default: "speaches-ai/Kokoro-82M-v1.0-ONNX"
    description: "Model id Open WebUI sends in /v1/audio/speech requests: the Speaches Kokoro ONNX id (speaches-ai/Kokoro-82M-v1.0-ONNX). The id 'hexgrad/Kokoro-82M' returns 404. Only the default is preloaded; download another id first with POST /v1/models/{id}."
  - name: SPEACHES_STT_MODEL
    default: "Systran/faster-distil-whisper-large-v3"
    description: "Inert: Speaches preloads from a hard-coded `PRELOAD_MODELS` list, and Open WebUI and Hermes request `whisper-1`, which Speaches maps to the preloaded Systran/faster-whisper-large-v3. Changing this value has no effect."
  - name: SPEACHES_API_KEY
    default: ""
    secret: true
    description: "Bearer key Speaches requires on its API routes (/health stays public); auto-generated by the bootstrapper. Open WebUI and Hermes receive it through OPEN_WEB_UI_STT_API_KEY, OPEN_WEB_UI_TTS_API_KEY and TTS_INTERNAL_API_KEY."
  - name: SPEACHES_PORT
    # default computed by services/topology.py slot allocator
    description: "Host port for the Speaches container (in-container listen port is 8000)."
  - name: SPEACHES_SCALE
    auto_managed: true
    description: "Computed by bootstrapper/services/service_config.py::_generate_stt_provider_config (or _generate_tts_provider_config) — set to 1 when STT_PROVIDER_SOURCE OR TTS_PROVIDER_SOURCE picks a speaches-* variant."

depends_on:
  # Speaches is a leaf STT/TTS engine selected via STT_PROVIDER_SOURCE or
  # TTS_PROVIDER_SOURCE. Neither `parakeet` nor `tts-provider` is a runtime
  # call edge — they're retained so the bootstrapper's canonical order
  # places this row in the media block after the LLM/engine rows it's
  # alternatively selected against. Same display-order convention as
  # ollama/parakeet/chatterbox. NOT a runtime call.
  required:
    - parakeet
    - tts-provider
  optional: []

exports: []

rows: []

# No runtime_sc / runtime_adaptive / runtime_deps blocks here — intentional.
# SPEACHES_SCALE is auto-managed by `_generate_stt_provider_config` /
# `_generate_tts_provider_config` in `bootstrapper/services/service_config.py`
# based on STT_PROVIDER_SOURCE / TTS_PROVIDER_SOURCE (speaches is dual-role
# and dedupes when both pick a speaches-* variant). The runtime contract
# lives in the parakeet / tts-provider manifests + the imperative
# source-config code, not in a per-service runtime block.

data_flow:
  calls: []

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
