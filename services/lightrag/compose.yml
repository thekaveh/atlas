# services/lightrag/compose.yml
# LightRAG fragment. Every env var declared in runtime_sc.lightrag.<src>.environment
# AND every adaptive var (LIGHTRAG_DOCLING_ENDPOINT, etc.) MUST also appear in
# the environment block below — memory: project_runtime_sc_vs_compose_env_dual_write.
services:
  lightrag:
    image: ${LIGHTRAG_IMAGE:-ghcr.io/hkuds/lightrag:v1.5.4}
    container_name: ${PROJECT_NAME}-lightrag
    deploy:
      replicas: ${LIGHTRAG_SCALE:-0}
      resources:
        limits:
          memory: ${LIGHTRAG_MEMORY_LIMIT:-6g}
          cpus: '${LIGHTRAG_CPU_LIMIT:-2.0}'
    ports:
      - "${HOST_BIND_IP:-}${LIGHTRAG_API_PORT}:9621"
    # Override the image's bare `python -m lightrag.api.lightrag_server`
    # entrypoint with a shell wrapper that exports the resolved values
    # lightrag-init wrote to /app/data/.env BEFORE python starts. Without
    # this, LightRAG's own dotenv loader looks at /app/.env (its WORKDIR)
    # which doesn't exist, leaving LLM_MODEL / EMBEDDING_MODEL / EMBEDDING_DIM
    # empty. `set -a` auto-exports every var sourced after it.
    entrypoint:
      - sh
      - -c
      - 'set -a; [ -f /app/data/.env ] && . /app/data/.env; set +a; exec python -m lightrag.api.lightrag_server'
    environment:
      LIGHTRAG_ENDPOINT: ${LIGHTRAG_ENDPOINT}
      HOST: 0.0.0.0
      PORT: 9621
      WORKERS: ${LIGHTRAG_WORKERS:-2}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      # JWT signing key for /login flow; without this LightRAG warns and
      # falls back to a hardcoded default secret (security risk).
      TOKEN_SECRET: ${LIGHTRAG_TOKEN_SECRET}
      LLM_BINDING: ${LIGHTRAG_LLM_BINDING:-openai}
      LLM_BINDING_HOST: ${LIGHTRAG_LLM_BINDING_HOST:-http://litellm:4000/v1}
      LLM_BINDING_API_KEY: ${LITELLM_MASTER_KEY}
      # Role-specific LightRAG v1.5+ LLM overrides. Empty values are
      # intentional: LightRAG treats them as unset and falls back to the base
      # LLM_* settings resolved by lightrag-init.
      EXTRACT_LLM_MODEL: ${LIGHTRAG_EXTRACT_LLM_MODEL:-}
      KEYWORD_LLM_MODEL: ${LIGHTRAG_KEYWORD_LLM_MODEL:-}
      QUERY_LLM_MODEL: ${LIGHTRAG_QUERY_LLM_MODEL:-}
      EXTRACT_LLM_BINDING: ${LIGHTRAG_EXTRACT_LLM_BINDING:-}
      KEYWORD_LLM_BINDING: ${LIGHTRAG_KEYWORD_LLM_BINDING:-}
      QUERY_LLM_BINDING: ${LIGHTRAG_QUERY_LLM_BINDING:-}
      EXTRACT_LLM_BINDING_HOST: ${LIGHTRAG_EXTRACT_LLM_BINDING_HOST:-}
      KEYWORD_LLM_BINDING_HOST: ${LIGHTRAG_KEYWORD_LLM_BINDING_HOST:-}
      QUERY_LLM_BINDING_HOST: ${LIGHTRAG_QUERY_LLM_BINDING_HOST:-}
      EXTRACT_LLM_BINDING_API_KEY: ${LIGHTRAG_EXTRACT_LLM_BINDING_API_KEY:-}
      # KEYWORD/QUERY role keys default to the in-network LiteLLM master key so a
      # consumer pointing these roles at LiteLLM needs zero key wiring (#721);
      # set the LIGHTRAG_* override only to target a different provider.
      KEYWORD_LLM_BINDING_API_KEY: ${LIGHTRAG_KEYWORD_LLM_BINDING_API_KEY:-${LITELLM_MASTER_KEY}}
      QUERY_LLM_BINDING_API_KEY: ${LIGHTRAG_QUERY_LLM_BINDING_API_KEY:-${LITELLM_MASTER_KEY}}
      EXTRACT_MAX_ASYNC_LLM: ${LIGHTRAG_EXTRACT_MAX_ASYNC_LLM:-}
      KEYWORD_MAX_ASYNC_LLM: ${LIGHTRAG_KEYWORD_MAX_ASYNC_LLM:-}
      QUERY_MAX_ASYNC_LLM: ${LIGHTRAG_QUERY_MAX_ASYNC_LLM:-}
      EXTRACT_LLM_TIMEOUT: ${LIGHTRAG_EXTRACT_LLM_TIMEOUT:-}
      KEYWORD_LLM_TIMEOUT: ${LIGHTRAG_KEYWORD_LLM_TIMEOUT:-}
      QUERY_LLM_TIMEOUT: ${LIGHTRAG_QUERY_LLM_TIMEOUT:-}
      # Query defaults. Numeric values must stay concrete because LightRAG
      # parses the env vars as ints. Rerank defaults false because Atlas's TEI
      # /rerank endpoint expects `{query, texts}`, while LightRAG's direct
      # jina/cohere clients send `{query, documents}`.
      RERANK_BY_DEFAULT: ${LIGHTRAG_QUERY_ENABLE_RERANK:-false}
      TOP_K: ${LIGHTRAG_QUERY_TOP_K:-10}
      CHUNK_TOP_K: ${LIGHTRAG_QUERY_CHUNK_TOP_K:-5}
      MAX_TOTAL_TOKENS: ${LIGHTRAG_QUERY_MAX_TOTAL_TOKENS:-12000}
      # LLM_MODEL / EMBEDDING_MODEL / EMBEDDING_DIM are intentionally NOT
      # set here — lightrag-init resolves them from LiteLLM /v1/models at
      # boot and writes them to /app/data/.env, which the entrypoint
      # sources above. Setting them empty here would clobber the resolved
      # values (compose env wins over dotenv).
      EMBEDDING_BINDING: ${LIGHTRAG_EMBEDDING_BINDING:-openai}
      EMBEDDING_BINDING_HOST: ${LIGHTRAG_EMBEDDING_BINDING_HOST:-http://litellm:4000/v1}
      EMBEDDING_BINDING_API_KEY: ${LITELLM_MASTER_KEY}
      VLM_PROCESS_ENABLE: ${LIGHTRAG_VLM_PROCESS_ENABLE:-true}
      LIGHTRAG_KV_STORAGE: ${LIGHTRAG_KV_STORAGE:-RedisKVStorage}
      LIGHTRAG_VECTOR_STORAGE: ${LIGHTRAG_VECTOR_STORAGE:-PGVectorStorage}
      LIGHTRAG_GRAPH_STORAGE: ${LIGHTRAG_GRAPH_STORAGE:-Neo4JStorage}
      LIGHTRAG_DOC_STATUS_STORAGE: ${LIGHTRAG_DOC_STATUS_STORAGE:-RedisDocStatusStorage}
      POSTGRES_URI: ${LIGHTRAG_PG_URI}
      # LightRAG v1.5.0's PGVectorStorage validates POSTGRES_USER, POSTGRES_PASSWORD,
      # POSTGRES_DATABASE individually at __post_init__ — POSTGRES_URI alone is not
      # enough. Pass the components separately when supabase is enabled.
      POSTGRES_HOST: ${LIGHTRAG_PG_URI:+supabase-db}
      POSTGRES_PORT: ${LIGHTRAG_PG_URI:+5432}
      POSTGRES_USER: ${LIGHTRAG_PG_URI:+${LIGHTRAG_DB_USER:?LIGHTRAG_DB_USER is required when LightRAG PostgreSQL is enabled}}
      POSTGRES_PASSWORD: ${LIGHTRAG_PG_URI:+${LIGHTRAG_DB_PASSWORD:?LIGHTRAG_DB_PASSWORD is required when LightRAG PostgreSQL is enabled}}
      POSTGRES_DATABASE: ${LIGHTRAG_PG_URI:+${SUPABASE_DB_NAME}}
      POSTGRES_WORKSPACE: lightrag
      NEO4J_URI: ${LIGHTRAG_NEO4J_URI}
      NEO4J_USERNAME: ${LIGHTRAG_NEO4J_USERNAME}
      NEO4J_PASSWORD: ${LIGHTRAG_NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      REDIS_URI: ${LIGHTRAG_REDIS_URI}
      LIGHTRAG_PARSER: "*:native-teP,*:legacy-R"
      DOCLING_ENDPOINT: ${LIGHTRAG_DOCLING_ENDPOINT}
      # LightRAG v1.5.0 only accepts cohere/jina/aliyun/null for RERANK_BINDING
      # and hard-crashes on an empty string. Atlas emits the literal `null`
      # because direct LightRAG->TEI rerank payloads are incompatible without
      # an adapter. The :-null default covers a blank/absent var so the
      # container can never boot-loop.
      RERANK_BINDING: ${LIGHTRAG_RERANK_BINDING:-null}
      RERANK_BINDING_HOST: ${LIGHTRAG_RERANK_BINDING_HOST}
      # Bearer token for the backend rerank adapter (#415). Blank unless the
      # adapter is enabled; the backend route rejects an empty/wrong token.
      # LightRAG sends it as `Authorization: Bearer <key>` on rerank calls.
      RERANK_BINDING_API_KEY: ${LIGHTRAG_RERANK_ADAPTER_TOKEN:-}
      RERANK_MODEL: mixedbread-ai/mxbai-rerank-base-v1
    volumes:
      - lightrag-data:/app/data
    networks:
      - backend-network
      - docling-lightrag-network
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP}"
    depends_on:
      lightrag-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    healthcheck:
      # LightRAG's image is python:3.12-slim — no curl/wget. Probe via
      # the bundled python urllib (same pattern as litellm's healthcheck).
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:9621/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    restart: unless-stopped

  lightrag-init:
    build:
      context: init
      args:
        BASE_IMAGE: ${LIGHTRAG_INIT_IMAGE:-alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b}
    image: ${PROJECT_NAME}-lightrag-init:local
    container_name: ${PROJECT_NAME}-lightrag-init
    deploy:
      replicas: ${LIGHTRAG_INIT_SCALE:-0}
    depends_on:
      litellm:
        condition: service_healthy
    entrypoint: ["sh", "-c", "/scripts/init-lightrag.sh"]
    environment:
      LIGHTRAG_SOURCE: ${LIGHTRAG_SOURCE}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL}
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL}
      # Service-specific overrides resolve-models.py honors above the
      # stack-wide LITELLM_* picks (dual-write: declared in service.yml).
      LIGHTRAG_LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-}
      LIGHTRAG_EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-}
      LIGHTRAG_EMBEDDING_DIM: ${LIGHTRAG_EMBEDDING_DIM:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LIGHTRAG_PG_URI: ${LIGHTRAG_PG_URI}
      LIGHTRAG_NEO4J_URI: ${LIGHTRAG_NEO4J_URI}
      LIGHTRAG_NEO4J_USERNAME: ${LIGHTRAG_NEO4J_USERNAME}
      LIGHTRAG_NEO4J_PASSWORD: ${LIGHTRAG_NEO4J_PASSWORD}
      LIGHTRAG_REDIS_URI: ${LIGHTRAG_REDIS_URI}
    volumes:
      - ./init/scripts:/scripts:ro
      - lightrag-data:/app/data
    networks:
      - backend-network
    restart: "no"

volumes:
  lightrag-data:
    name: ${PROJECT_NAME}-lightrag-data
