# services/cloudflared/service.yml
name: cloudflared
label: "Cloudflare Tunnel (public edge)"
category: infra
docs: services/cloudflared/README.md

capabilities:
  - name: "Outbound named-tunnel edge"
    status: supported
    verification: tested
    note: "Atlas runs cloudflared as an egress-only named tunnel to Kong and validates the required tunnel-token configuration before launch."
  - name: "Atlas-managed public hostname routing"
    status: not-supported
    verification: documented
    note: "Public hostnames and their Origin Host Header mappings must be created in the Cloudflare dashboard; Atlas does not provision tunnel ingress rules."
  - name: "Atlas-managed Cloudflare Access policy"
    status: not-supported
    verification: documented
    note: "Identity, application, and Access policy configuration remains external to Atlas and must be applied by the Cloudflare account operator."

containers:
  - cloudflared

images:
  - var: CLOUDFLARED_IMAGE
    default: "cloudflare/cloudflared:2026.6.1"
    container: cloudflared
    notes: "Cloudflare Tunnel daemon. Pin a dated tag; bump deliberately."

sources:
  var: CLOUDFLARED_SOURCE
  default: disabled
  options:
    - id: container
      label: "Run the tunnel daemon as a container (proxies to Kong)."
    - id: disabled
      label: "No public edge (default)."

env:
  - name: CLOUDFLARED_SOURCE
    default: disabled
    description: "Deployment mode: container (run the tunnel) or disabled (default)."
  - name: CLOUDFLARE_TUNNEL_TOKEN
    default: ""
    secret: true
    description: |
      Cloudflare named-tunnel token (Zero Trust > Networks > Tunnels). When
      CLOUDFLARED_SOURCE=container this must be set or the daemon exits. The
      tunnel's public hostname is configured in the Cloudflare dashboard to
      point at http://kong-api-gateway:8000.
  - name: CLOUDFLARED_SCALE
    auto_managed: true
    description: "Set to 1 when CLOUDFLARED_SOURCE=container, 0 when disabled."

depends_on:
  required:
    - kong
  optional: []

rows:
  - display_name: "Cloudflare Tunnel"
    source_var: CLOUDFLARED_SOURCE
    description: "Outbound tunnel to Cloudflare; terminates TLS at the edge and proxies to Kong."

exports: []

runtime_sc:
  cloudflared:
    container:
      scale: 1
      environment:
        TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
        TUNNEL_METRICS: "0.0.0.0:2000"
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - kong
