# services/supavisor/service.yml — optional Supabase Postgres transaction pooler
name: supavisor
label: "Supavisor (Postgres transaction pooler)"
category: data
docs: services/supavisor/README.md

containers:
  - supavisor

images:
  - var: SUPAVISOR_IMAGE
    default: "supabase/supavisor:2.9.5"
    container: supavisor

sources:
  var: SUPAVISOR_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container (transaction pooler)"
    - id: disabled
      label: "Disabled"

env:
  - name: SUPAVISOR_SOURCE
    default: disabled
    description: "Deployment mode: container (transaction pooler) or disabled/direct Postgres."
  - name: SUPAVISOR_SCALE
    auto_managed: true
    description: "1 when SUPAVISOR_SOURCE=container, otherwise 0."
  - name: SUPAVISOR_TENANT_ID
    default: atlas
    description: "Supavisor tenant suffix. Clients connect as <db_user>.<tenant>."
  - name: SUPAVISOR_DEFAULT_POOL_SIZE
    default: 20
    description: "Default upstream Postgres pool size for the Atlas tenant."
  - name: SUPAVISOR_MAX_CLIENT_CONN
    default: 100
    description: "Maximum client connections accepted by the Atlas tenant."
  - name: SUPAVISOR_DB_POOL_SIZE
    default: 5
    description: "Supavisor metadata database pool size."
  - name: SUPAVISOR_DATABASE_URL
    auto_managed: true
    description: "Generated Postgres URL consumed by backend/Celery; points at Supavisor when enabled and direct Supabase Postgres when disabled."
  - name: SUPAVISOR_DB_HOST
    auto_managed: true
    description: "Generated n8n Postgres host; supavisor when enabled, supabase-db when disabled."
  - name: SUPAVISOR_DB_PORT_VALUE
    auto_managed: true
    description: "Generated n8n Postgres port; 6543 when enabled, 5432 when disabled."
  - name: SUPAVISOR_DB_USER
    auto_managed: true
    description: "Generated n8n Postgres user; appends .${SUPAVISOR_TENANT_ID} when Supavisor is enabled."
  - name: SUPAVISOR_SECRET_KEY_BASE
    default: ""
    secret: true
    description: "Supavisor Phoenix secret; auto-generated by the bootstrapper when blank."
  - name: SUPAVISOR_VAULT_ENC_KEY
    default: ""
    secret: true
    description: "Supavisor vault encryption key; must be exactly 32 bytes and is auto-generated when blank."
  - name: SUPAVISOR_API_JWT_SECRET
    default: ""
    secret: true
    description: "Supavisor tenant API JWT secret; auto-generated by the bootstrapper when blank."
  - name: SUPAVISOR_METRICS_JWT_SECRET
    default: ""
    secret: true
    description: "Supavisor metrics JWT secret; auto-generated by the bootstrapper when blank."

depends_on:
  required:
    - supabase
  optional:
    - backend
    - n8n
    - celery

rows:
  - display_name: "Supavisor"
    source_var: SUPAVISOR_SOURCE
    scale_var: SUPAVISOR_SCALE
    description: "Internal-only Supabase Postgres transaction pooler for selected app clients."

runtime_sc:
  supavisor:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []

data_flow:
  calls:
    - supabase
