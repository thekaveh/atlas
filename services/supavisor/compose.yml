# services/supavisor/compose.yml — optional Supabase Postgres transaction pooler
services:
  supavisor:
    image: ${SUPAVISOR_IMAGE:-supabase/supavisor:2.9.5}
    container_name: ${PROJECT_NAME}-supavisor
    restart: unless-stopped
    deploy:
      replicas: ${SUPAVISOR_SCALE:-0}
    depends_on:
      supabase-db-init:
        condition: service_completed_successfully
    environment:
      PORT: 4000
      PROXY_PORT_TRANSACTION: 6543
      DATABASE_URL: ecto://${SUPAVISOR_DB_ADMIN_USER_URI:?SUPAVISOR_DB_ADMIN_USER_URI is required}:${SUPAVISOR_DB_ADMIN_PASSWORD_URI:?SUPAVISOR_DB_ADMIN_PASSWORD_URI is required}@supabase-db:5432/supavisor
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: ${SUPAVISOR_SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${SUPAVISOR_VAULT_ENC_KEY}
      API_JWT_SECRET: ${SUPAVISOR_API_JWT_SECRET}
      METRICS_JWT_SECRET: ${SUPAVISOR_METRICS_JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${SUPABASE_DB_NAME}
      POSTGRES_USER: ${SUPAVISOR_DB_ADMIN_USER:?SUPAVISOR_DB_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${SUPAVISOR_DB_ADMIN_PASSWORD:?SUPAVISOR_DB_ADMIN_PASSWORD is required}
      POOLER_TENANT_ID: ${SUPAVISOR_TENANT_ID:-atlas}
      POOLER_DEFAULT_POOL_SIZE: ${SUPAVISOR_DEFAULT_POOL_SIZE:-20}
      POOLER_MAX_CLIENT_CONN: ${SUPAVISOR_MAX_CLIENT_CONN:-100}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${SUPAVISOR_DB_POOL_SIZE:-5}
    command:
      - /bin/sh
      - -c
      - /app/bin/migrate && /app/bin/supavisor eval "$(cat /etc/pooler/pooler.exs)" && /app/bin/server
    volumes:
      - ./pooler/pooler.exs:/etc/pooler/pooler.exs:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -sSfL
        - --head
        - -o
        - /dev/null
        - http://127.0.0.1:4000/api/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    networks:
      - backend-network
