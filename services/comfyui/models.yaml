  # The node pack `comfyui-krea2edit` exists to run THIS LoRA — its own README
  # lists it as a hard requirement alongside a Krea 2 model and the Qwen3-VL
  # encoder. Without it a consumer gets the nodes registered and no edit
  # behaviour, while provision-nodes reports success and doctor reports the
  # node present: installed-but-inert, which is a worse failure shape than a
  # clean error (#909).
  #
  # Licence adds NO new surface. HuggingFace has no SPDX entry for the Krea 2
  # Community License, so `other` is what every Krea 2 artifact carries —
  # including the base weights above. The LoRA's NOTICE states it is a
  # Derivative Model of Krea 2 Raw under that same agreement, so selecting it
  # accepts exactly what krea2-raw-bf16 / krea2-turbo-bf16 already accept.
  # It is an unofficial community fine-tune and its NOTICE says so.
  #
  # base_model is Krea 2 RAW (confirmed against the HF model card). The node
  # advertises both, but identity fidelity may differ on Turbo — worth knowing
  # before paying for a 35 GB Raw download to find out.
  - name: krea2-identity-edit-v1-2
    family: Krea 2
    category: lora
    size_gb: 1.828256432
    size_bytes: 1828256432
