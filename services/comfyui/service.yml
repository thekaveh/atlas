# services/comfyui/service.yml — ComfyUI image generation + init
name: comfyui
label: "ComfyUI (image generation)"
category: media
docs: services/comfyui/README.md

containers:
  - comfyui
  - comfyui-init

images:
  - var: COMFYUI_IMAGE
    default: "ghcr.io/ai-dock/comfyui:v2-cpu-22.04-v0.2.7"
    container: comfyui
    notes: "AI-Dock base image; COMFYUI_AUTO_UPDATE + COMFYUI_REF pin the upstream ComfyUI core at startup."
  - var: COMFYUI_INIT_IMAGE
    default: "alpine:3.24.1"
    container: comfyui-init

sources:
  var: COMFYUI_SOURCE
  default: container-cpu
  options:
    - id: container-cpu
      label: "Container (CPU)"
    - id: container-gpu
      label: "Container (GPU, NVIDIA)"
    - id: localhost
      label: "Host (existing ComfyUI on this machine)"
      profiles: [default]
    - id: managed-localhost-mps
      label: "Host (Apple Silicon / Metal MPS, Atlas-managed)"
      profiles: [default]
    - id: disabled
      label: "Disabled"

env:
  - name: COMFYUI_SOURCE
    default: container-cpu
  - name: COMFYUI_INIT_SOURCE
    default: container
  - name: COMFYUI_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: COMFYUI_LOCALHOST_PORT
    default: "8000"
    description: "Host port for the localhost source variant. URL is derived at compose-render time as http://host.docker.internal:8000."
  - name: COMFYUI_MPS_LOCALHOST_PORT
    default: "8188"
    description: "Fixed host port the Atlas-managed Apple-Silicon/MPS ComfyUI listens on (source=managed-localhost-mps). Containers reach it as http://host.docker.internal:8188. Named with the _LOCALHOST_ host-port convention so the topology slot allocator leaves the fixed default intact."
  - name: COMFYUI_MPS_REF
    default: "v0.27.0"
    description: "Pinned upstream ComfyUI git ref the managed MPS host process checks out (mirrors COMFYUI_REF for the container path). A release tag or full commit SHA."
  - name: COMFYUI_MPS_STATE_DIR
    default: "~/.atlas/comfyui-mps"
    description: "Atlas-owned host state directory for the managed MPS ComfyUI: the pinned checkout, its venv, and the pid/log/status files. Never a container volume."
  - name: COMFYUI_MPS_MODELS_PATH
    default: "~/Documents/ComfyUI/models"
    description: "Existing host models directory the managed MPS process reuses (via extra_model_paths) so no weights are duplicated. Shared with COMFYUI_LOCAL_MODELS_PATH by default."
  - name: COMFYUI_MPS_MIN_MEMORY_GB
    default: "16"
    description: "Minimum unified-memory headroom (GiB) the managed MPS preflight requires before launching ComfyUI; below this the preflight warns."
  - name: COMFYUI_MPS_TORCH_PIN
    default: "torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0"
    description: "Pinned Torch/vision/audio pip spec the managed MPS install applies, so fresh installs are reproducible against the same COMFYUI_MPS_REF instead of pulling whatever Torch is newest that day. Space-separated pip requirement specifiers; bump alongside COMFYUI_MPS_REF. macOS/arm64 torch wheels carry Metal/MPS."
  - name: COMFYUI_MPS_LISTEN
    default: "127.0.0.1"
    description: "Bind address the managed MPS ComfyUI host process listens on. Default 127.0.0.1 (loopback) works on Docker Desktop/macOS where host.docker.internal forwards to host loopback. On Linux container engines, host.docker.internal maps via host-gateway to a bridge address that cannot reach a loopback listener — set 0.0.0.0 there so containers can reach the host process. Local health/port probes stay on 127.0.0.1 regardless."
  - name: COMFYUI_BASE_URL
    default: "http://comfyui:18188"
    description: "In-container default. Runtime value is COMFYUI_ENDPOINT computed by hook."
  - name: COMFYUI_KONG_URL
    default: "http://kong-api-gateway:8000/comfyui"
  - name: COMFYUI_ARGS
    default: "--listen"
  - name: COMFYUI_AUTO_UPDATE
    default: true
    description: "AI-Dock startup update flag. Atlas keeps this true so COMFYUI_REF pins the upstream ComfyUI core even when the base image tag lags."
  - name: COMFYUI_REF
    default: "v0.27.0"
    description: "Pinned upstream ComfyUI git ref passed to AI-Dock. Use a release tag or full commit SHA when deliberately changing the ComfyUI core."
  - name: COMFYUI_PLATFORM
    default: "linux/amd64"
  - name: COMFYUI_UPLOAD_TO_SUPABASE
    default: true
  - name: COMFYUI_STORAGE_BUCKET
    default: "comfyui-images"
  - name: COMFYUI_MODELS_PATH
    default: "/opt/ComfyUI/models"
  - name: COMFYUI_LOCAL_MODELS_PATH
    default: "~/Documents/ComfyUI/models"
  - name: COMFYUI_USER_MODELS
    default: ""
    description: "Comma-separated catalog model names the user picked in the wizard (or via --comfyui-models). Read by services/comfyui/init/scripts/download_models.sh."
  - name: COMFYUI_CUSTOM_MODELS_FILE
    default: "/custom-models.yaml"
    description: "Path to the ComfyUI custom-models sidecar YAML (user-authored models not in the curated catalog). Read by comfyui_resolver when generating the download manifest, and by the wizard's model picker."
  - name: COMFYUI_CUSTOM_NODES_FILE
    default: "/custom-nodes.yaml"
    description: "Path to the pinned ComfyUI custom-node allowlist. The bootstrapper maps selected models' requires_custom_node values through this file before writing active-custom-nodes.tsv."
  - name: COMFYUI_INIT_SCALE
    auto_managed: true
  - name: COMFYUI_SCALE
    auto_managed: true
  - name: COMFYUI_ENDPOINT
    auto_managed: true
    description: "Resolved per COMFYUI_SOURCE. Consumed by backend, open-webui, n8n, jupyterhub, and downstream overlays. Consumer pattern: MY_URL: ${MY_URL:-${COMFYUI_ENDPOINT:-http://comfyui:18188}}"
  - name: COMFYUI_DEPLOY_RESOURCES
    default: "~"
  - name: COMFYUI_MEMORY_LIMIT
    default: 40g
    description: "Hard container-memory ceiling for ComfyUI (deploy.resources.limits.memory). The limit does not reserve memory; 40 g permits large multi-file bundles such as Krea 2 while smaller workloads consume only what they need."
  - name: COMFYUI_CPU_LIMIT
    default: "2.0"
    description: "Container CPU limit for the comfyui container (deploy.resources.limits.cpus). 2.0 cores keeps CPU-mode inference from monopolising the host; GPU mode is GPU-bound so the CPU cap is irrelevant in practice."


depends_on:
  # ComfyUI's real compose gates are supabase-db-init + ollama-pull (i.e.
  # supabase + ollama). The `litellm` entry is retained as part of the
  # canonical-order backbone (see ollama/parakeet for the same
  # convention) — ComfyUI does not call LiteLLM at startup, but listing
  # litellm here pins ComfyUI's row position relative to the LLM block.
  required:
    - supabase
    - litellm
    - ollama
  optional: []

exports: []

rows:
  - display_name: "ComfyUI"
    source_var: COMFYUI_SOURCE
    port_var: COMFYUI_PORT
    scale_var: COMFYUI_SCALE
    alias: comfyui.localhost
    description: "AI image generation & workflows."
    localhost_endpoint_var: COMFYUI_ENDPOINT
    localhost_port_var: COMFYUI_LOCALHOST_PORT

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  comfyui:
    container-cpu:
      scale: 1
      # NOTE: no COMFYUI_ARGS / AUTO_UPDATE here — service_config reads
      # only COMFYUI_ENDPOINT from this block; the container's args come
      # verbatim from .env's COMFYUI_ARGS / COMFYUI_AUTO_UPDATE (README
      # §3). Per-source values listed here were never applied.
      environment:
        COMFYUI_ENDPOINT: http://comfyui:18188
        WEB_ENABLE_AUTH: 'false'
        ENABLE_QUICKTUNNEL: 'false'
        SERVERLESS: 'false'
        COMFYUI_LOCAL_MODELS_PATH: ./empty
      deploy: {}
      extra_hosts: []
    container-gpu:
      scale: 1
      environment:
        COMFYUI_ENDPOINT: http://comfyui:18188
        NVIDIA_VISIBLE_DEVICES: all
        NVIDIA_DRIVER_CAPABILITIES: compute,utility
        WEB_ENABLE_AUTH: 'false'
        ENABLE_QUICKTUNNEL: 'false'
        SERVERLESS: 'false'
        COMFYUI_LOCAL_MODELS_PATH: ./empty
      deploy:
        resources:
          reservations:
            devices:
            - driver: nvidia
              count: 1
              capabilities:
              - gpu
          limits:
            cpus: ${PROD_ENV_COMFYUI_CPUS:-2}
            memory: ${PROD_ENV_COMFYUI_MEM_LIMIT:-4g}
      extra_hosts: []
    localhost:
      scale: 0
      environment:
        COMFYUI_ENDPOINT: http://host.docker.internal:${COMFYUI_LOCALHOST_PORT:-8000}
        COMFYUI_LOCAL_MODELS_PATH: ${COMFYUI_LOCAL_MODELS_PATH:-~/Documents/ComfyUI/models}
      deploy: {}
      extra_hosts:
      - host.docker.internal:host-gateway
    managed-localhost-mps:
      # Atlas launches a native Apple-Silicon/Metal ComfyUI on the HOST (Docker
      # Desktop can't pass Metal into a Linux container), so no container runs
      # (scale 0) — containers reach the managed process via host.docker.internal.
      scale: 0
      environment:
        COMFYUI_ENDPOINT: http://host.docker.internal:${COMFYUI_MPS_LOCALHOST_PORT:-8188}
        COMFYUI_LOCAL_MODELS_PATH: ${COMFYUI_MPS_MODELS_PATH:-~/Documents/ComfyUI/models}
      deploy: {}
      extra_hosts:
      - host.docker.internal:host-gateway
    disabled:
      scale: 0
      environment:
        COMFYUI_ENDPOINT: http://comfyui:18188
      deploy: {}
      extra_hosts: []
  comfyui-init:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment: {}
      deploy: {}
      extra_hosts: []
runtime_adaptive:
  comfyui-init:
    adapts_to: comfyui
    # (no environment_adaptation: the old COMFYUI_HOST_URL entry was a
    # dead promise — download_models.sh reads only PG vars +
    # COMFYUI_MODELS_PATH, and compose never injected it.)
    environment_adaptation: {}
    extra_hosts_adaptation: inherit from comfyui

data_flow:
  calls:
    # ComfyUI uploads each generated image to Supabase Storage via Kong
    # (COMFYUI_UPLOAD_TO_SUPABASE=true). It does NOT call LiteLLM at runtime
    # — the only LiteLLM path is via custom nodes, and that volume is unseeded.
    - supabase
