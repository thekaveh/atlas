# services/litellm/service.yml — LiteLLM gateway + init
#
# The LiteLLM gateway is the mandatory core LLM router. Single source value
# (container); always on. The init container (litellm-init) runs once per
# startup to render config.yaml from the model catalog.
name: litellm
label: "LiteLLM gateway (LLM router)"
category: llm
docs: services/litellm/README.md

capabilities:
  - name: "Unified authenticated model gateway"
    status: supported
    verification: tested
    note: "Atlas exposes chat, embeddings, image generation, and reranking through one LiteLLM endpoint protected by the generated master key, with an explicitly credentialed admin UI."
  - name: "Catalog-driven provider routing"
    status: supported
    verification: tested
    note: "Startup deterministically renders Ollama, cloud, service-passthrough, and consumer-declared model rows from typed catalogs and enabled provider configuration."
  - name: "Gateway persistence and response caching"
    status: supported
    verification: tested
    note: "LiteLLM stores its control and spend data in a dedicated Supabase database and uses the authenticated shared Redis service for namespaced bounded-TTL response caching."
  - name: "Vision-model default consumption"
    status: stubbed
    verification: documented
    note: "Atlas resolves and persists LITELLM_VISION_MODEL for selection UX, but the manifest explicitly has no current consumer route for that default."
  - name: "Unified speech routing"
    status: not-supported
    verification: documented
    note: "STT and TTS consumers call their provider endpoints directly; LiteLLM does not register the stock audio transcription or speech routes."
  - name: "Per-service gateway credentials and budgets"
    status: not-supported
    verification: documented
    note: "Stock consumers share the master key; LiteLLM virtual keys, team budgets, and independently revocable per-service credentials are not provisioned."

containers:
  - litellm
  - litellm-init

images:
  - var: LITELLM_IMAGE
    default: "ghcr.io/berriai/litellm:v1.83.14-stable.patch.2"
    container: litellm

env:
  - name: LITELLM_SOURCE
    default: container
    description: "Locked. LiteLLM is mandatory; only one source value supported."
  - name: LITELLM_PORT
    description: "Host port for the LiteLLM gateway API and UI (in-container 4000)."
    # default removed — computed by services/topology.py slot allocator
  - name: LITELLM_INIT_SCALE
    default: 1
    description: "Init container always runs (single value)."
  - name: LITELLM_MASTER_KEY
    default: ""
    secret: true
    description: "Auto-generated by bootstrapper on first run. Doubles as the admin-dashboard password."
  - name: LITELLM_UI_USERNAME
    default: admin
    description: "Admin-dashboard login username at http://litellm.localhost:${KONG_HTTP_PORT}/ui/. Password is LITELLM_MASTER_KEY."
  - name: LITELLM_CACHE_TTL
    default: "3600"
    description: "Lifetime in seconds of a cached LiteLLM response in Redis. Embeddings, reranks and transcriptions are cached, and chat with LITELLM_CACHE_CHAT=true. LiteLLM's own default is 60s. A non-numeric or non-positive value falls back to 3600."
  - name: LITELLM_CACHE_NAMESPACE
    default: litellm.cache
    description: "Key prefix for LiteLLM's Redis response cache. Redis db 0 also holds the n8n and Langfuse queues and the backend media store. The prefix keeps gateway cache keys separately scannable and droppable."
  - name: LITELLM_CACHE_CHAT
    default: "false"
    description: "Also cache chat, text completion and Responses API calls. Off by default, because a cached reply silently replaces a fresh hermes-agent or lightrag passthrough run, such as a query over newly ingested documents."
  - name: LITELLM_DB_NAME
    description: "Postgres database for LiteLLM. Supabase db-init (05-scoped-roles.sh) creates it."
    default: litellm
  - name: LITELLM_DB_NAME_URI
    default: litellm
    description: "Bootstrapper-synchronized percent-encoded LITELLM_DB_NAME for DSN path components."
  - name: LITELLM_DB_USER
    description: "Scoped Postgres login that owns LITELLM_DB_NAME. Supabase db-init (05-scoped-roles.sh) creates it."
    default: litellm
  - name: LITELLM_DB_PASSWORD
    default: atlas-db-password
    secret: true
    description: "Auto-generated password for the owner of LiteLLM's dedicated database."
  - name: LITELLM_DB_USER_URI
    default: litellm
    description: "Bootstrapper-synchronized percent-encoded LITELLM_DB_USER for DSN userinfo."
  - name: LITELLM_DB_PASSWORD_URI
    default: atlas-db-password
    secret: true
    description: "Bootstrapper-synchronized percent-encoded LITELLM_DB_PASSWORD for DSN userinfo."
  - name: LITELLM_EMBEDDING_MODEL
    default: "ollama/nomic-embed-text"
    description: "Default embedding model used by weaviate-init when computing collection vectorizers."
  - name: LITELLM_DEFAULT_MODEL
    default: ""
    description: "Optional default chat model passed to LangMem (backend)."
  - name: LITELLM_VISION_MODEL
    default: ""
    description: "Default vision-capable model (resolved from the model catalog; forward-looking — no consumer routes on it yet)."
  - name: LITELLM_BASE_URL
    auto_managed: true
    default: "http://litellm:4000"
    description: "In-network URL consumers point at (backend, n8n, jupyterhub, open-webui)."

depends_on:
  required:
    - supabase
    - redis
  optional: []

rows:
  - display_name: "LiteLLM"
    source_var: LITELLM_SOURCE
    port_var: LITELLM_PORT
    alias: litellm.localhost
    description: "Unified LLM gateway — always-on; fronts every provider."
    localhost_endpoint_var: LITELLM_BASE_URL

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  litellm:
    container:
      scale: 1
      environment: {}
      deploy: {}
      extra_hosts: []

doc_extras:
  diagram:
    extra_consumers:
      - hermes

data_flow:
  calls:
    - supabase
    - redis
    - ollama
    - cloud-providers
    - hermes
    - lightrag
    - vllm-metal
    - fal
    - tei-reranker
    - otel-collector
    - langfuse

# Support tier (#1050). Selectable is not validated: this family is `experimental`
# until a cited cold-start, workflow, and upgrade qualification run promotes it.
support:
  tier: experimental
  evidence: "Capability contract declared; no cited cold-start, workflow, or upgrade qualification run yet"
  evidence_revision: v0.1.0
  owner: Atlas maintainers
