# services/crawl4ai/service.yml — Crawl4AI extraction API
name: crawl4ai
label: "Crawl4AI (JS-capable web extraction)"
category: media
docs: services/crawl4ai/README.md

containers:
  - crawl4ai

images:
  - var: CRAWL4AI_IMAGE
    default: "unclecode/crawl4ai:0.9.0"
    container: crawl4ai

sources:
  var: CRAWL4AI_SOURCE
  default: disabled
  options:
    - id: container
      label: "Container"
    - id: disabled
      label: "Disabled"

env:
  - name: CRAWL4AI_SOURCE
    default: disabled
  - name: CRAWL4AI_PORT
    # default removed — computed by services/topology.py slot allocator
  - name: CRAWL4AI_API_TOKEN
    default: ""
    secret: true
    description: "Bearer token required by Crawl4AI's Docker API; auto-generated by the bootstrapper."
  - name: CRAWL4AI_TIMEOUT_SECONDS
    default: 30
    description: "Local Deep Researcher timeout for Crawl4AI extraction calls."
  - name: CRAWL4AI_MAX_CHARS
    default: 60000
    description: "Maximum markdown characters Local Deep Researcher keeps from each Crawl4AI result."
  - name: CRAWL4AI_ALLOW_INTERNAL_URLS
    default: false
    description: "Keep false unless deliberately crawling private/internal URLs from inside the Atlas network."
  - name: CRAWL4AI_SCALE
    auto_managed: true
  - name: CRAWL4AI_ENDPOINT
    auto_managed: true

depends_on:
  required: []
  optional:
    - local-deep-researcher
    - n8n
    - backend
    - weaviate

rows:
  - display_name: "Crawl4AI"
    source_var: CRAWL4AI_SOURCE
    port_var: CRAWL4AI_PORT
    scale_var: CRAWL4AI_SCALE
    alias: crawl4ai.localhost
    description: "JS-capable web extraction API."

exports:
  - name: CRAWL4AI_ENDPOINT
    consumers:
      - local-deep-researcher
      - n8n

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  crawl4ai:
    container:
      scale: 1
      environment:
        CRAWL4AI_ENDPOINT: http://crawl4ai:11235
      deploy: {}
      extra_hosts: []
    disabled:
      scale: 0
      environment:
        CRAWL4AI_ENDPOINT: ''
      deploy: {}
      extra_hosts: []

data_flow:
  calls: []
