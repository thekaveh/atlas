# services/parakeet/compose.yml — Parakeet STT GPU container
services:
  parakeet-gpu:
    profiles:
      - parakeet-gpu
      - stt-gpu
    build:
      context: ./provider
      dockerfile: gpu/Dockerfile
      args:
        BASE_IMAGE: ${PARAKEET_GPU_IMAGE:-nvcr.io/nvidia/pytorch:26.06-py3}
    container_name: ${PROJECT_NAME}-parakeet-gpu
    restart: unless-stopped
    runtime: nvidia
    deploy:
      replicas: ${PARAKEET_GPU_SCALE:-0}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      PARAKEET_MODEL: ${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      PARAKEET_DEVICE: ${PARAKEET_GPU_DEVICE:-cuda}
      PARAKEET_COMPUTE_TYPE: ${PARAKEET_GPU_COMPUTE_TYPE:-float16}
      PARAKEET_MAX_UPLOAD_BYTES: ${PARAKEET_MAX_UPLOAD_BYTES:-104857600}
      PARAKEET_CONCURRENCY: ${PARAKEET_CONCURRENCY:-1}
      # Do not advertise HTTP readiness until the configured NeMo model has
      # downloaded, initialized, and moved to the requested device.
      PRELOAD_MODEL: "true"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - stt-provider-gpu-cache:/root/.cache/huggingface
    ports:
      # Default must match topology's STT_PROVIDER_PORT default (63054) and
      # the value in .env.example. Stale 10300 fallback would only have bit
      # users who hand-removed STT_PROVIDER_PORT from .env.
      - "${HOST_BIND_IP:-}${STT_PROVIDER_PORT:-63055}:8000"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    labels:
      - "com.${PROJECT_NAME}.service=speech-to-text"
      - "com.${PROJECT_NAME}.category=ai"
      - "com.${PROJECT_NAME}.backend=cuda"

volumes:
  stt-provider-gpu-cache:
    name: ${PROJECT_NAME}-stt-gpu-cache
    driver: local
