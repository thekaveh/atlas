apiVersion: 1

datasources:
  - name: Tempo
    uid: Tempo
    type: tempo
    access: proxy
    url: ${TEMPO_ENDPOINT}
    editable: false
    jsonData:
      httpMethod: GET
      # No serviceMap: Tempo's metrics generator is disabled (tempo.yaml), so
      # no service-graph series exist and the map would always be empty.
  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: ${LOKI_ENDPOINT}
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: Tempo
          matcherType: label
          matcherRegex: trace_id
          name: TraceID
          url: '$${__value.raw}'
