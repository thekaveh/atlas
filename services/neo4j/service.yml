# services/neo4j/service.yml — Neo4j graph database
name: neo4j
label: "Neo4j (graph database)"
category: data
docs: services/neo4j/README.md

capabilities:
  - name: "Container and host graph storage"
    status: supported
    verification: tested
    note: "Atlas supports a persistent Neo4j container or an operator-run localhost endpoint and wires Bolt consumers through the selected source."
  - name: "Snapshot backup and restore"
    status: supported
    verification: tested
    note: "The backup orchestrator records whether Neo4j Community 5.26.27 is running, stops it for bounded system and neo4j database dumps, restores the prior running state on success or failure, and provides an authenticated offline load path."
  - name: "Production access isolation"
    status: partial
    verification: documented
    note: "Password authentication is configured, but direct Bolt and Browser ports are plaintext and Atlas does not provision separate least-privilege service roles."

containers:
  - neo4j-graph-db

images:
  - var: NEO4J_GRAPH_DB_IMAGE
    default: "neo4j:5.26.27"
    container: neo4j-graph-db
    notes: "Used as build-arg BASE_IMAGE in graph-db/Dockerfile."

sources:
  var: NEO4J_GRAPH_DB_SOURCE
  default: container
  options:
    - id: container
      label: "Container (in-stack Neo4j)"
    - id: localhost
      label: "Host (use existing Neo4j on this machine)"
      profiles: [default]
    - id: disabled
      label: "Disabled"

env:
  - name: NEO4J_GRAPH_DB_SOURCE
    default: container
    description: "Neo4j deployment source. Drives NEO4J_SCALE and NEO4J_URI."
  - name: GRAPH_DB_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Host port for Neo4j bolt (container port 7687)."
  - name: GRAPH_DB_DASHBOARD_PORT
    # default removed — computed by services/topology.py slot allocator
    description: "Host port for Neo4j browser dashboard (container port 7474)."
  - name: GRAPH_DB_USER
    default: neo4j
  - name: GRAPH_DB_PASSWORD
    default: neo4j_password
    secret: true
    description: "Neo4j password; auto-generated by the bootstrapper when left as the placeholder."
  - name: GRAPH_DB_AUTH
    default: "neo4j/neo4j_password"
    secret: true
    description: "Neo4j auth in username/password format."
  - name: NEO4J_URI
    auto_managed: true
    description: "Computed from NEO4J_GRAPH_DB_SOURCE. Read by backend/jupyterhub."
  - name: NEO4J_SCALE
    auto_managed: true
    description: "Replicas: 1 for container, 0 otherwise."
  - name: NEO4J_LOCALHOST_HTTP_PORT
    default: "7474"
    description: "Host HTTP port for the neo4j-localhost source variant (browser UI + REST). Kong route target is derived as http://host.docker.internal:7474."
  - name: NEO4J_LOCALHOST_BOLT_PORT
    default: "7687"
    description: "Host Bolt port for the neo4j-localhost source variant (driver protocol). NEO4J_URI is derived as bolt://host.docker.internal:7687. The wizard's inline-textbox edits THIS port (HTTP is overridable via .env hand-edit)."
  - name: NEO4J_MEMORY_LIMIT
    default: 2g
    description: "Container memory limit for neo4j-graph-db (deploy.resources.limits.memory). 2 g is conservative for a 32 GB host; Neo4j keeps hot nodes in a heap-based page cache that typically stays well under 2 g for single-node dev/staging workloads."
  - name: NEO4J_CPU_LIMIT
    default: "1.5"
    description: "Container CPU limit for neo4j-graph-db (deploy.resources.limits.cpus). 1.5 cores is sufficient for single-node Bolt + HTTP query serving."

depends_on:
  required:
    - supabase
  optional: []

rows:
  - display_name: "Neo4j Graph DB"
    source_var: NEO4J_GRAPH_DB_SOURCE
    port_var: GRAPH_DB_DASHBOARD_PORT
    scale_var: NEO4J_SCALE
    alias: graph.localhost
    localhost_port_var: NEO4J_LOCALHOST_BOLT_PORT
    description: "Graph database for knowledge graphs."

exports: []

# ─────────────────────────────────────────────────────────
# Bootstrapper runtime data (migrated from the legacy
# bootstrapper/service-configs.yml). Slices owned by this
# manifest. Synthesized into the runtime dict by
# bootstrapper/services/sc_synthesizer.py.
# ─────────────────────────────────────────────────────────
runtime_sc:
  neo4j-graph-db:
    container:
      scale: 1
      environment:
        NEO4J_URI: bolt://neo4j-graph-db:7687
      deploy: {}
      extra_hosts: []
    localhost:
      scale: 0
      environment:
        NEO4J_URI: bolt://host.docker.internal:${NEO4J_LOCALHOST_BOLT_PORT:-7687}
      deploy: {}
      extra_hosts:
      - host.docker.internal:host-gateway
    disabled:
      scale: 0
      environment:
        NEO4J_URI: ''
      deploy: {}
      extra_hosts: []

data_flow:
  # Neo4j is a leaf graph database; it doesn't issue outbound calls at
  # request time. The historical supabase edge was an init-time
  # bootstrap contact, which the schema explicitly excludes from
  # data_flow.calls.
  calls: []
