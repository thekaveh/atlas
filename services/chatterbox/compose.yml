# services/chatterbox/compose.yml — Chatterbox (Resemble AI voice-cloning TTS)
services:
  chatterbox:
    profiles:
      - chatterbox-gpu
      - tts-gpu
    # NOTE: travisvn/chatterbox-tts-api publishes a rolling `gpu` tag for the
    # CUDA build (and `cpu` / `latest-cpu` for CPU); it has no version-locked
    # GPU tag. The default below pins `gpu` by digest. To refresh, run
    # `docker pull travisvn/chatterbox-tts-api:gpu` and replace the digest.
    image: ${CHATTERBOX_IMAGE:-travisvn/chatterbox-tts-api:gpu@sha256:8c0b379172d48b49d59d8f29a35fa23c0dc27955dba4d3ab41a77b2d71b4711f}
    container_name: ${PROJECT_NAME}-chatterbox
    restart: unless-stopped
    runtime: nvidia
    deploy:
      replicas: ${CHATTERBOX_SCALE:-0}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      # The pinned image sets PORT=5123; every caller (tts-provider endpoint,
      # Kong, this port map and healthcheck) uses 4123.
      PORT: "4123"
    volumes:
      # The image runs as `app` with MODEL_CACHE_DIR=/cache; a mount under
      # /root was never written, so models re-downloaded on every recreate.
      - chatterbox-cache:/cache
    ports:
      - "${HOST_BIND_IP-127.0.0.1:}${CHATTERBOX_PORT:-63059}:4123"
    networks:
      - backend-network
    # Chatterbox's docker/Dockerfile installs curl and exposes /health.
    # Verified against travisvn/chatterbox-tts-api @ :gpu (2026-05).
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4123/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"
    labels:
      - "com.${PROJECT_NAME}.service=text-to-speech"
      - "com.${PROJECT_NAME}.category=ai"
      - "com.${PROJECT_NAME}.backend=cuda"

volumes:
  chatterbox-cache:
    name: ${PROJECT_NAME}-chatterbox-cache
    driver: local
