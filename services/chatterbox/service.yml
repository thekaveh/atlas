# services/chatterbox/service.yml — Chatterbox (Resemble AI voice-cloning TTS, GPU)
#
# MIT-licensed, 5-sec zero-shot voice cloning. Activated when
# TTS_PROVIDER_SOURCE=chatterbox-container-gpu (the chatterbox-localhost
# variant uses the host's own install — no container).
#
# Like speaches, this manifest has NO `sources:` block — its activation
# is driven externally by TTS_PROVIDER_SOURCE (owned by tts-provider).
# `bootstrapper/services/service_config.py::_generate_tts_provider_config`
# writes CHATTERBOX_SCALE based on TTS_PROVIDER_SOURCE.
name: chatterbox
label: "Chatterbox (voice-cloning TTS, GPU)"
category: media
docs: services/tts-provider/README.md

capabilities:
  - name: "GPU voice-cloning text-to-speech"
    status: supported
    verification: documented
    note: "The TTS selector starts the digest-pinned NVIDIA container and exposes Chatterbox synthesis and voice cloning through the selected provider endpoint."
  - name: "Operator-run localhost Chatterbox"
    status: partial
    verification: documented
    note: "Atlas resolves a host Chatterbox endpoint selected by tts-provider, but installation, model downloads, process lifecycle, and hardware acceleration remain operator-owned."
  - name: "Persistent registered voice library"
    status: not-supported
    verification: documented
    note: "The container persists only the Hugging Face weight cache; registered voice samples have no Atlas-managed volume or object-store workflow and may disappear on replacement."
  - name: "Authenticated Chatterbox ingress"
    status: not-supported
    verification: documented
    note: "The host-published API and CORS-only tts.localhost Kong route have no Atlas authentication; use loopback or firewall controls, remove the publish, or add an authentication proxy."

containers:
  - chatterbox

images:
  - var: CHATTERBOX_IMAGE
    default: "travisvn/chatterbox-tts-api:gpu@sha256:8c0b379172d48b49d59d8f29a35fa23c0dc27955dba4d3ab41a77b2d71b4711f"
    container: chatterbox
    platform: "linux/amd64"
    notes: "Rolling :gpu tag. Pin to a digest in production via `docker pull travisvn/chatterbox-tts-api:gpu` + paste the digest."

env:
  - name: CHATTERBOX_PORT
    # default computed by services/topology.py slot allocator
    description: "Host port for the Chatterbox container (in-container listen port is 4123)."
  - name: CHATTERBOX_LOCALHOST_PORT
    default: "63044"
    description: "Host port for the chatterbox-localhost source variant. URL is derived at compose-render time as http://host.docker.internal:63044."
  - name: CHATTERBOX_SCALE
    auto_managed: true
    description: "Computed by bootstrapper/services/service_config.py::_generate_tts_provider_config — set to 1 when TTS_PROVIDER_SOURCE=chatterbox-container-gpu."

depends_on:
  # Chatterbox is a leaf TTS engine selected via TTS_PROVIDER_SOURCE.
  # The `tts-provider` virtual aggregator (which in turn depends on
  # litellm) is listed in `required` so the bootstrapper's canonical
  # order places this row in the media block after litellm — same
  # display-order convention as ollama/parakeet. NOT a runtime call.
  required:
    - tts-provider
  optional: []

exports: []

rows: []

# No runtime_sc / runtime_adaptive / runtime_deps blocks here — intentional.
# CHATTERBOX_SCALE is auto-managed by `_generate_tts_provider_config` in
# `bootstrapper/services/service_config.py` based on TTS_PROVIDER_SOURCE,
# so the runtime contract lives in the tts-provider virtual manifest plus
# the imperative source-config code, not in a per-service runtime block.

data_flow:
  calls: []
